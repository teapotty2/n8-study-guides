<style>

  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;}
  header{background:var(--card);border-bottom:1px solid var(--border);padding:20px 32px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;}

  .controls{padding:16px 32px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--card);border-bottom:1px solid var(--border);}
  .btn{padding:8px 18px;border-radius:8px;border:none;cursor:pointer;font-size:0.85rem;font-weight:600;transition:all 0.15s;}
  .btn-primary{background:var(--accent);color:white;}
  .btn-primary:hover{filter:brightness(1.15);}
  .btn-secondary{background:var(--tag);color:var(--text);border:1px solid var(--border);}

  .btn-sm{padding:5px 12px;font-size:0.78rem;}
  .btn-check{background:var(--warn);color:#000;font-weight:700;padding:10px 24px;border-radius:8px;border:none;cursor:pointer;font-size:0.9rem;margin-top:14px;display:none;width:100%;}
  .btn-check:hover{filter:brightness(1.1);}
  select{background:var(--tag);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:7px 12px;font-size:0.85rem;cursor:pointer;}
  select:focus{outline:none;border-color:var(--accent);}
  .progress-bar{height:3px;background:var(--border);}

  main{max-width:780px;margin:0 auto;padding:32px 20px;}
  .q-counter{font-size:0.78rem;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:0.5px;}
  .q-tags{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .q-chapter-tag{display:inline-block;background:var(--tag);color:var(--accent2);font-size:0.72rem;padding:3px 10px;border-radius:20px;border:1px solid var(--border);}
  .sata-tag{display:inline-block;background:rgba(240,165,0,0.15);color:var(--warn);font-size:0.72rem;padding:3px 10px;border-radius:20px;border:1px solid rgba(240,165,0,0.3);font-weight:700;}
  .question-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:28px;margin-bottom:20px;}
  .question-text{font-size:1.05rem;line-height:1.65;margin-bottom:22px;white-space:pre-wrap;}
  .options{display:flex;flex-direction:column;gap:10px;}
  .opt{padding:13px 18px;border-radius:10px;border:1.5px solid var(--border);cursor:pointer;font-size:0.9rem;line-height:1.5;transition:all 0.15s;}
  .opt:hover:not(.locked){border-color:var(--accent);background:rgba(124,106,247,0.08);}
  .opt.selected{border-color:var(--accent);background:var(--selected);}
  .opt.correct{border-color:var(--correct);background:rgba(76,175,136,0.12);}
  .opt.wrong{border-color:var(--wrong);background:rgba(224,92,92,0.1);}
  .opt.missed{border-color:var(--warn);background:rgba(240,165,0,0.08);}
  .opt.locked{cursor:default;}
  .feedback-box{margin-top:18px;padding:16px 18px;background:rgba(79,195,247,0.06);border:1px solid rgba(79,195,247,0.2);border-radius:10px;font-size:0.88rem;line-height:1.65;display:none;}
  .feedback-label{font-weight:700;color:var(--accent2);margin-bottom:6px;font-size:0.78rem;text-transform:uppercase;letter-spacing:0.5px;}
  .nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:20px;}
  .result-badge{display:none;align-items:center;gap:8px;padding:8px 16px;border-radius:8px;font-weight:700;font-size:0.9rem;}
  .result-badge.correct-badge{background:rgba(76,175,136,0.15);color:var(--correct);border:1px solid rgba(76,175,136,0.3);}
  .result-badge.wrong-badge{background:rgba(224,92,92,0.1);color:var(--wrong);border:1px solid rgba(224,92,92,0.2);}
  .summary{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:36px;text-align:center;display:none;}
  .summary h2{font-size:1.6rem;margin-bottom:8px;}
  .score-big{font-size:3.5rem;font-weight:800;color:var(--accent);line-height:1;margin:20px 0 8px;}
  .score-pct{font-size:1.2rem;color:var(--accent2);margin-bottom:24px;}
  .score-breakdown{display:flex;justify-content:center;gap:32px;margin:20px 0 28px;}
  .score-item{text-align:center;}
  .score-item-val{font-size:1.8rem;font-weight:700;}
  .score-item-label{font-size:0.75rem;color:var(--muted);margin-top:2px;}
  .grade-msg{font-size:1rem;color:var(--muted);margin-bottom:28px;padding:14px 20px;background:var(--tag);border-radius:10px;}
  .legend{font-size:0.75rem;color:var(--muted);margin-top:10px;display:none;}
  .legend span{margin-right:12px;}
</style>

<script>
const ALL_QUESTIONS = [{"ch": "Ch 1: Decision Making & Problem Solving", "q": "A nurse is applying a decision -making process to a clinical challenge. When applying this process, the nurse must:", "opts": "<div class=\"opt\" data-letter=\"A\">A) analyze the root causes of a situation.</div><div class=\"opt\" data-letter=\"B\">B) begin by solving the underlying problem.</div><div class=\"opt\" data-letter=\"C\">C) choose between different courses of action.</div><div class=\"opt\" data-letter=\"D\">D) prioritize the maximum good for the maximum number of people.</div>", "ans": "C", "sata": false, "fb": "Decision making is a complex, cognitive process often defined as choosing a particular course of action. Problem solving is part of decision making and is a systematic process that focuses on analyzing a difficult situation. It is not always realistic for the nurse to solve each of the problems contributing to a larger challenge, especially at the beginning of the decision -making process. The nurse often lacks the time, information, or resources to analyze the root causes of a situation. Many times, the nurse makes a decision that benefits the largest number of people, but this is not always feasible or desirable."}, {"ch": "Ch 1: Decision Making & Problem Solving", "q": "A nurse is applying the traditional problem -solving model when mediating a conflict between two colleagues. When applying this model, the nurse should prioritize what task?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Identifying the root cause of the conflict</div><div class=\"opt\" data-letter=\"B\">B) Implementing a solution as quickly as possible</div><div class=\"opt\" data-letter=\"C\">C) Eliciting input from other nurses</div><div class=\"opt\" data-letter=\"D\">D) Encouraging each nurse to reflect on their actions</div>", "ans": "A", "sata": false, "fb": "The traditional problem -solving model attempts to identify the root problem in situations, a task that requires much time and energy. Efficiency is desirable, but trying to implement a solution as quickly as possible can result in a hasty and incorrect solution. Outside input may or may not be necessary; this varies with each individual problem. Reflective thinking is always beneficial, but this is not a specific component of the traditional problem -solving model."}, {"ch": "Ch 1: Decision Making & Problem Solving", "q": "Which statement is true regarding decision making?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Scientific methods provide identical decisions by different individuals for the same problems.</div><div class=\"opt\" data-letter=\"B\">B) Decisions are greatly influenced by each person's value system.</div><div class=\"opt\" data-letter=\"C\">C) Personal beliefs can be adjusted for when the scientific approach to problem solving is used.</div><div class=\"opt\" data-letter=\"D\">D) Past experience has little to do with the quality of the decision.</div>", "ans": "B", "sata": false, "fb": "Values, life experience, individual preference, and individual ways of thinking will influence a person's decision making. No matter how objective the criteria will be, value judgments will always play a part in a person's decision making, either consciously or subconsciously. It is not possible for a nurse to fully \"set aside\" personal beliefs when making a decision, even if the nurse applies the principles of self -reflection."}, {"ch": "Ch 1: Decision Making & Problem Solving", "q": "The nurse -manager of a short -staffed unit needs to make a decision about a nurse's request for an unpaid leave of absence. In order to increase the chance of making a good decision, the manager should:", "opts": "<div class=\"opt\" data-letter=\"A\">A) involve as many people in the decision -making process as possible.</div><div class=\"opt\" data-letter=\"B\">B) begin the decision -making process by presuming the status quo to be the best option.</div><div class=\"opt\" data-letter=\"C\">C) generate as many different alternatives as possible.</div><div class=\"opt\" data-letter=\"D\">D) prioritize the option that is most innovative.</div>", "ans": "C", "sata": false, "fb": "The greater the number of alternatives that can be generated by the decision maker, the better the final decision will be. Generating multiple alternatives may require involving more people in the decision -making process, but the process can easily become unwieldy if too many people are involved. The manager should always consider the status quo as a possible option, but this is not always considered to be the default option. Innovation is often a desirable characteristic, but it would be inappropriate to choose an option solely because it is innovative; many other values must be considered."}, {"ch": "Ch 1: Decision Making & Problem Solving", "q": "An experienced nurse-manager has been described as being a \"right-brained thinker.\" Which is an example of this manager's decision-making process?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Uses data sets to generate solutions</div><div class=\"opt\" data-letter=\"B\">B) Uses thinking that is outside the normal standards to find a solution</div><div class=\"opt\" data-letter=\"C\">C) Has the ability to ask all those involved in the decision making</div><div class=\"opt\" data-letter=\"D\">D) Focuses on the intended process to reach a solution or goal</div>", "ans": "B", "sata": false, "fb": "Right -brained thinkers have traditionally been characterized as creative and intuitive, and thinking outside of normal standards to find a solution. Linear analysis, such as the ability to generate solutions based on data sets, is more closely aligned with left-brained thinking. Transparency, such as getting all those involved, and efficiency, which focuses on the process to reach a goal, are desirable qualities that are not particularly aligned with either of these two paradigms."}, {"ch": "Ch 1: Decision Making & Problem Solving", "q": "A nurse -manager is applying an evidence -based approach to a clinical question around client mobilization. When using a PICO (patient or population, intervention, comparison, and outcome) format to search for evidence, the nurse should identify what?", "opts": "<div class=\"opt\" data-letter=\"A\">A) The role of intuition in the decision -making process</div><div class=\"opt\" data-letter=\"B\">B) The preferences of clients and their families</div><div class=\"opt\" data-letter=\"C\">C) The clients for whom the intervention would be relevant</div><div class=\"opt\" data-letter=\"D\">D) Costs associated with a potential change in practice</div>", "ans": "C", "sata": false, "fb": "The PICO format is used in evidence -based practice to guide the search for the current best evidence to address a problem. Client and family preferences and cost are included in evidence -based practice but are not explicit components of the PICO format. Intuition is a component of decision making but is not specifically included in the PICO format."}, {"ch": "Ch 1: Decision Making & Problem Solving", "q": "A nurse -manager is applying the decision -making process when addressing a nurse's high rate of absenteeism. This process should result in:", "opts": "<div class=\"opt\" data-letter=\"A\">A) an outcome that is desired by all.</div><div class=\"opt\" data-letter=\"B\">B) a chosen course of action.</div><div class=\"opt\" data-letter=\"C\">C) an action that guarantees success.</div><div class=\"opt\" data-letter=\"D\">D) a full understanding of the underlying problem.</div>", "ans": "B", "sata": false, "fb": "A decision is made when a course of action has been chosen. A decision may not always be pleasing to everyone involved in the situation, and success can never be fully guaranteed. The manager should seek to fully understand the problem, but this is a phase in decision making, not the result of the process."}, {"ch": "Ch 1: Decision Making & Problem Solving", "q": "A nurse -manager is faced with a difficult decision in a situation that involves the manager's values. What is the manager's best action?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Try to base a decision on intuition rather than values.</div><div class=\"opt\" data-letter=\"B\">B) Set aside their own values and make a rationale decision.</div><div class=\"opt\" data-letter=\"C\">C) Defer the decision to a colleague with different values.</div><div class=\"opt\" data-letter=\"D\">D) Identify and reflect on their own values.</div>", "ans": "D", "sata": false, "fb": "Every person has a value system, and this cannot simply be \"set aside.\" Awareness and reflection are necessary to make good decisions in the context of one's own values. Intuition and values are not counterpoints, and prioritizing intuition does not negate the importance of values. Values influence every decision to varying degrees, and it is impractical to defer every value -laden decision to someone else."}, {"ch": "Ch 1: Decision Making & Problem Solving", "q": "Which statement concerning critical thinking is true?", "opts": "<div class=\"opt\" data-letter=\"A\">A) It is a simple approach to decision making.</div><div class=\"opt\" data-letter=\"B\">B) It is narrower in scope than decision making.</div><div class=\"opt\" data-letter=\"C\">C) It requires reasoning and creative analysis.</div><div class=\"opt\" data-letter=\"D\">D) It is a synonym for the problem -solving process.</div>", "ans": "C", "sata": false, "fb": "Critical thinking has a broader scope and is more complex than decision making and problem solving. It is sometimes referred to as reflective thinking. Critical thinking also involves reflecting on the meaning of statements, examining the offered evidence and reasoning, and forming judgments about facts."}, {"ch": "Ch 1: Decision Making & Problem Solving", "q": "A nurse -manager has realized that the data gathering process before a recent decision may have been influenced by confirmation bias. How can the manager best prevent this in the future?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Delegate data gathering to a trusted colleague who has different values.</div><div class=\"opt\" data-letter=\"B\">B) Make sure not to prioritize information that supports their own beliefs.</div><div class=\"opt\" data-letter=\"C\">C) Consider all of the implications of an alternative before making a decision.</div><div class=\"opt\" data-letter=\"D\">D) Collect only the minimum quantity of data before making a decision.</div>", "ans": "B", "sata": false, "fb": "Confirmation bias refers to our tendency to search for and favor information that confirms our beliefs while simultaneously ignoring or devaluing information that contradicts our beliefs. Self -awareness and reflection can reduce this tendency. Delegating the data-gathering process may be beneficial in some situations, but every person is prone to confirmation bias, although in differing ways. Considering the implications of a decision is an important part of decision making but does not address the issue of confirmation bias. Minimizing data collection may reduce confirmation bias but could compromise the quality of a decision."}, {"ch": "Ch 1: Decision Making & Problem Solving", "q": "A nurse -manager has made a decision and is now preparing to evaluate that decision. What question should best guide the nurse's evaluation process?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Is evaluation necessary when using a good decision -making model?</div><div class=\"opt\" data-letter=\"B\">B) Can evaluation be eliminated if the problem is resolved?</div><div class=\"opt\" data-letter=\"C\">C) Is every party happy with the outcomes of the decision?</div><div class=\"opt\" data-letter=\"D\">D) Did the outcomes align with the original objectives?</div>", "ans": "D", "sata": false, "fb": "The evaluation phase is necessary to find out more about one's ability as a decision maker and to find out where the decision making was faulty. This step cannot be eliminated from the decision -making process because it provides the means for determining whether a good decision was made. Happiness is not the criterion by which decisions are usually evaluated. Rather, evaluation is done by comparing actual outcomes to desired outcomes."}, {"ch": "Ch 1: Decision Making & Problem Solving", "q": "Which statement concerning the role of the most powerful individuals in organizational decision making is true?", "opts": "<div class=\"opt\" data-letter=\"A\">A) They exert less influence on decisions than was previously thought.</div><div class=\"opt\" data-letter=\"B\">B) They often make decisions that are in congruence with their own values.</div><div class=\"opt\" data-letter=\"C\">C) They tend to delegate decision making rather than making decisions themselves.</div><div class=\"opt\" data-letter=\"D\">D) They usually make important decisions with consideration of the effect on others.</div>", "ans": "B", "sata": false, "fb": "Not only does the preference of the powerful influence decisions of others in an organization but the powerful are also able to inhibit the preferences of the less powerful. Powerful people in organizations are more likely to have decisions made that are congruent with their own preferences and values. Powerful people tend to make decisions on their own rather than delegating them. Often, the effect on others is not prioritized as highly as it should be."}, {"ch": "Ch 1: Decision Making & Problem Solving", "q": "One of the nurses on the unit said, \"My Vietnamese client won't look me in the eye, but I know that Asian clients avoid making eye contact as a way of showing respect.\" This nurse is demonstrating what type of illogical thinking?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Affirming the consequences</div><div class=\"opt\" data-letter=\"B\">B) Arguing from analogy</div><div class=\"opt\" data-letter=\"C\">C) Deductive reasoning</div><div class=\"opt\" data-letter=\"D\">D) Overgeneralizing</div>", "ans": "D", "sata": false, "fb": "This type of flawed thinking occurs when one believes that because one person has a particular characteristic, every other person in the same category also has the same characteristic. It is an overgeneralization to assign one meaning for an action to every person from dozens of countries. This kind of oversimplified deduction is exemplified when stereotypical statements are used to justify arguments and decisions. When affirming the consequences, the nurse thinks that if B is good, but someone is doing A, then A must not be good. When arguing from analogy, the nurse applies a component that is present in two separate concepts and then states that because A is present in B, then A and B are alike in all respects."}, {"ch": "Ch 1: Decision Making & Problem Solving", "q": "A nurse has accepted a job in a workplace where organizational power has a pronounced effect. This characteristic may have what effect on the nurse and the workplace?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Many decisions will be delegated to the nurse by supervisors.</div><div class=\"opt\" data-letter=\"B\">B) There will be high levels of mistrust and suspicion at the workplace.</div><div class=\"opt\" data-letter=\"C\">C) Communication will be compromised at the workplace.</div><div class=\"opt\" data-letter=\"D\">D) The nurse may have to accept decisions contrary to their own values.</div>", "ans": "D", "sata": false, "fb": "The ability of the powerful to influence individual decision making in an organization often requires adopting a private personality and an organizational personality. The nurse will often have to accept decisions that solely reflect the values of more powerful individuals. This may lead to a feeling of powerlessness but not necessarily mistrust and lack of communication. Delegation of decision making is likely to be rare, not common, because it is concentrated with those in power."}, {"ch": "Ch 1: Decision Making & Problem Solving", "q": "A unit manager has created a decision grid in order to assist with a difficult staffing decision that will affect many nurses. The decision grid will allow the manager to:", "opts": "<div class=\"opt\" data-letter=\"A\">A) examine alternatives visually and compare each against the same criteria.</div><div class=\"opt\" data-letter=\"B\">B) ensure that the decision is made objectively rather than subjectively.</div><div class=\"opt\" data-letter=\"C\">C) plot the outcomes of a decision over time and evaluate the decision -making process.</div><div class=\"opt\" data-letter=\"D\">D) predict when events must take place to complete a project on time.</div>", "ans": "A", "sata": false, "fb": "A decision grid allows one to visually examine the alternatives and compare each against the same criteria. This assists with the decision -making process, but it cannot guarantee that the decision will be completely objective. A decision grid is not a tool for tracking the outcomes of a decision. Decision grids are not synonymous with project planning tables."}, {"ch": "Ch 1: Decision Making & Problem Solving", "q": "A nurse -manager is planning to apply a decision -making model to a clinical challenge. When using a decision -making tool, what should the manager do?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Be aware that the tool cannot eliminate the risk of human error.</div><div class=\"opt\" data-letter=\"B\">B) Have an objective colleague apply the tool rather than applying it personally.</div><div class=\"opt\" data-letter=\"C\">C) Apply the tool as quickly as possible.</div><div class=\"opt\" data-letter=\"D\">D) Recognize that the tool will negate the effect of the manager's values.</div>", "ans": "A", "sata": false, "fb": "Management decision -making aids are subject to human error and do not remove the effects of individual values, which always affect decision making. There is no particular reason that a tool would have to be applied by another person. Making the correct decision can take time; moving too quickly can compromise the quality of the process."}, {"ch": "Ch 1: Decision Making & Problem Solving", "q": "A nurse -manager had to intervene in a conflict between a client and a staff member. The manager chose to make a decision \"in the moment\" rather than applying a methodical or deliberate decision -making tool. How should this manager's actions be best interpreted?", "opts": "<div class=\"opt\" data-letter=\"A\">A) The manager applied heuristics to a problem that required a quick solution.</div><div class=\"opt\" data-letter=\"B\">B) The manager should have used a decision -making tool before responding.</div><div class=\"opt\" data-letter=\"C\">C) The manager's decision was likely made on the basis of emotion.</div><div class=\"opt\" data-letter=\"D\">D) The manager demonstrated an autocratic leadership style.</div>", "ans": "A", "sata": false, "fb": "Most individuals rely on discrete, often unconscious processes known as heuristics, which allows them to solve problems more quickly and to build on experiences they have gained in their lives. This manager's prompt decision making exemplifies this rapid approach. This does not necessarily lead to worse outcomes than a slower, more methodical approach. Heuristics can be based on experience and knowledge and are not simply expressions of emotion. Heuristics and rapid decision making are not synonymous with an autocratic leadership style that downplays input from others."}, {"ch": "Ch 1: Decision Making & Problem Solving", "q": "Which statement is true regarding an \"economic man\" style manager?", "opts": "<div class=\"opt\" data-letter=\"A\">A) The manager may lack complete knowledge and generate few alternatives.</div><div class=\"opt\" data-letter=\"B\">B) The manager makes decisions that may not be ideal but result in solutions that have an adequate outcome.</div><div class=\"opt\" data-letter=\"C\">C) The manager is primarily motivated by their own financial gain.</div><div class=\"opt\" data-letter=\"D\">D) The manager gathers as much information as possible and produces many alternatives.</div>", "ans": "D", "sata": false, "fb": "Managers with an \"economic man\" style gather as much information as possible and generate many alternatives. However, most management decisions are made by using the \"administrative man\" model of decision making, in which the manager never has complete knowledge and generates fewer alternatives. The \"administrative man\" carries out decisions that are \"satisficing,\" a term used to describe decisions that may not be ideal but result in solutions that have adequate outcomes. The term \"economic man\" does not suggest that the manager is motivated by personal financial gain."}, {"ch": "Ch 1: Decision Making & Problem Solving", "q": "What characteristic of a nurse -manager best demonstrates left -brained thinking?", "opts": "<div class=\"opt\" data-letter=\"A\">A) The manager highly values innovation and intuition when making decisions.</div><div class=\"opt\" data-letter=\"B\">B) The manager's relationships with peers are prioritized when evaluating decisions.</div><div class=\"opt\" data-letter=\"C\">C) The manager applies a linear, analytical model when making a decision.</div><div class=\"opt\" data-letter=\"D\">D) The manager is open to feedback from staff when making a decision.</div>", "ans": "C", "sata": false, "fb": "Left -brained thinkers process information in a linear, analytical way, which is different from the creative and intuitive approach of right -brained thinkers. Placing a value on relationships and being open to feedback are not specifically associated with one or the other side of the brain."}, {"ch": "Ch 1: Decision Making & Problem Solving", "q": "A nurse -manager is preparing to use the program evaluation and review technique (PERT) tool when making a staffing decision. This tool will primarily address what component of the decision -making process?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Values</div><div class=\"opt\" data-letter=\"B\">B) Consequences</div><div class=\"opt\" data-letter=\"C\">C) Timing</div><div class=\"opt\" data-letter=\"D\">D) Ethics</div>", "ans": "C", "sata": false, "fb": "PERT is a popular tool to determine the timing of decisions; it is essentially a flowchart that predicts when events and activities must take place if a final event is to occur. This tool does not explicitly address some of the other relevant considerations when making"}, {"ch": "Ch 1: Decision Making & Problem Solving", "q": "A nurse is working with a group of students who are learning a high -risk procedure. How should the nurse best ensure learning while protecting the safety of clients?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Create an unfolding case study featuring the procedure.</div><div class=\"opt\" data-letter=\"B\">B) Use simulation for the students to learn and practice the skill.</div><div class=\"opt\" data-letter=\"C\">C) Help the students use a decision -making model to choose the safest technique.</div><div class=\"opt\" data-letter=\"D\">D) Teach the students about the traditional problem -solving process before they practice the procedure.</div>", "ans": "B", "sata": false, "fb": "Simulation provides learners opportunities for problem solving that have little or no risk to clients or to organizational performance, while also providing models, either mechanical or live, to provide experiences for the learner. Simulation is generally considered to be more realistic (and conducive to learning) than a case study. A decision -making or problem -solving model is not normally implemented when learning new skills or procedures."}, {"ch": "Ch 1: Decision Making & Problem Solving", "q": "Which statements demonstrate a characteristic of a critical thinker? Select all that apply.", "opts": "<div class=\"opt\" data-letter=\"A\">A) \"Since that didn't work effectively, let's try something different.\"</div><div class=\"opt\" data-letter=\"B\">B) \"The solution has to be something the client is willing to do.\"</div><div class=\"opt\" data-letter=\"C\">C) \"I'll talk to the client's primary care giver about the problem.\"</div><div class=\"opt\" data-letter=\"D\">D) \"Maybe there is no new solution to this particular problem.\"</div><div class=\"opt\" data-letter=\"E\">E) \"It's important that we do not give up; our clients deserve it.\"</div>", "ans": ["A", "B", "C", "E"], "sata": true, "fb": "A critical thinker displays persistence, empathy, and assertiveness. Trying a new approach shows persistence. Considering the client's participation shows empathy. Speaking to the care provider on the client's behalf shows assertiveness. Stating \"It's important that we do not give up; our clients deserve it\" shows persistence and empathy. Concluding that there is no solution to a problem reflects an inability to think outside the box."}, {"ch": "Ch 1: Decision Making & Problem Solving", "q": "What is the value of using a structured approach to problem solving for the novice nurse?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Facilitates effective time management</div><div class=\"opt\" data-letter=\"B\">B) Supports the acquisition of clinical reasoning</div><div class=\"opt\" data-letter=\"C\">C) Supplements the orientation process</div><div class=\"opt\" data-letter=\"D\">D) Encourages professional autonomy</div>", "ans": "B", "sata": false, "fb": "A structured approach to problem solving and decision making increases clinical reasoning and is the best way to learn how to make quality decisions because it eliminates trial and error and focuses the learning on a proven process. This is particularly helpful to the novice nurse with limited clinical experience and intuition. The other options are outcomes of the possession of critical thinking skills and clinical reasoning."}, {"ch": "Ch 1: Decision Making & Problem Solving", "q": "A novice nurse has been trying to apply the nursing process to each client interaction. What should the nurse do to enhance the effectiveness of this process for making decisions and solving problems?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Ensure that specific goals are identified during the planning process.</div><div class=\"opt\" data-letter=\"B\">B) Conduct assessment and diagnosis simultaneously whenever possible.</div><div class=\"opt\" data-letter=\"C\">C) Prioritize ethics during each phase of the nursing process.</div><div class=\"opt\" data-letter=\"D\">D) Avoid evaluating the process until every outcome has been met.</div>", "ans": "A", "sata": false, "fb": "The weakness of the nursing process, like the traditional problem -solving model, is in not requiring clearly stated objectives. Goals should be clearly stated in the planning phase of the process, but this step is frequently omitted or obscured. Assessment and diagnosis often cannot be performed at the same time. Ethics should always be considered, of course, but this variable is not identified as enhancing the overall effectiveness of the nursing process. Evaluation is recommended as an ongoing, iterative process that is not reserved for when all outcomes have been met. Indeed, it is impossible to determine whether outcomes have been met without performing evaluation."}, {"ch": "Ch 1: Decision Making & Problem Solving", "q": "A team of nurse -managers is considering the purchase of pressure -reducing mattresses to reduce the incidence of pressure ulcers among long -term care residents. In order to use a payoff table to assist with the decision making, what must the managers know? Select all that apply.", "opts": "<div class=\"opt\" data-letter=\"A\">A) The cost for each new mattress</div><div class=\"opt\" data-letter=\"B\">B) Clients' expectations for how a mattress should feel</div><div class=\"opt\" data-letter=\"C\">C) The prognosis for recovery from a pressure ulcer</div><div class=\"opt\" data-letter=\"D\">D) The cost of treating pressure ulcers</div><div class=\"opt\" data-letter=\"E\">E) The amount of time between ordering the mattresses and their delivery</div>", "ans": ["A", "D"], "sata": true, "fb": "Payoff tables can be used to make decisions involving cost, profit, and volume. To make a decision, the team would need to know how much it costs to introduce a mattress and how much it costs to treat a pressure ulcer. Other variables such as client expectations, timing, and prognosis would be considered when making a decision, but these variables would not be quantified into a payoff table."}, {"ch": "Ch 1: Decision Making & Problem Solving", "q": "A nurse is considering applying for a management job that will require the nurse to make many difficult decisions. What question should the nurse ask when considering his or her ability to make difficult decisions?", "opts": "<div class=\"opt\" data-letter=\"A\">A) \"How comfortable am I with taking risks?\"</div><div class=\"opt\" data-letter=\"B\">B) \"Am I able to apply the nursing processes in varied circumstances?\"</div><div class=\"opt\" data-letter=\"C\">C) \"Am I usually able to please my coworkers?\"</div><div class=\"opt\" data-letter=\"D\">D) \"How quickly do I think?\"</div>", "ans": "A", "sata": false, "fb": "An individual's comfort level with risk has a major bearing on that person's ability and willingness to make difficult decisions. It also affects the outcomes of decisions. The nursing process can have application in the decision -making process, but it is not among the most common decision -making models in management situations. A focus on pleasing other people may make it difficult to arrive at a decision when there are no ideal options available. Quick thinking can be beneficial when making some decisions, but people who are more methodical thinkers are not necessarily at a disadvantage, as quick thinking does not always lead to wise decisions."}, {"ch": "Ch 1: Decision Making & Problem Solving", "q": "A nurse -manager has to make some difficult decisions around the allocation of vacation time during the holiday season. When making a decision, what should the manager do first?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Elicit ideas from as many staff members as possible.</div><div class=\"opt\" data-letter=\"B\">B) Consider how the issues have been addressed in the past.</div><div class=\"opt\" data-letter=\"C\">C) Think of as many alternatives as possible.</div><div class=\"opt\" data-letter=\"D\">D) Clearly identify each of the desired objectives in the situation.</div>", "ans": "D", "sata": false, "fb": "Regardless of what decision -making or problem -solving tool a manager is going to use, the process must necessarily begin with clear identification of the objectives. Once these are determined, subsequent steps like engaging stakeholders, creating alternatives, and considering previous approaches can be performed."}, {"ch": "Ch 1: Decision Making & Problem Solving", "q": "The nurses on a medical unit are using several different techniques for performing wound care and the manager recognizes a need to implement evidence -based practice (EBP). What should the manager do first when applying the principles of EBP?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Identify the main peer -reviewed journals in the field of wound care.</div><div class=\"opt\" data-letter=\"B\">B) Formulate a specific, searchable clinical question about wound care.</div><div class=\"opt\" data-letter=\"C\">C) Perform a review of the literature about wound care.</div><div class=\"opt\" data-letter=\"D\">D) Identify how expert nurses typically perform wound care.</div>", "ans": "B", "sata": false, "fb": "The implementation of EBP usually follows a linear approach that begins with formulating a specific question that can be used to guide a literature search. This should be done before starting a literature review or consulting experts in the field."}, {"ch": "Ch 1: Decision Making & Problem Solving", "q": "A nurse has accepted a management position in a busy ambulatory clinic and recognizes that the day -to-day operations of the clinic will require many decisions. What is the nurse's best initial action when preparing for this new role?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Identify staff who are likely to be allies.</div><div class=\"opt\" data-letter=\"B\">B) Determine where organizational power exists in the clinic.</div><div class=\"opt\" data-letter=\"C\">C) Clarify and reflect on their own values.</div><div class=\"opt\" data-letter=\"D\">D) Collaborate with the previous manager of the clinic.</div>", "ans": "C", "sata": false, "fb": "Values clarification is an imperative first step when preparing for a role that requires decision making and problem solving. This form of internal examination must precede strategic interactions with others or an analysis of where power lies in the organization. Internal examination should come before external examination."}, {"ch": "Ch 1: Decision Making & Problem Solving", "q": "A sales representative is describing the benefits of a new brand of incontinence brief to a manager. The representative states, \"These are a superior product. With what you're currently using, you're actually causing harm to your clients.\" How should the manager best interpret this statement?", "opts": "<div class=\"opt\" data-letter=\"A\">A) The representative is arguing from analogy.</div><div class=\"opt\" data-letter=\"B\">B) The representative is overgeneralizing about the new briefs.</div><div class=\"opt\" data-letter=\"C\">C) The representative is overgeneralizing about the briefs the unit currently uses.</div><div class=\"opt\" data-letter=\"D\">D) The representative is affirming the consequences.</div>", "ans": "D", "sata": false, "fb": "Affirming the consequences is a logical fallacy where a person decides that if B (i.e., the new brief) is good and someone is using A (i.e., the old brief), then A must not be good. The fact that the new brief is good does not mean the old brief is bad. Arguing from analogy is an illogical thinking that applies a component that is present in two separate concepts and then states that because A is present in B, then A and B are alike in all respects. Overgeneralizing involves extending characteristics of an individual to a group."}, {"ch": "Ch 2: Classical Views of Leadership", "q": "Which list represents the management functions that are incorporated into the management process?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Planning, directing, organizing, staffing, and transforming</div><div class=\"opt\" data-letter=\"B\">B) Planning, organizing, staffing, directing, and controlling</div><div class=\"opt\" data-letter=\"C\">C) Inspiring, planning, staffing, directing, and evaluating</div><div class=\"opt\" data-letter=\"D\">D) Organizing, staffing, planning, empowering, and controlling</div>", "ans": "B", "sata": false, "fb": "Management functions include planning, organizing, staffing, directing, and controlling. These are incorporated into what is known as the management process. Inspiring, empowering, and transforming are more often associated with a leadership role."}, {"ch": "Ch 2: Classical Views of Leadership", "q": "The manager of a care facility advocates traditional management science. What is this manager most likely to prioritize?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Ensuring that workers are satisfied in their roles</div><div class=\"opt\" data-letter=\"B\">B) Identifying and addressing barriers to efficiency</div><div class=\"opt\" data-letter=\"C\">C) Empowering workers to make decisions independently</div><div class=\"opt\" data-letter=\"D\">D) Providing rewards for exceptional caring</div>", "ans": "B", "sata": false, "fb": "Classical, or traditional, management science focuses on production in the workplace and on delineating organizational barriers to productivity and efficiency. Little attention is given to workers' job satisfaction, and they are assumed to be motivated solely by economic rewards. This management style tends to be more authoritarian than empowering. Rewards are more likely to be conferred on workers who increase efficiency rather than those who exemplify psychosocial concepts, such as caring."}, {"ch": "Ch 2: Classical Views of Leadership", "q": "Caregivers at a public health center believe that their manager adheres to Theory X. What action by the manager best confirms this suspicion?", "opts": "<div class=\"opt\" data-letter=\"A\">A) The manager collaborates with senior staff to set quarterly goals for the center.</div><div class=\"opt\" data-letter=\"B\">B) The manager insists on accompanying nurses to community events and observes them closely.</div><div class=\"opt\" data-letter=\"C\">C) The manager is rarely accessible to nursing staff during unit crises.</div><div class=\"opt\" data-letter=\"D\">D) The manager allocates rewards based on the outcomes of nurses' work.</div>", "ans": "B", "sata": false, "fb": "Theory X managers believe that their employees are basically lazy, need constant supervision and direction, and are indifferent to organizational needs. Close scrutiny of nurses' performance would suggest this perspective. Being inaccessible during a crisis is an undesirable trait in a manager, but this does not directly suggest a Theory X perspective. Collaboration and the distribution of rewards would be more closely associated with a Theory Y approach, which is more optimistic."}, {"ch": "Ch 2: Classical Views of Leadership", "q": "Accreditors are scheduled to visit a hospital site, and staff members have been made aware of what they will be assessing. What staff behavior would most clearly suggest the presence of the Hawthorne effect?", "opts": "<div class=\"opt\" data-letter=\"A\">A) The nurses consciously improve their performance because they know it is being scrutinized.</div><div class=\"opt\" data-letter=\"B\">B) The nurses avoid contact with the accreditors because they fear criticism.</div><div class=\"opt\" data-letter=\"C\">C) The manager blames individual nurses for deficits identified in the accreditation report.</div><div class=\"opt\" data-letter=\"D\">D) The manager temporarily adopts a leadership role.</div>", "ans": "A", "sata": false, "fb": "The Hawthorne effect means that people respond to the fact that they are being studied, attempting to increase whatever behavior they feel will continue to warrant the attention. Avoiding scrutiny and blame shifting do not demonstrate this effect of performance improvement, nor does adopting a leadership role on a temporary basis, which may or may not be seen as beneficial."}, {"ch": "Ch 2: Classical Views of Leadership", "q": "The manager at a long -term care facility has intervened in a conflict between two staff members about the timing and length of lunch and coffee breaks. What management function is this manager demonstrating?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Planning</div><div class=\"opt\" data-letter=\"B\">B) Organizing</div><div class=\"opt\" data-letter=\"C\">C) Directing</div><div class=\"opt\" data-letter=\"D\">D) Staffing</div>", "ans": "C", "sata": false, "fb": "Directing entails human resource management responsibilities, such as motivating, managing conflict, delegating, communicating, and facilitating collaboration. Planning encompasses determining philosophy, goals, objectives, policies, procedures, and rules; carrying out long - and short -range projections; determining a fiscal course of action; and managing planned change. Organizing includes establishing the structure to carry out plans, determining the most appropriate type of client care delivery, and grouping activities to meet unit goals. Evaluation is not one of the five specific functions in the management process."}, {"ch": "Ch 2: Classical Views of Leadership", "q": "A manager demonstrates one of the four principles of scientific management when he or she:", "opts": "<div class=\"opt\" data-letter=\"A\">A) shows an interest in employees' personal lives and emotional health.</div><div class=\"opt\" data-letter=\"B\">B) engages in lifelong learning and expects employees to do the same.</div><div class=\"opt\" data-letter=\"C\">C) allows employees to do their jobs independently, with minimal oversight.</div><div class=\"opt\" data-letter=\"D\">D) hires and promotes employees on the basis of their competence and skills.</div>", "ans": "D", "sata": false, "fb": "Frederick W. Taylor, the \"father of scientific management,\" had the idea that workers should be hired, trained, and promoted based on their competence and abilities. Scientific management does not emphasize relationships between managers and employees, lifelong learning, or high levels of independence for workers."}, {"ch": "Ch 2: Classical Views of Leadership", "q": "What aspect of the way that work is organized on a nursing unit best reflects the management theories of Max Weber?", "opts": "<div class=\"opt\" data-letter=\"A\">A) A committee that includes employees and managers has been established to plan the work on the unit.</div><div class=\"opt\" data-letter=\"B\">B) The hierarchy of authority and the policies and procedures on the unit are clearly posted.</div><div class=\"opt\" data-letter=\"C\">C) Quarterly awards are granted to employees who have demonstrated exceptional service.</div><div class=\"opt\" data-letter=\"D\">D) Employees are allowed to self -schedule their vacation time and must work out any</div>", "ans": "B", "sata": false, "fb": "Weber saw the need for legalized, formal authority and consistent rules and regulations for personnel in different positions. Clear expectations around authority and processes reflect Weber's beliefs. Weber did not emphasize collaborative decision making, using awards to incentivize work, or autonomy in workers' decision making."}, {"ch": "Ch 2: Classical Views of Leadership", "q": "The clinic leader tends to make decisions independently and closely supervises and controls the practice of the nurses at the clinic. What type of leadership is being exemplified?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Authoritarian</div><div class=\"opt\" data-letter=\"B\">B) Democratic</div><div class=\"opt\" data-letter=\"C\">C) Laissez -faire</div><div class=\"opt\" data-letter=\"D\">D) Contingency</div>", "ans": "A", "sata": false, "fb": "Authoritarianism is associated with strong control and decision making that does not involve others. Democratic leadership emphasizes broad participation in decision making, and a laissez -faire approach is highly permissive with low control. A contingency approach emphasizes the need for flexibility in leadership, not high control and centralized decision making."}, {"ch": "Ch 2: Classical Views of Leadership", "q": "How can a manager best implement the principles of situational or contingency leadership theory?", "opts": "<div class=\"opt\" data-letter=\"A\">A) By establishing rules and norms that can be applied in all conditions in the organization</div><div class=\"opt\" data-letter=\"B\">B) By avoiding punitive consequences when addressing workers' lack of performance</div><div class=\"opt\" data-letter=\"C\">C) By deferring to employees for day -to-day management decisions</div><div class=\"opt\" data-letter=\"D\">D) By adapting their leadership style to a particular circumstance</div>", "ans": "D", "sata": false, "fb": "The idea that leadership style should vary according to the situation or the individuals involved was first suggested almost 100 years ago by Mary Parker Follett and is central to contingency (situational) leadership. This model of leadership does not emphasize workers' autonomy in decision making rigid rules and norms or the avoidance of"}, {"ch": "Ch 2: Classical Views of Leadership", "q": "Which statement best depicts leadership?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Strong leaders can coerce people into following them.</div><div class=\"opt\" data-letter=\"B\">B) A leadership position has a narrower scope than a management position.</div><div class=\"opt\" data-letter=\"C\">C) People will follow a person in a leadership position by choice.</div><div class=\"opt\" data-letter=\"D\">D) Leadership requires meeting organizational goals.</div>", "ans": "C", "sata": false, "fb": "Those individuals who choose to follow a leader do so by choice, not because they have to; \"followership\" cannot be coerced. Leadership is a much broader concept than management, which implies a more specific and finite role. Leadership is not necessarily dependent on meeting organizational goals."}, {"ch": "Ch 2: Classical Views of Leadership", "q": "What characteristic of a nurse -manager suggests that they are acting in the role of a traditional manager rather than an integrated leader -manager?", "opts": "<div class=\"opt\" data-letter=\"A\">A) The manager is conscious of the important role of politics and is politically astute.</div><div class=\"opt\" data-letter=\"B\">B) The manager has an outward view, extending to the larger organization.</div><div class=\"opt\" data-letter=\"C\">C) The manager's influence is limited to their own group.</div><div class=\"opt\" data-letter=\"D\">D) The manager emphasizes the importance of vision and values.</div>", "ans": "C", "sata": false, "fb": "Traditional managers influence those in their own groups, whereas integrated leaders influence others beyond their own group. Political astuteness, an outward view, and an emphasis on vision and values are all characteristics of an integrated leader -manager."}, {"ch": "Ch 2: Classical Views of Leadership", "q": "What statement by a leader most clearly demonstrates the Great Man theory of leadership?", "opts": "<div class=\"opt\" data-letter=\"A\">A) \"The best leaders are those who have worked their way up through years of experience.\"</div><div class=\"opt\" data-letter=\"B\">B) \"Leadership and management are two different manifestations of one skill set.\"</div><div class=\"opt\" data-letter=\"C\">C) \"Some people are born to lead, and some are born to be led.\"</div><div class=\"opt\" data-letter=\"D\">D) \"Leadership can't exist without earning people's respect.\"</div>", "ans": "C", "sata": false, "fb": "The Great Man theory purports that some people are born to lead and some are born to follow. This early theory of leadership does not emphasize the role of relationships or earning the respect of others. This theory does not state that leadership and management are a synonymous skill set."}, {"ch": "Ch 2: Classical Views of Leadership", "q": "A nurse -manager has recently been accused of assigning work unequally. The manager has recognized the need to revise the process for assigning work to nurses. How can the manager best apply the principles of Theory Z?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Making a decision independently and imposing it on the nurses</div><div class=\"opt\" data-letter=\"B\">B) Gathering input from employees in order to reach a consensus</div><div class=\"opt\" data-letter=\"C\">C) Making a decision based on the pros and cons of each option</div><div class=\"opt\" data-letter=\"D\">D) Identifying as many different alternatives as possible</div>", "ans": "B", "sata": false, "fb": "The characteristics of Theory Z include consensus decision making. Autocratic decision making, formal analysis of pros and cons, and maximizing the number of alternatives are not major characteristics of this leadership theory."}, {"ch": "Ch 2: Classical Views of Leadership", "q": "The nurse who manages an ambulatory clinic is well known as being a visionary leader who is skilled at empowering others with this vision. What type of leader is this nurse?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Transactional</div><div class=\"opt\" data-letter=\"B\">B) Transformational</div><div class=\"opt\" data-letter=\"C\">C) Interactional</div><div class=\"opt\" data-letter=\"D\">D) Bureaucratic</div>", "ans": "B", "sata": false, "fb": "Transformational leadership is characterized by the presence of a vision. Transformational leaders impart this to others, creating a collective purpose. The traditional manager, concerned with the day -to-day operations, is termed a transactional leader. Transactional leaders are not typically known as being visionaries. Bureaucratic leaders are focused on functions and processes, not vision. The basic premise of interactional theory is that leadership behavior is generally determined by the relationship between the leader's personality and the specific situation; vision is not a central focus."}, {"ch": "Ch 2: Classical Views of Leadership", "q": "A nurse -leader has set a goal of becoming a more transformational leader. What outcome will best indicate progress toward achieving this goal?", "opts": "<div class=\"opt\" data-letter=\"A\">A) The nurse maximizes efficiency when allocating scarce resources.</div><div class=\"opt\" data-letter=\"B\">B) The nurse's subordinates demonstrate respect and loyalty.</div><div class=\"opt\" data-letter=\"C\">C) The nurse empowers others to reach their full potential.</div><div class=\"opt\" data-letter=\"D\">D) The nurse provides praise for good work performance.</div>", "ans": "C", "sata": false, "fb": "Transformational leadership is characterized by empowering others and instilling them with vision. Transactional leadership is more management oriented and includes functions around rewarding performance and allocating resources. Transactional and transformational leadership can both result in loyalty and respect."}, {"ch": "Ch 2: Classical Views of Leadership", "q": "In an introductory meeting, the new nurse -manager indicates that her management style is based on the human relations approach. The staff identify this to incorporate which of the following?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Engaging workers in decision making</div><div class=\"opt\" data-letter=\"B\">B) Applying laissez -faire leadership</div><div class=\"opt\" data-letter=\"C\">C) Focusing primarily on processes</div><div class=\"opt\" data-letter=\"D\">D) Withdrawing raises from workers who are unproductive</div>", "ans": "A", "sata": false, "fb": "The human relations era of management science emphasized concepts of participatory and humanistic management in which participative management was espoused. A manager with a human relations approach includes workers in decision making. This leadership style is more democratic but is not characterized as laissez -faire. The focus is on \"the human element\" and not just the processes. Punitive actions are not central to human relations management."}, {"ch": "Ch 2: Classical Views of Leadership", "q": "A nurse oversees the care of a hospital unit in the role of an integrated leader -manager. What characteristics should this nurse exhibit? Select all that apply.", "opts": "<div class=\"opt\" data-letter=\"A\">A) The nurse describes herself as an \"inward thinker.\"</div><div class=\"opt\" data-letter=\"B\">B) The nurse's thinking includes long -term issues.</div><div class=\"opt\" data-letter=\"C\">C) The nurse consciously attempts to motivate the employees.</div><div class=\"opt\" data-letter=\"D\">D) The nurse has influence that goes beyond her own group.</div><div class=\"opt\" data-letter=\"E\">E) The nurse is always conscious of political realities.</div>", "ans": ["B", "C", "D", "E"], "sata": true, "fb": "Gardner asserted that integrated leader -managers possess six distinguishing traits: they influence others beyond their own group; they emphasize vision, values, and motivation; they think longer term; they look outward, toward the larger organization; they are politically astute; and they think in terms of change and renewal."}, {"ch": "Ch 2: Classical Views of Leadership", "q": "The nurse -manager of a community clinic is applying the principles of interactional leadership when addressing a challenging situation. What variables should the nurse prioritize when applying this model of leadership? Select all that apply.", "opts": "<div class=\"opt\" data-letter=\"A\">A) The characteristics of the nurse -manager's personality</div><div class=\"opt\" data-letter=\"B\">B) The financial resources available to the nurse</div><div class=\"opt\" data-letter=\"C\">C) The consequences of failure</div><div class=\"opt\" data-letter=\"D\">D) The factors that motivate the employees of the clinic</div><div class=\"opt\" data-letter=\"E\">E) The specifics of the clinical challenge that the nurse is addressing</div>", "ans": ["A", "E"], "sata": true, "fb": "The basic premise of interactional theory is that leadership behavior is generally determined by the relationship between the leader's personality and the specific situation. The nurse would not ignore other variables, such as finances, employee motivation, and the risks for failure, but these are not the central considerations in the model of interactional leadership."}, {"ch": "Ch 2: Classical Views of Leadership", "q": "The nurse -manager of the perioperative department is attempting to apply the full -range leadership model (FRLM) when overseeing the department. The nurse should attempt to integrate what types of leadership? Select all that apply.", "opts": "<div class=\"opt\" data-letter=\"A\">A) Laissez -faire</div><div class=\"opt\" data-letter=\"B\">B) Scientific</div><div class=\"opt\" data-letter=\"C\">C) Autocratic</div><div class=\"opt\" data-letter=\"D\">D) Transactional</div><div class=\"opt\" data-letter=\"E\">E) Transformational</div>", "ans": ["A", "D", "E"], "sata": true, "fb": "The FRLM integrates the principles of laissez -faire, transactional, and transformational leadership. This model does not emphasize practices associated with autocratic leadership. Scientific management is an antiquated model of management that was influential in the early 20th century, not in contemporary models of leadership such as FRLM."}, {"ch": "Ch 2: Classical Views of Leadership", "q": "The manager of a busy emergency department is primarily concerned with the practical, day-to-day operations of the department. This manager is most clearly demonstrating what type of leadership?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Transactional</div><div class=\"opt\" data-letter=\"B\">B) Transformational</div><div class=\"opt\" data-letter=\"C\">C) Interactional</div><div class=\"opt\" data-letter=\"D\">D) Bureaucratic</div>", "ans": "A", "sata": false, "fb": "The traditional manager, concerned with the day -to-day operations, is termed a transactional leader. Transformational leadership prioritizes long -term vision and empowerment. Bureaucratic leadership emphasizes rules and regulations, whereas interactional leadership focuses on the link between personality and situations."}, {"ch": "Ch 2: Classical Views of Leadership", "q": "What statement by a manager best reflects the principles of interactional leadership?", "opts": "<div class=\"opt\" data-letter=\"A\">A) \"People's motives are important, and motives change over time.\"</div><div class=\"opt\" data-letter=\"B\">B) \"People perform to their fullest potential and then they're under pressure.\"</div><div class=\"opt\" data-letter=\"C\">C) \"A person can't simultaneously act as a manager and a leader.\"</div><div class=\"opt\" data-letter=\"D\">D) \"Organizations run best when there is no formal, centralized authority.\"</div>", "ans": "A", "sata": false, "fb": "Interactional leadership emphasizes the fact that people's motives are very important and that these are constantly changing. Interactional leadership does not prioritize pressure as a form of incentive or motivation, and it does not deny a role for authority or for the integration of leadership and management principles."}, {"ch": "Ch 2: Classical Views of Leadership", "q": "Which activities are associated with a leadership role? Select all that apply.", "opts": "<div class=\"opt\" data-letter=\"A\">A) Mentoring two new managers</div><div class=\"opt\" data-letter=\"B\">B) Establishing goals for the coming year</div><div class=\"opt\" data-letter=\"C\">C) Advocating for nurses to receive more professional development opportunities</div><div class=\"opt\" data-letter=\"D\">D) Providing a motivational speech at the new employee orientation</div><div class=\"opt\" data-letter=\"E\">E) Finding a nurse to cover another nurse's shift</div>", "ans": ["A", "B", "C", "D"], "sata": true, "fb": "Leadership roles include mentoring, decision making, advocating, and energizing. Risk taking is also considered a leadership role. Day -to-day functions such as staff scheduling are more closely associated with a management role."}, {"ch": "Ch 2: Classical Views of Leadership", "q": "It is considered a fatal flaw in leadership to fail to engage in which of the following activities? Select all that apply.", "opts": "<div class=\"opt\" data-letter=\"A\">A) Collaboration with colleagues</div><div class=\"opt\" data-letter=\"B\">B) Communication with employees</div><div class=\"opt\" data-letter=\"C\">C) Self-improvement</div><div class=\"opt\" data-letter=\"D\">D) Staff development</div><div class=\"opt\" data-letter=\"E\">E) Determining salary scales for employees</div>", "ans": ["A", "B", "C", "D"], "sata": true, "fb": "Leadership is flawed and likely ineffective when the leader does not collaborate and communicate effectively with others in the organization. The improvement and development of both others and oneself is vital to the effectiveness of a leader. Clear forward thinking is associated with good leadership. Variables related to pay scales are more suggestive of a management role; this particular activity is not identified as a fatal flaw of leadership."}, {"ch": "Ch 2: Classical Views of Leadership", "q": "Which statement by a subordinate demonstrates the greatest challenge for the leader", "opts": "<div class=\"opt\" data-letter=\"A\">A) \"Your plans for the change can't realistically be implemented.\"</div><div class=\"opt\" data-letter=\"B\">B) \"I don't think you heard what the rest of us had to say.\"</div><div class=\"opt\" data-letter=\"C\">C) \"Do you have an idea what direction we need to go?\"</div><div class=\"opt\" data-letter=\"D\">D) \"Can you tell me why my suggestion will not work?\"</div>", "ans": "A", "sata": false, "fb": "The statement is a clear indication that the subordinate feels the leader is not listening and collaborating; this is a fatal flaw. The subordinate is not making a statement that leads to dialogue and solutions. The other statements express openness to explanation by and with the subordinate and leader."}, {"ch": "Ch 2: Classical Views of Leadership", "q": "Which function of the management process involves the performance evaluation of employees?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Planning</div><div class=\"opt\" data-letter=\"B\">B) Organizing</div><div class=\"opt\" data-letter=\"C\">C) Staffing</div><div class=\"opt\" data-letter=\"D\">D) Controlling</div>", "ans": "D", "sata": false, "fb": "Controlling is the function that includes performance appraisals, fiscal accountability, quality control, legal and ethical control, and professional and collegial control. Planning encompasses determining philosophy, goals, objectives, policies, procedures, and rules; carrying out long - and short -range projections; determining a fiscal course of action; and managing planned change. Organizing includes establishing the structure to carry out plans, determining the most appropriate type of client care delivery, and grouping activities to meet unit goals. Staffing functions consist of recruiting, interviewing, hiring, and orienting staff."}, {"ch": "Ch 2: Classical Views of Leadership", "q": "A nurse has been hired to oversee the operations of a series of ambulatory clinics. The nurse can best promote the success of the organization by:", "opts": "<div class=\"opt\" data-letter=\"A\">A) promoting management skills among all employees.</div><div class=\"opt\" data-letter=\"B\">B) integrating leadership skills and management skills.</div><div class=\"opt\" data-letter=\"C\">C) clearly communicating to employees that they will be required to follow organizational leadership.</div><div class=\"opt\" data-letter=\"D\">D) advocating for the organization to hire a leader for each site.</div>", "ans": "B", "sata": false, "fb": "Success and high achievement are best promoted when leadership and management functions are integrated by individuals. Promoting certain management skills among employees can be beneficial, but this cannot replace the importance of the leader -manager's own skill set. Followership cannot be mandated; it must be earned. The presence of multiple leaders can make it more difficult to effect change because of diverse visions."}, {"ch": "Ch 2: Classical Views of Leadership", "q": "What action by the nurse -manager in a health organization best demonstrates transformational leadership?", "opts": "<div class=\"opt\" data-letter=\"A\">A) The manager readily takes responsibility after making a scheduling error.</div><div class=\"opt\" data-letter=\"B\">B) The manager's employees are reminded that they must submit evidence of renewing their license.</div><div class=\"opt\" data-letter=\"C\">C) The manager ensures that all nurses have submitted their required documentation for the performance reviews.</div><div class=\"opt\" data-letter=\"D\">D) The manager holds a workshop to outline a new vision for client-centered care.</div>", "ans": "D", "sata": false, "fb": "Transformational leadership often involves the communication of a vision and empowering employees to share in it. Functions involving performance review, scheduling, and licensure are more consistent with a transactional role. Taking responsibility is a trait of effective transformational and transactional leadership."}, {"ch": "Ch 2: Classical Views of Leadership", "q": "A nurse was 20 minutes late returning from a scheduled lunch break and a colleague's break was consequently cut short. What response by the manager best demonstrates a laissez -faire leadership approach?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Ask each of the nurses to speak with the manager separately to discuss the implications of this event.</div><div class=\"opt\" data-letter=\"B\">B) Ask the nurses to attend a short meeting together in the manager's office.</div><div class=\"opt\" data-letter=\"C\">C) Allow the two nurses to dialogue about this event and observe for evidence of a satisfactory resolution.</div><div class=\"opt\" data-letter=\"D\">D) Impose a meaningful consequence on the first nurse and have the nurse apologize to the colleague.</div>", "ans": "C", "sata": false, "fb": "Laissez -faire leadership is generally understood to be a \"hands -off\" approach. The manager using this approach would likely allow the two nurses to self -manage this event and reach a solution independently. Requiring a meeting would be a more authoritarian or autocratic approach. Punishing the nurse and requiring an apology would be a strong autocratic approach."}, {"ch": "Ch 2: Classical Views of Leadership", "q": "The nurse -manager is addressing a nurse's suspected breach of client confidentiality in a social media posting. What function of the management process is this nurse -manager demonstrating?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Organizing</div><div class=\"opt\" data-letter=\"B\">B) Staffing</div><div class=\"opt\" data-letter=\"C\">C) Directing</div><div class=\"opt\" data-letter=\"D\">D) Controlling</div>", "ans": "D", "sata": false, "fb": "Legal and ethical issues, such as violations of confidentiality, are categorized within the controlling function. Organizing includes establishing the structure to carry out plans, determining the most appropriate type of client care delivery, and grouping activities to meet unit goals. Staffing functions consist of recruiting, interviewing, hiring, and orienting staff. Directing entails human resource management responsibilities, such as motivating, managing conflict, delegating, communicating, and facilitating collaboration."}, {"ch": "Ch 2: Classical Views of Leadership", "q": "The nurse -manager has been approached by three different families in recent weeks, all of whom have described a particular nurse as giving exceptional care. The manager has relayed this feedback to the nurse and nominated the nurse for an organization -wide award. How should the manager's actions be best interpreted?", "opts": "<div class=\"opt\" data-letter=\"A\">A) The manager is giving an example of democratic leadership.</div><div class=\"opt\" data-letter=\"B\">B) The manager's actions are likely to cause accusations of favoritism.</div><div class=\"opt\" data-letter=\"C\">C) The manager is following the Great Man theory of leadership.</div><div class=\"opt\" data-letter=\"D\">D) The manager's actions may inadvertently discourage the other nurses.</div>", "ans": "A", "sata": false, "fb": "Democratic leadership involves the use of awards and feedback. Accusations of favoritism are unlikely, provided the manager's commendation is evidence based. The Great Man theory posits that leadership is an inherent trait, not a learned trait; the manager's actions do not point to this. There is no reason to believe that a commendation may discourage the nurse's peers."}, {"ch": "Ch 3: Twenty-First Century Leadership", "q": "What action by a nurse -manager best demonstrates servant leadership?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Prioritizing the interests of others over the manager's own interests</div><div class=\"opt\" data-letter=\"B\">B) Cultivating a personal relationship with each subordinate</div><div class=\"opt\" data-letter=\"C\">C) Making decisions on the basis of customer service</div><div class=\"opt\" data-letter=\"D\">D) Communicating a clear vision for the future and asking subordinates to share it</div>", "ans": "A", "sata": false, "fb": "Managers who are servant leaders put serving others, including employees, customers, and the community, as the number one priority. This attitude is not dependent, however, on having a personal relationship with every subordinate. Customer service is valued, but the servant leader also emphasizes the needs of employees and the community. Vision has a place in servant leadership, but this is not a specific characteristic of this type of leadership."}, {"ch": "Ch 3: Twenty-First Century Leadership", "q": "A nurse -manager who seeks to exemplify emotional intelligence should:", "opts": "<div class=\"opt\" data-letter=\"A\">A) attempt to remove emotion from decision making.</div><div class=\"opt\" data-letter=\"B\">B) prioritize emotion over reason when making decisions.</div><div class=\"opt\" data-letter=\"C\">C) regulate their own emotions and those of others.</div><div class=\"opt\" data-letter=\"D\">D) effectively manipulate the emotions of others to achieve goals.</div>", "ans": "C", "sata": false, "fb": "Theorists studying emotional intelligence posit that the ability to regulate the emotions of self and others is key to effective leadership. Emotional intelligence does not involve removing emotion from decision making; conversely, it does not claim that emotion should trump reason. Management of emotions is not the same as manipulating the emotions of others, which is unethical."}, {"ch": "Ch 3: Twenty-First Century Leadership", "q": "A leader -manager provides oversight on a busy medical -surgical unit. There has recently been an incident where two nurses were not honest about neglecting a controversial new protocol and misled the leader. How can the leader -manager best prevent similar episodes?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Support employees' right to disagree with proposed changes.</div><div class=\"opt\" data-letter=\"B\">B) Ensure that employees know the consequences of misleading the manager.</div><div class=\"opt\" data-letter=\"C\">C) Perform random checks on nurses to verify they are following all protocols.</div><div class=\"opt\" data-letter=\"D\">D) Identify allies who can be trusted to report employees who may mislead the manager.</div>", "ans": "A", "sata": false, "fb": "There is no guarantee that followers will not mislead leaders, but adhering to certain principles, such as making sure that followers are allowed to disagree, will guard against this from happening. The manager can often not avoid making unpopular decisions. Enacting punitive measures (consequences) has not been shown to encourage honesty. The use of \"informants\" is likely to cultivate mistrust and is likely to increase dishonesty."}, {"ch": "Ch 3: Twenty-First Century Leadership", "q": "Which statement regarding the characteristics of a good leader is true?", "opts": "<div class=\"opt\" data-letter=\"A\">A) They are brave in all situations.</div><div class=\"opt\" data-letter=\"B\">B) They may have character flaws.</div><div class=\"opt\" data-letter=\"C\">C) They are by nature good intentioned.</div><div class=\"opt\" data-letter=\"D\">D) Charisma is their strongest attribute.</div>", "ans": "B", "sata": false, "fb": "Leaders may be deceitful and trustworthy, greedy and generous, and cowardly and brave. To assume that all good leaders are good people is foolhardy and makes us blind to the human condition. It is only when we recognize and manage failings that leaders can achieve greatness. No one can be brave in each and every situation. Many good leaders have strong charisma, but this is not always the case."}, {"ch": "Ch 3: Twenty-First Century Leadership", "q": "To decrease overtime, the manager of a surgical unit offers nurses who get their work finished on time for an entire 2 -month period an extra day off with pay at regular time. The nurse is enacting what model of leadership?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Favoritism</div><div class=\"opt\" data-letter=\"B\">B) Quantum leadership</div><div class=\"opt\" data-letter=\"C\">C) Principal agent theory</div><div class=\"opt\" data-letter=\"D\">D) Servant leadership</div>", "ans": "C", "sata": false, "fb": "Principal agent theory suggests that followers may have an informational (expertise or knowledge) advantage over the leader as well as their own preferences, which may deviate from that of the principal. This may lead to a misalignment of goals. To influence the agent, the principal offers an incentive that corrects excessive overtime. This action is performance -based, so it would be difficult to characterize it as favoritism. Servant leadership prioritizes the interests of others; creating incentives to address the misalignment of goals is not central to servant leadership. Quantum leadership is a holistic theory of leadership that does not mainly focus on the alignment of disparate goals."}, {"ch": "Ch 3: Twenty-First Century Leadership", "q": "A nurse has been hired to oversee a day surgery clinic. What action will best ensure good outcomes for this nurse, the clients, and the employees of the clinic?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Implement the principles of authoritative leadership.</div><div class=\"opt\" data-letter=\"B\">B) Teach all employees about the financial considerations at the clinic.</div><div class=\"opt\" data-letter=\"C\">C) Consciously develop the ability to be charismatic.</div><div class=\"opt\" data-letter=\"D\">D) Integrate nursing management and nursing leadership roles and practices.</div>", "ans": "D", "sata": false, "fb": "For managers and leaders to function at their greatest potential, the two roles must be integrated. This helps ensure positive outcomes for all. Authoritative leadership is generally not preferred in the 21st century because it has poorer results than more contemporary models. Charisma can be beneficial in a leadership position, but it is not among the major traits of successful leadership and management. A focus on finances with all employees is not normally necessary and is not linked to high -level outcomes."}, {"ch": "Ch 3: Twenty-First Century Leadership", "q": "A new leader -manager is planning to implement the principles of strengths -based leadership after being hired for a new position. What action will best facilitate this plan?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Creating a team with diverse abilities and talents</div><div class=\"opt\" data-letter=\"B\">B) Identifying the leader's personal strengths and utilizing them</div><div class=\"opt\" data-letter=\"C\">C) Appraising team members on a scale that runs from \"weaker\" to \"stronger\"</div><div class=\"opt\" data-letter=\"D\">D) Organizing the flow of work to match the leader's strengths</div>", "ans": "A", "sata": false, "fb": "Strengths -based leadership posits that effective leaders surround themselves with people who have different strengths than they do. The leader should focus on addressing areas where they are weaker, not relying solely on existing strengths. This model does not rank people on a two -dimensional scale because there are diverse ways of being strong."}, {"ch": "Ch 3: Twenty-First Century Leadership", "q": "A leader is applying the principles of emotional intelligence (EI). What outcome indicates successful application of these principles?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Emotions are held in check.</div><div class=\"opt\" data-letter=\"B\">B) Emotions are used effectively.</div><div class=\"opt\" data-letter=\"C\">C) Emotions dominate decision making.</div><div class=\"opt\" data-letter=\"D\">D) Expression of emotion indicates success.</div>", "ans": "B", "sata": false, "fb": "EI refers to the ability to use emotions effectively and is required by leader -managers in order to enhance their success. Ho
