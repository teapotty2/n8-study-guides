lding one's emotions in check can be unhealthy; EI does not demand this. EI does not require that emotions dominate decision making or that the expression of emotion is the marker of success."}, {"ch": "Ch 3: Twenty-First Century Leadership", "q": "A manager has proposed to the hospital board that it hire someone to teach management and leadership classes and that head nurses are paid to attend the classes. What is this an example of?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Using emotional intelligence</div><div class=\"opt\" data-letter=\"B\">B) Transformational leadership</div><div class=\"opt\" data-letter=\"C\">C) Building human capital</div><div class=\"opt\" data-letter=\"D\">D) Using quantum leadership</div>", "ans": "C", "sata": false, "fb": "By providing classes in leadership, the manager is investing in the potential of the head nurse staff to become better leaders and managers. Human capital refers to the attributes of a person that are productive in some economic context, although it is normally measured and conceived of as a private return to the individual as well as a social return. There is no mention of the role of emotions or emotional intelligence. Quantum leadership focuses on the dynamic and multifactorial nature of leadership, but this is not evident in the scenario. Transformational leadership focuses on influencing and promoting vision; these"}, {"ch": "Ch 3: Twenty-First Century Leadership", "q": "An organization has hired six RNs who are recent immigrants. The manager has noticed they interact very little with other staff, often speaking in their own language during their breaks, although they speak English while on duty. Which intervention would be the most helpful action for the manager to help these new RNs better assimilate?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Explain to the new nurses the problem their isolation is causing.</div><div class=\"opt\" data-letter=\"B\">B) Arrange to send them to an English language course at the local adult school.</div><div class=\"opt\" data-letter=\"C\">C) Ask the established RNs to make an effort to include the new nurses in after -work activities.</div><div class=\"opt\" data-letter=\"D\">D) Hold a sharing session so all RNs can share information about their cultures and differences in client care.</div>", "ans": "D", "sata": false, "fb": "This situation has varied nuances that require the manager to address many factors. Providing an opportunity for both groups of nurses to share their cultural heritage and differences in nursing care is an opportunity to promote acceptance among all members of the staff. It has been established that speaking the language is not a problem because they do so while on duty. Including them in after -work activities may demonstrate willingness on the staff's part but will not address work -related isolation. Merely presenting the problem to the new nurses does not show managing initiative."}, {"ch": "Ch 3: Twenty-First Century Leadership", "q": "A nurse -manager will soon be introducing a significant change in the way overtime shifts are allocated on a hospital floor. What action by the manager will best demonstrate the principles of thought leadership?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Convincing employees that the change will be beneficial and innovative</div><div class=\"opt\" data-letter=\"B\">B) Relating the change to the fact that the floor has been required to cut costs</div><div class=\"opt\" data-letter=\"C\">C) Delegating the implementation of the change to the nurses themselves</div><div class=\"opt\" data-letter=\"D\">D) Describing clear expectations for nurses' adherence to the new policy</div>", "ans": "A", "sata": false, "fb": "Thought leadership refers to any situation in which one individual convinces another to consider a new idea, product, or way of looking at things. Thought leadership does not emphasize financial realities, delegation, or the need for rigid adherence."}, {"ch": "Ch 3: Twenty-First Century Leadership", "q": "When applying the principles of quantum leadership, the nurse -manager should prioritize:", "opts": "<div class=\"opt\" data-letter=\"A\">A) carefully managing emotions.</div><div class=\"opt\" data-letter=\"B\">B) being true to their own values, beliefs, and moral character.</div><div class=\"opt\" data-letter=\"C\">C) distinguishing between personal goals and organizational goals.</div><div class=\"opt\" data-letter=\"D\">D) understanding the fact that workplaces are complex and dynamic.</div>", "ans": "D", "sata": false, "fb": "Quantum leadership suggests that the environment and context in which people work is complex and dynamic and that this has a direct impact on organizational productivity required by leader -managers in order to enhance their success. Authentic leadership suggests that in order to lead, leaders must be true to themselves and their values and act accordingly. Quantum leadership does not prioritize the difference between personal and organizational goals or the management of emotions."}, {"ch": "Ch 3: Twenty-First Century Leadership", "q": "Twenty -first-century leadership models generally emphasize the importance of:", "opts": "<div class=\"opt\" data-letter=\"A\">A) relationships.</div><div class=\"opt\" data-letter=\"B\">B) incentives.</div><div class=\"opt\" data-letter=\"C\">C) motivation.</div><div class=\"opt\" data-letter=\"D\">D) consequences.</div>", "ans": "A", "sata": false, "fb": "A transition has occurred in the 21st century from industrial age leadership to relationship age leadership. Most of the contemporary models of leadership have some form of emphasis on relationships. Incentives, consequences, and motivation are not ignored, but relationships are highly prioritized."}, {"ch": "Ch 3: Twenty-First Century Leadership", "q": "There are current and future paradigm shifts in health care that affect the leadership skills needed by nurses in the 21st century. What issue at the organizational and unit levels are nurse -leaders being directed to address?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Active involvement in greatly needed health care reform</div><div class=\"opt\" data-letter=\"B\">B) Persistent and growing international nursing shortage</div><div class=\"opt\" data-letter=\"C\">C) Increasing disparities between health outcomes for wealthy clients and poorer clients</div><div class=\"opt\" data-letter=\"D\">D) High turnover rates by staff nurses</div>", "ans": "D", "sata": false, "fb": "At the organizational and unit levels, nurse -leaders are being directed to address high turnover rates by staff, an emerging shortage of qualified top -level nursing administrators, growing trends toward unionization, and intensified efforts to legislate minimum staffing ratios and eliminate mandatory overtime while maintaining cohesive and productive work environments. At the national level, nurse -leaders and nurse -managers are actively involved in greatly needed health care reform and in addressing a persistent, and likely growing, international nursing shortage. Healthy disparities exist at regional and national levels, not organizational levels."}, {"ch": "Ch 3: Twenty-First Century Leadership", "q": "A nurse -manager demonstrates Level 5 leadership by performing what action?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Keeping emotions in check</div><div class=\"opt\" data-letter=\"B\">B) Accepting nothing less than perfection from subordinates</div><div class=\"opt\" data-letter=\"C\">C) Taking responsibility for their own errors</div><div class=\"opt\" data-letter=\"D\">D) Avoiding conflict unless absolutely necessary</div>", "ans": "C", "sata": false, "fb": "Level 5 leaders know when to ask for help, accept responsibility for the errors they or their team make, and are incredibly disciplined in their work. This model does not have a particular emphasis on avoiding conflict or keeping emotions in check. Rejecting anything short of perfection is unrealistic and is not cited as a characteristic of a Level 5 leader."}, {"ch": "Ch 3: Twenty-First Century Leadership", "q": "A subordinate has accused a manager of favoritism after the manager created the work assignment for the day. How should the manager best apply the principles of emotional intelligence?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Take time to reflect on personal emotional reactions before responding to the accusation.</div><div class=\"opt\" data-letter=\"B\">B) Recognize that the subordinate's statement was likely based on emotion rather than evidence.</div><div class=\"opt\" data-letter=\"C\">C) Involve a colleague in the situation who has no emotional investment in the situation.</div><div class=\"opt\" data-letter=\"D\">D) Choose a response that will diffuse the subordinate's emotions.</div>", "ans": "A", "sata": false, "fb": "Self -awareness is a key component of emotional intelligence that involves the ability to recognize and understand one's moods, emotions, and drives as well as their effects on others. The manager should apply this aspect of emotional intelligence by self-reflection. This self -awareness can often help the manager address a challenging situation without having to involve an impartial third party. Emotional intelligence requires a manager to empathize with others' emotions, but this does not mean that decisions should be made with the sole goal of diffusing people's emotions. The manager must acknowledge the role of emotion but should not assume that a subordinate's complaint is exclusively emotional and lacking a rational basis."}, {"ch": "Ch 3: Twenty-First Century Leadership", "q": "A nurse -manager has been attending several conferences and workshops in order to network with colleagues and build relationships with people outside the organization. How should a nurse best interpret this manager's actions?", "opts": "<div class=\"opt\" data-letter=\"A\">A) The manager is building on their own strengths.</div><div class=\"opt\" data-letter=\"B\">B) The manager's self -regulation is likely to grow because of this activity.</div><div class=\"opt\" data-letter=\"C\">C) The manager is demonstrating servant leadership, which will ultimately benefit the whole organization.</div><div class=\"opt\" data-letter=\"D\">D) The manager is applying the social skills necessary for emotional intelligence.</div>", "ans": "D", "sata": false, "fb": "Social skills are a component of emotional intelligence and involve proficiency in handling relationships and building networks in an effort to find common ground. Servant leadership is characterized by selfless acts, which are not evident in this scenario. Similarly, there is no obvious evidence of the manager building on their strengths. Self -regulation is a component of emotional intelligence, but it involves controlling or redirecting disruptive impulses or moods; there is no indication that the manager is doing this."}, {"ch": "Ch 3: Twenty-First Century Leadership", "q": "Two nurses have approached the manager and have asked the manager to speak to a nurse on the unit who has a reputation for being difficult to get along with. How can the manager best implement authentic leadership?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Meet with the \"difficult\" nurse to assess emotions.</div><div class=\"opt\" data-letter=\"B\">B) Analyze the facts of the situation before making a decision.</div><div class=\"opt\" data-letter=\"C\">C) Encourage all three nurses to meet without the manager present.</div><div class=\"opt\" data-letter=\"D\">D) Encourage all three nurses to disregard their emotions.</div>", "ans": "B", "sata": false, "fb": "Four factors cover the components of authentic leadership. One of these is balanced processing, which involves analyzing data rationally before making decisions. This model acknowledges the salience of emotions, and it would not be appropriate or realistic to ask people to ignore them. Authentic leadership focuses on affective ways of being and does not prescribe specific actions like arranging meetings."}, {"ch": "Ch 3: Twenty-First Century Leadership", "q": "A new nurse -manager has set a goal of implementing authentic leadership. What is the manager's best initial action?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Identify and reflect on their own principles.</div><div class=\"opt\" data-letter=\"B\">B) Examine the source of their own power in the organization.</div><div class=\"opt\" data-letter=\"C\">C) Differentiate colleagues who are allies from those who are potential threats.</div><div class=\"opt\" data-letter=\"D\">D) Delegate management activities so that they can focus on leadership.</div>", "ans": "A", "sata": false, "fb": "In authentic leadership, the leader's principles and values are paramount. Identifying these is a logical starting point for implementing authentic leadership. Separating people into allies and enemies is likely to result in conflict and authoritarianism. Authentic leadership does not require that all management activities must be delegated; authentic leadership can occur in a blended leadership -management role. Examining sources of power may be a necessary practical concern, but this is not a focus of authentic leadership and its focus on principles and values."}, {"ch": "Ch 3: Twenty-First Century Leadership", "q": "An organization is facing budget cuts and the manager has openly shared the details, rationale, and implications of the cuts with staff. The manager has also expressed feelings of disappointment about the cuts. What component of authentic leadership has the manager demonstrated?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Balanced processing</div><div class=\"opt\" data-letter=\"B\">B) Internalized moral perspective</div><div class=\"opt\" data-letter=\"C\">C) Relational transparency</div><div class=\"opt\" data-letter=\"D\">D) Self-awareness</div>", "ans": "C", "sata": false, "fb": "Relational transparency refers to openly sharing feelings and information appropriate to a situation, as this manager has done. Balanced processing refers to analyzing data rationally before making decisions. Internalized moral perspective suggests that the authentic leader is guided by internal moral standards, which then guide their behavior, and self-awareness alludes to a knowing of self so as to make sense of the world."}, {"ch": "Ch 3: Twenty-First Century Leadership", "q": "What actions by the nurse -manager are consistent with relationship age leadership? Select all that apply.", "opts": "<div class=\"opt\" data-letter=\"A\">A) Communicating regularly and openly with employees</div><div class=\"opt\" data-letter=\"B\">B) Encouraging teamwork to solve problems and address issues</div><div class=\"opt\" data-letter=\"C\">C) Including committee representatives from all areas that will be affected by a change</div><div class=\"opt\" data-letter=\"D\">D) Recognizing staff members who have contributed to the organization's goals</div><div class=\"opt\" data-letter=\"E\">E) Encouraging competition between staff members to increase overall efficiency</div>", "ans": ["A", "B", "C", "D"], "sata": true, "fb": "People skills, transparent communication, cooperation, and valuing staff knowledge are all characteristics of the relationship age leader. Promoting competition is characteristic of an industrial age leader."}, {"ch": "Ch 3: Twenty-First Century Leadership", "q": "The leadership of a health care organization has chosen to implement human capital theory. What actions should the organization promote in order to meet this goal? Select all that apply.", "opts": "<div class=\"opt\" data-letter=\"A\">A) Giving subsidies to nurses who want to advance their education</div><div class=\"opt\" data-letter=\"B\">B) Increasing the frequency of performance appraisals for managers</div><div class=\"opt\" data-letter=\"C\">C) Providing in-services and workshops for nurses and other care providers</div><div class=\"opt\" data-letter=\"D\">D) Increasing opportunities for families to participate in care planning</div><div class=\"opt\" data-letter=\"E\">E) Providing salary increases of 2% for all nonmanagement staff</div>", "ans": ["A", "C"], "sata": true, "fb": "Human capital theory emphasizes the benefits of investing in education and professional development. Making performance appraisals more frequent for managers is inconsistent with this focus on education and professional development. Salary increases are invariably popular but do not build capacity by increasing knowledge and skills. Similarly, including families is beneficial to the quality of care but is not a direct example of human capital theory."}, {"ch": "Ch 3: Twenty-First Century Leadership", "q": "Which activity best supports the principles of strengths -based leadership in a health care organization?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Funding for staff to become educated in areas where they are naturally talented</div><div class=\"opt\" data-letter=\"B\">B) Providing remedial services to staff who have committed a medication error</div><div class=\"opt\" data-letter=\"C\">C) Mental -health counseling for staff who have depression or anxiety</div><div class=\"opt\" data-letter=\"D\">D) Smoking -cessation support classes</div>", "ans": "A", "sata": false, "fb": "Strengths -based leadership, which grew out of the positive psychology movement (began in the late 1990s), focuses on the development or empowerment of workers' strengths as opposed to identifying problems, improving underperformance, and addressing weaknesses and obstacles. Investing in staff to develop areas where they are naturally talented is an example of this. Remedial learning, counselling, and treatment address problems or vulnerabilities, not strengths."}, {"ch": "Ch 3: Twenty-First Century Leadership", "q": "Which characteristics are associated with a highly capable individual in Collin's level 5 leadership model? Select all that apply.", "opts": "<div class=\"opt\" data-letter=\"A\">A) Possesses useful knowledge</div><div class=\"opt\" data-letter=\"B\">B) Builds effective interdisciplinary teams</div><div class=\"opt\" data-letter=\"C\">C) Galvanizes members to achieve goals</div><div class=\"opt\" data-letter=\"D\">D) Has the talent and skills needed to do a good job</div><div class=\"opt\" data-letter=\"E\">E) Works effectively to help a team succeed</div>", "ans": ["A", "D"], "sata": true, "fb": "In Level 1 of this model, a highly capable individual makes high -quality contributions with their work, possesses useful levels of knowledge, and has the talent and skills needed to do a good job. Team building and teamwork are Level 2 characteristics,"}, {"ch": "Ch 3: Twenty-First Century Leadership", "q": "Which response is most characteristic of a servant leader?", "opts": "<div class=\"opt\" data-letter=\"A\">A) \"I don't think you have the skills necessary to be effective.\"</div><div class=\"opt\" data-letter=\"B\">B) \"Let me think about that request for 24 hours and get back to you.\"</div><div class=\"opt\" data-letter=\"C\">C) \"Do whatever it takes to get it done fast.\"</div><div class=\"opt\" data-letter=\"D\">D) \"I'll personally handle this situation.\"</div>", "ans": "B", "sata": false, "fb": "A servant leader always thinks before reacting. This leader also chooses words carefully so as to not damage those being led, provides directions toward goal achievement, and finds asking for input more important than personally providing solutions. Speed is not a priority within servant leadership."}, {"ch": "Ch 3: Twenty-First Century Leadership", "q": "A nurse has recently begun a leadership -management role and is most likely to face challenges in:", "opts": "<div class=\"opt\" data-letter=\"A\">A) resolving tensions between baccalaureate -educated nurses and nurses without a degree.</div><div class=\"opt\" data-letter=\"B\">B) promoting best outcomes for clients while reducing costs.</div><div class=\"opt\" data-letter=\"C\">C) educating nurses about their legal scope of practice.</div><div class=\"opt\" data-letter=\"D\">D) marketing the organization to members of the community.</div>", "ans": "B", "sata": false, "fb": "The fiscal realities of nursing and health care are known to make great demands on managers and leaders, regardless of their setting. For this reason, this challenge is more likely than intraprofessional tensions, which are more likely to be isolated. Marketing is not normally the responsibility of the nurse manager -leader. Scope of practice affects what nurse can and cannot do, but it is not the manager's responsibility to educate them about this; most professionals have a grasp of this before beginning a job."}, {"ch": "Ch 3: Twenty-First Century Leadership", "q": "The leaders of a health care organization ascribe to human capital theory and are planning the budget for the next year. What activity should the team prioritize in the budget to promote the goals of this theory?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Signing bonuses for nurses who are hired from outside the region</div><div class=\"opt\" data-letter=\"B\">B) Incentives for staff members who provide exemplary care and who make no errors</div><div class=\"opt\" data-letter=\"C\">C) Community outreach activities that will increase engagement between staff and residents</div><div class=\"opt\" data-letter=\"D\">D) Reimbursement of tuition to nurses who are upgrading their education</div>", "ans": "D", "sata": false, "fb": "Human capital theory prioritizes the long -term benefits of investing in training and education. Incentives, signing bonuses, and community outreach do not run contrary to this theory, but these actions are not direct examples of prioritizing skills acquisition and educational development."}, {"ch": "Ch 3: Twenty-First Century Leadership", "q": "A chief nursing officer is assembling a leadership team. The nurse is ensuring that the team is made up of people who have a diverse range of natural talents and skills. This leader is most clearly exemplifying what theory of leadership?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Level 5 leadership</div><div class=\"opt\" data-letter=\"B\">B) Emotional intelligence</div><div class=\"opt\" data-letter=\"C\">C) Strengths -based leadership</div><div class=\"opt\" data-letter=\"D\">D) Authentic leadership</div>", "ans": "C", "sata": false, "fb": "Strengths -based leadership emphasizes the need to not only identify one's own strengths but also to surround oneself with people who have different strengths. Emotional intelligence prioritizes the importance of values, emotions, and feelings. Level 5 leadership focuses on the affective traits of strong leaders. Authentic leadership is a holistic model that encompasses many more variables than just strengths."}, {"ch": "Ch 3: Twenty-First Century Leadership", "q": "A nurse manager -leader is experiencing many challenges overseeing the care in a health care organization. What statement most clearly indicates a need to apply quantum leadership", "opts": "<div class=\"opt\" data-letter=\"A\">A) \"There's a lot of conflict, not just between nurses but also between members of other disciplines.\"</div><div class=\"opt\" data-letter=\"B\">B) \"Our workplace is in a constant state of change. Each part of our work is unpredictable and always shifting.\"</div><div class=\"opt\" data-letter=\"C\">C) \"Historically, many decisions seem to have been made on the basis of emotion, and I'd really like to change that.\"</div><div class=\"opt\" data-letter=\"D\">D) \"There's a rift between management and employees and it affects communication.\"</div>", "ans": "B", "sata": false, "fb": "Quantum leadership posits that today's workplace is a highly fluid, flexible, and mobile environment, and this calls for an entirely innovative form of leadership. Quantum leadership encompasses varied aspects of this uncertainty, such as conflict and emotion, but these are not the central focuses of this theory."}, {"ch": "Ch 3: Twenty-First Century Leadership", "q": "A nurse -manager has proposed a change in the skills mix in a hospital unit, with fewer registered nurses and more nursing assistants. What outcome best demonstrates that the nurse is applying the principles of thought leadership?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Skeptics of the plan have begun to see it as innovative and beneficial.</div><div class=\"opt\" data-letter=\"B\">B) Individuals who oppose the plan have become isolated by their peers.</div><div class=\"opt\" data-letter=\"C\">C) Nurses and nursing assistants will both participate in the operations planning.</div><div class=\"opt\" data-letter=\"D\">D) The ultimate decision on the matter will be based on rational ideas rather than emotions.</div>", "ans": "A", "sata": false, "fb": "Thought leadership refers to any situation in which one individual convinces another to consider a new idea, product, or way of looking at things. The theory does not advocate achieving this through ostracizing dissenters. Inclusive leadership groups are beneficial, but this is not a particular characteristic of thought leadership. Thought leadership does not imply a rejection of emotion."}, {"ch": "Ch 18: Creating a Motivating Climate", "q": "A nurse -manager oversees approximately 12 employees. What strategy should the manager prioritize when trying to motivate the employees?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Offer praise for exceptional performance.</div><div class=\"opt\" data-letter=\"B\">B) Advocate for an increase in pay.</div><div class=\"opt\" data-letter=\"C\">C) Apply motivational strategies that are personally meaningful to each employee.</div><div class=\"opt\" data-letter=\"D\">D) Apply punishments objectively and fairly.</div>", "ans": "C", "sata": false, "fb": "Each person is a unique individual who is motivated by different things. The comparatively small size of the staff allows the manager to determine and apply motivation strategies that meet each employee's needs. There is no guarantee that salary, praise, and punishment will motivate every employee."}, {"ch": "Ch 18: Creating a Motivating Climate", "q": "What did motivational theorist Victor Vroom state?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Personal motivators could be separated from job satisfiers.</div><div class=\"opt\" data-letter=\"B\">B) People are motivated by three basic needs: achievement, affiliation, and power.</div><div class=\"opt\" data-letter=\"C\">C) A manager's assumptions about workers directly affect the intrinsic motivation of the workers.</div><div class=\"opt\" data-letter=\"D\">D) Employees' expectations about their work environment or an event will affect their behavior.</div>", "ans": "D", "sata": false, "fb": "Vroom's expectancy model says that a person's expectations about their environment or a certain event will influence behavior. The other listed statements about motivation are attributable to other theorists."}, {"ch": "Ch 18: Creating a Motivating Climate", "q": "A nurse -manager is applying Herzberg's motivation -hygiene theory. What strategy would the manager most likely use to motivate employees?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Advocating for an increase in salary</div><div class=\"opt\" data-letter=\"B\">B) Approving vacation requests</div><div class=\"opt\" data-letter=\"C\">C) Protecting employee's job security</div><div class=\"opt\" data-letter=\"D\">D) Recognizing nurses for exceptional clinical performance</div>", "ans": "D", "sata": false, "fb": "Herzberg maintained that factors such as pay, working conditions, and job security were maintenance factors that prevent dissatisfaction but which do not actually motivate. He claimed that recognition and achievement, however, were motivators."}, {"ch": "Ch 18: Creating a Motivating Climate", "q": "Which factor is most likely to provide intrinsic motivation to an employee?", "opts": "<div class=\"opt\" data-letter=\"A\">A) The employee's ambitious career aspirations</div><div class=\"opt\" data-letter=\"B\">B) The employee's need to elicit approval from the immediate supervisor</div><div class=\"opt\" data-letter=\"C\">C) The employee's need to avoid punishment for unsafe practice</div><div class=\"opt\" data-letter=\"D\">D) The employee's fear of being passed up for a promotion</div>", "ans": "A", "sata": false, "fb": "Intrinsic motivation comes from within the individual. An example is an employee's career aspirations. An employee's desire for rewards or desire to avoid punishment is an example of extrinsic rewards."}, {"ch": "Ch 18: Creating a Motivating Climate", "q": "According to McClelland, what motivates an achievement -oriented employee?", "opts": "<div class=\"opt\" data-letter=\"A\">A) The extrinsic rewards to be acquired</div><div class=\"opt\" data-letter=\"B\">B) A need to nurture others</div><div class=\"opt\" data-letter=\"C\">C) A need to have legitimate power over others</div><div class=\"opt\" data-letter=\"D\">D) The intrinsic need to be successful</div>", "ans": "D", "sata": false, "fb": "McClelland stated that achievement -oriented people will focus on improving (succeeding) through action rather than seeking extrinsic rewards. Affiliation -oriented people focus on relationships and nurturing others. Power -oriented people are motivated by influence over others."}, {"ch": "Ch 18: Creating a Motivating Climate", "q": "A nurse -manager who is operating from the position of McGregor's Theory X will most likely hold what assumption about employees?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Putting forth effort comes naturally for employees.</div><div class=\"opt\" data-letter=\"B\">B) Workers are inherently diligent, responsible, and helpful.</div><div class=\"opt\" data-letter=\"C\">C) Workers are fundamentally uncreative and indifferent toward their work.</div><div class=\"opt\" data-letter=\"D\">D) It is impossible to accurately identify what motivates an employee.</div>", "ans": "C", "sata": false, "fb": "McGregor's Theory X posits that workers are lazy, uncreative, and indifferent. Theory Y emphasizes the natural altruism and motivation of workers. McGregor did not explicitly state that it was impossible to know an employee's motivations."}, {"ch": "Ch 18: Creating a Motivating Climate", "q": "According to Maslow, what statement best describes motivation?", "opts": "<div class=\"opt\" data-letter=\"A\">A) All needs have equal power in motivation.</div><div class=\"opt\" data-letter=\"B\">B) Unsatisfied needs trigger behavior.</div><div class=\"opt\" data-letter=\"C\">C) Lower -level needs are less valued.</div><div class=\"opt\" data-letter=\"D\">D) Some individuals have hereditary needs.</div>", "ans": "B", "sata": false, "fb": "Hierarchy of need implies that people are motivated to satisfy certain needs, ranging from basic survival to complex psychological needs, and people seek a higher need only when the lower needs have been predominantly met. Needs exist within a hierarchy, and lower -level needs are prioritized over higher -level needs."}, {"ch": "Ch 18: Creating a Motivating Climate", "q": "What did Victor Vroom emphasize the importance of?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Managers knowing each employee's expectation of reward</div><div class=\"opt\" data-letter=\"B\">B) Managers being honest with their employees</div><div class=\"opt\" data-letter=\"C\">C) Making sure that the employees' lower -level needs are met</div><div class=\"opt\" data-letter=\"D\">D) Understanding that individuals react in a stimulus -response mode</div>", "ans": "A", "sata": false, "fb": "Victor Vroom emphasized the importance of managers knowing each employee's expectation of reward. The other options are not related to Vroom's theory."}, {"ch": "Ch 18: Creating a Motivating Climate", "q": "A nurse -manager is applying the theory of Saul Gellerman to motivating employees. What action by the manager would best exemplify Gellerman's theory?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Determining whether employees are achievement -oriented, affiliation -oriented, or power -oriented</div><div class=\"opt\" data-letter=\"B\">B) Allowing employees to be self -directed in their choice of tasks and schedules</div><div class=\"opt\" data-letter=\"C\">C) Providing constructive and positive feedback on a regular basis</div><div class=\"opt\" data-letter=\"D\">D) Occasionally assigning employees tasks that are more difficult than usual</div>", "ans": "D", "sata": false, "fb": "Gellerman suggested stretching, which involves assigning tasks that are more difficult than what the person is used to doing. Determining whether employees are achievement -oriented, affiliation -oriented, or power -oriented is associated with McClelland. Gellerman did not explicitly advocate feedback or self -direction."}, {"ch": "Ch 18: Creating a Motivating Climate", "q": "A nurse -manager can apply Skinner's theory of motivation by performing what action?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Assigning employees outcomes and having them decide how to achieve them</div><div class=\"opt\" data-letter=\"B\">B) Distributing rewards and punishments to influence behavior</div><div class=\"opt\" data-letter=\"C\">C) Forming individualized, collaborative relationships with employees</div><div class=\"opt\" data-letter=\"D\">D) Prioritizing the role of financial rewards and incentives</div>", "ans": "B", "sata": false, "fb": "Skinner emphasized the role of rewards and punishment as conditioning individuals' behavior. Skinner did not emphasize a specific role for financial rewards or the importance of relationships. He did not state that employees should decide independently how to achieve outcomes."}, {"ch": "Ch 18: Creating a Motivating Climate", "q": "For several months, a nurse -manager has been rewarding employees' performance in an effort to motivate them. The nurse -manager should be aware of what unintended", "opts": "<div class=\"opt\" data-letter=\"A\">A) Employees may set unrealistically high goals for themselves.</div><div class=\"opt\" data-letter=\"B\">B) Unhealthy competition may develop between coworkers.</div><div class=\"opt\" data-letter=\"C\">C) Employees' intrinsic motivation may become blunted.</div><div class=\"opt\" data-letter=\"D\">D) Employees may expect a corresponding increase in salary.</div>", "ans": "C", "sata": false, "fb": "The tendency of extrinsic motivation to interfere with intrinsic motivation is known as the overjustification effect. This involves a decrease in intrinsically motivated behaviors after the behavior is extrinsically rewarded and the reinforcement is subsequently discontinued. Distribution of rewards is not noted to cause unrealistically high goals, unhealthy competition, or an expectation for higher salaries."}, {"ch": "Ch 18: Creating a Motivating Climate", "q": "Which statement is typically true of job satisfaction levels?", "opts": "<div class=\"opt\" data-letter=\"A\">A) They are generally higher for subordinates than for management staff.</div><div class=\"opt\" data-letter=\"B\">B) They decline as the level of participation in unit decision making increases.</div><div class=\"opt\" data-letter=\"C\">C) They are related to the degree of work -life control subordinates perceive they have.</div><div class=\"opt\" data-letter=\"D\">D) They are fairly static given that unit cultures are traditionally very difficult to change.</div>", "ans": "C", "sata": false, "fb": "Job satisfaction levels can be correlated with the degree of control subordinates perceive they have over their work life. It is untrue that subordinates enjoy greater job satisfaction. Participation in decision making increases job satisfaction. Job satisfaction is highly dynamic, depending on several factors."}, {"ch": "Ch 18: Creating a Motivating Climate", "q": "Which course of action would be most apt to help a demotivated nurse -manager with personal and professional renewal?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Begin job hunting in a new field.</div><div class=\"opt\" data-letter=\"B\">B) Start practicing self-care.</div><div class=\"opt\" data-letter=\"C\">C) Take a management class.</div><div class=\"opt\" data-letter=\"D\">D) Reduce work hours whenever possible.</div>", "ans": "B", "sata": false, "fb": "For self -care, the manager should seek time off on a regular basis to meet personal needs, have recreation, form relationships outside the work setting, and have fun. Friends and colleagues are essential for emotional support, guidance, and renewal. A proper diet and exercise are important to maintain physical as well as emotional health. The remaining options are not practical and lack the focus on self."}, {"ch": "Ch 18: Creating a Motivating Climate", "q": "Which activity demonstrates employee engagement?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Employee participates in hospital fundraiser.</div><div class=\"opt\" data-letter=\"B\">B) Employee accepts position as charge nurse.</div><div class=\"opt\" data-letter=\"C\">C) Employee completes annual performance review.</div><div class=\"opt\" data-letter=\"D\">D) Employee arrives to work on time.</div>", "ans": "A", "sata": false, "fb": "The term used to describe an employee's emotional commitment to the organization and its goals is employee engagement. Engagement occurs when workers are involved in, enthusiastic about, and committed to their work and workplace. Similarly, Mizne (2018) defines employee engagement as proactively and passionately adding value while aligning with the company mission and operational goals."}, {"ch": "Ch 18: Creating a Motivating Climate", "q": "Which of the following is a true statement regarding intrinsic motivation?", "opts": "<div class=\"opt\" data-letter=\"A\">A) It is within a person and is unchangeable.</div><div class=\"opt\" data-letter=\"B\">B) It involves a quest for external rewards.</div><div class=\"opt\" data-letter=\"C\">C) It can be influenced by others.</div><div class=\"opt\" data-letter=\"D\">D) It is sufficient to motivate most workers.</div>", "ans": "C", "sata": false, "fb": "Intrinsic motivation comes from within the person, driving him or her to be productive such as personal goals and aspirations. Despite the fact that it comes from within, it can be influenced by others and is changeable. It is rarely sufficient to fully motivate a worker."}, {"ch": "Ch 18: Creating a Motivating Climate", "q": "A nurse -manager wants to express appreciation to an employee. What statement is most effective?", "opts": "<div class=\"opt\" data-letter=\"A\">A) \"You're doing an excellent job of providing care for your clients.\"</div><div class=\"opt\" data-letter=\"B\">B) \"I really admire everything that you do on the unit.\"</div><div class=\"opt\" data-letter=\"C\">C) \"You did an exemplary job of handling a very heavy workload this shift.\"</div><div class=\"opt\" data-letter=\"D\">D) \"Your performance demonstrates a strong commitment to the profession.\"</div>", "ans": "C", "sata": false, "fb": "Praise that is specific and evidence -based is generally more effective than broad, general statements about an employee's performance."}, {"ch": "Ch 18: Creating a Motivating Climate", "q": "McClelland's studies state that all people are motivated by specific basic needs. What are these needs? Select all that apply.", "opts": "<div class=\"opt\" data-letter=\"A\">A) Self-esteem</div><div class=\"opt\" data-letter=\"B\">B) Self-actualization</div><div class=\"opt\" data-letter=\"C\">C) Achievement</div><div class=\"opt\" data-letter=\"D\">D) Power</div><div class=\"opt\" data-letter=\"E\">E) Affiliation</div>", "ans": ["C", "D", "E"], "sata": true, "fb": "McClelland's studies state that all people are motivated by three basic needs: achievement, affiliation, and power. McClelland does not include self -esteem and self-actualization as needs associated with motivation."}, {"ch": "Ch 18: Creating a Motivating Climate", "q": "A nurse -manager can best implement Gellerman's theory of motivation by performing what action?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Distributing praise and rewards equitably to all employees</div><div class=\"opt\" data-letter=\"B\">B) Establishing authentic relationships with employees</div><div class=\"opt\" data-letter=\"C\">C) Being transparent and accountable when administering punishments</div><div class=\"opt\" data-letter=\"D\">D) Empowering employees by giving them authority to make decisions</div>", "ans": "D", "sata": false, "fb": "Gellerman states that most managers in organizations overmanage, making the responsibilities too narrow and failing to give employees any decision -making power or to stretch them often enough. Gellerman did not emphasize the importance of distributing praise and rewards equitably, being open when punishing employees, and cultivating relationships with employees."}, {"ch": "Ch 18: Creating a Motivating Climate", "q": "A nurse -manager recognizes the need to avoid burnout and maintain a high motivation level. The manager can best achieve this by:", "opts": "<div class=\"opt\" data-letter=\"A\">A) working on as large a variety of projects as possible.</div><div class=\"opt\" data-letter=\"B\">B) asking supervisors to keep the manager closely accountable for work performance.</div><div class=\"opt\" data-letter=\"C\">C) asking subordinates and superiors to provide positive reinforcement whenever possible.</div><div class=\"opt\" data-letter=\"D\">D) reflecting on their own needs and seeking help when necessary.</div>", "ans": "D", "sata": false, "fb": "It is imperative that discouraged managers acknowledge their own feelings and seek assistance accordingly. A manager can easily become burnt out when working on a large variety of projects. It is inappropriate to overtly ask for positive reinforcement, whether from superiors or from subordinates. Accountability can enhance performance but does not prevent burnout."}, {"ch": "Ch 18: Creating a Motivating Climate", "q": "What is one of the most powerful yet frequently overlooked or underused motivators that the manager can use to create a motivating climate?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Continuing education</div><div class=\"opt\" data-letter=\"B\">B) Fair and objective punishments</div><div class=\"opt\" data-letter=\"C\">C) Positive reinforcement</div><div class=\"opt\" data-letter=\"D\">D) Adequate self-care</div>", "ans": "C", "sata": false, "fb": "Positive reinforcement is one of the most powerful motivators the manager can use and is frequently overlooked or underused. Continuing education is necessary but is not identified as a motivator. Punishments are necessary in certain circumstances but are not considered a standard motivation technique. Adequate self -care preserves health and productivity but does not independently provide motivation."}, {"ch": "Ch 18: Creating a Motivating Climate", "q": "When attempting to create a work environment that includes appropriate and effective monetary incentives, a nurse -manager will initially address which issue?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Whether incentives are traditionally used in the institution</div><div class=\"opt\" data-letter=\"B\">B) Whether the budget will allow for monetary rewards large enough to create incentive</div><div class=\"opt\" data-letter=\"C\">C) Whether the staff views monetary incentives as having the greatest value</div><div class=\"opt\" data-letter=\"D\">D) Whether other nurse -managers feel that monetary incentives are appropriate</div>", "ans": "C", "sata": false, "fb": "Organizations must be cognizant of the need to offer incentives at a level where employees value them. This requires that the organization and its managers understand employees' collective values and devise a reward system that is consistent with that value system. Although the other options represent reasonable areas to explore, they are not the initial issue to be addressed because they would all be moot if employees did not value monetary incentives."}, {"ch": "Ch 18: Creating a Motivating Climate", "q": "Which is the basic factor involving staff engagement and motivation, and its relationship with the achievement of unit -oriented goals?", "opts": "<div class=\"opt\" data-letter=\"A\">A) The autonomy the staff has to achieve the stated goals</div><div class=\"opt\" data-letter=\"B\">B) The input the staff has in establishing the unit goals</div><div class=\"opt\" data-letter=\"C\">C) The value the staff places on the stated unit goals</div><div class=\"opt\" data-letter=\"D\">D) The relationship staff has with their management</div>", "ans": "D", "sata": false, "fb": "The interpersonal relationship between an employee and their supervisor is critical to the employee's motivation level. We often forget that the only way to achieve our goals is through the people who work with us. Although the other options reflect factors that may impact goal achievement, they are not considered the basic factor."}, {"ch": "Ch 18: Creating a Motivating Climate", "q": "Which attribute plays a factor in intrinsic motivation?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Gender</div><div class=\"opt\" data-letter=\"B\">B) Benefit</div><div class=\"opt\" data-letter=\"C\">C) Culture</div><div class=\"opt\" data-letter=\"D\">D) Salary</div>", "ans": "C", "sata": false, "fb": "Parents and peers often play major roles in shaping a person's values about what they want to do and be, and cultural background also has an impact on intrinsic motivation because some cultures value career mobility, job success, and recognition more than others. Benefits and salary are considered extrinsic motivation when individuals are motivated to perform a behavior or engage in an activity to earn a reward or avoid punishment."}, {"ch": "Ch 18: Creating a Motivating Climate", "q": "Which characteristics define a Theory Y employee? Select all that apply.", "opts": "<div class=\"opt\" data-letter=\"A\">A) Needs only general supervision</div><div class=\"opt\" data-letter=\"B\">B) Avoids responsibility</div><div class=\"opt\" data-letter=\"C\">C) Has little ambition</div><div class=\"opt\" data-letter=\"D\">D) Must be directed</div><div class=\"opt\" data-letter=\"E\">E) Seeks responsibility</div>", "ans": ["A", "E"], "sata": true, "fb": "These assumptions, which McGregor labeled Theory X and Theory Y, led to the realization in management science that how the manager views, and thus treats, the worker will have an impact on how well the organization functions. Theory X and Theory Y focus on the employee's attitudes about people and are described as two opposite attitudes that a manager can possess."}, {"ch": "Ch 18: Creating a Motivating Climate", "q": "Which reward is an example of intrinsic motivation?", "opts": "<div class=\"opt\" data-letter=\"A\">A) The prized locker is awarded to the staff member voted \"most helpful\" by their peers.</div><div class=\"opt\" data-letter=\"B\">B) An extra vacation day is awarded every 6 months if a staff member has perfect attendance.</div><div class=\"opt\" data-letter=\"C\">C) The entire staff is treated to a pizza party each time the unit earns a client</div><div class=\"opt\" data-letter=\"D\">D) A staff member is eager to obtain an advanced practice credential and is working toward this end.</div>", "ans": "D", "sata": false, "fb": "Intrinsic motivation comes from within the individual. It is driven by a need to improve and be more productive. Extrinsic motivation is motivation enhanced by the job environment or external rewards. Rewards and reinforcements are given to encourage certain behaviors and/or levels of achievement. The remaining options are examples of extrinsic motivations."}, {"ch": "Ch 18: Creating a Motivating Climate", "q": "A nurse -manager recognizes the need to foster creativity among employees. What action will best promote creativity?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Encourage regular turnover of employees.</div><div class=\"opt\" data-letter=\"B\">B) Hire young employees whenever possible.</div><div class=\"opt\" data-letter=\"C\">C) Demote employees who show a lack of creativity.</div><div class=\"opt\" data-letter=\"D\">D) Avoid micromanaging employees' behaviors.</div>", "ans": "D", "sata": false, "fb": "Micromanaging is known to stifle creativity. In order to be creative, employees must have a degree of freedom over their actions. Young employees are not necessarily more creative than older employees, and frequent staffing turnover does not guarantee creativity. Punitive actions are unlikely to promote the sense of exploration and freedom that results in creativity."}, {"ch": "Ch 18: Creating a Motivating Climate", "q": "What characteristic of a workplace is most likely to result in creativity and risk taking?", "opts": "<div class=\"opt\" data-letter=\"A\">A) There are frequent changes in management and supervision.</div><div class=\"opt\" data-letter=\"B\">B) There is a high proportion of recent nursing graduates.</div><div class=\"opt\" data-letter=\"C\">C) Employees have frequent performance appraisals with the manager.</div><div class=\"opt\" data-letter=\"D\">D) The employees feel empowered to advocate for change.</div>", "ans": "D", "sata": false, "fb": "In order to be creative and take risks, employees need to feel sufficiently empowered to challenge the status quo. Instability in leadership and management does not promote creativity and risk taking, and new graduates are less likely to be creative risk takers than nurses who have more experience. Frequent performance appraisals are an important part of good management, but these do not lead directly to creativity and risk taking."}, {"ch": "Ch 18: Creating a Motivating Climate", "q": "A nurse -manager has been distributing rewards to employees but has not identified a resulting increase in motivation. What characteristic of the manager's rewards may have limited their effect on motivation?", "opts": "<div class=\"opt\" data-letter=\"A\">A) The manager did not clearly communicate the intent of the rewards.</div><div class=\"opt\" data-letter=\"B\">B) The manager has not been distributing the rewards consistently.</div><div class=\"opt\" data-letter=\"C\">C) There is no precedent of giving rewards in the organization.</div><div class=\"opt\" data-letter=\"D\">D) The manager's supervisor does not acknowledge the benefits of rewards.</div>", "ans": "B", "sata": false, "fb": "Inconsistent distribution of rewards can frustrate and confuse workers, resulting in decreased motivation. The manager does not have to be explicit about the intent of rewards in order for them to motivate. Inexperience and unfamiliarity with rewards would not necessarily limit their benefits, if applied correctly."}, {"ch": "Ch 18: Creating a Motivating Climate", "q": "A nurse -manager is in a new position and has observed that many of the employees appear to be unmotivated. The manager can promote employees' motivation by:", "opts": "<div class=\"opt\" data-letter=\"A\">A) establishing trusting and respectful relationships with the employees.</div><div class=\"opt\" data-letter=\"B\">B) making expectations for motivation clearly known.</div><div class=\"opt\" data-letter=\"C\">C) assigning preceptors to each of the unmotivated employees.</div><div class=\"opt\" data-letter=\"D\">D) increasing recruitment efforts to add new employees to the unit.</div>", "ans": "A", "sata": false, "fb": "Collaborative and supportive relationships between managers and employees are essential to creating an environment that promotes motivation. Motivation cannot be demanded, and preceptors are not normally assigned to existing employees. Adding new staff members will not necessarily increase motivation."}, {"ch": "Ch 18: Creating a Motivating Climate", "q": "A nurse manager believes that their employees are self -motivated, creative, and willing to take responsibility for their jobs. This belief represents:", "opts": "<div class=\"opt\" data-letter=\"A\">A) Maslow's hierarchy of needs.</div><div class=\"opt\" data-letter=\"B\">B) McGregor's Theory X.</div><div class=\"opt\" data-letter=\"C\">C) McGregor's Theory Y.</div><div class=\"opt\" data-letter=\"D\">D) Herzberg's two -factor theory.</div>", "ans": "C", "sata": false, "fb": "These assumptions, which McGregor labeled Theory X and Theory Y, led to the realization in management science that how the manager views, and thus treats, the worker will have an impact on how well the organization functions. Theory X and Theory Y focus on the employee's attitudes about people and are described as two opposite attitudes that a manager can possess."}];
let questions = [...ALL_QUESTIONS];
let current = 0;
let answers = {};       // index -> letter (normal) or Set of letters (sata)
let correctCount = 0, wrongCount = 0;
let wrongIndexes = new Set();

function init() {
  current = 0; answers = {}; correctCount = 0; wrongCount = 0; wrongIndexes = new Set();
  document.getElementById('stat-correct').textContent = '0';
  document.getElementById('stat-wrong').textContent = '0';
  document.getElementById('stat-remain').textContent = questions.length;
  document.getElementById('summary').style.display = 'none';
  document.getElementById('quiz-container').style.display = 'block';
  document.getElementById('wrong-btn').style.display = 'none';
  render();
}

function render() {
  if (current >= questions.length) { showSummary(); return; }
  const q = questions[current];
  document.getElementById('q-counter').textContent = 'Question ' + (current+1) + ' of ' + questions.length;
  document.getElementById('ch-tag').textContent = q.ch;

  const sataTag = document.getElementById('sata-tag');
  const legend  = document.getElementById('sata-legend');
  if (q.sata) {
    sataTag.style.display = 'inline-block';
    legend.style.display = 'block';
  } else {
    sataTag.style.display = 'none';
    legend.style.display = 'none';
  }

  document.getElementById('q-text').textContent = q.q;
  document.getElementById('options').innerHTML = q.opts;
  document.getElementById('feedback').style.display = 'none';
  document.getElementById('feedback-text').textContent = q.fb;
  document.getElementById('correct-badge').style.display = 'none';
  document.getElementById('wrong-badge').style.display  = 'none';
  document.getElementById('check-btn').style.display    = 'none';
  document.getElementById('progress').style.width = ((current / questions.length) * 100) + '%';
  document.getElementById('prev-btn').disabled = current === 0;
  document.getElementById('next-btn').textContent = current === questions.length - 1 ? 'Finish' : 'Next';

  const prev = answers[current];
  if (prev !== undefined) {
    if (q.sata) restoreMulti(prev, q.ans);
    else        revealSingle(prev, q.ans);
  } else {
    if (q.sata) attachMultiHandlers(q.ans);
    else        attachSingleHandlers(q.ans);
  }
}

// ── Single-answer ───────────────────────────────────────────────────────────
function attachSingleHandlers(correct) {
  document.querySelectorAll('.opt').forEach(o => {
    o.onclick = () => {
      if (answers[current] !== undefined) return;
      answers[current] = o.dataset.letter;
      updateStats(o.dataset.letter === correct);
      revealSingle(o.dataset.letter, correct);
    };
  });
}

function revealSingle(selected, correct) {
  document.querySelectorAll('.opt').forEach(o => {
    o.classList.add('locked'); o.onclick = null;
    if (o.dataset.letter === correct)                       o.classList.add('correct');
    if (o.dataset.letter === selected && selected !== correct) o.classList.add('wrong');
  });
  document.getElementById('feedback').style.display = 'block';
  const isCorrect = selected === correct;
  document.getElementById('correct-badge').style.display = isCorrect ? 'flex' : 'none';
  document.getElementById('wrong-badge').style.display   = isCorrect ? 'none' : 'flex';
}

// ── Multi-answer SATA ───────────────────────────────────────────────────────
let sataSelected = new Set();

function attachMultiHandlers(correctList) {
  sataSelected = new Set();
  document.querySelectorAll('.opt').forEach(o => {
    o.onclick = () => {
      if (o.classList.contains('locked')) return;
      const letter = o.dataset.letter;
      if (sataSelected.has(letter)) {
        sataSelected.delete(letter);
        o.classList.remove('selected');
      } else {
        sataSelected.add(letter);
        o.classList.add('selected');
      }
      document.getElementById('check-btn').style.display = sataSelected.size > 0 ? 'block' : 'none';
    };
  });
  document.getElementById('check-btn').onclick = () => submitMulti(correctList);
}

function submitMulti(correctList) {
  const correct = new Set(correctList);
  const isFullyCorrect = [...correct].every(l => sataSelected.has(l)) &&
                         [...sataSelected].every(l => correct.has(l));
  answers[current] = [...sataSelected];
  if (!isFullyCorrect) wrongIndexes.add(current);
  updateStats(isFullyCorrect);

  document.querySelectorAll('.opt').forEach(o => {
    o.classList.add('locked'); o.onclick = null;
    o.classList.remove('selected');
    const letter = o.dataset.letter;
    const wasSelected = sataSelected.has(letter);
    const isCorrect   = correct.has(letter);
    if (isCorrect && wasSelected)  o.classList.add('correct');
    if (!isCorrect && wasSelected) o.classList.add('wrong');
    if (isCorrect && !wasSelected) o.classList.add('missed');
  });
  document.getElementById('check-btn').style.display = 'none';
  document.getElementById('feedback').style.display  = 'block';
  document.getElementById('correct-badge').style.display = isFullyCorrect ? 'flex' : 'none';
  document.getElementById('wrong-badge').style.display   = isFullyCorrect ? 'none' : 'flex';
}

function restoreMulti(savedList, correctList) {
  const saved   = new Set(savedList);
  const correct = new Set(correctList);
  document.querySelectorAll('.opt').forEach(o => {
    o.classList.add('locked'); o.onclick = null;
    const letter = o.dataset.letter;
    const wasSelected = saved.has(letter);
    const isCorrect   = correct.has(letter);
    if (isCorrect && wasSelected)  o.classList.add('correct');
    if (!isCorrect && wasSelected) o.classList.add('wrong');
    if (isCorrect && !wasSelected) o.classList.add('missed');
  });
  document.getElementById('feedback').style.display = 'block';
  const isFullyCorrect = [...correct].every(l => saved.has(l)) && [...saved].every(l => correct.has(l));
  document.getElementById('correct-badge').style.display = isFullyCorrect ? 'flex' : 'none';
  document.getElementById('wrong-badge').style.display   = isFullyCorrect ? 'none' : 'flex';
}

// ── Stats ────────────────────────────────────────────────────────────────────
function updateStats(isCorrect) {
  if (isCorrect) correctCount++; else { wrongCount++; wrongIndexes.add(current); }
  document.getElementById('stat-correct').textContent = correctCount;
  document.getElementById('stat-wrong').textContent   = wrongCount;
  document.getElementById('stat-remain').textContent  = questions.length - Object.keys(answers).length;
}

// ── Nav ──────────────────────────────────────────────────────────────────────
function nextQ() {
  if (current < questions.length - 1) { current++; render(); } else showSummary();
}
function prevQ() { if (current > 0) { current--; render(); } }

// ── Summary ──────────────────────────────────────────────────────────────────
function showSummary() {
  document.getElementById('quiz-container').style.display = 'none';
  document.getElementById('summary').style.display = 'block';
  const total   = questions.length;
  const skipped = total - Object.keys(answers).length;
  const pct     = total > 0 ? Math.round((correctCount/total)*100) : 0;
  document.getElementById('sum-score').textContent   = correctCount + '/' + total;
  document.getElementById('sum-pct').textContent     = pct + '%';
  document.getElementById('sum-correct').textContent = correctCount;
  document.getElementById('sum-wrong').textContent   = wrongCount;
  document.getElementById('sum-skipped').textContent = skipped;
  let msg = '';
  if (pct >= 92) msg = 'A — Outstanding! You are very well prepared.';
  else if (pct >= 83) msg = 'B — Good work. A few more rounds and you are set.';
  else if (pct >= 75) msg = 'C — Passing, but push for deeper mastery before exam day.';
  else msg = 'Below passing — focus on rationales for wrong answers and review those chapters.';
  document.getElementById('sum-msg').textContent = msg;
  document.getElementById('progress').style.width = '100%';
  if (wrongIndexes.size > 0) document.getElementById('wrong-btn').style.display = 'inline-block';
}

// ── Controls ─────────────────────────────────────────────────────────────────
function shuffleQuestions() {
  for (let i = questions.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i+1));
    [questions[i], questions[j]] = [questions[j], questions[i]];
  }
  init();
}
function resetQuiz() {
  questions = [...ALL_QUESTIONS];
  document.getElementById('ch-filter').value = 'all';
  init();
}
function filterByChapter() {
  const val = document.getElementById('ch-filter').value;
  questions = val === 'all' ? [...ALL_QUESTIONS]
    : ALL_QUESTIONS.filter(q => q.ch.startsWith('Ch ' + val + ':'));
  init();
}
function showOnlyWrong() {
  if (wrongIndexes.size === 0) return;
  questions = [...wrongIndexes].map(i => questions[i]);
  init();
}

document.addEventListener('keydown', e => {
  const key = e.key.toUpperCase();
  if (['A','B','C','D','E'].includes(key)) {
    document.querySelectorAll('.opt').forEach(o => { if (o.dataset.letter === key) o.click(); });
  }
  if ((e.key === 'ArrowRight' || e.key === 'Enter') && answers[current] !== undefined) nextQ();
  if (e.key === 'ArrowLeft') prevQ();
});

init();
</script>
</body>
</html>
