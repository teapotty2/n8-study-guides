<script>

const ALL_QUESTIONS = [{"ch": "Ch 9: Time Management", "q": "Which is the first step in the time management process?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Completing the highest priority task</div><div class=\"opt\" data-letter=\"B\">B) Allowing enough time for sufficient daily planning</div><div class=\"opt\" data-letter=\"C\">C) Reprioritizing based on new information received</div><div class=\"opt\" data-letter=\"D\">D) Delegating work that cannot be accomplished in a day</div>", "ans": "B", "fb": "Daily planning is essential if the manager is to manage by efficiency rather than by crisis. The remaining options are steps that occur after planning."}, {"ch": "Ch 9: Time Management", "q": "What is the reason that first- and middle-level managers experience more interruptions than higher-level managers?", "opts": "<div class=\"opt\" data-letter=\"A\">A) They generally interact directly with a greater number of subordinates in daily planning</div><div class=\"opt\" data-letter=\"B\">B) They seldom have the clerical and secretarial help assigned to higher-level managers</div><div class=\"opt\" data-letter=\"C\">C) They are more social in nature and personal interactions</div><div class=\"opt\" data-letter=\"D\">D) They are busier than higher-level managers</div>", "ans": "A", "fb": "Frequent interruptions are common for first- and middle-level managers, who have a larger number of direct reports than do higher-level managers. The other options are not generally true statements. N"}, {"ch": "Ch 9: Time Management", "q": "Which time waster does the manager have least control over?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Failure to set objectives</div><div class=\"opt\" data-letter=\"B\">B) Inability to say no</div><div class=\"opt\" data-letter=\"C\">C) Procrastination</div><div class=\"opt\" data-letter=\"D\">D) Paperwork overload</div>", "ans": "D", "fb": "Excessive paperwork is an external time waster; the others are time wasters created by the manager (internal). Page 1 PlusBay.Plus"}, {"ch": "Ch 9: Time Management", "q": "What does the good manager have to remember about creating a daily list?", "opts": "<div class=\"opt\" data-letter=\"A\">A) It should remain changed once initial planning is completed</div><div class=\"opt\" data-letter=\"B\">B) It is a planning tool, and thus must have flexibility in its implementation</div><div class=\"opt\" data-letter=\"C\">C) It should include all the planner's short-term, intermediate, and long-term goals</div><div class=\"opt\" data-letter=\"D\">D) It should be highly structured, thus decreasing the possibility of procrastination</div>", "ans": "B", "fb": "The daily list should be flexible, changeable, leave some time for the unexpected, and include appropriate short-term goals."}, {"ch": "Ch 9: Time Management", "q": "Which policy implemented by a manager will minimize unproductive socialization?", "opts": "<div class=\"opt\" data-letter=\"A\">A) An open-door policy</div><div class=\"opt\" data-letter=\"B\">B) Scheduled appointments</div><div class=\"opt\" data-letter=\"C\">C) Informal, impromptu meetings</div><div class=\"opt\" data-letter=\"D\">D) Maintaining strict professional boundaries</div>", "ans": "B", "fb": "Appointments will discourage unproductive socialization since time will be allotted and a schedule maintained. Open-door policies and impromptu meetings encourage socialization while strict professional boundaries may actually interfere with communications. N"}, {"ch": "Ch 9: Time Management", "q": "Which plan is an effective way of handling a large task?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Plan to finish the task with few breaks</div><div class=\"opt\" data-letter=\"B\">B) Delegate portions of the task to qualified staff</div><div class=\"opt\" data-letter=\"C\">C) Break the task into smaller, less intimidating units</div><div class=\"opt\" data-letter=\"D\">D) Delay beginning the task until it has your undivided attention</div>", "ans": "C", "fb": "Breaking down a task, or chunking, prevents the person from becoming overwhelmed by the size of the task. It may not be possible or advisable to finish the task without breaks or delegating it to staff. Page 2 PlusBay.Plus"}, {"ch": "Ch 9: Time Management", "q": "Which statement about time management is true?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Most people have an accurate perception of the time they spend on a particular task or the total amount of time they are productive during the day</div><div class=\"opt\" data-letter=\"B\">B) Nurses who are self-aware and have clearly identified personal goals and priorities have greater control over how they spend their time</div><div class=\"opt\" data-letter=\"C\">C) Writing goals down is not necessary if the goals are limited to fewer than five in number</div><div class=\"opt\" data-letter=\"D\">D) A time inventory for 2 or 3 days is sufficient to identify a time management pattern</div>", "ans": "B", "fb": "Nurses who are self-aware and have clearly identified personal goals and priorities have greater control over how they spend their time. The other options are not true statements regarding time management."}, {"ch": "Ch 9: Time Management", "q": "Which task should the team leader initially engage in when planning care for a group of patients?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Plan so that each patient on the team receives equal amounts of nursing care</div><div class=\"opt\" data-letter=\"B\">B) Prioritize the amount and type of nursing care each patient requires</div><div class=\"opt\" data-letter=\"C\">C) Identify the staff who will comprise the individual care teams</div><div class=\"opt\" data-letter=\"D\">D) Assign patients to the specific nursing teams</div>", "ans": "B", "fb": "Prioritizing the care each patient will require is the initial step in care planning. The other options are considered but implementation will happen after the prioritizing."}, {"ch": "Ch 9: Time Management", "q": "What will the nurse-manager do to best reduce paper clutter in the workspace?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Support face-to-face communication between staff members</div><div class=\"opt\" data-letter=\"B\">B) Encourage paper clutter to be thrown away at the end of each shift</div><div class=\"opt\" data-letter=\"C\">C) Deal with paper correspondence as soon as possible after it arrives.</div><div class=\"opt\" data-letter=\"D\">D) Place additional recycling and trash receptacles throughout the unit</div>", "ans": "C", "fb": "Whenever possible, incoming correspondence should be handled the day it arrives. It should either be thrown away or filed according to the date to be completed. The other options do not have the same amount of impact on controlling clutter. Page 3 PlusBay.Plus"}, {"ch": "Ch 9: Time Management", "q": "Which technique will help the manager prioritize?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Doing ―trivial‖ items first to get them out of the way</div><div class=\"opt\" data-letter=\"B\">B) Putting some items in the ―don't do‖ category</div><div class=\"opt\" data-letter=\"C\">C) ―Breaking of‖ overwhelming tasks</div><div class=\"opt\" data-letter=\"D\">D) ―Delegating‖ the most important things to someone else</div>", "ans": "B", "fb": "The ―don't do‖ list contains items that will take care of themselves, are already outdated, or are best accomplished by someone else. In the case of items that are best done by someone else, the manager should pass these along in a timely fashion. None of the remaining options address prioritization."}, {"ch": "Ch 9: Time Management", "q": "Which is the foundational principle of nursing time management?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Short-term planning</div><div class=\"opt\" data-letter=\"B\">B) Strategic planning</div><div class=\"opt\" data-letter=\"C\">C) Immediate attention to care needs</div><div class=\"opt\" data-letter=\"D\">D) Adhering to a daily plan</div>", "ans": "A", "fb": "The foundational principle of time management is short-term planning. Strategic planning is a long-term activity while the other options lack the flexibility needed by time management. N"}, {"ch": "Ch 9: Time Management", "q": "Which activity is associated with a leadership role in time management?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Assisting followers in working cooperatively to maximize time use</div><div class=\"opt\" data-letter=\"B\">B) Prioritizing day-to-day planning to meet short-term and long-term unit goals</div><div class=\"opt\" data-letter=\"C\">C) Building time for time management planning into the work schedule</div><div class=\"opt\" data-letter=\"D\">D) Utilizing technology to facilitate timely communication and documentation</div>", "ans": "A", "fb": "A leadership role is to assist followers in working cooperatively to maximize time use. Management functions include the following: Appropriately prioritizes day-to-day planning to meet short-term and long-term unit goals; builds time for planning into the work schedule; utilizes technology to facilitate timely communication and documentation. Page 4 PlusBay.Plus"}, {"ch": "Ch 9: Time Management", "q": "How can subordinates be discouraged from taking up a nursing manager's time unproductively?", "opts": "", "ans": "", "fb": ""}, {"ch": "Ch 9: Time Management", "q": "Being accessible in the nursing station", "opts": "", "ans": "", "fb": ""}, {"ch": "Ch 9: Time Management", "q": "Instituting an open-door policy", "opts": "", "ans": "", "fb": ""}, {"ch": "Ch 9: Time Management", "q": "Have limited office seating available", "opts": "", "ans": "", "fb": ""}, {"ch": "Ch 9: Time Management", "q": "Refocus conversations as needed", "opts": "<div class=\"opt\" data-letter=\"A\">A) 1, 2</div><div class=\"opt\" data-letter=\"B\">B) 1, 3</div><div class=\"opt\" data-letter=\"C\">C) 2, 4</div><div class=\"opt\" data-letter=\"D\">D) 3, 4</div>", "ans": "D", "fb": "Do not make yourself overly accessible. Make it easy for people to ignore you. Try not to ―work‖ at the nursing station, if this is possible. Interrupt. When someone is rambling on without getting to the point, break in and say gently, ―Excuse me. Somehow I'm not getting your message. What exactly are you saying?‖ Avoid promoting socialization. Having several comfortable chairs in your office, a full candy dish, and posters on your walls that invite comments encourage socializing in your office. Be brief. Watch your own long-winded comments, and stand up when you are finished."}, {"ch": "Ch 9: Time Management", "q": "What is the best response for a nurse-manager to handle someone who has a pattern of lengthy chatter?", "opts": "<div class=\"opt\" data-letter=\"A\">A) ―We'll need to make it bNrief since my schedule is tight today.‖</div><div class=\"opt\" data-letter=\"B\">B) ―I can't speak with you now, but I'm going to have free time at 11 am.‖</div><div class=\"opt\" data-letter=\"C\">C) ―Stop by and we can talk during your lunch break.‖</div><div class=\"opt\" data-letter=\"D\">D) ―I am sorry but I do not have anytime today to talk with you.‖</div>", "ans": "B", "fb": "If someone has a pattern of lengthy chatter and manages to corner you on rounds or at the nurse's station, say, ―I can't speak with you now, but I'm going to have some free time at 11 AM. Why don't you see me then?‖ Unless the meeting is important, the person who just wishes to chat will not bother to make a formal appointment. If you would like to chat and have the time to do so, use coffee breaks and lunch hours for socializing. Page 5 PlusBay.Plus"}, {"ch": "Ch 9: Time Management", "q": "Time management can be reduced to cyclic steps. What are the steps?", "opts": "", "ans": "", "fb": ""}, {"ch": "Ch 9: Time Management", "q": "Allow time for planning and establish priorities.", "opts": "", "ans": "", "fb": ""}, {"ch": "Ch 9: Time Management", "q": "Complete the quickest priority tasks first.", "opts": "", "ans": "", "fb": ""}, {"ch": "Ch 9: Time Management", "q": "Complete the highest priority task, and whenever possible, finish one task before beginning another.", "opts": "", "ans": "", "fb": ""}, {"ch": "Ch 9: Time Management", "q": "Reprioritize based on remaining tasks and new information that may have been received.", "opts": "<div class=\"opt\" data-letter=\"A\">A) 1, 2, 3</div><div class=\"opt\" data-letter=\"B\">B) 1, 2, 4</div><div class=\"opt\" data-letter=\"C\">C) 1, 3, 4</div><div class=\"opt\" data-letter=\"D\">D) 2, 3, 4</div>", "ans": "C", "fb": "Time management can be reduced to three cyclic steps: (a) allow time for planning and establish priorities; (b) complete the highest priority task, and whenever possible, finish one task before beginning another; and (c) reprioritize based on remaining tasks and new information that may have been received."}, {"ch": "Ch 9: Time Management", "q": "When is the best time of day for the manager to spend appropriate time on planning?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Whenever a block of time is available</div><div class=\"opt\" data-letter=\"B\">B) Beginning of the day</div><div class=\"opt\" data-letter=\"C\">C) Middle of the day</div><div class=\"opt\" data-letter=\"D\">D) End of the day</div>", "ans": "B N", "fb": "Setting aside time at the beginning of each day to plan the day allows the manager to spend appropriate time on high-priority tasks."}, {"ch": "Ch 9: Time Management", "q": "What is the most critical skill in good time management?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Allow adequate time for planning</div><div class=\"opt\" data-letter=\"B\">B) Recognizing the need for daily planning</div><div class=\"opt\" data-letter=\"C\">C) Priority setting</div><div class=\"opt\" data-letter=\"D\">D) Handling situations as they arise</div>", "ans": "C", "fb": "Priority setting is perhaps the most critical skill in time management because all actions taken are some type of relative importance. Page 6 PlusBay.Plus"}, {"ch": "Ch 9: Time Management", "q": "What category of prioritizing will an item that will take care of itself be placed?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Squeaky wheel</div><div class=\"opt\" data-letter=\"B\">B) Don't do</div><div class=\"opt\" data-letter=\"C\">C) Do later</div><div class=\"opt\" data-letter=\"D\">D) Do now</div>", "ans": "B", "fb": "One simple means of prioritizing what needs to be accomplished is to divide all requests into three categories: ―don't do,‖ ―do later,‖ and ―do now.‖ The ―don't do‖ items probably reflect problems that will take care of themselves, are already outdated, or are better accomplished by someone else."}, {"ch": "Ch 9: Time Management", "q": "What do the ―do now‖ requests reflect?", "opts": "<div class=\"opt\" data-letter=\"A\">A) A unit's day-to-day operational needs</div><div class=\"opt\" data-letter=\"B\">B) Issues related to short-term goals</div><div class=\"opt\" data-letter=\"C\">C) Large, time-consuming tasks</div><div class=\"opt\" data-letter=\"D\">D) Problems that cannot be delegated</div>", "ans": "A", "fb": "The ―do now‖ requests most commonly reflect a unit's day-to-day operational needs. These ―do now‖ requests are not necessarily related to short-term goals or time-consuming. Nor are they also non-delegatable. N"}, {"ch": "Ch 9: Time Management", "q": "In prioritizing all the ―do now‖ items, the manager may find preparing a written list helpful. What is important to remember about the written list?", "opts": "", "ans": "", "fb": ""}, {"ch": "Ch 9: Time Management", "q": "It is a plan", "opts": "", "ans": "", "fb": ""}, {"ch": "Ch 9: Time Management", "q": "It is a product", "opts": "", "ans": "", "fb": ""}, {"ch": "Ch 9: Time Management", "q": "It is a planning tool", "opts": "", "ans": "", "fb": ""}, {"ch": "Ch 9: Time Management", "q": "It is the final goal to be accomplished", "opts": "<div class=\"opt\" data-letter=\"A\">A) 1, 2</div><div class=\"opt\" data-letter=\"B\">B) 1, 3</div><div class=\"opt\" data-letter=\"C\">C) 2, 3</div><div class=\"opt\" data-letter=\"D\">D) 3, 4</div>", "ans": "B", "fb": "In prioritizing all the ―do now‖ items, the manager may find preparing a written list helpful. The list is a planning tool. Remember, however, that a list is a plan, not a product, and that the creation of the list is not the final goal. Page 7 PlusBay.Plus"}, {"ch": "Ch 9: Time Management", "q": "Which statement identifies a common mistake made related to daily planning?", "opts": "<div class=\"opt\" data-letter=\"A\">A) ―Crises always come up so my plan is always changing.‖</div><div class=\"opt\" data-letter=\"B\">B) ―I have always handled my patients' needs as they arise.‖</div><div class=\"opt\" data-letter=\"C\">C) ―Sometimes it's difficult to reserve time for daily planning.‖</div><div class=\"opt\" data-letter=\"D\">D) ―Patient care requires a lot of reassessment by nursing.‖</div>", "ans": "B", "fb": "Two mistakes common in planning are underestimating the importance of a daily plan and not allowing adequate time for planning. The remaining options reflect an understanding of the importance of planning."}, {"ch": "Ch 9: Time Management", "q": "How does the effective nurse-manager most effectively deal with the ever-changing nature of the nursing work environment?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Evaluating the management skills of the nursing team leaders</div><div class=\"opt\" data-letter=\"B\">B) Providing time management classes for staff members</div><div class=\"opt\" data-letter=\"C\">C) Frequently reassessing personally established priorities</div><div class=\"opt\" data-letter=\"D\">D) Encouraging staff to engage in daily planning</div>", "ans": "C", "fb": "Setting new priorities or adjusting priorities to reflect ever-changing work situations is an ongoing reality for the unit manager. While the other options are appropriate, they are not directed to the management role in dealing with the ever-changing nature of the environment of nursing. N"}, {"ch": "Ch 9: Time Management", "q": "Which statement demonstrates adherence to habits that supports good time management skills? Select all that apply.", "opts": "<div class=\"opt\" data-letter=\"A\">A) ―It's important to me to be professional.‖</div><div class=\"opt\" data-letter=\"B\">B) ―I can depend on the members of my team.‖</div><div class=\"opt\" data-letter=\"C\">C) ―I've learned that I'm most energetic in the morning.‖</div><div class=\"opt\" data-letter=\"D\">D) ―I'll adjust my sleep schedule now that I'm on night shift.‖</div>", "ans": "A, B, C, D", "fb": "Habit 1: Strive to be authentic. Be honest with yourself about what you want and why you do what you do. Habit 2: Favor trusting relationships. Build relationships with people you can trust and count on, and make sure those same people can trust and count on you. Habit 3: Maintain a lifestyle that will give you maximum energy. Exercise, eat well, and get enough sleep. Habit 4: Listen to your biorhythms and organize your day accordingly. Pay attention to regular fluctuations in your physical and mental energy levels throughout the day and schedule tasks accordingly. Habit 5: Set very few priorities and stick to them. Select a maximum of two things that are your highest priority, and work on them. Page 8 PlusBay.Plus"}, {"ch": "Ch 9: Time Management", "q": "What is the primary reason for documenting nursing interventions as soon as possible after an activity is completed?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Decreasing the risk of inaccurate documentation</div><div class=\"opt\" data-letter=\"B\">B) Implementing effective time management skills</div><div class=\"opt\" data-letter=\"C\">C) Demonstrating professional nursing behavior</div><div class=\"opt\" data-letter=\"D\">D) Observing an established nursing principle</div>", "ans": "A", "fb": "Document your nursing interventions as soon as possible after an activity is completed. Waiting until the end of the workday to complete necessary documentation increases the risk of inaccuracies and incomplete documentation. The remaining options are accurate but lack the primary focus of patient safety."}, {"ch": "Ch 9: Time Management", "q": "What is the suggested perception of a nurse-manager who is consistently late for appointments?", "opts": "<div class=\"opt\" data-letter=\"A\">A) The manager is overworked with too many responsibilities</div><div class=\"opt\" data-letter=\"B\">B) The manager needs additional management training</div><div class=\"opt\" data-letter=\"C\">C) The manager does not value other people's time</div><div class=\"opt\" data-letter=\"D\">D) The manager lacks time management skills</div>", "ans": "C", "fb": "A lack of punctuality suggests that one does not value other people's time. The other options may be true but the peNrception is the more emotional perception. Page 9 PlusBay.Plus"}, {"ch": "Ch 20: Delegation", "q": "What is an inappropriate reason for delegation?", "opts": "<div class=\"opt\" data-letter=\"A\">A) To empower subordinates by ―stretching‖ them in their work assignment</div><div class=\"opt\" data-letter=\"B\">B) To free the manager to address more complex, higher-level unit needs</div><div class=\"opt\" data-letter=\"C\">C) When the task is not a challenge for the manager</div><div class=\"opt\" data-letter=\"D\">D) Because someone else is better qualified to do the task that needs to be done</div>", "ans": "C", "fb": "That the manager is not challenged by a task is not a valid reason for delegating that task to another. The other options are all appropriate reasons to delegate tasks to qualified staff."}, {"ch": "Ch 20: Delegation", "q": "What is a common cause of a manager to underdelegation?", "opts": "<div class=\"opt\" data-letter=\"A\">A) A high degree of trust in subordinates</div><div class=\"opt\" data-letter=\"B\">B) A democratic leadership style</div><div class=\"opt\" data-letter=\"C\">C) A need for perfectionism</div><div class=\"opt\" data-letter=\"D\">D) Sufficient time to accomplish unit goals alone</div>", "ans": "C", "fb": "A manager with a need for perfectionism and control may believe that another person will not complete a task. Trust in subordinates and a democratic leadership style would support effective delegation. Delegating should not be based on the issue of time exclusively. N"}, {"ch": "Ch 20: Delegation", "q": "What is the most important consideration for the manager when identifying the appropriate person to whom to delegate a specific task?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Whose turn it is to delegate a task</div><div class=\"opt\" data-letter=\"B\">B) The qualifications of the person regarding the task</div><div class=\"opt\" data-letter=\"C\">C) The fiscal cost of delegating the task</div><div class=\"opt\" data-letter=\"D\">D) Whether the person has experience with similar tasks</div>", "ans": "B", "fb": "Managers should ask the individuals to whom they are delegating if they are capable of completing the delegated task. Page 1 PlusBay.Plus"}, {"ch": "Ch 20: Delegation", "q": "Which situation presents an example of inappropriate delegation?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Temporary authority is given to support completion of a delegated task</div><div class=\"opt\" data-letter=\"B\">B) The person to whom a task is delegated considers it a challenge</div><div class=\"opt\" data-letter=\"C\">C) The employee is given exact instructions on completing the task</div><div class=\"opt\" data-letter=\"D\">D) Regular updates on the task are exchanged with the manager and the employee</div>", "ans": "C", "fb": "If an employee has the skills necessary to complete a task, that employee should be able to carry out the task with autonomy and be provided with the authority and resources necessary. Depending on the complexity of the project, the manager should meet with the employee for updates. One of the goals of delegation is to challenge employees into learning new skills."}, {"ch": "Ch 20: Delegation", "q": "What is the first step the manager takes when a subordinate is having difficulty carrying out a delegated task?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Take over the task so the employee will not become demoralized</div><div class=\"opt\" data-letter=\"B\">B) Be available to the employee as a role model and resource for the task</div><div class=\"opt\" data-letter=\"C\">C) Assign another more experienced employee to help with the task</div><div class=\"opt\" data-letter=\"D\">D) Re-assign the employee a different, less complex task</div>", "ans": "B", "fb": "A manager should be available to the employee to help identify solutions to problems encountered with a delegatedNtask and should encourage the employee to persevere. Taking back a task that was originally delegated is an absolute last resort. Reassigning and co-assigning the task are options that are not initially considered."}, {"ch": "Ch 20: Delegation", "q": "What statement concerning the delegating of tasks by the nurse to unlicensed assistive personnel (NAP) is true?", "opts": "<div class=\"opt\" data-letter=\"A\">A) One can safely assume that the NAP has at least a high school diploma as a minimum hiring criterion</div><div class=\"opt\" data-letter=\"B\">B) All unlicensed assistive personnel have achieved at least minimum standardized training pursuant to the Omnibus Budget Reconciliation Act of 1987</div><div class=\"opt\" data-letter=\"C\">C) No federal or community standards have been established for training the broad classification of NAP</div><div class=\"opt\" data-letter=\"D\">D) The nurse is protected from liability when allowing the NAP to perform only those tasks the employee includes in the job description</div>", "ans": "C", "fb": "No federal or community standards have been established for the training of the NAP. The Omnibus Budget Reconciliation Act relates to certified nursing assistants only. The hiring policies of institutions vary regarding the employment qualifications of the NAP and many institutions do not have distinct job descriptions for NAP that define their scope of practice. Page 2 PlusBay.Plus"}, {"ch": "Ch 20: Delegation", "q": "Which action is considered a leadership role associated with delegation?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Creating job descriptions for all personnel</div><div class=\"opt\" data-letter=\"B\">B) Providing formal recognition or reward for completion of delegated tasks</div><div class=\"opt\" data-letter=\"C\">C) Demonstrating sensitivity to how cultural phenomena affect transcultural delegation</div><div class=\"opt\" data-letter=\"D\">D) Reprimanding employees who demonstrate overt resistance to the tasks they are delegated</div>", "ans": "C", "fb": "Factors such as communication, space, social organization, timing, environmental control, and biologic variations affect delegation to a culturally diverse staff and should be modeled as a leadership role. The other choices are all management functions."}, {"ch": "Ch 20: Delegation", "q": "Which statement is true regarding the general delegation liability of the registered nurse (RN)?", "opts": "<div class=\"opt\" data-letter=\"A\">A) It is minimal because subordinates alone are held accountable for practicing within the accepted scope of practice for their job classification</div><div class=\"opt\" data-letter=\"B\">B) It is great because the RN is automatically held liable for the tasks delegated to all recognized subordinates</div><div class=\"opt\" data-letter=\"C\">C) It is reduced when the RN appropriately assesses what and to whom delegation is appropriate and supervises the completion of the tasks</div><div class=\"opt\" data-letter=\"D\">D) It is avoided entirely byNdelegating tasks to only other licensed personnel</div>", "ans": "C", "fb": "Proper delegation practices that include assessment and evaluation help protect the RN from liability. The other statements are not true."}, {"ch": "Ch 20: Delegation", "q": "What managerial action is important when supporting the delegation of a task to a subordinate?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Always requiring a maximizing quality outcome</div><div class=\"opt\" data-letter=\"B\">B) Frequently reassuring the employee that if they are incapable of completing a delegated task, it will be reassigned</div><div class=\"opt\" data-letter=\"C\">C) Drafting a preliminary plan of how the task will be redone if the outcome does not meet stated expectations</div><div class=\"opt\" data-letter=\"D\">D) Occasionally providing learning or ―stretching‖ opportunities for employees</div>", "ans": "D", "fb": "―Stretching‖ provides growth opportunities for employees, builds employee self-esteem, and helps prevent boredom and de-motivation. The other options are not actions that are supportive of the staff and the delegation process. Page 3 PlusBay.Plus"}, {"ch": "Ch 20: Delegation", "q": "Periodically during the day the RN checked with the team members to determine whether they are having difficulty completing their assigned tasks. This describes which manager role?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Skills evaluation</div><div class=\"opt\" data-letter=\"B\">B) Patient safety</div><div class=\"opt\" data-letter=\"C\">C) Effective delegation</div><div class=\"opt\" data-letter=\"D\">D) Micromanagement</div>", "ans": "C", "fb": "This manager provided the team with the autonomy to complete the work and was available should any need arise. This describes effective delegation. This action is not related to any of the other options."}, {"ch": "Ch 20: Delegation", "q": "A member of the team reports that they have been given too much to do and are not going to be able to complete the work on time. What action will the RN take to effectively manage this situation?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Assign the work to another team member</div><div class=\"opt\" data-letter=\"B\">B) Take on the responsibility of the tasks</div><div class=\"opt\" data-letter=\"C\">C) Have the team member perform only the necessary tasks</div><div class=\"opt\" data-letter=\"D\">D) Examine the workload and assist the individual in reprioritizing</div>", "ans": "D", "fb": "The manager should help theNoverwhelmed employee reprioritize the workload with the goal of making it manageable for that employee. None of the other options realistically assist the team member in managing time and prioritizing effectively."}, {"ch": "Ch 20: Delegation", "q": "Which assessment must the RN do initially when assigning tasks to non-licensed personnel (NAP)?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Evaluating the NAP's skills and knowledge level</div><div class=\"opt\" data-letter=\"B\">B) Assessing which tasks the NAP is interested in assuming</div><div class=\"opt\" data-letter=\"C\">C) Evaluating how patients rate the NAP's performance</div><div class=\"opt\" data-letter=\"D\">D) Assessing how team members like working with the NAP</div>", "ans": "A", "fb": "The manager must be knowledgeable about the skills and knowledge of all members of the health-care team. While the other options are factors regarding general NAP utilization, initially skills and knowledge levels take priority. Page 4 PlusBay.Plus"}, {"ch": "Ch 20: Delegation", "q": "Which task would the director of a home health agency not delegate another staff RN?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Assigning home health aides to specific patient care</div><div class=\"opt\" data-letter=\"B\">B) Serving on a diabetic study committee of community resources</div><div class=\"opt\" data-letter=\"C\">C) Meeting with the agency's administration regarding budget cuts</div><div class=\"opt\" data-letter=\"D\">D) Reviewing staff time cards for completion and accuracy</div>", "ans": "C", "fb": "Management responsibilities associated with budgeting would not be delegated to another RN on the staff. The other options could be appropriately delegated to another RN."}, {"ch": "Ch 20: Delegation", "q": "Which organization is actively engaged in clarifying the delegation parameters for RNs?", "opts": "<div class=\"opt\" data-letter=\"A\">A) American Hospital Association (AMA)</div><div class=\"opt\" data-letter=\"B\">B) The federal government</div><div class=\"opt\" data-letter=\"C\">C) National League for Nursing (NLN)</div><div class=\"opt\" data-letter=\"D\">D) State Boards of Nursing Licensure</div>", "ans": "D", "fb": "State Boards of Nursing Licensure is responsible for clarifying the delegation parameters for RNs. None of the other options are involved in this process."}, {"ch": "Ch 20: Delegation", "q": "What must managers delegateNto another RN in order to assure completion of a task?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Time and space</div><div class=\"opt\" data-letter=\"B\">B) Leadership and creativity</div><div class=\"opt\" data-letter=\"C\">C) Authority and responsibility</div><div class=\"opt\" data-letter=\"D\">D) Personnel and knowledge</div>", "ans": "C", "fb": "Managers must delegate the authority and the responsibility necessary to complete the task. Nothing is more frustrating to a creative and productive employee than not having the resources or authority to carry out a well-developed plan. Qualities like leadership, knowledge, and creativity are not transferable. The remaining option choices are resources that are provided rather than delegated. Page 5 PlusBay.Plus"}, {"ch": "Ch 20: Delegation", "q": "The Omnibus Budget Reconciliation Act of 1987 established regulations for the education and certification of which health-care worker?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Nurse aide (NA)</div><div class=\"opt\" data-letter=\"B\">B) NAP</div><div class=\"opt\" data-letter=\"C\">C) Licensed practical nurse (LPN)</div><div class=\"opt\" data-letter=\"D\">D) RN</div>", "ans": "A", "fb": "Although the Omnibus Budget Reconciliation Act of 1987 established regulations for the education and certification of ―nurse's aides‖ (minimum of 75 hours of theory and practice and successful completion of an examination in both areas), no federal or community standards have been established for training the more broadly defined NAP. LPNs and RNs are not addressed by this act."}, {"ch": "Ch 20: Delegation", "q": "Who bears the ultimate responsibility for ensuring that the nursing care provided by team members meets or exceeds minimum safety standards?", "opts": "<div class=\"opt\" data-letter=\"A\">A) The patient's primary healthcare provider</div><div class=\"opt\" data-letter=\"B\">B) The facility's Director of Nursing</div><div class=\"opt\" data-letter=\"C\">C) The unit's nursing manager</div><div class=\"opt\" data-letter=\"D\">D) The team's RN</div>", "ans": "D", "fb": "The team's RN always bears tNhe ultimate responsibility for ensuring that the nursing care provided by his or her team members meets or exceeds minimum safety standards. This is not the role of any of the other positions mentioned."}, {"ch": "Ch 20: Delegation", "q": "What occurs when a manager has the false assumption that delegation may be interpreted as a lack of ability on the subordinate's part to do the job correctly or completely?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Underdelegating</div><div class=\"opt\" data-letter=\"B\">B) Overdelegating</div><div class=\"opt\" data-letter=\"C\">C) Improper delegating</div><div class=\"opt\" data-letter=\"D\">D) Inappropriate delegating</div>", "ans": "A", "fb": "Underdelegating occurs when a manager has a false assumption that delegation may be interpreted as a lack of ability on his or her part to do the job correctly or completely. Page 6 PlusBay.Plus"}, {"ch": "Ch 20: Delegation", "q": "What cultural phenomena must be considered for the biopsychosocial differences between racial and ethnic groups that have susceptibility to disease and physiologic differences?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Space</div><div class=\"opt\" data-letter=\"B\">B) Social organization</div><div class=\"opt\" data-letter=\"C\">C) Environmental control</div><div class=\"opt\" data-letter=\"D\">D) Biologic variations</div>", "ans": "D", "fb": "The phenomenon Biologic variations refers to the biopsychosocial differences between racial and ethnic groups, such as susceptibility to disease and physiologic differences. None of the other options are associated with managing these differences."}, {"ch": "Ch 20: Delegation", "q": "Which restraining force occurs when a subordinate ―tests the water‖ to determine what the consequences are of not completing a delegated task?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Failure of delegator to see subordinate perspective</div><div class=\"opt\" data-letter=\"B\">B) Subordinate incapable of completing the task</div><div class=\"opt\" data-letter=\"C\">C) Subordinate inherent resistance to authority</div><div class=\"opt\" data-letter=\"D\">D) Overdelegation of specificity of the task</div>", "ans": "C", "fb": "One cause of subordinate resistance to delegation is an inherent resistance to authority. Some subordinates simply neNed to ―test the water‖ and determine what the consequences are of not completing delegated tasks. The remaining options do not represent the behaviors described."}, {"ch": "Ch 20: Delegation", "q": "Which factor has the greatest impact on the need for nurses to possess excellent delegation skills?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Increase in patient acuity levels</div><div class=\"opt\" data-letter=\"B\">B) Decrease in patient hospitalization time</div><div class=\"opt\" data-letter=\"C\">C) Increase in the use of NAP</div><div class=\"opt\" data-letter=\"D\">D) Decrease in nurse-to-patient ratios</div>", "ans": "C", "fb": "With the increased use of NAP in patient care, the need for nurses to have highly developed delegation skills has never been greater. The impact of acuity levels, nurse–patient ratios, and hospitalization stays does not have as great an impact as does the correct option. Page 7 PlusBay.Plus"}, {"ch": "Ch 20: Delegation", "q": "Which characteristic is most important when the nurse-manager is considering staff for a delegated role?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Years of experience</div><div class=\"opt\" data-letter=\"B\">B) Willingness to grow professionally</div><div class=\"opt\" data-letter=\"C\">C) Aversion to risk taking</div><div class=\"opt\" data-letter=\"D\">D) Pervious experience with similar tasks</div>", "ans": "B", "fb": "Identify which individuals can complete the job in terms of capability and time to do so. Remember that it is a leadership role to stretch new and capable employees who want opportunities to learn and grow. Also look for employees who are innovative and willing to take risks. It is also important that the person to whom the task is being delegated considers the task to be important. Years of experience and exposure to similar tasks are not as important as interest in professional growth."}, {"ch": "Ch 20: Delegation", "q": "Which action on the part of a manager demonstrates the mark of a great leader?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Acknowledging the accomplishment of staff members at the unit's staff meeting</div><div class=\"opt\" data-letter=\"B\">B) Providing onsite in-services on new equipment for the staff</div><div class=\"opt\" data-letter=\"C\">C) Including funds in the unit's budget of staff development</div><div class=\"opt\" data-letter=\"D\">D) Stressing the importance of patient safety to all new employees</div>", "ans": "A", "fb": "The mark of a great leader is Nwhen he or she can recognize the excellent performance of someone else and allow others to shine for their accomplishments. While the other options are appropriate, they are not identified as being the mark of a great leader but rather an efficient manager."}, {"ch": "Ch 20: Delegation", "q": "Which statement by the nurse-manager demonstrates an understanding of the need to provide effective guidance to those a project has been delegated?", "opts": "<div class=\"opt\" data-letter=\"A\">A) ―Don't be afraid to let me know if you feel the project is overwhelming you.‖</div><div class=\"opt\" data-letter=\"B\">B) ―What do you suggest we do to address the problems that exist with the project?‖</div><div class=\"opt\" data-letter=\"C\">C) ―I can give you a few solutions for the issues you have been having with the project.‖</div><div class=\"opt\" data-letter=\"D\">D) ―Do you want more time to complete the project?‖</div>", "ans": "C", "fb": "If the worker is having difficulty carrying out the delegated task, the leader-manager should be available as a role model and resource in identifying alternative solutions. Leaders should encourage employees, however, to attempt to solve problems themselves first, although they should always be willing to answer questions about the task or to clarify desired outcomes as necessary. Suggesting solutions or removing the person from the task prematurely does not demonstrate an understanding of effective guidance. Page 8 PlusBay.Plus"}, {"ch": "Ch 20: Delegation", "q": "When a manager appropriately recognizes the successful completion of a delegated team task, what is the primary reward for the manager?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Less involvement in uncomplicated tasks</div><div class=\"opt\" data-letter=\"B\">B) A staff that is familiar with team-related delegated tasks</div><div class=\"opt\" data-letter=\"C\">C) Professional recognition as a leader</div><div class=\"opt\" data-letter=\"D\">D) Staff that is growing as professional caregivers</div>", "ans": "C", "fb": "Leaders are often measured by the successes of those on their teams. Therefore, the more recognition team members receive, the more recognition will be given to their leader. Spending less time on uncomplicated tasks is not the primary gain for the nurse-manager. It is the staff that benefit from the exposure to team work and professional growth. N Page 9 PlusBay.Plus"}];

let questions = [...ALL_QUESTIONS];
let current = 0;
let answers = {};
let wrongIndexes = new Set();

function init() {
  current = 0;
  answers = {};
  wrongIndexes = new Set();
  document.getElementById('stat-correct').textContent = '0';
  document.getElementById('stat-wrong').textContent = '0';
  document.getElementById('stat-remain').textContent = questions.length;
  document.getElementById('summary').style.display = 'none';
  document.getElementById('quiz-container').style.display = 'block';
  document.getElementById('wrong-btn').style.display = 'none';
  render();
}

function render() {
  if (current >= questions.length) { showSummary(); return; }
  const q = questions[current];
  document.getElementById('q-counter').textContent = 'Question ' + (current+1) + ' of ' + questions.length;
  document.getElementById('ch-tag').textContent = q.ch;
  document.getElementById('q-text').textContent = q.q;
  document.getElementById('options').innerHTML = q.opts;
  document.getElementById('feedback').style.display = 'none';
  document.getElementById('feedback-text').textContent = q.fb;
  document.getElementById('correct-badge').style.display = 'none';
  document.getElementById('wrong-badge').style.display = 'none';
  document.getElementById('progress').style.width = ((current / questions.length) * 100) + '%';
  document.getElementById('prev-btn').disabled = current === 0;
  document.getElementById('next-btn').textContent = current === questions.length - 1 ? 'Finish' : 'Next';

  const prev = answers[current];
  if (prev !== undefined) {
    revealAnswer(prev, q.ans, false);
  } else {
    document.querySelectorAll('.opt').forEach(o => {
      o.onclick = () => selectAnswer(o.dataset.letter, q.ans);
    });
  }
}

function selectAnswer(letter, correct) {
  if (answers[current] !== undefined) return;
  answers[current] = letter;
  if (letter !== correct) wrongIndexes.add(current);
  const correctCount = Object.entries(answers).filter(([i,l]) => l === questions[parseInt(i)].ans).length;
  const wrongCount = Object.entries(answers).filter(([i,l]) => l !== questions[parseInt(i)].ans).length;
  document.getElementById('stat-correct').textContent = correctCount;
  document.getElementById('stat-wrong').textContent = wrongCount;
  document.getElementById('stat-remain').textContent = questions.length - Object.keys(answers).length;
  revealAnswer(letter, correct, true);
}

function revealAnswer(selected, correct, animate) {
  document.querySelectorAll('.opt').forEach(o => {
    const letter = o.dataset.letter;
    o.onclick = null;
    if (letter === correct) o.classList.add('correct');
    if (letter === selected && selected !== correct) o.classList.add('wrong');
  });
  document.getElementById('feedback').style.display = 'block';
  if (selected === correct) {
    document.getElementById('correct-badge').style.display = 'flex';
  } else {
    document.getElementById('wrong-badge').style.display = 'flex';
  }
}

function nextQ() {
  if (current < questions.length - 1) { current++; render(); }
  else showSummary();
}

function prevQ() {
  if (current > 0) { current--; render(); }
}

function showSummary() {
  document.getElementById('quiz-container').style.display = 'none';
  document.getElementById('summary').style.display = 'block';
  const total = questions.length;
  const correct = Object.entries(answers).filter(([i,l]) => l === questions[parseInt(i)].ans).length;
  const wrong = Object.entries(answers).filter(([i,l]) => l !== questions[parseInt(i)].ans).length;
  const skipped = total - Object.keys(answers).length;
  const pct = total > 0 ? Math.round((correct/total)*100) : 0;
  document.getElementById('sum-score').textContent = correct + '/' + total;
  document.getElementById('sum-pct').textContent = pct + '%';
  document.getElementById('sum-correct').textContent = correct;
  document.getElementById('sum-wrong').textContent = wrong;
  document.getElementById('sum-skipped').textContent = skipped;
  let msg = '';
  if (pct >= 92) msg = 'A — Outstanding! You are very well prepared.';
  else if (pct >= 83) msg = 'B — Good work. A few more review rounds and you are set.';
  else if (pct >= 75) msg = 'C — Passing, but push for deeper mastery before exam day.';
  else msg = 'Below passing — focus on the rationales for wrong answers and review those chapters.';
  document.getElementById('sum-msg').textContent = msg;
  document.getElementById('progress').style.width = '100%';
  if (wrongIndexes.size > 0) document.getElementById('wrong-btn').style.display = 'inline-block';
}

function shuffleQuestions() {
  for (let i = questions.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i+1));
    [questions[i], questions[j]] = [questions[j], questions[i]];
  }
  init();
}

function resetQuiz() {
  questions = [...ALL_QUESTIONS];
  document.getElementById('ch-filter').value = 'all';
  init();
}

function filterByChapter() {
  const val = document.getElementById('ch-filter').value;
  if (val === 'all') {
    questions = [...ALL_QUESTIONS];
  } else {
    questions = ALL_QUESTIONS.filter(q => q.ch.startsWith('Ch ' + val + ':'));
  }
  init();
}

function showOnlyWrong() {
  if (wrongIndexes.size === 0) return;
  questions = [...wrongIndexes].map(i => questions[i]);
  init();
}

document.addEventListener('keydown', e => {
  const key = e.key.toUpperCase();
  if (['A','B','C','D','E'].includes(key)) {
    document.querySelectorAll('.opt').forEach(o => { if (o.dataset.letter === key) o.click(); });
  }
  if (e.key === 'ArrowRight' || e.key === 'Enter') { if (answers[current] !== undefined) nextQ(); }
  if (e.key === 'ArrowLeft') prevQ();
});

init();

</script>
</body>
</html>
