<style>

  body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;}

  .btn{padding:8px 18px;border-radius:8px;border:none;cursor:pointer;font-size:0.85rem;font-weight:600;transition:all 0.15s;}

  .btn-check:hover{filter:brightness(1.1);}
  select{background:var(--tag);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:7px 12px;font-size:0.85rem;cursor:pointer;}
  select:focus{outline:none;border-color:var(--accent);}
  .progress-bar{height:3px;background:var(--border);}

  main{max-width:780px;margin:0 auto;padding:32px 20px;}

  .sata-tag{display:inline-block;background:rgba(240,165,0,0.15);color:var(--warn);font-size:0.72rem;padding:3px 10px;border-radius:20px;border:1px solid rgba(240,165,0,0.3);font-weight:700;}
  .question-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:28px;margin-bottom:20px;}
  .question-text{font-size:1.05rem;line-height:1.65;margin-bottom:22px;white-space:pre-wrap;}
  .options{display:flex;flex-direction:column;gap:10px;}
  .opt{padding:13px 18px;border-radius:10px;border:1.5px solid var(--border);cursor:pointer;font-size:0.9rem;line-height:1.5;transition:all 0.15s;}
  .opt:hover:not(.locked){border-color:var(--accent);background:rgba(124,106,247,0.08);}
  .opt.selected{border-color:var(--accent);background:var(--selected);}
  .opt.correct{border-color:var(--correct);background:rgba(76,175,136,0.12);}
  .opt.wrong{border-color:var(--wrong);background:rgba(224,92,92,0.1);}
  .opt.missed{border-color:var(--warn);background:rgba(240,165,0,0.08);}
  .opt.locked{cursor:default;}
  .feedback-box{margin-top:18px;padding:16px 18px;background:rgba(79,195,247,0.06);border:1px solid rgba(79,195,247,0.2);border-radius:10px;font-size:0.88rem;line-height:1.65;display:none;}
  .feedback-label{font-weight:700;color:var(--accent2);margin-bottom:6px;font-size:0.78rem;text-transform:uppercase;letter-spacing:0.5px;}
  .nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:20px;}
  .result-badge{display:none;align-items:center;gap:8px;padding:8px 16px;border-radius:8px;font-weight:700;font-size:0.9rem;}
  .result-badge.correct-badge{background:rgba(76,175,136,0.15);color:var(--correct);border:1px solid rgba(76,175,136,0.3);}
  .result-badge.wrong-badge{background:rgba(224,92,92,0.1);color:var(--wrong);border:1px solid rgba(224,92,92,0.2);}
  .summary{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:36px;text-align:center;display:none;}
  .summary h2{font-size:1.6rem;margin-bottom:8px;}
  .score-big{font-size:3.5rem;font-weight:800;color:var(--accent);line-height:1;margin:20px 0 8px;}
  .score-pct{font-size:1.2rem;color:var(--accent2);margin-bottom:24px;}
  .score-breakdown{display:flex;justify-content:center;gap:32px;margin:20px 0 28px;}
  .score-item{text-align:center;}
  .score-item-val{font-size:1.8rem;font-weight:700;}
  .score-item-label{font-size:0.75rem;color:var(--muted);margin-top:2px;}
  .grade-msg{font-size:1rem;color:var(--muted);margin-bottom:28px;padding:14px 20px;background:var(--tag);border-radius:10px;}
  .legend{font-size:0.75rem;color:var(--muted);margin-top:10px;display:none;}
  .legend span{margin-right:12px;}
</style>

<script>
const ALL_QUESTIONS = [{"ch": "Ch 9: Time Management", "q": "A nurse -manager is having difficulty finishing the necessary tasks for each day. When implementing the time management process, what should the manager do first?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Complete the highest priority task.</div><div class=\"opt\" data-letter=\"B\">B) Allow enough time for sufficient daily planning.</div><div class=\"opt\" data-letter=\"C\">C) Reprioritize based on new information received.</div><div class=\"opt\" data-letter=\"D\">D) Delegate work that cannot be accomplished in a day.</div>", "ans": "B", "sata": false, "fb": "Daily planning is essential if the manager is to manage by efficiency rather than by crisis. Delegation, completion of tasks, and reprioritizing on the basis of new information are steps that occur after planning."}, {"ch": "Ch 9: Time Management", "q": "A charge nurse is having a discussion with the head nurse of the division in an acute care facility. Both nurses are validating the constant interruptions that have led to decreased levels of productivity. What statement best supports the discussion?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Both interact directly with a greater number of individuals in daily planning.</div><div class=\"opt\" data-letter=\"B\">B) Both seldom have the clerical and secretarial help assigned to higher -level managers.</div><div class=\"opt\" data-letter=\"C\">C) Both lack the time management skills that more experienced managers possess.</div><div class=\"opt\" data-letter=\"D\">D) Both have heavier workloads than higher -level managers.</div>", "ans": "A", "sata": false, "fb": "Frequent interruptions are common for first - and middle -level managers, who have a larger number of direct reports than do higher -level managers. Clerical support does not necessarily prevent interruptions. Time management skills increase efficiency, but these do not prevent interruptions for coworkers and subordinates. Workloads vary widely, and lower -level managers do not always have heavier workloads than upper -level managers."}, {"ch": "Ch 9: Time Management", "q": "A nurse -manager has set a goal of addressing external time wasters. What phenomenon should the manager address?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Failure to set clear daily objectives for the unit</div><div class=\"opt\" data-letter=\"B\">B) The manager's inability to say no to coworkers' and subordinates' requests</div><div class=\"opt\" data-letter=\"C\">C) The fact that the manager has a tendency to procrastinate</div><div class=\"opt\" data-letter=\"D\">D) The large quantity of paperwork that the manager must complete</div>", "ans": "D", "sata": false, "fb": "Excessive paperwork is an external time waster; the other characteristics are internal time wasters created by the manager."}, {"ch": "Ch 9: Time Management", "q": "A manager is trying to get in the habit of creating a daily list of tasks. The manager should:", "opts": "<div class=\"opt\" data-letter=\"A\">A) avoid changing the list once initial planning is completed.</div><div class=\"opt\" data-letter=\"B\">B) include flexibility in the implementation of the list.</div><div class=\"opt\" data-letter=\"C\">C) include all relevant short -term, intermediate, and long -term goals.</div><div class=\"opt\" data-letter=\"D\">D) keep the list highly structured, thus decreasing the possibility of procrastination.</div>", "ans": "B", "sata": false, "fb": "The daily list should be flexible, changeable, leave some time for the unexpected, and include appropriate short -term goals."}, {"ch": "Ch 9: Time Management", "q": "A nurse -manager has recognized that unproductive socialization is making it difficult to complete each day’s tasks. What action should the manager take to prevent this cause of inefficiency?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Maintain an open -door policy so employees can have more rapid interactions with the manager.</div><div class=\"opt\" data-letter=\"B\">B) Schedule appointments so that interactions can be predicted and controlled.</div><div class=\"opt\" data-letter=\"C\">C) Request a transfer to a site where the manager knows fewer coworkers and employees.</div><div class=\"opt\" data-letter=\"D\">D) Ban socialization on the unit during working hours.</div>", "ans": "B", "sata": false, "fb": "Appointments will discourage unproductive socialization since time will be allotted and a schedule maintained. Open -door policies and impromptu meetings encourage socialization. Requesting a transfer would be an extreme measure that should be reserved for more entrenched or unsolvable problems. An outright ban on socialization is excessive"}, {"ch": "Ch 9: Time Management", "q": "A nurse -manager is responsible for implementing a large and complex plan that will require much time and effort. How should the manager address this large task?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Work on the task with few breaks in order to finish as quickly as possible.</div><div class=\"opt\" data-letter=\"B\">B) Delegate as much of the task as possible to employees and focus on evaluation.</div><div class=\"opt\" data-letter=\"C\">C) Break the task into smaller, less intimidating units.</div><div class=\"opt\" data-letter=\"D\">D) Delay beginning the task until it has the manager’s undivided attention.</div>", "ans": "C", "sata": false, "fb": "Breaking down a task, or chunking, prevents the person from becoming overwhelmed by the size of the task. Working with few breaks may lead to exhaustion and compromise the quality of outcomes. Delegation is appropriate, but it is not usually appropriate to delegate all of a large task and to focus solely on evaluation instead of execution. Managers often need to work on several tasks simultaneously and cannot always wait until they can devote their undivided attention."}, {"ch": "Ch 9: Time Management", "q": "A nurse -manager is discussing time management with a new nurse manager. Which statement is used in teaching about time management?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Most people have an accurate perception of the time they spend on a particular task or the total amount of time they are productive during the day.</div><div class=\"opt\" data-letter=\"B\">B) Nurses with clearly identified personal goals and priorities have greater control over how they spend their time being productive each day.</div><div class=\"opt\" data-letter=\"C\">C) Writing down goals to assist in prioritizing responsibility is not necessary if the goals are limited to fewer than five in number.</div><div class=\"opt\" data-letter=\"D\">D) Keeping a time inventory for 1 day will allow the manager to identify a time management pattern.</div>", "ans": "B", "sata": false, "fb": "Nurses who are self -aware and have clearly identified personal goals and priorities have greater control over how they spend their time. Most people have misperceptions about how they spend their time. Writing down goals is always necessary and creating an accurate time inventory requires more than 1 day."}, {"ch": "Ch 9: Time Management", "q": "Which task should a team leader perform first when planning care for a group of clients?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Plan so that each client on the team receives equal amounts of nursing care.</div><div class=\"opt\" data-letter=\"B\">B) Prioritize the amount and type of nursing care each client requires.</div><div class=\"opt\" data-letter=\"C\">C) Identify the staff who will comprise the individual care teams.</div><div class=\"opt\" data-letter=\"D\">D) Assign clients to the specific nursing teams.</div>", "ans": "B", "sata": false, "fb": "Prioritizing the care each client will require is the initial step in care planning. The other options are considered, but implementation will happen after prioritization."}, {"ch": "Ch 9: Time Management", "q": "A nurse -manager is frustrated by the quantity of paper clutter. How should the manager best deal with this time waster?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Require face -to-face communication between staff members rather than written documentation.</div><div class=\"opt\" data-letter=\"B\">B) Set aside a block of time once per week to process documents.</div><div class=\"opt\" data-letter=\"C\">C) Deal with paper correspondence as soon as possible after it arrives.</div><div class=\"opt\" data-letter=\"D\">D) Place additional recycling and trash receptacles throughout the unit.</div>", "ans": "C", "sata": false, "fb": "Whenever possible, incoming correspondence should be handled the day it arrives. It should either be thrown away or filed according to the date to be completed. Letting it accumulate for a week at a time may make the problem worse, not better. Many forms of written documentation cannot be replaced by face -to-face conversation. Providing more waste receptacles will not help the manager process paperwork, which cannot normally be discarded without being addressed."}, {"ch": "Ch 9: Time Management", "q": "A nurse -manager is prioritizing tasks. Which tasks should the manager put into the “do now” category?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Adding follow-up comments to an incident report from the previous day</div><div class=\"opt\" data-letter=\"B\">B) Covering sick calls for the upcoming shift to ensure there are enough nurses</div><div class=\"opt\" data-letter=\"C\">C) Providing performance reviews for new staff nurses on the unit</div><div class=\"opt\" data-letter=\"D\">D) Meeting with the chairperson of the hospital's strategic planning committee</div>", "ans": "B", "sata": false, "fb": "Short -term staffing needs are a priority because this has direct implications for client safety. Following up an incident report, meeting with a committee, and providing performance reviews are actions that are necessary but less time -dependent and with less direct implications for safety."}, {"ch": "Ch 9: Time Management", "q": "A nurse -manager is creating a list in order to promote efficiency and productivity. What is the manager’s best action?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Use long -term goals as the framework for creating the list.</div><div class=\"opt\" data-letter=\"B\">B) Include slightly more activities than can be completed in a day, in order to motivate.</div><div class=\"opt\" data-letter=\"C\">C) Begin by ranking the priority of tasks that need to be accomplished.</div><div class=\"opt\" data-letter=\"D\">D) Keep each day’s list as similar as possible to each other day’s lists.</div>", "ans": "C", "sata": false, "fb": "Lists must be based on the relative priority of tasks. Lists generally focus on short -term priorities more than longer -term goals. The list should not be longer than what can be realistically accomplished in 1 day; otherwise, it demotivates instead of assisting. There is no particular benefit to keeping each day’s list similar to every other days."}, {"ch": "Ch 9: Time Management", "q": "A nurse -manager is focused on improving time management. Which activity is associated with a leadership role in time management?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Assisting followers in working cooperatively to maximize time use</div><div class=\"opt\" data-letter=\"B\">B) Prioritizing day -to-day planning to meet short -term and long -term unit goals</div><div class=\"opt\" data-letter=\"C\">C) Building time for time management planning into the work schedule</div><div class=\"opt\" data-letter=\"D\">D) Utilizing technology to facilitate timely communication and documentation</div>", "ans": "A", "sata": false, "fb": "A leadership role is to assist followers in working cooperatively to maximize time use. Management functions include prioritizing day -to-day planning to meet short -term and long -term unit goals, building time for planning into the work schedule, and utilizing"}, {"ch": "Ch 9: Time Management", "q": "How can subordinates be discouraged from taking up a nurse -manager’s time unproductively? Select all that apply.", "opts": "<div class=\"opt\" data-letter=\"A\">A) Having the manager be accessible in the nursing station</div><div class=\"opt\" data-letter=\"B\">B) Instituting an open -door policy</div><div class=\"opt\" data-letter=\"C\">C) Having limited office seating available</div><div class=\"opt\" data-letter=\"D\">D) Refocusing conversations as needed</div><div class=\"opt\" data-letter=\"E\">E) Work in a public area</div>", "ans": ["C", "D"], "sata": true, "fb": "Productivity can be enhanced by refocusing conversations that are taking too long and limiting the amount of office seating so that subordinates do not “settle in.” Working in a public area is likely to invite interruptions. An open -door policy promotes collaboration but can harm productivity."}, {"ch": "Ch 9: Time Management", "q": "What is the best response for a nurse -manager to handle someone who has a pattern of lengthy chatter?", "opts": "<div class=\"opt\" data-letter=\"A\">A) “We’ll need to make it brief since my schedule is tight today.”</div><div class=\"opt\" data-letter=\"B\">B) “I can’t speak with you now, but I’m going to have free time at 11 AM.”</div><div class=\"opt\" data-letter=\"C\">C) “Stop by and we can talk during your lunch break.”</div><div class=\"opt\" data-letter=\"D\">D) “I am sorry but I do not have anytime today to talk with you.”</div>", "ans": "B", "sata": false, "fb": "If someone has a pattern of lengthy chatter and manages to corner you on rounds or at the nurse’s station, say, “I can’t speak with you now, but I’m going to have some free time at 11 AM. Why don’t you see me then?” Unless the meeting is important, the person who just wishes to chat will not bother to make a formal appointment. If you would like to chat and have the time to do so, use coffee breaks and lunch hours for socializing."}, {"ch": "Ch 9: Time Management", "q": "Which steps can be included in improving time management for a nurse -manager working with a staff of 50 nurses? Select all that apply.", "opts": "<div class=\"opt\" data-letter=\"A\">A) Allow time for planning and establish priorities based on daily or project timelines</div><div class=\"opt\" data-letter=\"B\">B) Complete tasks according to their difficulty, from easiest to most difficult</div><div class=\"opt\" data-letter=\"C\">C) Complete the highest priority task, and whenever possible, finish one task before beginning another</div><div class=\"opt\" data-letter=\"D\">D) Reprioritize based on remaining tasks and new information that may have been received</div><div class=\"opt\" data-letter=\"E\">E) Divide each day into 1 -hour blocks in order to schedule as much as possible</div>", "ans": ["A", "C", "D"], "sata": true, "fb": "Time management can be reduced to three cyclic steps: (a) allow time for planning and establish priorities; (b) complete the highest priority task, and whenever possible, finish one task before beginning another; and (c) reprioritize based on remaining tasks and new information that may have been received. It is often necessary to divide days into blocks that are much smaller than 1 hour. Sequencing is based on priority, not ease or difficulty of completion."}, {"ch": "Ch 9: Time Management", "q": "A manager has identified the need to spend more time planning in order to accomplish each day’s tasks. When should the manager do this planning?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Whenever a block of time is available</div><div class=\"opt\" data-letter=\"B\">B) At the beginning of each day</div><div class=\"opt\" data-letter=\"C\">C) In the middle of the day, after high -priority tasks have been completed</div><div class=\"opt\" data-letter=\"D\">D) At the end of the day, in preparation for the next day</div>", "ans": "B", "sata": false, "fb": "Setting aside time at the beginning of each day to plan the day allows the manager to spend appropriate time on high -priority tasks. This proactive approach is preferable to planning in the middle of the day. Taking an ad hoc approach will not likely result in consistent planning. The manager may be too fatigued to plan the next day’s work at the end of a busy work day."}, {"ch": "Ch 9: Time Management", "q": "A leader -manager has recognized the need to be more consistent with time management.", "opts": "<div class=\"opt\" data-letter=\"A\">A) Enlisting the help of an administrative assistant</div><div class=\"opt\" data-letter=\"B\">B) Recognizing the need for goal setting</div><div class=\"opt\" data-letter=\"C\">C) Prioritizing tasks accurately</div><div class=\"opt\" data-letter=\"D\">D) Handling emergency situations quickly</div>", "ans": "C", "sata": false, "fb": "Priority setting is perhaps the most critical skill in time management because all actions taken are of some type of relative importance. It is very possible for a manager to set goals but then fail to manage their time. A person’s ability to handle emergencies does not necessarily indicate their ability to manage time on a day -to-day basis. An administrative assistant can be a valuable asset but does not facilitate the manager’s own time management skills."}, {"ch": "Ch 9: Time Management", "q": "A nurse -manager is reviewing a backlog of correspondence and reads an e -mail asking for feedback from a manufacturer about a piece of equipment that is used at the facility. The manager reads that the sender asked for all feedback to be submitted by the end of last week. In what category of prioritizing should this task be placed?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Squeaky wheel</div><div class=\"opt\" data-letter=\"B\">B) Don’t do</div><div class=\"opt\" data-letter=\"C\">C) Do later</div><div class=\"opt\" data-letter=\"D\">D) Do now</div>", "ans": "B", "sata": false, "fb": "One simple means of prioritizing what needs to be accomplished is to divide all requests into three categories: “don’t do,” “do later,” and “do now.” The “don’t do” items reflect problems that will take care of themselves, are already outdated, or are better accomplished by someone else. In this case, this is a task that is outdated because the deadline for feedback has passed. Doing it now (or later) is ultimately a waste of time at this point."}, {"ch": "Ch 9: Time Management", "q": "The nurse -manager of a hospital unit has categorized some tasks in the “do now” category. The tasks most likely reflect:", "opts": "<div class=\"opt\" data-letter=\"A\">A) the unit's day-to-day operational needs.</div><div class=\"opt\" data-letter=\"B\">B) the short-term or long-term goals of the unit.</div><div class=\"opt\" data-letter=\"C\">C) large, time-consuming tasks.</div><div class=\"opt\" data-letter=\"D\">D) problems that cannot be safely delegated.</div>", "ans": "A", "sata": false, "fb": "The “do now” requests most commonly reflect a unit’s day -to-day operational needs. These “do now” requests may or may not be related to long -term goals or require large amounts of time. The fact that a task can be safely delegated, or not delegated, has little to do with its priority."}, {"ch": "Ch 9: Time Management", "q": "A nurse -manager set a goal early in the year to take better control of time management. Upon achieving this goal, the manager is likely to experience what benefits? Select all that apply.", "opts": "<div class=\"opt\" data-letter=\"A\">A) Increased learning</div><div class=\"opt\" data-letter=\"B\">B) Increased influence on coworkers</div><div class=\"opt\" data-letter=\"C\">C) Increased knowledge</div><div class=\"opt\" data-letter=\"D\">D) Enhanced productivity</div><div class=\"opt\" data-letter=\"E\">E) Decreased stress</div>", "ans": ["D", "E"], "sata": true, "fb": "Managing time appropriatel reduces stress and increases productivity. However, a manager is unlikely see a direct relationship between time management and increased knowledge, influence, and learning."}, {"ch": "Ch 9: Time Management", "q": "Which statement identifies a common mistake made related to daily planning?", "opts": "<div class=\"opt\" data-letter=\"A\">A) “Crises always come up, so my plan keeps changing.”</div><div class=\"opt\" data-letter=\"B\">B) “I always handle each client’s needs as they arise.”</div><div class=\"opt\" data-letter=\"C\">C) “Sometimes it’s difficult to reserve time for daily planning.”</div><div class=\"opt\" data-letter=\"D\">D) “Client care requires a lot of reassessment by nursing.” suggests that the nurse is not taking time to prioritize tasks in terms of their importance. Essentially, tasks are completed in a random sequence based only on when the nurse became aware of the client need. The other listed statements reflect thoughtful planning and flexibility, which are important skills</div>", "ans": "B", "sata": false, "fb": "If a nurse is sequencing work solely on the basis of when issues emerge, this suggests that the nurse is not taking time to prioritize tasks in terms of their importance. Essentially, tasks are completed in a random sequence based only on when the nurse became aware of the client need. The other listed statements reflect thoughtful planning and flexibility, which are important skills."}, {"ch": "Ch 9: Time Management", "q": "How should a nurse -manager most effectively deal with the ever -changing nature of the nursing work environment?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Evaluating the management skills of the nursing team leaders</div><div class=\"opt\" data-letter=\"B\">B) Providing time management classes for staff members</div><div class=\"opt\" data-letter=\"C\">C) Frequently reassessing personally established priorities</div><div class=\"opt\" data-letter=\"D\">D) Encouraging staff to engage in daily planning</div>", "ans": "C", "sata": false, "fb": "Setting new priorities or adjusting priorities to reflect ever -changing work situations is an ongoing reality for the unit manager. Although the other options are appropriate, they are not directed to the management role in dealing with the ever -changing nature of the environment of nursing."}, {"ch": "Ch 9: Time Management", "q": "Which statements demonstrate adherence to habits that supports good personal time management skills? Select all that apply.", "opts": "<div class=\"opt\" data-letter=\"A\">A) “It’s important to me to be professional.”</div><div class=\"opt\" data-letter=\"B\">B) “I’m learning to trust the members of my team.”</div><div class=\"opt\" data-letter=\"C\">C) “I’ve learned that I’m most energetic in the morning.”</div><div class=\"opt\" data-letter=\"D\">D) “I’ll adjust my sleep schedule now that I’m on night shift.”</div><div class=\"opt\" data-letter=\"E\">E) “I never quit a task that I’ve decided to do.”</div>", "ans": ["B", "C", "D"], "sata": true, "fb": "Habits that foster good time management include favoring trusting relationships and listening to biorhythms. Professionalism is an important attribute of good managers, but this does not relate directly to personal time management. Having the wisdom to quit tasks that are unimportant or futile is important to time management."}, {"ch": "Ch 9: Time Management", "q": "A nurse is teaching a newly hired nurse for the division. Which statement supports why nursing interventions are documented as soon as possible after an activity is completed?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Decreasing the risk of inaccurate documentation</div><div class=\"opt\" data-letter=\"B\">B) Implementing effective time management skills</div><div class=\"opt\" data-letter=\"C\">C) Demonstrating professional nursing behavior</div><div class=\"opt\" data-letter=\"D\">D) Observing an established nursing principle</div>", "ans": "A", "sata": false, "fb": "It is important to document nursing interventions as soon as possible after an activity is completed. Waiting until the end of the workday to complete necessary documentation increases the risk of inaccuracies and incomplete documentation. It is true that this is an established nursing principle and that it shows professionalism and good time management, but the primary rationale is client safety."}, {"ch": "Ch 9: Time Management", "q": "A novice nurse -manager is frequently late for appointments. This manager’s colleagues are likely to have what perception of the manager?", "opts": "<div class=\"opt\" data-letter=\"A\">A) The manager is overworked with too many responsibilities.</div><div class=\"opt\" data-letter=\"B\">B) The manager needs additional management training.</div><div class=\"opt\" data-letter=\"C\">C) The manager does not value other people’s time.</div><div class=\"opt\" data-letter=\"D\">D) The manager lacks the skills necessary for the job.</div>", "ans": "C", "sata": false, "fb": "A lack of punctuality suggests that one does not value other people’s time. Chronic lateness is likely to cause resentment among colleagues, not recognition of the manager’s needs for more support."}, {"ch": "Ch 9: Time Management", "q": "A manager feels that time slips away, leaving many important tasks undone. How should this manager begin to develop better time management skills?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Identify a mentor who can plan the manager's schedule.</div><div class=\"opt\" data-letter=\"B\">B) Complete a time inventory to identify how time is used.</div><div class=\"opt\" data-letter=\"C\">C) Experiment with adjustments to the daily schedule.</div><div class=\"opt\" data-letter=\"D\">D) Request a temporary reduction in workload.</div>", "ans": "B", "sata": false, "fb": "A time inventory provides objective data that can be used to inform changes in the manager's behavior. It is unrealistic to expect a mentor to plan the manager's schedule, and this action would not improve the manager's ability to manage time independently."}, {"ch": "Ch 9: Time Management", "q": "A unit manager has been instructed to complete a comprehensive audit of the unit’s use of resources. The manager is daunted by the size of the task, which will likely take several weeks to complete. The manager should:", "opts": "<div class=\"opt\" data-letter=\"A\">A) set aside low - and medium -priority tasks until the project is complete.</div><div class=\"opt\" data-letter=\"B\">B) delegate the project to subordinates and ask for weekly updates.</div><div class=\"opt\" data-letter=\"C\">C) divide the project into smaller components that can be more easily completed.</div><div class=\"opt\" data-letter=\"D\">D) request clerical or secretarial assistance.</div>", "ans": "C", "sata": false, "fb": "Breaking up large projects into smaller pieces makes them much easier to accomplish and prevents procrastination. Delegation is often appropriate and efficient, but it would normally be inappropriate to delegate the entirety of a large project to subordinates. The manager must not neglect other tasks, even when there is a major project at hand. Secretarial support may provide some assistance with a larger project, but it is not likely to be the major determinant of success."}, {"ch": "Ch 9: Time Management", "q": "A nurse -manager makes lists of tasks for each day. What should the manager do in order to ensure that lists accurately reflect changes in priorities?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Reevaluate the lists on a regular basis and adjust them as needed.</div><div class=\"opt\" data-letter=\"B\">B) Ensure that each day's list is significantly different from the previous day's list.</div><div class=\"opt\" data-letter=\"C\">C) Add more detail to each task on the list.</div><div class=\"opt\" data-letter=\"D\">D) Have the lists reviewed by a trusted colleague on a regular basis.</div>", "ans": "A", "sata": false, "fb": "Evaluating and reprioritizing are vital aspects of time management. There is no obvious benefit in aiming to make lists different from other days’ lists. Increased detail can help with time management, but this does not help the manager adjust time and tasks as needed. Similarly, review by a colleague does not mean that the manager’s planning will respond to short -term changes."}, {"ch": "Ch 9: Time Management", "q": "A nurse -manager is beginning a day and is responsible for completing numerous tasks, including one high -priority task, three medium -priority tasks, and several lower priority tasks. How should the manager plan the day?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Complete some low -priority tasks first to make room for focusing on the high-priority task.</div><div class=\"opt\" data-letter=\"B\">B) Complete the high -priority task as early in the day as possible.</div><div class=\"opt\" data-letter=\"C\">C) Arrange the tasks according to the amount of time that they will require.</div><div class=\"opt\" data-letter=\"D\">D) Complete the low -priority tasks first, then medium -priority tasks, and then focus exclusively on the high -priority tasks.</div>", "ans": "B", "sata": false, "fb": "Finishing high -priority tasks first is an essential step in personal time management. Any option that does not focus first on the high -priority task is inaccurate."}, {"ch": "Ch 9: Time Management", "q": "A nurse -manager is having an exceptionally busy day and tells a colleague, “There’s no way I can take a lunch break today. I’ve got too much to do.” What is the colleague’s best response?", "opts": "<div class=\"opt\" data-letter=\"A\">A) “It’s important to take breaks, so there’s never any valid reason for skipping lunch.”</div><div class=\"opt\" data-letter=\"B\">B) “I know that happens sometimes. Let me know if you need help with organizing your day.”</div><div class=\"opt\" data-letter=\"C\">C) “You probably just need to reorganize your day. Do you need help with that?”</div><div class=\"opt\" data-letter=\"D\">D) “Let’s take a quick break and get something to eat, even if we have to come back a</div>", "ans": "D", "sata": false, "fb": "Whenever possible, the manager should take breaks in order to recharge and be more focused and efficient. Even so, there may be days where it is an impossibility. The colleague should encourage the manager to take a break, if possible, even if it is shorter than usual. Often a day is exceptionally busy, no matter how well it is organized."}, {"ch": "Ch 20: Delegation", "q": "A new nurse -manager is evaluating recent tasks that had been delegated to other staff for effectiveness. What is an inappropriate reason for delegation?", "opts": "<div class=\"opt\" data-letter=\"A\">A) To empower subordinates by “stretching” them in their work assignment</div><div class=\"opt\" data-letter=\"B\">B) To allow the manager to address more complex unit needs</div><div class=\"opt\" data-letter=\"C\">C) To free the manager of a task that is not intellectually challenging</div><div class=\"opt\" data-letter=\"D\">D) To give the task to someone who is better qualified</div>", "ans": "C", "sata": false, "fb": "Frequent mistakes made in delegating include underdelegating, overdelegating, and improper delegating. That the manager is not intellectually challenged by a task is not a valid reason for delegating that task to another person. The other options are all appropriate reasons to delegate tasks to qualified staff."}, {"ch": "Ch 20: Delegation", "q": "A performance appraisal states that the manager often underdelegates. What is potential cause of this delegation error?", "opts": "<div class=\"opt\" data-letter=\"A\">A) A high degree of trust in subordinates</div><div class=\"opt\" data-letter=\"B\">B) A democratic leadership style</div><div class=\"opt\" data-letter=\"C\">C) A need for perfectionism</div><div class=\"opt\" data-letter=\"D\">D) Sufficient time to accomplish unit goals alone</div>", "ans": "C", "sata": false, "fb": "A manager with a need for perfectionism and control may believe that another person will not complete a task. Trust in subordinates and a democratic leadership style would support effective delegation. Delegating should not be based on the issue of time exclusively."}, {"ch": "Ch 20: Delegation", "q": "A manager needs to delegate some tasks. What consideration should the manager prioritize when identifying the appropriate person to whom to delegate a specific task?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Whose turn it is to take on a delegated task</div><div class=\"opt\" data-letter=\"B\">B) The qualifications of the person regarding the task</div><div class=\"opt\" data-letter=\"C\">C) The fiscal cost of delegating the task</div><div class=\"opt\" data-letter=\"D\">D) Whether the person has experience with similar tasks</div>", "ans": "B", "sata": false, "fb": "Managers should ask the individuals to whom they are delegating if they are capable of completing the delegated task. If the person lacks the appropriate qualifications, the fact that they have experience is irrelevant. The manager should not base delegation decisions primarily on whose turn it is or on cost. 4. A nurse -manager delegates many tasks in the course of a day. Which practice should the manager reconsider or discontinue? a. The manager grants temporary authority to support completion of a delegated task. b. The manager confirms that the person to whom a task is delegated is adequately qualified. c. The manager provides employees with exact instructions for each step of completing the task. d. The manager asks for regular updates from the employee when tasks take a long time. ANS: C Feedback: If an employee has the skills necessary to complete a task, that employee should be able to carry out the task with autonomy and be provided with the authority and resources necessary. There should be no need for the manager to give excessively detailed instructions. Depending on the complexity of the project, the manager should meet with the employee for updates. The manager must always confirm employees’ qualifications. 5. A manager’s subordinate is having difficulty carrying out a delegated task. What is the manager’s best initial action? a. Release the subordinate from the task so they will not become demoralized. b. Be available to the employee as a role model and resource for the task. c. Assign another more experienced employee to help with the task. d. Reassign the employee a different, less complex task."}, {"ch": "Ch 20: Delegation", "q": "A nurse -manager delegates many tasks in the course of a day. Which practice should the manager reconsider or discontinue?", "opts": "<div class=\"opt\" data-letter=\"A\">A) The manager grants temporary authority to support completion of a delegated task.</div><div class=\"opt\" data-letter=\"B\">B) The manager confirms that the person to whom a task is delegated is adequately qualified.</div><div class=\"opt\" data-letter=\"C\">C) The manager provides employees with exact instructions for each step of completing the task.</div><div class=\"opt\" data-letter=\"D\">D) The manager asks for regular updates from the employee when tasks take a long time.</div>", "ans": "C", "sata": false, "fb": "If an employee has the skills necessary to complete a task, that employee should be able to carry out the task with autonomy and be provided with the authority and resources necessary. There should be no need for the manager to give excessively detailed instructions. Depending on the complexity of the project, the manager should meet with the employee for updates. The manager must always confirm employees’ qualifications."}, {"ch": "Ch 20: Delegation", "q": "A manager’s subordinate is having difficulty carrying out a delegated task. What is the manager’s best initial action?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Release the subordinate from the task so they will not become demoralized.</div><div class=\"opt\" data-letter=\"B\">B) Be available to the employee as a role model and resource for the task.</div><div class=\"opt\" data-letter=\"C\">C) Assign another more experienced employee to help with the task.</div><div class=\"opt\" data-letter=\"D\">D) Reassign the employee a different, less complex task.</div>", "ans": "B", "sata": false, "fb": "A manager should be available to the employee to help identify solutions to problems encountered with a delegated task and should encourage the employee to persevere. Taking back a task that was originally delegated is an absolute last resort. Reassigning and coassigning the task are options that should not be initially considered, but which may be necessary later. 6. What principle should guide the nurse’s delegation of tasks to unlicensed nursing assistive personnel (NAP)? a. It is safe to assume that the NAP has at least a high school diploma as a minimum hiring criterion. b. Like all members of the care team, NAP stands to lose their licensure in case of negligent practice. c. No federal or community standards have been established for training the broad classification of NAP. d. The nurse is protected from liability when allowing the NAP to perform only those tasks the employer includes in their job description. ANS: C Feedback: No federal or community standards have been established for the training of the NAP. The hiring policies of institutions vary regarding the employment qualifications of the NAP, and many institutions do not have distinct job descriptions for NAP that define their scope of practice. NAPs do not have a license that they can lose. 7. Which action is considered a leadership role associated with delegation? a. Creating job descriptions for all personnel b. Providing formal recognition or reward for completion of delegated tasks c. Demonstrating sensitivity to how cultural phenomena affect transcultural delegation d. Reprimanding employees who demonstrate overt resistance to the tasks they are delegated"}, {"ch": "Ch 20: Delegation", "q": "What principle should guide the nurse’s delegation of tasks to unlicensed nursing assistive personnel (NAP)?", "opts": "<div class=\"opt\" data-letter=\"A\">A) It is safe to assume that the NAP has at least a high school diploma as a minimum hiring criterion.</div><div class=\"opt\" data-letter=\"B\">B) Like all members of the care team, NAP stands to lose their licensure in case of negligent practice.</div><div class=\"opt\" data-letter=\"C\">C) No federal or community standards have been established for training the broad classification of NAP.</div><div class=\"opt\" data-letter=\"D\">D) The nurse is protected from liability when allowing the NAP to perform only those tasks the employer includes in their job description.</div>", "ans": "C", "sata": false, "fb": "No federal or community standards have been established for the training of the NAP. The hiring policies of institutions vary regarding the employment qualifications of the NAP, and many institutions do not have distinct job descriptions for NAP that define their scope of practice. NAPs do not have a license that they can lose."}, {"ch": "Ch 20: Delegation", "q": "Which action is considered a leadership role associated with delegation?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Creating job descriptions for all personnel</div><div class=\"opt\" data-letter=\"B\">B) Providing formal recognition or reward for completion of delegated tasks</div><div class=\"opt\" data-letter=\"C\">C) Demonstrating sensitivity to how cultural phenomena affect transcultural delegation</div><div class=\"opt\" data-letter=\"D\">D) Reprimanding employees who demonstrate overt resistance to the tasks they are delegated</div>", "ans": "C", "sata": false, "fb": "Factors such as communication, space, social organization, timing, environmental control, and biologic variations affect delegation to a culturally diverse staff and should be modeled as a leadership role. The other choices are all management functions. 8. Which statement is true regarding the general delegation liability of a registered nurse (RN)? a. It is minimal because subordinates alone are held accountable for practicing within the accepted scope of practice for their job classification. b. It is high because the RN is automatically held liable for the tasks delegated to all recognized subordinates. c. It is reduced when the RN delegates appropriately and supervises the completion of the tasks. d. It is avoided entirely as long as the nurse delegates only other licensed personnel. ANS: C Feedback: Proper delegation practices that include assessment and evaluation help protect the RN from liability. In general, accountability is shared and does not lie solely with the subordinate. Delegation to licensed personnel does not completely release a nurse from liability. 9. What action should a nurse -manager perform when supporting the delegation of a task to a subordinate? a. Holding the subordinate’s professional development as the highest priority b. Frequently reassuring the employee that if they are incapable of completing a delegated task, it will be reassigned c. Drafting a preliminary plan of how the task will be redone if the outcome does not meet stated expectations d. Occasionally providing learning or “stretching” opportunities for employees ANS: D Feedback: “Stretching” provides growth opportunities for employees, builds employee self-esteem, and helps prevent boredom and demotivation. Client safety is prioritized over professional development. The manager should avoid excessive reassurance and threats of reassignment. The nurse should not presume that the task will need to be redone before the"}, {"ch": "Ch 20: Delegation", "q": "Which statement is true regarding the general delegation liability of a registered nurse (RN)?", "opts": "<div class=\"opt\" data-letter=\"A\">A) It is minimal because subordinates alone are held accountable for practicing within the accepted scope of practice for their job classification.</div><div class=\"opt\" data-letter=\"B\">B) It is high because the RN is automatically held liable for the tasks delegated to all recognized subordinates.</div><div class=\"opt\" data-letter=\"C\">C) It is reduced when the RN delegates appropriately and supervises the completion of the tasks.</div><div class=\"opt\" data-letter=\"D\">D) It is avoided entirely as long as the nurse delegates only other licensed personnel.</div>", "ans": "C", "sata": false, "fb": "Proper delegation practices that include assessment and evaluation help protect the RN from liability. In general, accountability is shared and does not lie solely with the subordinate. Delegation to licensed personnel does not completely release a nurse from liability."}, {"ch": "Ch 20: Delegation", "q": "What action should a nurse -manager perform when supporting the delegation of a task to a subordinate?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Holding the subordinate’s professional development as the highest priority</div><div class=\"opt\" data-letter=\"B\">B) Frequently reassuring the employee that if they are incapable of completing a delegated task, it will be reassigned</div><div class=\"opt\" data-letter=\"C\">C) Drafting a preliminary plan of how the task will be redone if the outcome does not meet stated expectations</div><div class=\"opt\" data-letter=\"D\">D) Occasionally providing learning or “stretching” opportunities for employees</div>", "ans": "D", "sata": false, "fb": "\"Stretching\" provides growth opportunities for employees, builds employee self-esteem, and helps prevent boredom and demotivation. Client safety is prioritized over professional development. The manager should avoid excessive reassurance and threats of reassignment. The nurse should not presume that the task will need to be redone before it is attempted."}, {"ch": "Ch 20: Delegation", "q": "Periodically during the day, an RN checks with the team members to determine whether they are having difficulty completing their assigned tasks. This describes which manager role?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Skills evaluation</div><div class=\"opt\" data-letter=\"B\">B) Client safety</div><div class=\"opt\" data-letter=\"C\">C) Effective delegation</div><div class=\"opt\" data-letter=\"D\">D) Micromanagement</div>", "ans": "C", "sata": false, "fb": "This manager provided the team with the autonomy to complete the work and was available should any need arise. This describes effective delegation. This action does not constitute micromanagement, provided it is not excessive. This promotes client safety but is not synonymous with it. This practice is not a form of skills evaluation."}, {"ch": "Ch 20: Delegation", "q": "A member of the team has been delegated some tasks and reports, “I’ve been given too much to do and I’m not going to be able to complete the work on time.” What is the RN’s best initial action?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Assign the work to another team member.</div><div class=\"opt\" data-letter=\"B\">B) Take on the responsibility of the tasks.</div><div class=\"opt\" data-letter=\"C\">C) Have the team member perform only the most necessary tasks.</div><div class=\"opt\" data-letter=\"D\">D) Examine the workload and assist the individual in reprioritizing.</div>", "ans": "D", "sata": false, "fb": "The manager should help the overwhelmed employee reprioritize the workload with the goal of making it manageable for that employee. This strategy should be tried before assigning work to another team member or having the employee abandon some of the tasks. In most cases, it is ineffective if the RN takes on the tasks that the employee was supposed to complete."}, {"ch": "Ch 20: Delegation", "q": "Which assessment should an RN prioritize when assigning tasks to nursing assistive personnel (NAP)?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Determining the NAP’s skills and knowledge level</div><div class=\"opt\" data-letter=\"B\">B) Assessing which tasks the NAP is motivated to perform</div><div class=\"opt\" data-letter=\"C\">C) Evaluating the NAP’s ability to follow instructions</div><div class=\"opt\" data-letter=\"D\">D) Asking colleagues to appraise the NAP’s strengths and weaknesses</div>", "ans": "A", "sata": false, "fb": "The nurse or manager must be knowledgeable about the skills and knowledge of all members of the health care team. These variables are more important than the NAP’s motivation, ability to following instructions, or personal attributes because they are more closely associated with client safety and the avoidance of liability."}, {"ch": "Ch 20: Delegation", "q": "Which task would the director of a home health agency not delegate to another staff RN?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Assigning home health aides to specific client care</div><div class=\"opt\" data-letter=\"B\">B) Serving on a diabetic study committee of community resources</div><div class=\"opt\" data-letter=\"C\">C) Meeting with the agency’s administration regarding budget cuts</div><div class=\"opt\" data-letter=\"D\">D) Reviewing the care assignment for the following shift</div>", "ans": "C", "sata": false, "fb": "Management responsibilities associated with budgeting would not normally be delegated to another RN on the staff because this is a role that is not the responsibility of an RN. The other options could be appropriately delegated to another RN in most circumstances."}, {"ch": "Ch 20: Delegation", "q": "An RN needs to confirm the specific delegation parameters for RNs. The RN should refer to guidelines from what organization?", "opts": "<div class=\"opt\" data-letter=\"A\">A) The Joint Commission</div><div class=\"opt\" data-letter=\"B\">B) U.S. Department of Health and Human Services</div><div class=\"opt\" data-letter=\"C\">C) The National League for Nursing</div><div class=\"opt\" data-letter=\"D\">D) The state board of nursing</div>", "ans": "D", "sata": false, "fb": "State boards of nursing are responsible for clarifying the delegation parameters for RNs. None of the other options are involved in this process."}, {"ch": "Ch 20: Delegation", "q": "What must managers delegate to another RN in order to assure completion of a task?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Time and space</div><div class=\"opt\" data-letter=\"B\">B) Leadership and creativity</div><div class=\"opt\" data-letter=\"C\">C) Authority and responsibility</div><div class=\"opt\" data-letter=\"D\">D) Personnel and knowledge</div>", "ans": "C", "sata": false, "fb": "Managers must delegate the authority and the responsibility necessary to complete a task. Qualities like leadership, knowledge, and creativity are not transferable. The remaining option choices are resources that are provided rather than delegated."}, {"ch": "Ch 20: Delegation", "q": "The Omnibus Budget Reconciliation Act of 1987 established regulations for the education and training of which category of health care worker?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Certified nurse aide (CNA)</div><div class=\"opt\" data-letter=\"B\">B) Registered nurse (RN)</div><div class=\"opt\" data-letter=\"C\">C) Licensed practical nurse (LPN)</div><div class=\"opt\" data-letter=\"D\">D) Ward clerk</div>", "ans": "A", "sata": false, "fb": "Although the Omnibus Budget Reconciliation Act of 1987 established regulations for the education and certification of “nurse’s aides” (minimum of 75 hours of theory and practice and successful completion of an examination in both areas), no federal or community standards have been established for training the more broadly defined NAP. LPNs and ward clerks are not addressed by this act."}, {"ch": "Ch 20: Delegation", "q": "A registered nurse (RN) was working with a nursing assistive personnel (NAP) and delegated some tasks to the NAP. The NAP exceeded their scope of practice and caused injury to a client. Ultimate responsibility for this adverse event lies with whom?", "opts": "<div class=\"opt\" data-letter=\"A\">A) The NAP</div><div class=\"opt\" data-letter=\"B\">B) The facility’s director of nursing</div><div class=\"opt\" data-letter=\"C\">C) The unit’s nursing manager</div><div class=\"opt\" data-letter=\"D\">D) The RN</div>", "ans": "D", "sata": false, "fb": "The team’s RN always bears the ultimate responsibility for ensuring that the nursing care provided by their team members meets or exceeds minimum safety standards. This is not the ultimate role of any of the other positions mentioned."}, {"ch": "Ch 20: Delegation", "q": "A nurse -manager is new to the unit and is worried about being perceived as incompetent or underqualified by subordinates. The manager should recognize that this creates a risk for what problem?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Underdelegating</div><div class=\"opt\" data-letter=\"B\">B) Overdelegating</div><div class=\"opt\" data-letter=\"C\">C) Improper delegating</div><div class=\"opt\" data-letter=\"D\">D) Inappropriate delegating</div>", "ans": "A", "sata": false, "fb": "Underdelegating occurs when a manager has a false assumption that delegation may be interpreted as a lack of ability on his or her part to do the job correctly or completely. This insecurity may make the manager highly reluctant to delegate."}, {"ch": "Ch 20: Delegation", "q": "A nurse -manager is overseeing a culturally diverse group of staff. The manager should consider what variables when planning delegation? Select all that apply.", "opts": "<div class=\"opt\" data-letter=\"A\">A) Communication style</div><div class=\"opt\" data-letter=\"B\">B) Concepts of time</div><div class=\"opt\" data-letter=\"C\">C) Intelligence level of staff</div><div class=\"opt\" data-letter=\"D\">D) Biologic variations</div><div class=\"opt\" data-letter=\"E\">E) Social organization</div>", "ans": ["A", "B", "D", "E"], "sata": true, "fb": "There are six cultural phenomena that must be considered when working with staff from a culturally diverse background: communication, space, social organization, time, environmental control, and biologic variations. Intelligence is not a cultural phenomenon."}, {"ch": "Ch 20: Delegation", "q": "An RN is leading a care team on a busy hospital unit. What tasks is the RN justified in delegating to NAP? Select all that apply.", "opts": "<div class=\"opt\" data-letter=\"A\">A) Feeding a client who has unilateral weakness</div><div class=\"opt\" data-letter=\"B\">B) Repositioning an immobile client every 2 hours</div><div class=\"opt\" data-letter=\"C\">C) Assessing a client’s surgical wound</div><div class=\"opt\" data-letter=\"D\">D) Weighing a client who has chronic heart failure</div><div class=\"opt\" data-letter=\"E\">E) Transporting a client to a diagnostic test</div>", "ans": ["A", "B", "D", "E"], "sata": true, "fb": "Assessment is beyond the scope of NAP. However, NAP can appropriately feed, reposition, transport, and weigh clients."}, {"ch": "Ch 20: Delegation", "q": "An experienced RN has seen a significant increase in the need for delegation skills over the past several years. This change is most likely attributable to:", "opts": "<div class=\"opt\" data-letter=\"A\">A) increased numbers of uninsured clients.</div><div class=\"opt\" data-letter=\"B\">B) increased lengths of stay.</div><div class=\"opt\" data-letter=\"C\">C) increases in the use of NAP.</div><div class=\"opt\" data-letter=\"D\">D) decreases in nurse –client ratios.</div>", "ans": "C", "sata": false, "fb": "With the increased use of NAP in client care, the need for nurses to have highly developed delegation skills has never been greater. The impact of insurance, nurse –client ratios, and hospitalization stays does not have as great an impact on delegation as does the correct option. Hospital stays are shorter, not longer, than in the past."}, {"ch": "Ch 20: Delegation", "q": "A subordinate is reluctant to accept a task that the nurse -manager wants to delegate. The manager suspects that the subordinate’s reluctance is due to a lack of self -confidence. What is the manager’s best initial action?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Teach the subordinate about the value of self-confidence.</div><div class=\"opt\" data-letter=\"B\">B) Try to empower the subordinate.</div><div class=\"opt\" data-letter=\"C\">C) Offer a reward to the subordinate in order to motivate.</div><div class=\"opt\" data-letter=\"D\">D) Restate the importance of the task to the subordinate.</div>", "ans": "B", "sata": false, "fb": "Empowering the subordinate who lacks self -confidence is an appropriate initial action. If this is not possible, then reassigning the task may be necessary. Teaching about the need for self -confidence rarely instills self -confidence in those who lack it. Restating the importance of the task does not address the nurse’s confidence level."}, {"ch": "Ch 20: Delegation", "q": "Which action on the part of a unit’s nurse -manager demonstrates the mark of a great leader?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Acknowledging the accomplishments of staff members at the unit meeting</div><div class=\"opt\" data-letter=\"B\">B) Providing onsite inservices on new equipment for the staff</div><div class=\"opt\" data-letter=\"C\">C) Including funds in the unit’s budget of staff development</div><div class=\"opt\" data-letter=\"D\">D) Stressing the importance of client safety to all new employees</div>", "ans": "A", "sata": false, "fb": "The mark of a great leader is when they can recognize the excellent performance of someone else and allow others to shine for their accomplishments. Although the other options are appropriate, they are not identified as being the mark of a great leader but rather an efficient manager."}, {"ch": "Ch 20: Delegation", "q": "A nurse-manager has asked a NAP for an update on delegated tasks, and the NAP has said, \"I am having a lot of trouble with the tasks assigned to me — I do not know how to handle them all.\" What is the manager's best response?", "opts": "<div class=\"opt\" data-letter=\"A\">A) \"Don't be afraid to let me know if you feel the project is overwhelming you.\"</div><div class=\"opt\" data-letter=\"B\">B) \"Time management is key to keeping on schedule with your tasks.\"</div><div class=\"opt\" data-letter=\"C\">C) \"I can give you a few solutions to help manage this heavy workload.\"</div><div class=\"opt\" data-letter=\"D\">D) \"Do you want more time to complete your work?\"</div>", "ans": "C", "sata": false, "fb": "If the worker is having difficulty carrying out the delegated task, the leader-manager should be available as a role model and resource in identifying alternative solutions. Leaders should encourage employees to attempt to solve problems themselves first, although they should always be willing to answer questions about the task or clarify desired outcomes. Suggesting solutions is the best initial response — it is more helpful than giving permission to feel overwhelmed or simply offering more time without addressing the workload problem."}, {"ch": "Ch 20: Delegation", "q": "A nurse has successfully completed a difficult and complex task that the manager delegated. What is the manager’s best action?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Document the fact that the nurse completed the task.</div><div class=\"opt\" data-letter=\"B\">B) Assign a slightly more difficult task the next time.</div><div class=\"opt\" data-letter=\"C\">C) Acknowledge the nurse’s significant accomplishment.</div><div class=\"opt\" data-letter=\"D\">D) Ask the nurse to act as a role model for other staff members.</div>", "ans": "C", "sata": false, "fb": "It is important to reward employees for accomplishment. This must precede “stretching” the nurse with even more difficult assignments or asking the nurse to act as a role model."}, {"ch": "Ch 20: Delegation", "q": "A nurse -manager has delegated some administrative tasks to an experienced RN. Which of the following is true about this act of delegation? Select all that apply.", "opts": "<div class=\"opt\" data-letter=\"A\">A) The nurse’s task will be beyond their scope of practice.</div><div class=\"opt\" data-letter=\"B\">B) The manager transfers the authority for the task to the nurse.</div><div class=\"opt\" data-letter=\"C\">C) The nurse is practicing on the manager’s license.</div><div class=\"opt\" data-letter=\"D\">D) The manager is released of the need to oversee the nurse.</div>", "ans": ["B", "E"], "sata": true, "fb": "In delegation, the individual transfers the authority to perform a specific activity from their own practice to an individual qualified to perform that task, but retains accountability for the delegated task. Delegation does not involve going beyond the nurse’s scope of practice, and there is still a need for oversight. The nurse does not perform on someone else’s license when completing delegated tasks."}, {"ch": "Ch 20: Delegation", "q": "A nurse -manager has begun a new role in a community health center and will need to delegate tasks often to subordinates. What actions should the manager perform when delegating tasks? Select all that apply.", "opts": "<div class=\"opt\" data-letter=\"A\">A) Choose the most time -consuming tasks to delegate to subordinates.</div><div class=\"opt\" data-letter=\"B\">B) Evaluate the skills and education of subordinates before delegating.</div><div class=\"opt\" data-letter=\"C\">C) Ensure that subordinates know the goal of any delegated task.</div><div class=\"opt\" data-letter=\"D\">D) Avoid monitoring the subordinate unless there is evidence of a problem.</div><div class=\"opt\" data-letter=\"E\">E) Evaluate subordinates’ performance after they have completed a task.</div>", "ans": ["B", "C", "E"], "sata": true, "fb": "Safe and effective delegation involves evaluating the skills and education of staff, identifying goals clearly, and evaluating performance after completion. Tasks should not be selected for delegation on the sole basis of being time -consuming for the manager. Monitoring is appropriate and necessary and is not reserved just for problems or emergencies."}, {"ch": "Ch 20: Delegation", "q": "A nurse delegated some tasks to a nurse several hours ago. The manager has now learned that the nurse did not complete any of the delegated tasks. What is the manager’s best initial action?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Determine exactly why the nurse did not complete the delegated tasks.</div><div class=\"opt\" data-letter=\"B\">B) Assertively state the expectation that delegated tasks will be completed on time.</div><div class=\"opt\" data-letter=\"C\">C) Document the nurse’s insubordination and arrange a private meeting.</div><div class=\"opt\" data-letter=\"D\">D) Take action to reestablish the authority power gap. reasons for this before taking action. Addressing the problem before knowing the circumstances or the cause would be premature</div>", "ans": "A", "sata": false, "fb": "If an employee does not complete delegated tasks, the manager should assess the reasons for this before taking action. Addressing the problem before knowing the circumstances or the cause would be premature. 29. A registered nurse has been leading teams of NAP for several years and will soon be leading licensed practical nurses (LPNs) for the first time. In preparation for delegating to these nurses, the RN should: a. delegate the same tasks to the LPNs that the RN normally delegated to NAPs. b. review the LPN scope of practice in the jurisdiction in which they are working. c. ask each LPN what tasks they are comfortable performing. d. consult a decision tree for delegation to unlicensed assistive personnel. ANS: B Feedback: Delegation to an LPN is different from delegation to an NAP. The parameters vary from state to state, and the RN should review the scope of practice. The LPN’s comfort level is secondary to their knowledge, skills, and scope of practice. A decision tree for delegation to unlicensed assistive personnel would guide delegation to NAPs, not LPNs. 30. A health care organization has laid off several RNs and hired numerous NAPs in their place. What effect is this change most likely to have on the remaining RNs? a. There will be a risk of the RNs underdelegating. b. The RNs’ level of liability will increase. c. Cultural variables will become a larger consideration. d. The RNs’ scope of practice will become expanded. ANS: B Feedback: In general, increasing delegation to NAPs increases the scope of liability for the RN. There is no reason why this change in staffing would create a risk for underdelegating or make culture a more salient concern. The RNs’ scope of practice is enacted in the jurisdiction’s nurse practice act and is not affected by this change."}, {"ch": "Ch 20: Delegation", "q": "A registered nurse has been leading teams of NAP for several years and will soon be leading licensed practical nurses (LPNs) for the first time. In preparation for delegating to these nurses, the RN should:", "opts": "<div class=\"opt\" data-letter=\"A\">A) delegate the same tasks to the LPNs that the RN normally delegated to NAPs.</div><div class=\"opt\" data-letter=\"B\">B) review the LPN scope of practice in the jurisdiction in which they are working.</div><div class=\"opt\" data-letter=\"C\">C) ask each LPN what tasks they are comfortable performing.</div><div class=\"opt\" data-letter=\"D\">D) consult a decision tree for delegation to unlicensed assistive personnel.</div>", "ans": "B", "sata": false, "fb": "Delegation to an LPN is different from delegation to an NAP. The parameters vary from state to state, and the RN should review the scope of practice. The LPN’s comfort level is secondary to their knowledge, skills, and scope of practice. A decision tree for delegation to unlicensed assistive personnel would guide delegation to NAPs, not LPNs."}, {"ch": "Ch 20: Delegation", "q": "A health care organization has laid off several RNs and hired numerous NAPs in their place. What effect is this change most likely to have on the remaining RNs?", "opts": "<div class=\"opt\" data-letter=\"A\">A) There will be a risk of the RNs underdelegating.</div><div class=\"opt\" data-letter=\"B\">B) The RNs’ level of liability will increase.</div><div class=\"opt\" data-letter=\"C\">C) Cultural variables will become a larger consideration.</div><div class=\"opt\" data-letter=\"D\">D) The RNs’ scope of practice will become expanded.</div>", "ans": "B", "sata": false, "fb": "In general, increasing delegation to NAPs increases the scope of liability for the RN. There is no reason why this change in staffing would create a risk for underdelegating or make culture a more salient concern. The RNs’ scope of practice is enacted in the jurisdiction’s nurse practice act and is not affected by this change."}];
let questions = [...ALL_QUESTIONS];
let current = 0;
let answers = {};       // index -> letter (normal) or Set of letters (sata)
let correctCount = 0, wrongCount = 0;
let wrongIndexes = new Set();

function init() {
  current = 0; answers = {}; correctCount = 0; wrongCount = 0; wrongIndexes = new Set();
  document.getElementById('stat-correct').textContent = '0';
  document.getElementById('stat-wrong').textContent = '0';
  document.getElementById('stat-remain').textContent = questions.length;
  document.getElementById('summary').style.display = 'none';
  document.getElementById('quiz-container').style.display = 'block';
  document.getElementById('wrong-btn').style.display = 'none';
  render();
}

function render() {
  if (current >= questions.length) { showSummary(); return; }
  const q = questions[current];
  document.getElementById('q-counter').textContent = 'Question ' + (current+1) + ' of ' + questions.length;
  document.getElementById('ch-tag').textContent = q.ch;

  const sataTag = document.getElementById('sata-tag');
  const legend  = document.getElementById('sata-legend');
  if (q.sata) {
    sataTag.style.display = 'inline-block';
    legend.style.display = 'block';
  } else {
    sataTag.style.display = 'none';
    legend.style.display = 'none';
  }

  document.getElementById('q-text').textContent = q.q;
  document.getElementById('options').innerHTML = q.opts;
  document.getElementById('feedback').style.display = 'none';
  document.getElementById('feedback-text').textContent = q.fb;
  document.getElementById('correct-badge').style.display = 'none';
  document.getElementById('wrong-badge').style.display  = 'none';
  document.getElementById('check-btn').style.display    = 'none';
  document.getElementById('progress').style.width = ((current / questions.length) * 100) + '%';
  document.getElementById('prev-btn').disabled = current === 0;
  document.getElementById('next-btn').textContent = current === questions.length - 1 ? 'Finish' : 'Next';

  const prev = answers[current];
  if (prev !== undefined) {
    if (q.sata) restoreMulti(prev, q.ans);
    else        revealSingle(prev, q.ans);
  } else {
    if (q.sata) attachMultiHandlers(q.ans);
    else        attachSingleHandlers(q.ans);
  }
}

// ── Single-answer ───────────────────────────────────────────────────────────
function attachSingleHandlers(correct) {
  document.querySelectorAll('.opt').forEach(o => {
    o.onclick = () => {
      if (answers[current] !== undefined) return;
      answers[current] = o.dataset.letter;
      updateStats(o.dataset.letter === correct);
      revealSingle(o.dataset.letter, correct);
    };
  });
}

function revealSingle(selected, correct) {
  document.querySelectorAll('.opt').forEach(o => {
    o.classList.add('locked'); o.onclick = null;
    if (o.dataset.letter === correct)                       o.classList.add('correct');
    if (o.dataset.letter === selected && selected !== correct) o.classList.add('wrong');
  });
  document.getElementById('feedback').style.display = 'block';
  const isCorrect = selected === correct;
  document.getElementById('correct-badge').style.display = isCorrect ? 'flex' : 'none';
  document.getElementById('wrong-badge').style.display   = isCorrect ? 'none' : 'flex';
}

// ── Multi-answer SATA ───────────────────────────────────────────────────────
let sataSelected = new Set();

function attachMultiHandlers(correctList) {
  sataSelected = new Set();
  document.querySelectorAll('.opt').forEach(o => {
    o.onclick = () => {
      if (o.classList.contains('locked')) return;
      const letter = o.dataset.letter;
      if (sataSelected.has(letter)) {
        sataSelected.delete(letter);
        o.classList.remove('selected');
      } else {
        sataSelected.add(letter);
        o.classList.add('selected');
      }
      document.getElementById('check-btn').style.display = sataSelected.size > 0 ? 'block' : 'none';
    };
  });
  document.getElementById('check-btn').onclick = () => submitMulti(correctList);
}

function submitMulti(correctList) {
  const correct = new Set(correctList);
  const isFullyCorrect = [...correct].every(l => sataSelected.has(l)) &&
                         [...sataSelected].every(l => correct.has(l));
  answers[current] = [...sataSelected];
  if (!isFullyCorrect) wrongIndexes.add(current);
  updateStats(isFullyCorrect);

  document.querySelectorAll('.opt').forEach(o => {
    o.classList.add('locked'); o.onclick = null;
    o.classList.remove('selected');
    const letter = o.dataset.letter;
    const wasSelected = sataSelected.has(letter);
    const isCorrect   = correct.has(letter);
    if (isCorrect && wasSelected)  o.classList.add('correct');
    if (!isCorrect && wasSelected) o.classList.add('wrong');
    if (isCorrect && !wasSelected) o.classList.add('missed');
  });
  document.getElementById('check-btn').style.display = 'none';
  document.getElementById('feedback').style.display  = 'block';
  document.getElementById('correct-badge').style.display = isFullyCorrect ? 'flex' : 'none';
  document.getElementById('wrong-badge').style.display   = isFullyCorrect ? 'none' : 'flex';
}

function restoreMulti(savedList, correctList) {
  const saved   = new Set(savedList);
  const correct = new Set(correctList);
  document.querySelectorAll('.opt').forEach(o => {
    o.classList.add('locked'); o.onclick = null;
    const letter = o.dataset.letter;
    const wasSelected = saved.has(letter);
    const isCorrect   = correct.has(letter);
    if (isCorrect && wasSelected)  o.classList.add('correct');
    if (!isCorrect && wasSelected) o.classList.add('wrong');
    if (isCorrect && !wasSelected) o.classList.add('missed');
  });
  document.getElementById('feedback').style.display = 'block';
  const isFullyCorrect = [...correct].every(l => saved.has(l)) && [...saved].every(l => correct.has(l));
  document.getElementById('correct-badge').style.display = isFullyCorrect ? 'flex' : 'none';
  document.getElementById('wrong-badge').style.display   = isFullyCorrect ? 'none' : 'flex';
}

// ── Stats ────────────────────────────────────────────────────────────────────
function updateStats(isCorrect) {
  if (isCorrect) correctCount++; else { wrongCount++; wrongIndexes.add(current); }
  document.getElementById('stat-correct').textContent = correctCount;
  document.getElementById('stat-wrong').textContent   = wrongCount;
  document.getElementById('stat-remain').textContent  = questions.length - Object.keys(answers).length;
}

// ── Nav ──────────────────────────────────────────────────────────────────────
function nextQ() {
  if (current < questions.length - 1) { current++; render(); } else showSummary();
}
function prevQ() { if (current > 0) { current--; render(); } }

// ── Summary ──────────────────────────────────────────────────────────────────
function showSummary() {
  document.getElementById('quiz-container').style.display = 'none';
  document.getElementById('summary').style.display = 'block';
  const total   = questions.length;
  const skipped = total - Object.keys(answers).length;
  const pct     = total > 0 ? Math.round((correctCount/total)*100) : 0;
  document.getElementById('sum-score').textContent   = correctCount + '/' + total;
  document.getElementById('sum-pct').textContent     = pct + '%';
  document.getElementById('sum-correct').textContent = correctCount;
  document.getElementById('sum-wrong').textContent   = wrongCount;
  document.getElementById('sum-skipped').textContent = skipped;
  let msg = '';
  if (pct >= 92) msg = 'A — Outstanding! You are very well prepared.';
  else if (pct >= 83) msg = 'B — Good work. A few more rounds and you are set.';
  else if (pct >= 75) msg = 'C — Passing, but push for deeper mastery before exam day.';
  else msg = 'Below passing — focus on rationales for wrong answers and review those chapters.';
  document.getElementById('sum-msg').textContent = msg;
  document.getElementById('progress').style.width = '100%';
  if (wrongIndexes.size > 0) document.getElementById('wrong-btn').style.display = 'inline-block';
}

// ── Controls ─────────────────────────────────────────────────────────────────
function shuffleQuestions() {
  for (let i = questions.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i+1));
    [questions[i], questions[j]] = [questions[j], questions[i]];
  }
  init();
}
function resetQuiz() {
  questions = [...ALL_QUESTIONS];
  document.getElementById('ch-filter').value = 'all';
  init();
}
function filterByChapter() {
  const val = document.getElementById('ch-filter').value;
  questions = val === 'all' ? [...ALL_QUESTIONS]
    : ALL_QUESTIONS.filter(q => q.ch.startsWith('Ch ' + val + ':'));
  init();
}
function showOnlyWrong() {
  if (wrongIndexes.size === 0) return;
  questions = [...wrongIndexes].map(i => questions[i]);
  init();
}

document.addEventListener('keydown', e => {
  const key = e.key.toUpperCase();
  if (['A','B','C','D','E'].includes(key)) {
    document.querySelectorAll('.opt').forEach(o => { if (o.dataset.letter === key) o.click(); });
  }
  if ((e.key === 'ArrowRight' || e.key === 'Enter') && answers[current] !== undefined) nextQ();
  if (e.key === 'ArrowLeft') prevQ();
});

init();
</script>
