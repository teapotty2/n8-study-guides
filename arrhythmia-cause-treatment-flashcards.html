<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardiac Arrhythmia — Cause & Treatment Flashcards</title>
    <style>
        :root {
            --gotit: #4ade80;
            --unsure: #fbbf24;
            --missed: #f87171;
            --primary: #dc2626;
            --primary-hover: #b91c1c;
            --muted: #94a3b8;
            --card-bg: #1e293b;
            --border: #334155;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
        }

        .screen {
            display: none;
            padding: 2rem 1rem;
            max-width: 800px;
            margin: 0 auto;
        }

        .screen.active {
            display: block;
        }

        h1 {
            color: var(--primary);
            text-align: center;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            text-align: center;
            color: var(--muted);
            margin-bottom: 2rem;
        }

        #progress-summary {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            border: 1px solid var(--border);
        }

        #progress-summary h3 {
            color: var(--primary);
            margin-bottom: 0.75rem;
        }

        .overall-bar {
            height: 8px;
            background: #475569;
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            margin-bottom: 0.5rem;
        }

        .mb-gotit {
            height: 100%;
            background: var(--gotit);
        }

        .mb-unsure {
            height: 100%;
            background: var(--unsure);
        }

        .mb-missed {
            height: 100%;
            background: var(--missed);
        }

        .overall-text {
            font-size: 0.85rem;
            color: var(--muted);
            text-align: center;
        }

        .cat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .cat-btn {
            background: var(--card-bg);
            border: 2px solid var(--border);
            border-radius: 10px;
            padding: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            position: relative;
        }

        .cat-btn:hover {
            border-color: var(--cat-color, var(--primary));
            transform: translateY(-2px);
        }

        .cat-btn.selected {
            border-color: var(--cat-color, var(--primary));
            background: rgba(220, 38, 38, 0.1);
        }

        .cat-name {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .cat-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .cat-count {
            font-size: 0.8rem;
            color: var(--muted);
        }

        .cat-mastery {
            margin-top: 0.5rem;
        }

        .cat-mastery-bar {
            height: 4px;
            background: #475569;
            border-radius: 2px;
            overflow: hidden;
            display: flex;
        }

        .cat-mastery-text {
            font-size: 0.75rem;
            color: var(--muted);
            margin-top: 0.25rem;
        }

        .due-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: var(--primary);
            color: white;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 0.15rem 0.4rem;
            border-radius: 10px;
            min-width: 20px;
            text-align: center;
        }

        .options-row {
            display: flex;
            gap: 2rem;
            justify-content: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .toggle-label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            font-size: 0.9rem;
            color: var(--muted);
        }

        .start-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }

        .btn-primary:disabled,
        .btn-weak:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-secondary:hover {
            background: rgba(220, 38, 38, 0.1);
        }

        .btn-due {
            background: #6366f1;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-due:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-weak {
            background: #ef4444;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-weak:hover {
            background: #ef4444;
        }

        .btn-reset {
            background: transparent;
            color: var(--muted);
            border: 1px solid var(--border);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .btn-reset:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .sr-badge {
            font-size: 0.7rem;
            padding: 0.1rem 0.4rem;
            border-radius: 4px;
            font-weight: 600;
            margin-left: 0.5rem;
        }

        .sr-box1 {
            background: var(--missed);
            color: white;
        }

        .sr-box2 {
            background: #fb923c;
            color: white;
        }

        .sr-box3 {
            background: var(--unsure);
            color: #0f172a;
        }

        .sr-box4 {
            background: #a3e635;
            color: #0f172a;
        }

        .sr-box5 {
            background: var(--gotit);
            color: #0f172a;
        }

        .card-screen {
            max-width: 700px;
            margin: 0 auto;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .progress-section {
            flex: 1;
        }

        .progress-text {
            font-size: 0.9rem;
            margin-bottom: 0.25rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .requeue-badge {
            background: #6366f1;
            color: white;
            font-size: 0.7rem;
            padding: 0.15rem 0.4rem;
            border-radius: 4px;
            font-weight: 600;
        }

        .progress-bar {
            height: 8px;
            background: #475569;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary);
            transition: width 0.3s ease;
        }

        .cat-badge {
            background: var(--card-bg);
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            font-size: 0.85rem;
            border: 1px solid var(--border);
            white-space: nowrap;
        }

        .flashcard {
            perspective: 1200px;
            cursor: pointer;
            margin-bottom: 1.5rem;
            min-height: 350px;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            min-height: 350px;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }

        .flashcard.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            min-height: 350px;
            backface-visibility: hidden;
            background: var(--card-bg);
            border-radius: 16px;
            border: 2px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 2rem;
        }

        .card-back {
            transform: rotateY(180deg);
        }

        .card-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            font-size: 1.25rem;
            text-align: center;
        }

        .card-front .card-content {
            font-size: 1.35rem;
        }

        .flip-hint {
            text-align: center;
            color: var(--muted);
            font-size: 0.85rem;
            margin-top: auto;
        }

        .answer-text {
            font-size: 1.2rem;
            margin-bottom: 1rem;
        }

        .exam-tip {
            background: rgba(220, 38, 38, 0.1);
            border-left: 3px solid var(--primary);
            padding: 0.75rem 1rem;
            margin-top: 1rem;
            font-size: 0.95rem;
            text-align: left;
            border-radius: 0 8px 8px 0;
        }

        .typed-answer-display {
            background: rgba(99, 102, 241, 0.15);
            border-left: 3px solid #818cf8;
            padding: 0.75rem 1rem;
            margin-top: 0.75rem;
            font-size: 0.9rem;
            text-align: left;
            border-radius: 0 8px 8px 0;
            color: #c7d2fe;
        }

        .answer-input-wrap {
            margin-top: 1rem;
            display: flex;
            gap: 0.5rem;
        }

        .answer-input-wrap input {
            flex: 1;
            padding: 0.75rem;
            border-radius: 8px;
            border: 2px solid var(--border);
            background: #0f172a;
            color: #e2e8f0;
            font-size: 1rem;
        }

        .answer-input-wrap input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .answer-input-wrap button {
            padding: 0.75rem 1.25rem;
            border-radius: 8px;
            border: none;
            background: var(--primary);
            color: white;
            font-weight: 600;
            cursor: pointer;
        }

        .conf-controls {
            display: none;
            gap: 1rem;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        .conf-controls.visible {
            display: flex;
        }

        .conf-btn {
            flex: 1;
            max-width: 150px;
            padding: 1rem;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.25rem;
        }

        .conf-btn:hover {
            transform: translateY(-3px);
        }

        .conf-missed {
            background: var(--missed);
            color: white;
        }

        .conf-unsure {
            background: var(--unsure);
            color: #0f172a;
        }

        .conf-gotit {
            background: var(--gotit);
            color: #0f172a;
        }

        .conf-icon {
            font-size: 1.5rem;
        }

        .conf-label {
            font-weight: 600;
        }

        .conf-key {
            font-size: 0.75rem;
            opacity: 0.8;
        }

        .nav-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .kb-hints {
            color: var(--muted);
            font-size: 0.85rem;
        }

        .kb-hints kbd {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            margin: 0 0.25rem;
        }

        .results-container {
            max-width: 700px;
            margin: 0 auto;
            text-align: center;
        }

        .results-container h1 {
            color: var(--primary);
            margin-bottom: 2rem;
        }

        .stats-row {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .stat-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 1.5rem 2rem;
            min-width: 120px;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
        }

        .stat-label {
            font-size: 0.9rem;
            color: var(--muted);
        }

        .stat-pct {
            font-size: 1.1rem;
            margin-top: 0.25rem;
        }

        .stat-gotit .stat-value {
            color: var(--gotit);
        }

        .stat-unsure .stat-value {
            color: var(--unsure);
        }

        .stat-missed .stat-value {
            color: var(--missed);
        }

        .breakdown-section,
        .weak-section {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .breakdown-section h3,
        .weak-section h3 {
            color: var(--primary);
            margin-bottom: 1rem;
        }

        .cat-stat-row {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 0.75rem;
        }

        .cat-stat-name {
            flex: 0 0 150px;
            font-size: 0.9rem;
        }

        .cat-stat-bar {
            flex: 1;
            height: 8px;
            background: #475569;
            border-radius: 4px;
            overflow: hidden;
            display: flex;
        }

        .bar-seg {
            height: 100%;
        }

        .bar-gotit {
            background: var(--gotit);
        }

        .bar-unsure {
            background: var(--unsure);
        }

        .bar-missed {
            background: var(--missed);
        }

        .cat-stat-pct {
            flex: 0 0 50px;
            text-align: right;
            font-size: 0.9rem;
        }

        .weak-item {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
            border-bottom: 1px solid var(--border);
        }

        .weak-item:last-child {
            border-bottom: none;
        }

        .results-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        @media (max-width: 600px) {
            .card-content {
                font-size: 1.1rem;
            }

            .card-front .card-content {
                font-size: 1.2rem;
            }

            .conf-btn {
                padding: 0.75rem;
            }

            .cat-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <!-- START SCREEN -->
    <div id="screen-start" class="screen active">
        <div class="start-container">
            <h1>Cardiac Arrhythmias</h1>
            <p class="subtitle">Cause & Treatment flashcards across all arrhythmias from the cardiac lecture — sinus
                rhythms, atrial, junctional, ventricular & heart blocks</p>
            <div id="progress-summary"></div>
            <div class="cat-grid" id="cat-grid"></div>
            <div class="options-row">
                <label class="toggle-label"><input type="checkbox" id="chk-shuffle" checked> Shuffle cards</label>
                <label class="toggle-label"><input type="checkbox" id="chk-multi"> Multi-select categories</label>
                <label class="toggle-label"><input type="checkbox" id="chk-answer-first"> Type answer first</label>
            </div>
            <div class="start-actions">
                <button class="btn-due" id="btn-due" onclick="studyDue()">Due for Review (0)</button>
                <button class="btn-weak" id="btn-weak" onclick="studyWeak()">Study Weak Cards (0)</button>
                <button class="btn-primary" onclick="startAll()">Study All Cards</button>
                <button class="btn-reset" onclick="resetProgress()">Reset All Progress</button>
            </div>
        </div>
    </div>

    <!-- CARD SCREEN -->
    <div id="screen-card" class="screen">
        <div class="card-screen">
            <div class="card-header">
                <div class="progress-section">
                    <div class="progress-text">
                        <span id="cur-num">1</span> / <span id="tot-num">0</span>
                        <span class="requeue-badge" id="requeue-info" style="display:none;"></span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="prog-fill" style="width:0%"></div>
                    </div>
                </div>
                <span class="cat-badge" id="cur-cat">Category</span>
            </div>
            <div class="flashcard" id="flashcard" onclick="handleFlashcardClick(event)">
                <div class="card-inner">
                    <div class="card-face card-front">
                        <div class="card-content" id="front-content"></div>
                        <div id="answer-input-area"></div>
                        <div class="flip-hint" id="flip-hint">SPACE or click to flip</div>
                    </div>
                    <div class="card-face card-back">
                        <div class="card-content" id="back-content"></div>
                    </div>
                </div>
            </div>
            <div class="conf-controls" id="conf-controls">
                <button class="conf-btn conf-missed" onclick="rate('missed')"><span
                        class="conf-icon">&#10007;</span><span class="conf-label">Missed</span><span
                        class="conf-key">Press 1</span></button>
                <button class="conf-btn conf-unsure" onclick="rate('unsure')"><span class="conf-icon">~</span><span
                        class="conf-label">Unsure</span><span class="conf-key">Press 2</span></button>
                <button class="conf-btn conf-gotit" onclick="rate('gotit')"><span class="conf-icon">&#10003;</span><span
                        class="conf-label">Got It</span><span class="conf-key">Press 3</span></button>
            </div>
            <div class="nav-row">
                <button class="btn-secondary" onclick="exitSession()">Exit Session</button>
                <div class="kb-hints"><kbd>Space</kbd> Flip <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> Rate <kbd>Esc</kbd>
                    Exit</div>
            </div>
        </div>
    </div>

    <!-- RESULTS SCREEN -->
    <div id="screen-results" class="screen">
        <div class="results-container">
            <h1>Session Complete</h1>
            <div class="stats-row" id="stats-row"></div>
            <div class="breakdown-section" id="breakdown-section">
                <h3>By Category</h3>
                <div id="cat-breakdown"></div>
            </div>
            <div class="weak-section" id="weak-section" style="display:none;">
                <h3>Focus Areas</h3>
                <div id="weak-list"></div>
            </div>
            <div class="results-actions">
                <button class="btn-primary" id="btn-review-missed" onclick="reviewMissed()">Review Missed Cards</button>
                <button class="btn-secondary" onclick="reviewMissedAndUnsure()">Review Missed + Unsure</button>
                <button class="btn-secondary" onclick="showScreen('start')">New Session</button>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'arrhythmia-ct-fc-v1';
        const SR_KEY = 'arrhythmia-ct-sr-v1';

        const categories = {
            'sinus': { name: 'Sinus Rhythms', color: '#10b981' },
            'atrial': { name: 'Atrial Arrhythmias', color: '#f97316' },
            'junctional': { name: 'Junctional Rhythms', color: '#14b8a6' },
            'ventricular': { name: 'Ventricular Arrhythmias', color: '#ef4444' },
            'blocks': { name: 'Heart Blocks', color: '#6366f1' }
        };

        const cards = [
            // ===== SINUS RHYTHMS =====
            {
                id: 1, cat: 'sinus', q: 'What are the <strong>causes</strong> of Sinus Bradycardia?',
                a: '<strong>Sleep, athletic training, hypothyroidism, vagal stimulation, suctioning, severe pain, increased ICP.</strong><br><br><strong>Medications:</strong> Beta blockers, calcium channel blockers, antiarrhythmics.<br><br><strong>Sick Sinus Syndrome</strong> (SA node dysfunction).',
                tip: 'From Slide 48: Risks include increased BMI, right and left bundle branch block, increased age, and HTN.'
            },
            {
                id: 2, cat: 'sinus', q: 'What is the <strong>treatment</strong> for Sinus Bradycardia?',
                a: '<strong>Treat only if symptomatic</strong> (hypotension, AMS, shock, ischemic chest discomfort).<br><br>1. <strong>Atropine 0.5 mg IV</strong> q3–5 min (max 3 mg)<br>2. If persistent: <strong>transcutaneous pacing</strong><br>3. Catecholamines: <strong>dopamine or epinephrine</strong> drip',
                tip: 'From Slide 48: Atropine blocks vagal (parasympathetic) tone, allowing the SA node to fire faster. Athletes may have resting HR in the 40s — treat the patient, not the number.'
            },
            {
                id: 3, cat: 'sinus', q: 'What are the <strong>causes</strong> of Sinus Tachycardia?',
                a: '<strong>Physiologic or psychological stress, acute blood loss, shock, hyper/hypovolemia, HF, fever, pain, exercise.</strong><br><br><strong>Substances:</strong> Caffeine, nicotine, amphetamines, cocaine.<br><br><strong>Other:</strong> Anxiety, medications.',
                tip: 'From Slide 49: Sinus tachycardia is a SYMPTOM, not the primary problem. Always look for the underlying cause before treating the rate.'
            },
            {
                id: 4, cat: 'sinus', q: 'What is the <strong>treatment</strong> for Sinus Tachycardia?',
                a: '<strong>Identify and treat the underlying cause</strong> — this is the priority.<br><br>1. <strong>Vagal maneuvers</strong> (gagging, bearing down, coughing, cold stimulus)<br>2. <strong>Adenosine</strong> if SVT suspected<br>3. <strong>Beta blockers / CCBs</strong> if hemodynamically stable<br>4. <strong>Synchronized cardioversion</strong> if unstable',
                tip: 'From Slide 49: Never treat sinus tach with antiarrhythmics without addressing the cause — giving a beta blocker to someone who is bleeding can be fatal.'
            },

            // ===== ATRIAL ARRHYTHMIAS =====
            {
                id: 5, cat: 'atrial', q: 'What are the <strong>causes</strong> of PACs (Premature Atrial Complexes)?',
                a: '<strong>Caffeine, alcohol, nicotine, anxiety, hypokalemia.</strong><br><br>Often seen with tachycardia.',
                tip: 'From Slide 51: Patient may say "my heart skipped a beat." More than 6 PACs/min may indicate worsening state or onset of A-fib.'
            },
            {
                id: 6, cat: 'atrial', q: 'What is the <strong>treatment</strong> for PACs?',
                a: 'If <strong>infrequent → no treatment</strong> necessary.<br><br>If <strong>>6/min → may herald onset of atrial fibrillation;</strong> treat underlying cause (reduce caffeine, correct hypokalemia).',
                tip: 'From Slide 51: Monitor closely if frequent — PACs can be the early warning sign of A-fib.'
            },
            {
                id: 7, cat: 'atrial', q: 'What are the <strong>causes</strong> of Atrial Flutter?',
                a: '<strong>Conduction defect in the atrium.</strong><br><br>Associated with: <strong>CAD, heart failure, valvular disease, pulmonary embolism, post-cardiac surgery.</strong>',
                tip: 'From Slides 58-59: The re-entry circuit in flutter is usually in the right atrium. If all impulses were conducted, the ventricular rate would be 250-400 = V-fib.'
            },
            {
                id: 8, cat: 'atrial', q: 'What is the <strong>treatment</strong> for Atrial Flutter?',
                a: '1. <strong>Vagal maneuvers</strong><br>2. <strong>Adenosine</strong> (short half-life 6-10 sec) — rapid IV push with arm elevated + 20 mL NS flush<br>3. <strong>Rate and rhythm control</strong> (beta blockers, CCBs)<br>4. <strong>Antithrombotic therapy</strong><br>5. <strong>Cardioversion</strong> (very effective for flutter)',

        // ===================== STATE =====================

        }

        function saveSessionResults() { Object.entries(state.results).forEach(([id, r]) => { savedProgress[id] = r; updateSR(parseInt(id), r); }); saveProgress(); }
        function resetProgress() { if (confirm('Reset all progress? This cannot be undone.')) { savedProgress = {}; srData = {}; saveProgress(); saveSR(); renderStartScreen(); } }

        // ===================== SCREENS =====================
        function showScreen(n) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); document.getElementById('screen-' + n).classList.add('active'); if (n === 'start') renderStartScreen(); }
        function renderStartScreen() {

            const pd = document.getElementById('progress-summary');

                const cc = cards.filter(c => c.cat === catId), ct = cc.length; let cg = 0, cu = 0, cm = 0;

        function toggleCategory(catId, btn) { if (document.getElementById('chk-multi').checked) { if (selectedCats.has(catId)) { selectedCats.delete(catId); btn.classList.remove('selected'); } else { selectedCats.add(catId); btn.classList.add('selected'); } } else startSession([catId]); }

        // ===================== SESSION =====================
        function startSession(catIds) { loadProgress(); let sc = cards.filter(c => catIds.includes(c.cat)); if (document.getElementById('chk-shuffle').checked) sc = shuffleArray([...sc]); state = { deck: sc.map(c => c.id), idx: 0, flipped: false, results: {}, overflow: [], totalOriginal: sc.length }; if (!state.deck.length) { alert('No cards in selected categories.'); return; } showScreen('card'); displayCard(); }

            state.flipped = false; document.getElementById('flashcard').classList.remove('flipped'); document.getElementById('conf-controls').classList.remove('visible');
        }
        function handleFlashcardClick(e) { if (e.target.closest('.answer-input-wrap')) return; flipCard(); }
        function flipCard() {
            if (!state.flipped) { const af = document.getElementById('chk-answer-first').checked; if (af) { const ui = document.getElementById('user-answer'); const t = ui ? ui.value.trim() : ''; if (t) { const bc = document.getElementById('back-content'); if (!bc.querySelector('.typed-answer-display')) { const d = document.createElement('div'); d.className = 'typed-answer-display'; d.innerHTML = `<strong>Your answer:</strong> ${t.replace(/</g, '&lt;').replace(/>/g, '&gt;')}`; bc.insertBefore(d, bc.firstChild); } } } }

        }
        function rate(conf) {
            if (!state.flipped) return; const cardId = state.deck[state.idx]; state.results[cardId] = conf;
            if (conf === 'missed') { const o = 5 + Math.floor(Math.random() * 3), i = state.idx + o; if (i < state.deck.length) state.deck.splice(i, 0, cardId); else state.overflow.push(cardId); }
            else if (conf === 'unsure') { const o = 8 + Math.floor(Math.random() * 3), i = state.idx + o; if (i < state.deck.length) state.deck.splice(i, 0, cardId); else state.overflow.push(cardId); }

        }

        // ===================== RESULTS =====================
        function showResults() {
            showScreen('results'); let g = 0, u = 0, m = 0; const cs = {};
            Object.entries(state.results).forEach(([id, r]) => { const c = cards.find(x => x.id === parseInt(id)); if (!cs[c.cat]) cs[c.cat] = { gotit: 0, unsure: 0, missed: 0 }; if (r === 'gotit') { g++; cs[c.cat].gotit++; } else if (r === 'unsure') { u++; cs[c.cat].unsure++; } else { m++; cs[c.cat].missed++; } });
            const t = g + u + m;
            document.getElementById('stats-row').innerHTML = `<div class="stat-card stat-gotit"><div class="stat-value">${g}</div><div class="stat-label">Got It</div><div class="stat-pct">${t > 0 ? (g / t * 100).toFixed(0) : 0}%</div></div><div class="stat-card stat-unsure"><div class="stat-value">${u}</div><div class="stat-label">Unsure</div><div class="stat-pct">${t > 0 ? (u / t * 100).toFixed(0) : 0}%</div></div><div class="stat-card stat-missed"><div class="stat-value">${m}</div><div class="stat-label">Missed</div><div class="stat-pct">${t > 0 ? (m / t * 100).toFixed(0) : 0}%</div></div>`;
            let bh = ''; const wa = [];
            Object.entries(cs).forEach(([catId, s]) => { const cat = categories[catId], ct = s.gotit + s.unsure + s.missed, gp = s.gotit / ct * 100, up = s.unsure / ct * 100, mp = s.missed / ct * 100; if (gp < 60) wa.push({ name: cat.name, pct: gp.toFixed(0) }); bh += `<div class="cat-stat-row"><div class="cat-stat-name">${cat.name}</div><div class="cat-stat-bar"><div class="bar-seg bar-gotit" style="width:${gp}%"></div><div class="bar-seg bar-unsure" style="width:${up}%"></div><div class="bar-seg bar-missed" style="width:${mp}%"></div></div><div class="cat-stat-pct">${gp.toFixed(0)}%</div></div>`; });
            document.getElementById('cat-breakdown').innerHTML = bh;
            const ws = document.getElementById('weak-section'); if (wa.length > 0) { document.getElementById('weak-list').innerHTML = wa.map(w => `<div class="weak-item"><span>${w.name}</span><span>${w.pct}% mastery</span></div>`).join(''); ws.style.display = 'block'; } else ws.style.display = 'none';
            document.getElementById('btn-review-missed').disabled = m === 0;
        }
        function reviewMissed() { const mi = Object.entries(state.results).filter(([_, r]) => r === 'missed').map(([id]) => parseInt(id)); if (!mi.length) return; const mc = cards.filter(c => mi.includes(c.id)); state = { deck: mc.map(c => c.id), idx: 0, flipped: false, results: {}, overflow: [], totalOriginal: mc.length }; showScreen('card'); displayCard(); }
        function reviewMissedAndUnsure() { const ri = Object.entries(state.results).filter(([_, r]) => r === 'missed' || r === 'unsure').map(([id]) => parseInt(id)); if (!ri.length) return; const rc = cards.filter(c => ri.includes(c.id)); state = { deck: shuffleArray(rc.map(c => c.id)), idx: 0, flipped: false, results: {}, overflow: [], totalOriginal: rc.length }; showScreen('card'); displayCard(); }

        // ===================== UTILITIES =====================
        function shuffleArray(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[a[i], a[j]] = [a[j], a[i]]; } return a; }

        // ===================== KEYBOARD =====================
        document.addEventListener('keydown', (e) => {
            const cs = document.getElementById('screen-card'), rs = document.getElementById('screen-results');
            if (cs.classList.contains('active')) { if (e.target.tagName === 'INPUT') { if (e.key === 'Enter') { e.preventDefault(); flipCard(); } return; } if (e.key === ' ' || e.key === 'Spacebar') { e.preventDefault(); flipCard(); } else if (e.key === '1') rate('missed'); else if (e.key === '2') rate('unsure'); else if (e.key === '3') rate('gotit'); else if (e.key === 'Escape') exitSession(); }
            else if (rs.classList.contains('active')) { if (e.key === 'Escape' || e.key === 'Enter') showScreen('start'); }
        });

        // ===================== INIT =====================
        loadProgress(); loadSR(); renderStartScreen();
    </script>
</body>
