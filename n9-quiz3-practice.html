<style>
  :root {
    --bg:#0f1117;--card:#1a1d27;--border:#2a2d3a;

    --selected:#3a3560;--warn:#f0a500;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;}
  header{background:var(--card);border-bottom:1px solid var(--border);padding:20px 32px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;}

  .stats{display:flex;gap:16px;}
  .stat{text-align:center;}
  .stat-val{font-size:1.4rem;font-weight:700;color:var(--accent2);}
  .stat-label{font-size:0.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;}
  .controls{padding:16px 32px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--card);border-bottom:1px solid var(--border);}
  .btn{padding:8px 18px;border-radius:8px;border:none;cursor:pointer;font-size:0.85rem;font-weight:600;transition:all 0.15s;}
  .btn-primary{background:var(--accent);color:white;}
  .btn-primary:hover{filter:brightness(1.15);}
  .btn-secondary{background:var(--tag);color:var(--text);border:1px solid var(--border);}
  .btn-secondary:hover{border-color:var(--accent);color:var(--accent);}
  .btn-sm{padding:5px 12px;font-size:0.78rem;}
  .btn-check{background:var(--warn);color:#000;font-weight:700;padding:10px 24px;border-radius:8px;border:none;cursor:pointer;font-size:0.9rem;margin-top:14px;display:none;width:100%;}
  .btn-check:hover{filter:brightness(1.1);}
  select{background:var(--tag);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:7px 12px;font-size:0.85rem;cursor:pointer;}
  select:focus{outline:none;border-color:var(--accent);}
  .progress-bar{height:3px;background:var(--border);}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width 0.3s;}
  main{max-width:780px;margin:0 auto;padding:32px 20px;}
  .q-counter{font-size:0.78rem;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:0.5px;}
  .q-tags{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .q-chapter-tag{display:inline-block;background:var(--tag);color:var(--accent2);font-size:0.72rem;padding:3px 10px;border-radius:20px;border:1px solid var(--border);}
  .sata-tag{display:inline-block;background:rgba(240,165,0,0.15);color:var(--warn);font-size:0.72rem;padding:3px 10px;border-radius:20px;border:1px solid rgba(240,165,0,0.3);font-weight:700;}
  .question-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:28px;margin-bottom:20px;}
  .question-text{font-size:1.05rem;line-height:1.65;margin-bottom:22px;white-space:pre-wrap;}
  .options{display:flex;flex-direction:column;gap:10px;}
  .opt{padding:13px 18px;border-radius:10px;border:1.5px solid var(--border);cursor:pointer;font-size:0.9rem;line-height:1.5;transition:all 0.15s;}
  .opt:hover:not(.locked){border-color:var(--accent);background:rgba(124,106,247,0.08);}
  .opt.selected{border-color:var(--accent);background:var(--selected);}
  .opt.correct{border-color:var(--correct);background:rgba(76,175,136,0.12);}
  .opt.wrong{border-color:var(--wrong);background:rgba(224,92,92,0.1);}
  .opt.missed{border-color:var(--warn);background:rgba(240,165,0,0.08);}
  .opt.locked{cursor:default;}
  .feedback-box{margin-top:18px;padding:16px 18px;background:rgba(79,195,247,0.06);border:1px solid rgba(79,195,247,0.2);border-radius:10px;font-size:0.88rem;line-height:1.65;display:none;}
  .feedback-label{font-weight:700;color:var(--accent2);margin-bottom:6px;font-size:0.78rem;text-transform:uppercase;letter-spacing:0.5px;}
  .nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:20px;}
  .result-badge{display:none;align-items:center;gap:8px;padding:8px 16px;border-radius:8px;font-weight:700;font-size:0.9rem;}
  .result-badge.correct-badge{background:rgba(76,175,136,0.15);color:var(--correct);border:1px solid rgba(76,175,136,0.3);}
  .result-badge.wrong-badge{background:rgba(224,92,92,0.1);color:var(--wrong);border:1px solid rgba(224,92,92,0.2);}
  .summary{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:36px;text-align:center;display:none;}
  .summary h2{font-size:1.6rem;margin-bottom:8px;}
  .score-big{font-size:3.5rem;font-weight:800;color:var(--accent);line-height:1;margin:20px 0 8px;}
  .score-pct{font-size:1.2rem;color:var(--accent2);margin-bottom:24px;}
  .score-breakdown{display:flex;justify-content:center;gap:32px;margin:20px 0 28px;}
  .score-item{text-align:center;}
  .score-item-val{font-size:1.8rem;font-weight:700;}
  .score-item-label{font-size:0.75rem;color:var(--muted);margin-top:2px;}
  .grade-msg{font-size:1rem;color:var(--muted);margin-bottom:28px;padding:14px 20px;background:var(--tag);border-radius:10px;}
  .legend{font-size:0.75rem;color:var(--muted);margin-top:10px;display:none;}
  .legend span{margin-right:12px;}
</style>

<script>
const ALL_QUESTIONS = [{"ch": "Ch 7: Organizational Planning", "q": "A nurse is considering applying for employment at a new health care facility. How should the nurse best identify the aims and priorities of the organization?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Review the organization's mission statement.</div><div class=\"opt\" data-letter=\"B\">B) Speak with as many front -line workers as possible.</div><div class=\"opt\" data-letter=\"C\">C) Ask interviewers about recent responses to consumer satisfaction surveys.</div><div class=\"opt\" data-letter=\"D\">D) Review the organization's policy and procedures documents.</div>", "ans": "A", "sata": false, "fb": "The purpose or mission statement is a brief statement identifying the reason that an organization exists. The mission statement identifies the organization's position regarding ethics, principles, and standards of practice. The nurse should be able to infer the organization's aims and priorities from this statement. Consumer feedback will not necessarily reveal the organization's aims and priorities. Similarly, workers are often unable to identify these priorities. Policies and procedures identify the preferred ways of completing tasks but not the organization's aims and priorities."}, {"ch": "Ch 7: Organizational Planning", "q": "A nurse is participating in a planning process in a large health care organization. The nurse and the other members of the team should:", "opts": "<div class=\"opt\" data-letter=\"A\">A) avoid specifics so that the plan can be applied in any health care setting.</div><div class=\"opt\" data-letter=\"B\">B) ensure that long -term priorities are always prioritized over short -term priorities.</div><div class=\"opt\" data-letter=\"C\">C) ensure that evaluation occurs at several points during the process.</div><div class=\"opt\" data-letter=\"D\">D) begin to engage employees in the process after the plan has been implemented.</div>", "ans": "C", "sata": false, "fb": "Planning can be short term or long term but should always include built -in evaluation checkpoints so there can be a midcourse correction if unexpected events occur. Excessive generalization (vagueness) can make a plan difficult to implement because of the lack of specifics. Employee engagement should occur early in the process. Short - and long-term interests must be balanced; long -term priorities do not always supersede short -term priorities."}, {"ch": "Ch 7: Organizational Planning", "q": "Which is a true statement about planning?", "opts": "<div class=\"opt\" data-letter=\"A\">A) All plans should be defined well so that changes are not necessary.</div><div class=\"opt\" data-letter=\"B\">B) Long- and short-range plans should be kept separate so priorities do not become confused.</div><div class=\"opt\" data-letter=\"C\">C) Objectives and goals must be established before the philosophy is written.</div><div class=\"opt\" data-letter=\"D\">D) All plans should be flexible to accommodate changing circumstances.</div>", "ans": "D", "sata": false, "fb": "Every plan should be flexible because unexpected events are inevitable. It is impossible to identify every aspect of the plan at the outset because circumstances are always changing. Short - and long -range plans should be complementary and integrated, not separate. The philosophy should form the foundation of objectives and goals."}, {"ch": "Ch 7: Organizational Planning", "q": "A nurse is participating in the process of values clarification. What are the characteristics of a true value? Select all that apply.", "opts": "<div class=\"opt\" data-letter=\"A\">A) It is freely chosen from among alternatives.</div><div class=\"opt\" data-letter=\"B\">B) It aligns with the dominant values of society.</div><div class=\"opt\" data-letter=\"C\">C) It is prized and cherished.</div><div class=\"opt\" data-letter=\"D\">D) It is positively affirmed.</div><div class=\"opt\" data-letter=\"E\">E) It is acted upon.</div>", "ans": ["A", "C", "D", "E"], "sata": true, "fb": "McNally identified the fact that a value is prized and cherished, positively affirmed and acted on, and chosen freely from among alternatives. It is possible for a value to be true while not aligning with the dominant values of the society."}, {"ch": "Ch 7: Organizational Planning", "q": "Which statement is an example of a process objective?", "opts": "<div class=\"opt\" data-letter=\"A\">A) \"Every nurse will screen newly admitted clients for alcohol abuse.\"</div><div class=\"opt\" data-letter=\"B\">B) \"The falls rate on the unit will decrease by 50% compared with 2016 rates.\"</div><div class=\"opt\" data-letter=\"C\">C) \"The health care facility will achieve accreditation within the next 24 months.\"</div><div class=\"opt\" data-letter=\"D\">D) \"The new bowel care protocol will be fully implemented by the end of the calendar year.\"</div>", "ans": "A", "sata": false, "fb": "Objectives can focus on either the desired process or the desired result. Process objectives are written in terms of the method to be used, whereas result -focused objectives specify the desired outcome. The statement \"Every nurse will screen newly admitted clients for alcohol abuse\" states how (i.e., the process) each client will be screened. Each of the other listed statements focuses on results or outcomes."}, {"ch": "Ch 7: Organizational Planning", "q": "A leader has launched an organizational planning process that requires the development of new policies. How should the leader utilize subordinates during this process?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Delegate the evaluation phase of organizational planning to subordinates.</div><div class=\"opt\" data-letter=\"B\">B) Ask subordinates to brainstorm alternatives and then have industry experts evaluate each alternative.</div><div class=\"opt\" data-letter=\"C\">C) Limit the involvement of subordinates to developing unit -level policies and procedures.</div><div class=\"opt\" data-letter=\"D\">D) Include subordinates early in the process and include them in all aspects of policy formation.</div>", "ans": "D", "sata": false, "fb": "The leader should encourage subordinates to be involved in policy formation, including developing, implementing, and reviewing unit philosophy, goals, objectives, policies, procedures, and rules. The leader should work alongside the subordinates, not just delegate to them. Subordinates should contribute to evaluation rather than this role limited to experts. The role of subordinates should not be limited to policies and procedures at a unit level."}, {"ch": "Ch 7: Organizational Planning", "q": "The manager is leading a team to develop a unit -level philosophy statement. What guideline should the team use during this process?", "opts": "<div class=\"opt\" data-letter=\"A\">A) The unit's philosophy should align with the larger organization's philosophy.</div><div class=\"opt\" data-letter=\"B\">B) The unit's philosophy should include a mission statement and a vision statement.</div><div class=\"opt\" data-letter=\"C\">C) The statement should reflect the values and priorities of the specific unit manager.</div><div class=\"opt\" data-letter=\"D\">D) The statement should be consistent with that of other similar health care agencies.</div>", "ans": "A", "sata": false, "fb": "The unit's philosophy will be congruent with the organizational philosophy. Vision and mission are distinct from philosophy statements. The statement should transcend any one particular manager and does not necessarily have to align with other organizations."}, {"ch": "Ch 7: Organizational Planning", "q": "A new nurse on the unit has been criticized for deviating from the accepted model of end-of-shift report, even though there is no written policy about the content or format for report. Which term is used for this type of policy?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Implied policies</div><div class=\"opt\" data-letter=\"B\">B) Expressed policies</div><div class=\"opt\" data-letter=\"C\">C) Understood precedents</div><div class=\"opt\" data-letter=\"D\">D) The organizational culture</div>", "ans": "A", "sata": false, "fb": "Implied policies are neither written nor stated verbally and have developed over time. The other options fail to meet this description."}, {"ch": "Ch 7: Organizational Planning", "q": "A health care organization has adopted a new philosophy statement. What observation best shows that the philosophy is being implemented?", "opts": "<div class=\"opt\" data-letter=\"A\">A) The philosophy is displayed prominently in client -care areas and staff areas.</div><div class=\"opt\" data-letter=\"B\">B) The philosophy aligns with the organization's vision and mission.</div><div class=\"opt\" data-letter=\"C\">C) The philosophy is reflected in the care that clients and families receive.</div><div class=\"opt\" data-letter=\"D\">D) The philosophy was created by an interdisciplinary group that included nurses.</div>", "ans": "C", "sata": false, "fb": "A philosophy is being implemented if it is evident in the care that clients and families receive. Displaying the philosophy prominently, aligning it with vision and mission, and collaboratively creating the philosophy do not guarantee that the philosophy is actually being implemented."}, {"ch": "Ch 7: Organizational Planning", "q": "A recent nursing graduate has not performed a dressing change on a central catheter for several months and is unsure of how to correctly perform this. Which action should the nurse take?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Review previous documentation</div><div class=\"opt\" data-letter=\"B\">B) Evaluate the practice rules</div><div class=\"opt\" data-letter=\"C\">C) Assess the organization policy</div><div class=\"opt\" data-letter=\"D\">D) Explore the procedure manual</div>", "ans": "D", "sata": false, "fb": "Procedures delineate a series of specific steps of a required action, such as performing a specific type of dressing change. Policies are plans reduced to statements or instructions that direct organizations in their decision making, not specific nursing actions. Procedures are not synonymous with documentation of \"practice rules.\""}, {"ch": "Ch 7: Organizational Planning", "q": "A nurse -manager recognizes the role that individual values play on decision making. How should the manager best address this fact during a period of organizational planning?", "opts": "<div class=\"opt\" data-letter=\"A\">A) The manager should carefully reflect on his or her most important values.</div><div class=\"opt\" data-letter=\"B\">B) The manager should make every attempt to set aside his or her values when making decisions.</div><div class=\"opt\" data-letter=\"C\">C) The manager should seek individuals who have similar values when creating a decision -making team.</div><div class=\"opt\" data-letter=\"D\">D) The manager should seek individuals who claim to have flexible values when creating a decision -making team.</div>", "ans": "A", "sata": false, "fb": "All people should carefully examine their value system and recognize the role that it plays in how they make decisions and resolve conflicts and even how they perceive things. Therefore, the nurse -leader must be self -aware and provide subordinates with learning opportunities or experiences that foster increased self -awareness. In most cases, teams are not chosen on the basis of their personal values. It is unrealistic for a person to expect that he or she can set aside values or alter them when making decision."}, {"ch": "Ch 7: Organizational Planning", "q": "A nurse has been asked to join the health care organization's strategic planning committee. What actions should the committee perform in order to create an efficient and evidence -based planning process? Select all that apply.", "opts": "<div class=\"opt\" data-letter=\"A\">A) Enlist members with expertise in health care economics.</div><div class=\"opt\" data-letter=\"B\">B) Carefully consider political issues related to health care.</div><div class=\"opt\" data-letter=\"C\">C) Prioritize the role of intuition in the planning process.</div><div class=\"opt\" data-letter=\"D\">D) Identify and implement a planning theory.</div><div class=\"opt\" data-letter=\"E\">E) Include as many stakeholders as possible in the planning process.</div>", "ans": ["A", "B", "D", "E"], "sata": true, "fb": "Strategic planning requires managerial expertise in health care economics, human resource management, and political and legislative issues affecting health care, as well as planning theory. Stakeholders should be engaged in the process. Intuition is not assigned a high value in organizational planning processes and is not normally prioritized over other decision -making processes."}, {"ch": "Ch 7: Organizational Planning", "q": "Which statement best describes an emerging paradigm that is likely to influence strategic planning for health care in the 21st century?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Reduced emphasis on cost containment</div><div class=\"opt\" data-letter=\"B\">B) Reduced regulatory oversight of health care organizations</div><div class=\"opt\" data-letter=\"C\">C) A shift from interdependence of health care professionals to greater autonomy</div><div class=\"opt\" data-letter=\"D\">D) Continued increases in the cost of pharmaceuticals</div>", "ans": "D", "sata": false, "fb": "The rising cost of pharmaceuticals and ongoing drug shortages will continue to be a problem for U.S. hospitals for at least the next several years. Cost containment, regulatory oversight, and interdependence of health care providers are predicted to continue."}, {"ch": "Ch 7: Organizational Planning", "q": "Which element should influence the nurse executive most heavily when assessing the organization's philosophy of nursing services for possible revision?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Consumer surveys</div><div class=\"opt\" data-letter=\"B\">B) Input from other health disciplines</div><div class=\"opt\" data-letter=\"C\">C) The organization's mission statement</div><div class=\"opt\" data-letter=\"D\">D) Policy statements from accrediting bodies</div>", "ans": "C", "sata": false, "fb": "The philosophy flows from the mission statement, the highest priority in the planning hierarchy. Each of the other sources may be considered, but none should be as influential as the mission statement of the organization."}, {"ch": "Ch 7: Organizational Planning", "q": "A nurse -manager can implement the principles of preactive planning by:", "opts": "<div class=\"opt\" data-letter=\"A\">A) responding quickly to emergent problems.</div><div class=\"opt\" data-letter=\"B\">B) using new technologies to accelerate change.</div><div class=\"opt\" data-letter=\"C\">C) preferring the status quo as a stable environment.</div><div class=\"opt\" data-letter=\"D\">D) directing planning in response to a crisis.</div>", "ans": "B", "sata": false, "fb": "Preactive planners utilize technology to accelerate change and are future oriented. Unsatisfied with the past or present, preactivists do not value experience and believe that the future is always preferable to the present. Their focus is not necessarily crisis response."}, {"ch": "Ch 7: Organizational Planning", "q": "A manager has been experiencing challenges during a planning process and must implement strategies to overcome barriers that impede planning. What is the manager's best action?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Reevaluate whether the goals and objectives are appropriate and achievable.</div><div class=\"opt\" data-letter=\"B\">B) Establish a fixed goal that is unaffected by changes in the organization.</div><div class=\"opt\" data-letter=\"C\">C) Limit membership in the planning team to administrators, leaders, and executives.</div><div class=\"opt\" data-letter=\"D\">D) Make the goals of the plan more general so that they can be more easily achieved.</div>", "ans": "A", "sata": false, "fb": "The organization can be more effective if movement within it is directed at specified goals and objectives. Because a plan is a guide to reach a goal, it must be flexible and allow for readjustment as unexpected events occur. Reevaluation is often necessary to ensure that this happens. The manager should include in the planning process all people and units that could be affected by a plan, not just administrators and executives. A plan that is too global or unrealistic discourages rather than motivates employees because the attainment of the goals can never be clearly determined."}, {"ch": "Ch 7: Organizational Planning", "q": "A nurse -manager is creating an organizational plan. What characteristic of the plan is more likely to promote success?", "opts": "<div class=\"opt\" data-letter=\"A\">A) A midterm evaluation of the planning process</div><div class=\"opt\" data-letter=\"B\">B) Several predefined evaluation checkpoints</div><div class=\"opt\" data-letter=\"C\">C) The rejection of any earlier plans that did not succeed</div><div class=\"opt\" data-letter=\"D\">D) Overplanning to accommodate predicted lapses in the planning process</div>", "ans": "B", "sata": false, "fb": "Good plans have several built -in evaluation checkpoints so that there can be a midcourse correction if unexpected events occur. A single midterm evaluation is likely insufficient. If goals were not met, the plan should be examined to determine why it failed. However, this does not necessarily mean that similar plans cannot be reattempted. Overplanning can result in an excessive and inefficient commitment to minor details."}, {"ch": "Ch 7: Organizational Planning", "q": "At the unit level, what time frame may be considered long -range planning?", "opts": "<div class=\"opt\" data-letter=\"A\">A) 3 months</div><div class=\"opt\" data-letter=\"B\">B) 6 months</div><div class=\"opt\" data-letter=\"C\">C) 12 months</div><div class=\"opt\" data-letter=\"D\">D) 18 months</div>", "ans": ["B", "C", "D"], "sata": true, "fb": "At the unit level, any planning that is at least 6 months in the future may be considered long -range planning."}, {"ch": "Ch 7: Organizational Planning", "q": "A nurse -manager is on a team that is performing a SWOT analysis of the staffing system at a community clinic. What should the manager do when addressing the \"S\" component of the SWOT analysis?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Identify stakeholders in the current staffing system.</div><div class=\"opt\" data-letter=\"B\">B) Examine the factors indicating that a change in the staffing system is necessary.</div><div class=\"opt\" data-letter=\"C\">C) Identify any characteristics of the staffing system that currently help the clinic</div><div class=\"opt\" data-letter=\"D\">D) Strategize about ways by which the staffing system could possibly be improved.</div>", "ans": "C", "sata": false, "fb": "After identifying the issue, SWOT analysis begins with identifying strengths, which are the internal attributes that help an organization achieve its objectives. The \"S\" does not denote stakeholders or strategizing. It is important to identify the rationale for a change, but this is not a component of the SWOT model of analysis."}, {"ch": "Ch 7: Organizational Planning", "q": "One of the most commonly used tools in health care organizations is SWOT analysis. What is the definition of the \"O\" component of this model?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Internal attributes that help an organization achieve its objectives</div><div class=\"opt\" data-letter=\"B\">B) Internal attributes that challenge an organization in achieving its objectives</div><div class=\"opt\" data-letter=\"C\">C) External conditions that promote achievement of organizational objectives</div><div class=\"opt\" data-letter=\"D\">D) External conditions that challenge or threaten the achievement of organizational objectives</div>", "ans": "C", "sata": false, "fb": "Opportunities are external conditions that promote achievement of organizational objectives. Strengths are internal attributes that help an organization achieve its objectives. Weaknesses are internal attributes that challenge an organization in achieving its objectives. Threats are external conditions that challenge or threaten the achievement of organizational objectives."}, {"ch": "Ch 7: Organizational Planning", "q": "A nurse -manager is participating in organizational planning. Which factors should the team consider when identifying variables that may complicate the planning process? Select all that apply.", "opts": "<div class=\"opt\" data-letter=\"A\">A) Government regulations</div><div class=\"opt\" data-letter=\"B\">B) Rapidly changing technologies</div><div class=\"opt\" data-letter=\"C\">C) Decreased acknowledgement of the importance of planning</div><div class=\"opt\" data-letter=\"D\">D) Changing population demographics</div><div class=\"opt\" data-letter=\"E\">E) Public mistrust of the nursing profession</div>", "ans": ["A", "B", "D"], "sata": true, "fb": "Because of the rapidly changing technology, increasing government regulatory involvement in health care, changing population demographics, and reduced provider autonomy, health care organizations are finding it increasingly difficult to appropriately identify long -term needs and plan accordingly. Nurses are generally well trusted by the public, and there is acknowledgment that planning is important in health care organizations."}, {"ch": "Ch 7: Organizational Planning", "q": "An organization is considering a revision to its philosophy. What characteristic of the current philosophy would most clearly indicate a need for revision?", "opts": "<div class=\"opt\" data-letter=\"A\">A) The philosophy is more than 5 years old.</div><div class=\"opt\" data-letter=\"B\">B) Staff claim that the stated unit philosophy is in contrast to the care that is being given.</div><div class=\"opt\" data-letter=\"C\">C) The philosophy was appropriated from a different health care facility.</div><div class=\"opt\" data-letter=\"D\">D) The philosophy was created after the organization's vision and mission were determined.</div>", "ans": "B", "sata": false, "fb": "An organizational philosophy that is not or cannot be implemented is useless. An old philosophy is not necessarily obsolete, and it is possible to adopt a philosophy from another facility if it is appropriate in a different setting. It is acceptable for an organization's philosophy to flow from the vision and mission statements."}, {"ch": "Ch 7: Organizational Planning", "q": "Which statement regarding nursing policies and procedures is most important to their successful application in achieving goals?", "opts": "<div class=\"opt\" data-letter=\"A\">A) The policies and procedures are created by staff representatives.</div><div class=\"opt\" data-letter=\"B\">B) All policies and practices are based on current evidence related to practice.</div><div class=\"opt\" data-letter=\"C\">C) Policies and procedures are reviewed at fixed times, every 5 years.</div><div class=\"opt\" data-letter=\"D\">D) One hundred percent of the staff adheres to established policies and procedures 100% of the time.</div>", "ans": "B", "sata": false, "fb": "Policies and procedures should be evidence -based. It is unrealistic to expect 100% compliance, 100% of the time. A policy that is created by staff representatives but which is not evidence -based is not appropriate because it may be unsafe. Ongoing, cyclical review should be implemented."}, {"ch": "Ch 7: Organizational Planning", "q": "The nurse -manager is reviewing the rules that the previous manager had put into place. When reviewing these rules, what principles should guide the manager's decision to keep or change the rules? Select all that apply.", "opts": "<div class=\"opt\" data-letter=\"A\">A) Rules should be flexible.</div><div class=\"opt\" data-letter=\"B\">B) The number of rules should be kept to a minimum.</div><div class=\"opt\" data-letter=\"C\">C) Rules should be changed on a regular basis.</div><div class=\"opt\" data-letter=\"D\">D) Enforcement of the rules supports staff morale.</div><div class=\"opt\" data-letter=\"E\">E) Consistent rule enforcement supports organizational structure.</div>", "ans": ["A", "B", "D", "E"], "sata": true, "fb": "Rules are fairly inflexible, so the fewer the rules, the better. Existing rules, however, should be enforced to keep morale from breaking down and to allow organizational structure. It is neither reasonable nor necessary for all involved parties to agree with the rules but all must follow them. Rules require regular evaluation, but change may not be warranted."}, {"ch": "Ch 7: Organizational Planning", "q": "Which statements concerning the role of the leader -manager in organizational planning are true? Select all that apply.", "opts": "<div class=\"opt\" data-letter=\"A\">A) The leader -manager must be future oriented.</div><div class=\"opt\" data-letter=\"B\">B) The leader -manager has to be willing to take risks.</div><div class=\"opt\" data-letter=\"C\">C) The leader -manager should possess human resource management skills.</div><div class=\"opt\" data-letter=\"D\">D) The leader -manager must evaluate the social climate that affects the organization.</div><div class=\"opt\" data-letter=\"E\">E) The leader -manager must be the most experienced clinician in the organization.</div>", "ans": ["A", "B", "C", "D"], "sata": true, "fb": "Planning requires managerial expertise in health care economics, human resource management, political and legislative issues affecting health care, and planning theory. Planning also requires the leadership skills of being sensitive to the environment, being able to appraise accurately the social and political climate, and being willing to take risks. A leader -manager can give effective oversight without being the most experienced clinician on the unit."}, {"ch": "Ch 7: Organizational Planning", "q": "The manager of a clinic is considering a change in the scheduling of vacation time in which nurses would self -schedule their vacation rather than having the manager respond to their submitted requests. A nurse has pointed out that it is possible that newer nurses may feel intimidated by more experienced nurses on the unit when scheduling their vacation. This observation constitutes what component of a SWOT analysis?", "opts": "<div class=\"opt\" data-letter=\"A\">A) S</div><div class=\"opt\" data-letter=\"B\">B) W</div><div class=\"opt\" data-letter=\"C\">C) O</div><div class=\"opt\" data-letter=\"D\">D) T</div>", "ans": "B", "sata": false, "fb": "Weaknesses are those internal attributes that challenge an organization in achieving its objectives. In this case, possible intimidation within the culture of the unit would be considered an internal attribute that could complicate the proposed system. Threats are also potential confounding factors, but these are external, not internal, factors. Strengths and opportunities are positive attributes."}, {"ch": "Ch 7: Organizational Planning", "q": "A nurse -manager is on a strategic planning team that is applying the balanced scorecard while strategic planning. The team should specifically consider what variables when creating the scorecard? Select all that apply.", "opts": "<div class=\"opt\" data-letter=\"A\">A) Legislation that governs the organization's operations</div><div class=\"opt\" data-letter=\"B\">B) The health care organization's budget</div><div class=\"opt\" data-letter=\"C\">C) Goals identified by similar organizations</div><div class=\"opt\" data-letter=\"D\">D) The existing processes that are in place</div><div class=\"opt\" data-letter=\"E\">E) Opportunities for learning and growth</div><div class=\"opt\" data-letter=\"F\">F) Feedback that clients and families have provided</div>", "ans": ["B", "D", "E", "F"], "sata": true, "fb": "Strategic planners using a balanced scorecard develop metrics, collect data, and analyze that data from four organizational perspectives: financial, customers, internal business processes (or simply processes), and learning and growth. This particular model does not explicitly include other organizations' goals or legislation as major components of planning."}, {"ch": "Ch 7: Organizational Planning", "q": "A nurse -manager has been asked for the first time to join the health care facility's strategic planning committee. What action should the manager take first?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Approach potential mentors on the committee.</div><div class=\"opt\" data-letter=\"B\">B) Perform a SWOT analysis of the issues facing the committee.</div><div class=\"opt\" data-letter=\"C\">C) Identify and examine their own planning style.</div><div class=\"opt\" data-letter=\"D\">D) Review the committee's most recent balanced scorecard.</div>", "ans": "C", "sata": false, "fb": "Self -reflection is a necessary first step when a nurse is becoming involved in strategic planning. This should precede efforts such as finding mentors. Performing SWOT analysis and creating balanced scorecards constitute the work of the committee."}, {"ch": "Ch 7: Organizational Planning", "q": "A society that highly values social equity and equality is likely to support a health care system which:", "opts": "<div class=\"opt\" data-letter=\"A\">A) prioritizes the role of the free market in providing health care services.</div><div class=\"opt\" data-letter=\"B\">B) entitles all citizens to similar levels of health care services.</div><div class=\"opt\" data-letter=\"C\">C) relies on the private sector to organize and provide health care.</div><div class=\"opt\" data-letter=\"D\">D) is cost -effective and efficient.</div>", "ans": "B", "sata": false, "fb": "Values strongly influence the formation of health care policy. A society that values equality of access and social equity is likely to create a health care system in which each citizen has similar access to services. In many cases, the roles of the free market and the private sector are eclipsed by government, which provides or coordinates services accessible to all. This type of system may or may not be cost -effective, depending on numerous variables."}, {"ch": "Ch 7: Organizational Planning", "q": "A nurse -manager has identified the following objective for the care on the unit: \"At least 95% of new clients' health records will contain a completed assessment for intimate partner violence.\" How should the manager improve this objective?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Increase the objective to 100% of health records.</div><div class=\"opt\" data-letter=\"B\">B) Restate the objective in behavioral terms that focus on client outcomes.</div><div class=\"opt\" data-letter=\"C\">C) Focus on client actions rather than documentation.</div><div class=\"opt\" data-letter=\"D\">D) Include a time frame in the statement.</div>", "ans": "D", "sata": false, "fb": "For objectives to be measurable, they should have certain criteria. There should be a specific time frame in which the objectives are to be completed, and the objectives should be stated in behavioral terms, be objectively evaluated, and identify positive outcomes rather than negative outcomes. It is appropriate for an objective to include references to documentation and it may or may not be appropriate to expect 100% compliance, depending on many factors. The rationale is not normally included in an objective statement."}, {"ch": "Ch 12: Organizational Structure", "q": "After starting a new job, a nurse -manager has been surprised at the amount of grapevine communication that happens. The manager should recognize what characteristic of this type of communication?", "opts": "<div class=\"opt\" data-letter=\"A\">A) It is difficult to control or stop.</div><div class=\"opt\" data-letter=\"B\">B) It always involves verbal, face -to-face communication.</div><div class=\"opt\" data-letter=\"C\">C) It consists of negative and subversive messages.</div><div class=\"opt\" data-letter=\"D\">D) Strong organizations have policies that prohibit it.</div>", "ans": "A", "sata": false, "fb": "\"Grapevine\" communication is informal and is difficult to control or stop. Consequently, policies that aim to ban it are unrealistic. This type of communication can involve all types of content, not just negative messages. The spread of easy, instant electronic communication means that it is not always verbal."}, {"ch": "Ch 12: Organizational Structure", "q": "Max Weber, as part of the scientific management era, contributed immensely to the development of organizational theory. Which statements are representative of his beliefs? Select all that apply.", "opts": "<div class=\"opt\" data-letter=\"A\">A) Bureaucracy could provide a rational basis for administrative decisions.</div><div class=\"opt\" data-letter=\"B\">B) Worker satisfaction was integral to productivity.</div><div class=\"opt\" data-letter=\"C\">C) Organization charts could depict the hierarchy of authority.</div><div class=\"opt\" data-letter=\"D\">D) Impersonality of relationships should exist in organizations.</div><div class=\"opt\" data-letter=\"E\">E) Advancement and placement should be based on relationships.</div>", "ans": ["A", "C", "D"], "sata": true, "fb": "Weber emphasized the impersonality of work relationships, the ability of bureaucracy to provide rational decisions, and the role of organizational charts. Max Weber's theories did not address worker satisfaction. Weber advocated promotions based on competence, not relationships."}, {"ch": "Ch 12: Organizational Structure", "q": "A nurse has begun working in a new health care facility and is beginning to understand the organizational culture. When seeking to understand the organizational culture, the nurse should:", "opts": "<div class=\"opt\" data-letter=\"A\">A) carefully examine the demographic characteristics of the workforce.</div><div class=\"opt\" data-letter=\"B\">B) ask the middle - and upper -level managers about the potential for advancement.</div><div class=\"opt\" data-letter=\"C\">C) ask coworkers at various levels to interpret the organizational chart.</div><div class=\"opt\" data-letter=\"D\">D) try to perceive the dominant values, traditions, and beliefs in the organization.</div>", "ans": "D", "sata": false, "fb": "Organizational culture encompasses the symbols, beliefs, values, history, and communication patterns of an organization. It differs from organizational climate, which is how the employees perceive the organization. Employees may not be able to articulate the organizational culture due to their proximity to it. Culture does not determine the potential for advancement and is not solely a reflection of demographics."}, {"ch": "Ch 12: Organizational Structure", "q": "A clinical nurse specialist (CNS) is included on a hospital department's organizational chart. However, there are no solid lines leading to or from the nurse's position on the chart. What does this imply?", "opts": "<div class=\"opt\" data-letter=\"A\">A) The CNS lacks productive relationships with colleagues.</div><div class=\"opt\" data-letter=\"B\">B) Any member of staff may exercise authority over the CNS.</div><div class=\"opt\" data-letter=\"C\">C) The CNS is not accountable for his or her practice.</div><div class=\"opt\" data-letter=\"D\">D) The CNS does not have formal authority over other staff members.</div>", "ans": "D", "sata": false, "fb": "The absence of a \"line position\" denotes an absence of formal decision -making authority. This is often the case for an advisory (staff) position such as CNS. However, this does not suggest that every other staff member holds authority over the CNS or that the CNS is not accountable for his or her safe practice and adherence to standards. Line positions do not represent personal relationships."}, {"ch": "Ch 12: Organizational Structure", "q": "There is one vertical, solid line connecting a middle manager and a top -level manager on a clinic's organizational chart. What should a nurse conclude from this aspect of the organizational chart?", "opts": "<div class=\"opt\" data-letter=\"A\">A) The middle- and top-level manager share equal authority.</div><div class=\"opt\" data-letter=\"B\">B) The middle manager's position on the chart is permanent.</div><div class=\"opt\" data-letter=\"C\">C) The middle manager has only one boss.</div><div class=\"opt\" data-letter=\"D\">D) The top-level manager was originally promoted from being a middle manager.</div>", "ans": "C", "sata": false, "fb": "Unity of command means one immediate boss per employee and is denoted by a single vertical line. This does not suggest equal authority among the two managers or that the top -level manager was promoted from the position below him or her. This portion of the chart does not indicate that the middle manager's position is permanent."}, {"ch": "Ch 12: Organizational Structure", "q": "A new graduate nurse is starting a new position at a health care organization. Which employee at this organization would likely be considered a middle -level manager?", "opts": "<div class=\"opt\" data-letter=\"A\">A) An experienced primary care nurse who mentors other nurses</div><div class=\"opt\" data-letter=\"B\">B) The team leader of the hospital's wound care specialists</div><div class=\"opt\" data-letter=\"C\">C) The charge nurse who oversees day shifts on a medical unit</div><div class=\"opt\" data-letter=\"D\">D) The hospital's nursing supervisor</div>", "ans": "D", "sata": false, "fb": "Nursing supervisors are middle -level managers. All the others (primary care nurse, team leader, and charge nurse) are first -level managers."}, {"ch": "Ch 12: Organizational Structure", "q": "A health care organization utilizes decentralized decision making. What will most likely happen when there is a need for decisions to be made in the organization?", "opts": "<div class=\"opt\" data-letter=\"A\">A) A decision can be made at the lowest practical managerial level.</div><div class=\"opt\" data-letter=\"B\">B) The decision will be made by top -level managers.</div><div class=\"opt\" data-letter=\"C\">C) There is a potential that the decision will be made too quickly.</div><div class=\"opt\" data-letter=\"D\">D) It will be unclear who is ultimately accountable for the decision.</div>", "ans": "A", "sata": false, "fb": "Decentralized organizational structure allows decision making to be made at the level at which problems occur. Decision making by top managers is more likely when decision making is centralized. Decentralized decision making does not necessarily lead to rash decisions or unclear accountability."}, {"ch": "Ch 12: Organizational Structure", "q": "A middle manager who oversees the operations of several nursing units has a high degree of organizational centrality. What is most likely true about this manager?", "opts": "<div class=\"opt\" data-letter=\"A\">A) The manager is isolated from top -level managers.</div><div class=\"opt\" data-letter=\"B\">B) The manager interacts with a comparatively small number of coworkers.</div><div class=\"opt\" data-letter=\"C\">C) The manager receives much communication from varied directions.</div><div class=\"opt\" data-letter=\"D\">D) There are more middle -level managers than first -level managers in the organization.</div>", "ans": "C", "sata": false, "fb": "Centrality is a position on an organizational chart where it is possible to have many different types of communication (upward, downward, lateral, and diagonal). This does not suggest that there are more middle -level managers than lower level managers or that this manager is isolated from his or her superiors."}, {"ch": "Ch 12: Organizational Structure", "q": "A nurse -manager has established a new committee and will be chairing the committee. The committee consists of six representatives from various departments, at various levels within the organization. What goal should the committee members set?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Creating a new organizational chart</div><div class=\"opt\" data-letter=\"B\">B) Adding four to six new members</div><div class=\"opt\" data-letter=\"C\">C) Emphasizing formal communication</div><div class=\"opt\" data-letter=\"D\">D) Implementing shared decision making</div>", "ans": "D", "sata": false, "fb": "A shared decision making is a desirable goal in most committees. This maximizes productivity and input. Communication does not necessarily need to be formal and a committee does not necessarily have to consist of 10 to 12 members. It would be unusual for a committee to be charged with creating an entirely new organizational chart."}, {"ch": "Ch 12: Organizational Structure", "q": "A nurse -manager is chairing a committee, most of whose members are subordinates. When communicating with the members during meetings, the manager should:", "opts": "<div class=\"opt\" data-letter=\"A\">A) ensure their contributions are recorded for performance appraisal purposes.</div><div class=\"opt\" data-letter=\"B\">B) avoid overt demonstrations of power or authority.</div><div class=\"opt\" data-letter=\"C\">C) reserve the right to impose decisions on the committee.</div><div class=\"opt\" data-letter=\"D\">D) avoid informality in speech or writing.</div>", "ans": "B", "sata": false, "fb": "During committee work, encouraging interaction that is free of status and power is important. Recording for performance appraisal purposes is likely to be intimidating for committee members. There is no reason for all communication to be formal in a committee setting."}, {"ch": "Ch 12: Organizational Structure", "q": "A manager has accepted a new position and there are more than 20 people who directly report to the manager. What description of this manager's role is most accurate?", "opts": "<div class=\"opt\" data-letter=\"A\">A) The manager has an unrealistic workload.</div><div class=\"opt\" data-letter=\"B\">B) The manager has a large span of control.</div><div class=\"opt\" data-letter=\"C\">C) The manager has a top -level management position.</div><div class=\"opt\" data-letter=\"D\">D) The manager is working in a poorly designed organization.</div>", "ans": "B", "sata": false, "fb": "The number of people directly reporting to any one manager represents that manager's span of control and determines the number of interactions expected of that manager. Without knowing more about the manager's role, there is no way of knowing if the workload is unrealistic or if this is a top -level position. This manager's large span of control is not necessarily a marker of a poorly designed organization."}, {"ch": "Ch 12: Organizational Structure", "q": "A nurse -manager is working with a committee that is showing evidence of groupthink. What characteristic of the committee would show evidence of this phenomenon?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Members of the committee are unwilling to take risks with new ideas.</div><div class=\"opt\" data-letter=\"B\">B) The committee prefers to make decisions by consensus.</div><div class=\"opt\" data-letter=\"C\">C) The committee members want to take turns chairing the meetings.</div><div class=\"opt\" data-letter=\"D\">D) The committee has an unstable membership.</div>", "ans": "A", "sata": false, "fb": "Groupthink occurs when group members fail to take adequate risks by disagreeing, being challenged, or assessing discussion carefully. A preference for a rotating meeting chair does not necessarily indicate groupthink, nor does a preference for working by consensus. Unstable membership is not a desirable characteristic of a committee, but this does not directly indicate groupthink."}, {"ch": "Ch 12: Organizational Structure", "q": "A nurse is working on a unit whose culture has become firmly entrenched. What solution should the nurses on the unit best propose?", "opts": "<div class=\"opt\" data-letter=\"A\">A) New leadership</div><div class=\"opt\" data-letter=\"B\">B) A decrease in workload</div><div class=\"opt\" data-letter=\"C\">C) Collaboration with a unit that is not entrenched</div><div class=\"opt\" data-letter=\"D\">D) Increased administration support</div>", "ans": "A", "sata": false, "fb": "It is extremely difficult to change a unit culture without new leadership. A change in administrative support or even a reduction in workload will not necessarily challenge the established culture. Collaboration with a unit that is not entrenched may be beneficial, but new leadership is likely the most effective solution."}, {"ch": "Ch 12: Organizational Structure", "q": "A nurse who is applying for an administrative position is assessing the financial security within a new health care organization. Which characteristic would suggest that flattening is occurring within the organization?", "opts": "<div class=\"opt\" data-letter=\"A\">A) There is a collective spirit that is based on the mission and vision.</div><div class=\"opt\" data-letter=\"B\">B) There is reduction in the number of administration levels.</div><div class=\"opt\" data-letter=\"C\">C) There are shared work goals across units.</div><div class=\"opt\" data-letter=\"D\">D) There are formal and informal systems in place to address conflicts.</div>", "ans": "B", "sata": false, "fb": "Reducing the numbers of administration levels is called flattening the organization. A collective spirit, shared work goals, and adequate structures for conflict resolution are not related to organizational flattening."}, {"ch": "Ch 12: Organizational Structure", "q": "A manager is participating in introducing a shared governance model to a health care organization. What is the manager's best action?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Remove lines of authority.</div><div class=\"opt\" data-letter=\"B\">B) Form joint practice committees.</div><div class=\"opt\" data-letter=\"C\">C) Eliminate performance appraisals.</div><div class=\"opt\" data-letter=\"D\">D) Increase the number of first -level managers.</div>", "ans": "B", "sata": false, "fb": "In shared governance, the organization's governance is shared among board members, nurses, physicians, and management. Joint practice committees are developed to assume the power and accountability for decision making, and professional communication is egalitarian rather than hierarchical. Shared governance does not require a complete removal of lines of authority or the elimination of performance appraisals. Shared governance would not require more first -level managers."}, {"ch": "Ch 12: Organizational Structure", "q": "A nurse -manager is chairing a workplace committee. What should the manager prioritize in this role?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Keeping members on task and promoting productivity</div><div class=\"opt\" data-letter=\"B\">B) Promoting members' career development</div><div class=\"opt\" data-letter=\"C\">C) Resolving interpersonal conflicts and preventing groupthink</div><div class=\"opt\" data-letter=\"D\">D) Providing information on each agenda item</div>", "ans": "A", "sata": false, "fb": "Although all the listed choices may be something the chairperson does, the primary responsibility is to keep members on task so that committee work gets completed. This is prioritized because it best reflects the main purpose of a committee, which is to collectively address specific tasks and challenges in the workplace."}, {"ch": "Ch 12: Organizational Structure", "q": "A nurse -manager has been commissioned to create a new workplace committee that will focus on client safety issues. When forming this committee, the manager should:", "opts": "<div class=\"opt\" data-letter=\"A\">A) meet at least twice per week for the first month to create momentum.</div><div class=\"opt\" data-letter=\"B\">B) aim for diversity of genders and cultures among the membership.</div><div class=\"opt\" data-letter=\"C\">C) ensure that half of the members are the manager's subordinates and half are the manager's superiors.</div><div class=\"opt\" data-letter=\"D\">D) give members permission to attend meetings as often or as rarely as they wish in order to accommodate their schedules.</div>", "ans": "B", "sata": false, "fb": "When assigning members to committees, cultural and gender diversity should always be a goal. The manager should make efforts to accommodate members' schedules, but giving members' permission to attend as rarely as they wish will compromise the group's cohesion and effectiveness. Momentum must be created after the committee is formed, but this does not necessarily require twice -weekly meetings. It is unnecessary and unrealistic to split the membership between the manager's subordinates and superiors."}, {"ch": "Ch 12: Organizational Structure", "q": "What should the leader remember when forming committees?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Committees work best when there is an adequate supply of workers, with 10 members being the minimum.</div><div class=\"opt\" data-letter=\"B\">B) Willingness to work hard is the most important criterion for appointment.</div><div class=\"opt\" data-letter=\"C\">C) Written agendas provide excessive structure and stifle committee creativity.</div><div class=\"opt\" data-letter=\"D\">D) There should be sufficient expertise among committee members to accomplish the assigned task.</div>", "ans": "D", "sata": false, "fb": "The most important criterion for committee selection is overall adequate expertise to accomplish the agenda. Effort is an important criterion for membership, but this quality is not productive unless it is accompanied by expertise. There is no absolute minimum of 10 members. Written agendas provide structure and focus for committee meetings and the manager should provide these."}, {"ch": "Ch 12: Organizational Structure", "q": "During a strategic planning committee meeting to develop technology goals, several unit managers spend a considerable amount of time discussing current staffing problems. What is the primary action of the chairperson of this committee?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Take the remainder of the meeting time to discuss staffing with all members.</div><div class=\"opt\" data-letter=\"B\">B) Adjourn the meeting and reschedule at a time when there are no staffing problems.</div><div class=\"opt\" data-letter=\"C\">C) Request that committee members return to discussing items on the agenda.</div><div class=\"opt\" data-letter=\"D\">D) Excuse those discussing staffing from the remainder of the meeting.</div>", "ans": "C", "sata": false, "fb": "Committee time is wasted when agendas are not adhered to. The chairperson should avoid facilitating discussion of peripheral issues. It is unrealistic to put the committee's work on hold until all staffing problems are resolved. Dismissing the members who are discussing irrelevant issues is a heavy -handed approach that is unnecessary and which would be disruptive."}, {"ch": "Ch 12: Organizational Structure", "q": "A nurse -manager works in a health care facility that has applied for Magnet status. What characteristics of the organization will support the application? Select all that apply.", "opts": "<div class=\"opt\" data-letter=\"A\">A) Centralized decision -making environment</div><div class=\"opt\" data-letter=\"B\">B) Open, participatory management</div><div class=\"opt\" data-letter=\"C\">C) Improved client outcomes</div><div class=\"opt\" data-letter=\"D\">D) High staff nurse satisfaction</div><div class=\"opt\" data-letter=\"E\">E) Large number of registered nurses and absence of practical nurses</div>", "ans": ["B", "C", "D"], "sata": true, "fb": "Magnet designation is conferred by the ANCC to health care organizations exemplifying well -qualified nurse executives in a decentralized environment, with organizational structures that emphasize open, participatory management. Magnet -designated organizations demonstrate improved client outcomes and higher staff nurse satisfaction than organizations that do not have Magnet status. Magnet status is not dependent of registered nurses performing roles that are otherwise performed by practical nurses."}, {"ch": "Ch 12: Organizational Structure", "q": "Which components are considered a part of an organizational structure? Select all that", "opts": "<div class=\"opt\" data-letter=\"A\">A) The individuals included in the group</div><div class=\"opt\" data-letter=\"B\">B) Lines of communication</div><div class=\"opt\" data-letter=\"C\">C) Decision -making process</div><div class=\"opt\" data-letter=\"D\">D) Channels of legitimate authority</div><div class=\"opt\" data-letter=\"E\">E) Organizational culture</div>", "ans": ["A", "B", "C", "D"], "sata": true, "fb": "Organizational structure refers to the way in which a group is formed (membership), its lines of communication, and its means for channeling authority and making decisions. Organizational culture is an important aspect of every organization but this is not conveyed in the organizational structure."}, {"ch": "Ch 12: Organizational Structure", "q": "The leadership of a large health care organization has arranged a series of meetings with stakeholders. What individuals or groups would be included in this category? Select all that apply.", "opts": "<div class=\"opt\" data-letter=\"A\">A) A community group that advocates for the rights of people addicted to drugs</div><div class=\"opt\" data-letter=\"B\">B) Representatives from a labor union who represents many staff members, an external organization, or individuals</div><div class=\"opt\" data-letter=\"C\">C) A community group that promotes client safety in health care</div><div class=\"opt\" data-letter=\"D\">D) Members of the local media</div><div class=\"opt\" data-letter=\"E\">E) The surgeons and anesthetists who work in the operating room</div>", "ans": ["A", "B", "C", "E"], "sata": true, "fb": "Stakeholders are those entities in an organization's environment who play a role in the organization's health and performance or who are affected by the organization. Stakeholders may be both internal and external, they may include groups. As a result, groups that focus on client safety or a particular vulnerable population would be considered stakeholders. As well, staff members or the organizations representing their interests would be considered stakeholders. The media would not normally play a role in the organization's health and performance or be affected by the organization."}, {"ch": "Ch 12: Organizational Structure", "q": "A health care organization has undergone an organizational restructure that increases nurses' autonomy and empowerment. What effect is most likely?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Increased interdisciplinary collaboration</div><div class=\"opt\" data-letter=\"B\">B) Improved nurse-physician communication</div><div class=\"opt\" data-letter=\"C\">C) Increased effectiveness of client care</div><div class=\"opt\" data-letter=\"D\">D) Increased client autonomy</div>", "ans": "C", "sata": false, "fb": "Current research suggests that changing an organization's structure in a manner that increases autonomy and work empowerment for nurses will lead to more effective client care. There is no evidence that increasing the autonomy of nurses causes enhanced communication or collaboration, or that it has an effect on client autonomy."}, {"ch": "Ch 12: Organizational Structure", "q": "The organization of work in a large health care facility reflects Weber's theories around bureaucracies. What characteristic is most likely to exist in this facility?", "opts": "<div class=\"opt\" data-letter=\"A\">A) High flexibility in the way that work is structured</div><div class=\"opt\" data-letter=\"B\">B) Promotion and advancement on the basis of relationships</div><div class=\"opt\" data-letter=\"C\">C) Absolute autonomy of each employee</div><div class=\"opt\" data-letter=\"D\">D) A clear division of labor among employees</div>", "ans": "D", "sata": false, "fb": "Weber emphasized the need for a clear division of labor. Advancement was to be based on competence, not relationships. A high degree of accountability was to exist rather than absolute autonomy. The flow of work is more structured than flexible."}, {"ch": "Ch 12: Organizational Structure", "q": "Which statements are true concerning a bureaucratic organization? Select all that apply.", "opts": "<div class=\"opt\" data-letter=\"A\">A) It is commonly referred to as a line organization.</div><div class=\"opt\" data-letter=\"B\">B) It is typically found in large health care organizations.</div><div class=\"opt\" data-letter=\"C\">C) It is rooted in individual personalities.</div><div class=\"opt\" data-letter=\"D\">D) They resemble Weber's original design of organization.</div><div class=\"opt\" data-letter=\"E\">E) Its authority is represented by its staff organizational chart.</div>", "ans": ["A", "B", "D", "E"], "sata": true, "fb": "Bureaucratic organizational designs are commonly called line structures or line organizations. Their structure is illustrated by an organizational chart. These designs are common in large health care organizations and are based on Weber's original conceptualization. Policies and rules govern the organization rather than individual"}, {"ch": "Ch 12: Organizational Structure", "q": "A nursing supervisor has been given the responsibility for increasing the frequency and thoroughness of nursing assessments on a hospital unit. However, the supervisor does not have the authority to enforce new guidelines for assessment or assign consequences for noncompliance. What is the most likely outcome of this scenario?", "opts": "<div class=\"opt\" data-letter=\"A\">A) The desired outcome will not be achieved.</div><div class=\"opt\" data-letter=\"B\">B) The assessments will improve, but the nurses will be resentful.</div><div class=\"opt\" data-letter=\"C\">C) The supervisor will need to use unauthorized enforcement.</div><div class=\"opt\" data-letter=\"D\">D) The assessments will improve as a result of collaboration.</div>", "ans": "A", "sata": false, "fb": "Responsibility without authority often causes role confusion and makes it difficult for a manager to enforce a necessary change. This is likely to cause the failure of the initiative. Without binding incentives and disincentives, it is unlikely that change will occur. Spontaneous collaboration is possible, but role confusion is more likely. The use of unauthorized enforcement could be problematic for the manager and would be most likely avoided due to the associated risk."}, {"ch": "Ch 12: Organizational Structure", "q": "An organization has proposed a policy stating that no more than five people should report to any single manager in the organization. What is the most likely outcome of this change in organizational structure?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Decision making will become unpredictable.</div><div class=\"opt\" data-letter=\"B\">B) Workplace satisfaction will increase.</div><div class=\"opt\" data-letter=\"C\">C) Efficiency will decrease in the organization.</div><div class=\"opt\" data-letter=\"D\">D) Worker autonomy and empowerment will increase.</div>", "ans": "C", "sata": false, "fb": "Having too few people report to a manager creates an inefficient and top -heavy organization. Decision making is likely to become similarly inefficient, although it may not become more unpredictable. This change in structure will not necessarily increase the autonomy or satisfaction of employees who may be under closer scrutiny."}, {"ch": "Ch 12: Organizational Structure", "q": "A nurse -manager is reviewing the organizational chart of a health care facility before accepting a job offer. When reviewing the organizational chart, the nurse should:", "opts": "<div class=\"opt\" data-letter=\"A\">A) be aware that the informal structure of the organization cannot be discerned from the chart.</div><div class=\"opt\" data-letter=\"B\">B) confirm the accuracy of the chart with the human resources department.</div><div class=\"opt\" data-letter=\"C\">C) try to meet with the people at the top of the chart, if possible.</div><div class=\"opt\" data-letter=\"D\">D) review the qualifications of each person on the chart.</div>", "ans": "A", "sata": false, "fb": "Organizational charts convey the formal structure of an organization, but they do not include informal structures. It is impractical and unnecessary to review every individual's qualifications. Unless there are reasons to doubt the accuracy of the chart, it is unnecessary to confirm with the human resources department. Unless the manager is applying for a top -level position, it is often unnecessary and impossible to meet with the people at the top of the chart."}, {"ch": "Ch 12: Organizational Structure", "q": "A rural hospital is considering a sharp reduction in the range and availability of the services it provides. Before making this change, the hospital's leadership should:", "opts": "<div class=\"opt\" data-letter=\"A\">A) decentralize its decision -making model.</div><div class=\"opt\" data-letter=\"B\">B) implement shared governance.</div><div class=\"opt\" data-letter=\"C\">C) review its organizational chart.</div><div class=\"opt\" data-letter=\"D\">D) consult with local stakeholders.</div>", "ans": "D", "sata": false, "fb": "The stakeholders are all the internal and external individuals and groups who have an interest in an organization's operations. In a rural community where few options for health care exist, it would be prudent to consult with local stakeholders before a major change in service. There is no obvious need for this organization to decentralize, implement shared governance, or review its organizational chart."}, {"ch": "Ch 12: Organizational Structure", "q": "The top -level managers of a hospital have chosen to apply for Magnet designation. The decision to grant this designation will be largely based on what factor?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Input from local nursing educators and academics</div><div class=\"opt\" data-letter=\"B\">B) The findings from an onsite visit by assessors</div><div class=\"opt\" data-letter=\"C\">C) The results of a local public opinion survey</div><div class=\"opt\" data-letter=\"D\">D) Review of the organizational chart</div>", "ans": "B", "sata": false, "fb": "A detailed onsite visit is a major component of the Magnet accreditation process. Nurse educators from outside the organization would not normally be consulted, and a public opinion survey is not normally taken. Accreditors would review the organizational chart, but this is a lesser piece of data compared with the results of a site visit."}, {"ch": "Ch 21: Conflict, Workplace Violence, and Negotiation", "q": "A nurse -manager is preparing for negotiations. When negotiating, what is the manager's most appropriate action?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Be willing to win at any cost.</div><div class=\"opt\" data-letter=\"B\">B) Communicate only when asked direct questions.</div><div class=\"opt\" data-letter=\"C\">C) Compromise only as a last resort.</div><div class=\"opt\" data-letter=\"D\">D) Begin with high but realistic expectations.</div>", "ans": "D", "sata": false, "fb": "The selected starting point in negotiations should be at the upper limits of the negotiator's expectations, within reason. However, negotiators must realize that they may have to come down to a lesser goal. Winning at any cost is counterproductive, and the manager should expect to compromise. Plentiful and accurate communication is necessary at all stages of negotiation."}, {"ch": "Ch 21: Conflict, Workplace Violence, and Negotiation", "q": "A charge nurse has assisted two employees to resolve their conflict, with the outcome being that the two opposing goals were discarded and new goals were adopted. What is this an example of?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Smoothing of conflict by the leader</div><div class=\"opt\" data-letter=\"B\">B) Facilitating collaboration</div><div class=\"opt\" data-letter=\"C\">C) A majority rule approach</div><div class=\"opt\" data-letter=\"D\">D) A good lesson in compromising</div>", "ans": "B", "sata": false, "fb": "In collaboration, all parties set aside their original goals and work together to establish a common goal. In promoting collaboration, the charge nurse has not simply smoothed over the conflict. The formation of new goals differentiates between collaboration and compromise. There is no evidence that a majority rule approach has been taken because there are two parties involved."}, {"ch": "Ch 21: Conflict, Workplace Violence, and Negotiation", "q": "Which is a true statement about destructive negotiation tactics?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Ridicule often takes the form of ambiguous or inappropriate questioning and is a diversionary tactic.</div><div class=\"opt\" data-letter=\"B\">B) Most managers successfully resist the illness/wellness tactic because of their nursing preparation.</div><div class=\"opt\" data-letter=\"C\">C) Negotiation tactics can sometimes be manipulative; thus, managers must be cognizant of the other party's motives.</div><div class=\"opt\" data-letter=\"D\">D) Nurses are known to be particularly vulnerable to the tactic of flattery.</div>", "ans": "C", "sata": false, "fb": "Destructive negotiation tactics are never a part of a successful collaborative conflict resolution. An astute nurse -manager must stay cognizant of the other party's motives and behaviors in order to identify manipulative tactics. Ridicule is a separate tactic from ambiguous and inappropriate questioning. Nurses can be particularly vulnerable to the helplessness tactic because nurses are educated and inclined to help others. Nurses are not noted to be exceptionally vulnerable to flattery, however."}, {"ch": "Ch 21: Conflict, Workplace Violence, and Negotiation", "q": "What statement about conflict most closely reflects the interactionist theories of organizational conflict?", "opts": "<div class=\"opt\" data-letter=\"A\">A) \"The most important response to conflict is to deal with it immediately.\"</div><div class=\"opt\" data-letter=\"B\">B) \"Conflict can actually be a positive thing and can help us to grow.\"</div><div class=\"opt\" data-letter=\"C\">C) \"The presence of conflict in our workplace shows that there is bad management.\"</div><div class=\"opt\" data-letter=\"D\">D) \"The best organizations are places where there is no conflict.\"</div>", "ans": "B", "sata": false, "fb": "The interactionist movement encouraged organizations to promote conflict as a means of producing growth. Interactionist did not see conflict as evidence of bad management or dysfunction. Interactionists did not particularly emphasize the need to deal with conflict immediately."}, {"ch": "Ch 21: Conflict, Workplace Violence, and Negotiation", "q": "A nurse -manager has accepted a new position on a hospital unit. An experienced nurse on the unit tells the manager, \"We all work really well with each other. There's never any conflict.\" How should the manager interpret this statement?", "opts": "<div class=\"opt\" data-letter=\"A\">A) The unit may be lacking in growth and new ideas.</div><div class=\"opt\" data-letter=\"B\">B) There is a need for the manager to introduce conflict.</div><div class=\"opt\" data-letter=\"C\">C) The manager needs to ensure that this characteristic continues.</div><div class=\"opt\" data-letter=\"D\">D) There is likely conflict that the nurse is not recognizing or acknowledging.</div>", "ans": "A", "sata": false, "fb": "Some level of conflict in an organization appears to be desirable because it seems to prevent organizational stagnation. Despite this, it would normally be inappropriate for the manager to deliberately introduce conflict for the purpose of promoting growth. There is no reason to believe that the nurse's statement is untrue."}, {"ch": "Ch 21: Conflict, Workplace Violence, and Negotiation", "q": "Which nurse is experiencing intrapersonal conflict?", "opts": "<div class=\"opt\" data-letter=\"A\">A) A manager who has received a negative performance appraisal and who wishes to dispute the findings</div><div class=\"opt\" data-letter=\"B\">B) A manager who has to confront a nurse who made a medication error but did not follow up with documentation</div><div class=\"opt\" data-letter=\"C\">C) A manager who is in conflict with a long -standing employee who often ignores the manager's directives</div><div class=\"opt\" data-letter=\"D\">D) A manager who perceives a dilemma between loyalty to staff and loyalty to the organization in a particular situation</div>", "ans": "D", "sata": false, "fb": "Intrapersonal conflict occurs within an individual. Each of the other examples constitutes interpersonal conflict, which is conflict involving two or more people."}, {"ch": "Ch 21: Conflict, Workplace Violence, and Negotiation", "q": "Which of the following workplace situations would be categorized as latent conflict?", "opts": "<div class=\"opt\" data-letter=\"A\">A) A nurse expresses frustration to a colleague who did not perform some tasks that were clearly delegated.</div><div class=\"opt\" data-letter=\"B\">B) A nurse expresses anger to the manager, accusing the manager of preferential treatment toward other nurses.</div><div class=\"opt\" data-letter=\"C\">C) The most experienced nurses on a unit are allowed to self -schedule, but less experienced nurse are not.</div><div class=\"opt\" data-letter=\"D\">D) Two nurses were in conflict about inequities in their work assignment but were able to resolve the conflict.</div>", "ans": "C", "sata": false, "fb": "The first stage in the conflict process, latent conflict, implies the existence of antecedent conditions such as inequities in staffing. In this stage, conditions are ripe for conflict, although no conflict has actually yet occurred. In each of the other examples, the conflict has progressed beyond this antecedent stage."}, {"ch": "Ch 21: Conflict, Workplace Violence, and Negotiation", "q": "A nurse -manager was involved in conflict where the other individual adopted a competing approach. This approach is evident in what circumstances?", "opts": "<div class=\"opt\" data-letter=\"A\">A) When fair play is important to all involved parties</div><div class=\"opt\" data-letter=\"B\">B) When one party wins at the expense of the others</div><div class=\"opt\" data-letter=\"C\">C) When managers need to control a volatile situation</div><div class=\"opt\" data-letter=\"D\">D) When an appropriate political strategy is necessary</div>", "ans": "B", "sata": false, "fb": "The competing approach is used when one party pursues what it wants at the expense of the others. Because only one party typically wins, the competing party seeks to win regardless of the cost to others. Neither manager control nor political strategy is necessarily associated with the competing approach to resolving conflict."}, {"ch": "Ch 21: Conflict, Workplace Violence, and Negotiation", "q": "A nurse is in a conflict with a colleague, but both nurses are committed to collaboration. To promote collaboration, the nurses should:", "opts": "<div class=\"opt\" data-letter=\"A\">A) identify a common goal that is important to both of them.</div><div class=\"opt\" data-letter=\"B\">B) possess the ability to negotiate without having emotion get involved.</div><div class=\"opt\" data-letter=\"C\">C) have a relationship that existed before the conflict.</div><div class=\"opt\" data-letter=\"D\">D) ask a neutral third party to mediate in the conflict.</div>", "ans": "A", "sata": false, "fb": "In collaboration, all parties set aside their original goals and work together to establish a supraordinate or priority common goal. This does not necessarily require the preexistence of a relationship or mediation. Collaboration is still possible even if the conflict has an emotional element."}, {"ch": "Ch 21: Conflict, Workplace Violence, and Negotiation", "q": "A registered nurse reports to the nurse -manager that the team's nursing assistant regularly fails to complete assigned tasks. The nurse -manager responds that it is the nurse's initial responsibility to talk with the nursing assistant about this problem. The manager is engaged in what aspect of conflict?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Conflict avoidance</div><div class=\"opt\" data-letter=\"B\">B) Conflict smoothing</div><div class=\"opt\" data-letter=\"C\">C) Encouraging competitive conflict resolution</div><div class=\"opt\" data-letter=\"D\">D) Facilitating conflict resolution</div>", "ans": "D", "sata": false, "fb": "Managers should not intervene in every conflict but should urge subordinates to handle their own problems. This is an example of supporting conflict resolution. In most circumstances, this approach should be implemented before the manager becomes directly involved. The manager's deference does not indicate conflict avoidance or conflict smoothing."}, {"ch": "Ch 21: Conflict, Workplace Violence, and Negotiation", "q": "Which statement best defines conflict?", "opts": "<div class=\"opt\" data-letter=\"A\">A) It involves an internal struggle resulting from value -related discord.</div><div class=\"opt\" data-letter=\"B\">B) Its basis is the violation of personal rights or values.</div><div class=\"opt\" data-letter=\"C\">C) It centers on either internal discord or external discord between individuals.</div><div class=\"opt\" data-letter=\"D\">D) It is the outcome of a visible struggle between individuals.</div>", "ans": "C", "sata": false, "fb": "Conflict is generally defined as the internal or external discord that results from
