differences in ideas, values, or feelings between two or more people. The remaining options describe only limited aspects of conflict."}, {"ch": "Ch 21: Conflict, Workplace Violence, and Negotiation", "q": "A nurse -manager will be participating in negotiations around the skills mix in the organization. Before these negotiations begin, the manager should perform what action first?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Identify the ideal skills mix for the organization.</div><div class=\"opt\" data-letter=\"B\">B) Choose an appropriate negotiation strategy.</div><div class=\"opt\" data-letter=\"C\">C) Interact with the other party to identify any hidden agendas.</div><div class=\"opt\" data-letter=\"D\">D) Learn as much as possible about the issue.</div>", "ans": "D", "sata": false, "fb": "For managers to be successful, they must systematically prepare for the negotiation. As the negotiator, the manager begins by gathering as much information as possible regarding the issue to be negotiated. This data -gathering phase should precede the other listed actions."}, {"ch": "Ch 21: Conflict, Workplace Violence, and Negotiation", "q": "A nurse -manager is participating in negotiations around the allocation of resources in the organization. During the negotiations, the manager should:", "opts": "<div class=\"opt\" data-letter=\"A\">A) try to speak the same amount or slightly more than the other party.</div><div class=\"opt\" data-letter=\"B\">B) use open -ended questions rather than yes or no questions.</div><div class=\"opt\" data-letter=\"C\">C) declare his or her bottom line at the start of negotiations.</div><div class=\"opt\" data-letter=\"D\">D) ensure that the negotiations proceed at a rapid pace.</div>", "ans": "B", "sata": false, "fb": "The manager should encourage the other negotiator to talk by asking lots of open -ended questions that cannot be answered with a simple \"yes\" or \"no.\" It is not beneficial to openly declare the bottom line before negotiations have even begun. The manager should listen 70% of the time and talk only 30% of the time. Speed is not a goal during negotiation and can lead to hasty decisions."}, {"ch": "Ch 21: Conflict, Workplace Violence, and Negotiation", "q": "A nurse -manager is negotiating for the funds necessary to purchase several new isolettes for the facility's newborn nursery. The chief financial officer (CFO) states, \"I've always been curious about that piece of equipment; how does it actually work?\" What negotiation action has the CFO engaged in?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Collaborating</div><div class=\"opt\" data-letter=\"B\">B) Smoothing</div><div class=\"opt\" data-letter=\"C\">C) A diversionary tactic</div><div class=\"opt\" data-letter=\"D\">D) Appropriate fact finding</div>", "ans": "C", "sata": false, "fb": "The CFO was consciously or unconsciously using a diversionary tactic that deflects from the issue at hand. There is no evidence of collaboration with this question, and it is unnecessary information. Smoothing is an approach to conflict, not negotiation."}, {"ch": "Ch 21: Conflict, Workplace Violence, and Negotiation", "q": "Several RNs on a unit want to address the possibility of initiating flextime on the unit because they state that the current scheduling system is unfair. What is the manager's best initial response?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Assuring the RNs that every effort is being made to streamline the current scheduling system</div><div class=\"opt\" data-letter=\"B\">B) Asking the RNs to circulate a partition to be signed by employees who support the change</div><div class=\"opt\" data-letter=\"C\">C) Arranging for the RNs to air their views at the next staff meeting</div><div class=\"opt\" data-letter=\"D\">D) Sharing with the RNs that they need to address the issue with upper management</div>", "ans": "C", "sata": false, "fb": "This manager should plan to let employees air their views at the next staff meeting. Nursing managers can no longer afford to respond to conflict traditionally (to avoid, deflect, or suppress conflict) because this is nonproductive. Providing false reassurance and referring them elsewhere are not direct and respectful responses to conflict."}, {"ch": "Ch 21: Conflict, Workplace Violence, and Negotiation", "q": "A nurse -manager has learned that two employees are in conflict. The manager's fact gathering reveals that the conflict exists because each employee misunderstands the job description and role of the other employee. What conflict management strategy should the manager implement first?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Responsibility charting</div><div class=\"opt\" data-letter=\"B\">B) Confrontation</div><div class=\"opt\" data-letter=\"C\">C) Behavior change</div><div class=\"opt\" data-letter=\"D\">D) Third party consultation</div>", "ans": "A", "sata": false, "fb": "When a supervisor delineates job duties to persons in conflict, it is called responsibility charting. This attempt at clearing up the misunderstanding should be attempted before resorting to other strategies."}, {"ch": "Ch 21: Conflict, Workplace Violence, and Negotiation", "q": "An employee has come to the manager with a long list of complaints about a coworker, all of which are attributable to personality factors rather than unsafe practice. What is the manager's best initial action?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Encourage the employee to speak directly with the coworker.</div><div class=\"opt\" data-letter=\"B\">B) Ask the employee to e -mail or text message the complaints to the coworker.</div><div class=\"opt\" data-letter=\"C\">C) Arrange for third -party mediation.</div><div class=\"opt\" data-letter=\"D\">D) Acknowledge and document the employee's complaints.</div>", "ans": "A", "sata": false, "fb": "When team members inappropriately expect the manager to solve their interpersonal conflicts, managers can urge subordinates to attempt to handle their own problems by using face -to-face communication to resolve conflicts. This basic approach should be attempted before mediation. E -mails and text messages are too impersonal for interpersonal conflicts that can have significant conflict aftermath. Acknowledging and documenting the complaints offers no course of action to the employee."}, {"ch": "Ch 21: Conflict, Workplace Violence, and Negotiation", "q": "The manager has learned that some of the more experienced nurses on the unit have been playing pranks on a newly hired nurse and delegating their most challenging tasks to the nurse. What is the manager's best response after confirming that these events took place?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Offer support and encouragement to the newly hired nurse.</div><div class=\"opt\" data-letter=\"B\">B) Confront the more experienced nurses directly about their behavior.</div><div class=\"opt\" data-letter=\"C\">C) Implement a structure change so the experienced nurses no longer work at the same time as the new nurse.</div><div class=\"opt\" data-letter=\"D\">D) Arrange for third -party consultation involving the more experienced nurses, the manager, and the new nurse.</div>", "ans": "B", "sata": false, "fb": "The manager must address bullying directly and promptly. The nurse should also offer support to the bullied nurse, but the priority is addressing the behaviors. Separating the group from the individual or having mediation may eventually be necessary, but the manager would first confront the behavior."}, {"ch": "Ch 21: Conflict, Workplace Violence, and Negotiation", "q": "Which of the following behaviors should a nurse -manager identify as workplace violence, incivility, or bullying? Select all that apply. workload, despite having time to do so.", "opts": "<div class=\"opt\" data-letter=\"A\">A) A group of nurses consistently refuse to help a nurse when that nurse has a heavy workload, despite having time to do so.</div><div class=\"opt\" data-letter=\"B\">B) Staff members assign an unwanted nickname to a colleague.</div><div class=\"opt\" data-letter=\"C\">C) A nurse's specific vacation request is denied by the manager for 2 years in a row.</div><div class=\"opt\" data-letter=\"D\">D) A nurse asks a colleague to assess a known verbally abusive client without warning to see how the colleague will respond.</div><div class=\"opt\" data-letter=\"E\">E) A nurse tells a nursing student to rush to room 311, knowing that the unit has no room 311.</div>", "ans": ["A", "B", "D", "E"], "sata": true, "fb": "Workplace incivility can take many forms, including name -calling, refusing help, setting up a colleague for failure, or playing pranks. Vacation denials can happen for many reasons and would not necessarily constitute an uncivil act."}, {"ch": "Ch 21: Conflict, Workplace Violence, and Negotiation", "q": "Two groups in a health care organization have been unable to reach an agreement after prolonged negotiation. The groups have agreed to arbitration. What will happen during this process?", "opts": "<div class=\"opt\" data-letter=\"A\">A) A neutral party will facilitate new negotiations, starting from the beginning.</div><div class=\"opt\" data-letter=\"B\">B) A neutral party will listen to both groups and then present a binding recommendation.</div><div class=\"opt\" data-letter=\"C\">C) A neutral third party will act as a \"go between\" in the negotiations.</div><div class=\"opt\" data-letter=\"D\">D) Negotiations will continue in a court setting, and a lawyer will mediate between the groups.</div>", "ans": "B", "sata": false, "fb": "Arbitration is a binding conflict resolution process in which the facts of the case are heard by an individual who makes a final decision for the parties in conflict. It does not involve repeating the negotiations and does not take place in a court setting."}, {"ch": "Ch 21: Conflict, Workplace Violence, and Negotiation", "q": "A nurse -manager is attempting to help a group of staff members reach a consensus on a sensitive issue. What is a consequence of using a consensus -based approach?", "opts": "<div class=\"opt\" data-letter=\"A\">A) One group will be perceived as the \"winner\" and one group as the \"loser.\"</div><div class=\"opt\" data-letter=\"B\">B) It is likely that neither group will achieve their desired \"ideal\" outcome.</div><div class=\"opt\" data-letter=\"C\">C) A solution that is ideal to both groups will be selected.</div><div class=\"opt\" data-letter=\"D\">D) Each group will receive exactly what they originally requested.</div>", "ans": "B", "sata": false, "fb": "Consensus means that negotiating parties reach an agreement that all parties can support, even if it does not represent everyone's first priorities. Consensus decision making does not provide complete satisfaction for everyone involved, and the solution is unlikely to be described as \"ideal\" by anyone involved. Reaching a consensus does not involve an increased risk for future conflict."}, {"ch": "Ch 21: Conflict, Workplace Violence, and Negotiation", "q": "An employee who is involved in a dispute has sought the assistance of the organization's ombudsperson. What role will the ombudsperson play in resolving the employee's conflict?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Providing expert testimony in conflict cases</div><div class=\"opt\" data-letter=\"B\">B) Providing psychosocial support to employees in distress</div><div class=\"opt\" data-letter=\"C\">C) Investigating the employee's grievance against the other party</div><div class=\"opt\" data-letter=\"D\">D) Monitoring the implementation of the terms of a conflict's compromise</div>", "ans": "C", "sata": false, "fb": "Ombudspersons investigate grievances filed by one party against another and ensure that individuals involved in conflicts understand their rights as well as the process that should be used to report and resolve the conflict. They do not normally provide expert testimony, psychosocial support, or monitor implementation of a solution."}, {"ch": "Ch 21: Conflict, Workplace Violence, and Negotiation", "q": "A negotiating session has just concluded with a compromise agreement. What is the manager's best action?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Clearly restate the terms of the compromise to all involved before dispersing.</div><div class=\"opt\" data-letter=\"B\">B) Give feedback to the members of the other negotiating team on their behavior and performance.</div><div class=\"opt\" data-letter=\"C\">C) Evaluate the fairness of the compromise to all involved parties.</div><div class=\"opt\" data-letter=\"D\">D) Restate each party's original bottom line.</div>", "ans": "A", "sata": false, "fb": "Once a compromise has been reached, restate it so that everyone is clear about what has been agreed on. Giving feedback to others after negotiation is not a usual practice. The fairness of the compromise should be considered during negotiation, not after the fact. There is no benefit to stating the original bottom lines."}, {"ch": "Ch 21: Conflict, Workplace Violence, and Negotiation", "q": "A nurse -manager is engaged in a negotiation with staff representatives when the discussion becomes controlled by a particularly aggressive member. Which action will the nurse -manager take to assure that the process is successful?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Ask that the aggressive individual recognize the rights of all the other members.</div><div class=\"opt\" data-letter=\"B\">B) State, \"I need to have time to think over all that we have discussed.\"</div><div class=\"opt\" data-letter=\"C\">C) Halt any discussion until new representatives can be appointed.</div><div class=\"opt\" data-letter=\"D\">D) Share with the members that aggressiveness negatively impacts the negotiations.</div>", "ans": "B", "sata": false, "fb": "Some people win in negotiation simply by rapidly and aggressively taking over and controlling the negotiation before other members realize what is happening. If managers believe that this may be happening, they should call a halt to the negotiations before decisions are made. Saying simply, \"I need to have time to think this over\" is a good method of stopping an aggressive takeover. The other options are much less effective and may even lead to increased aggressiveness among team members."}, {"ch": "Ch 21: Conflict, Workplace Violence, and Negotiation", "q": "Which personal characteristics will best help meet the psychological needs of conflict negotiation?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Perseverance and assertiveness</div><div class=\"opt\" data-letter=\"B\">B) Calmness and self-assuredness</div><div class=\"opt\" data-letter=\"C\">C) Compassion and reflectiveness</div><div class=\"opt\" data-letter=\"D\">D) Organization and self-reflection</div>", "ans": "B", "sata": false, "fb": "Negotiation is psychological and verbal. The effective negotiator always appears calm and self -assured. The other options are not as impactful when considering the psychological aspects of the negotiation process."}, {"ch": "Ch 21: Conflict, Workplace Violence, and Negotiation", "q": "A nurse -manager is participating in negotiations that have become confrontational and unproductive. As a result, both parties have agreed to mediation. This mechanism for dispute resolution will have what characteristics? Select all that apply.", "opts": "<div class=\"opt\" data-letter=\"A\">A) The mediator will be a respected person from within the organization.</div><div class=\"opt\" data-letter=\"B\">B) Both parties are required to accept the mediator's decision.</div><div class=\"opt\" data-letter=\"C\">C) The mediator addresses the process but not the issues.</div><div class=\"opt\" data-letter=\"D\">D) The mediator meets with each group separately as well as meeting with them together.</div><div class=\"opt\" data-letter=\"E\">E) The mediator is an individual who has no vested interest in the outcome.</div>", "ans": ["D", "E"], "sata": true, "fb": "A mediator is a neutral third party who has no conflict of interest and who is from outside the organization. The mediator's decision is not binding, unlike arbitration. The mediator has a broad role that can address process as well as the issues in dispute."}, {"ch": "Ch 21: Conflict, Workplace Violence, and Negotiation", "q": "A recent graduate has begun working at a health center and finds the behaviors of colleagues stressful and intimidating. The colleagues whisper when the new nurse is around, roll their eyes, and laugh when the new nurse asks for assistance or clarification. What is this recent graduate's best action?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Organize a meeting to confront the colleagues about their behavior.</div><div class=\"opt\" data-letter=\"B\">B) Avoid the offending colleagues whenever possible.</div><div class=\"opt\" data-letter=\"C\">C) Report these behaviors to the nurse -manager.</div><div class=\"opt\" data-letter=\"D\">D) Seek assistance from the organization's ombudsperson.</div>", "ans": "C", "sata": false, "fb": "The nurse -manager should be made aware of this behavior so that action can be taken. It is unrealistic to expect a new graduate to organize a staff meeting to confront a group of more experienced colleagues about their behavior. Ombudspersons generally deal with disputes and grievances, not the immediate management of workplace violence. The nurse may be tempted to simply avoid these colleagues, but this is not sustainable and does not address this unacceptable behavior."}, {"ch": "Ch 21: Conflict, Workplace Violence, and Negotiation", "q": "A hospital unit is undergoing a major transition from a nursing model of exclusively RNs to a model that is a mix of RNs, LPNs, and NAPs. The transition has resulted in several conflicts between staff. What conflict resolution strategy will the manager most likely need to use?", "opts": "<div class=\"opt\" data-letter=\"A\">A) Third -party consultation</div><div class=\"opt\" data-letter=\"B\">B) Behavior change</div><div class=\"opt\" data-letter=\"C\">C) Responsibility charting</div><div class=\"opt\" data-letter=\"D\">D) Structure change</div>", "ans": "C", "sata": false, "fb": "The transition from a homogenous workforce to a highly diverse one with a complex skills mix is likely to cause conflict around roles and jurisdictions. This type of conflict can be addressed by reviewing and reinforcing the responsibilities of each team member. Each of the other listed strategies may be necessary for some conflicts on the unit, but the most likely strategy is the one that directly addresses roles and responsibilities."}, {"ch": "Ch 21: Conflict, Workplace Violence, and Negotiation", "q": "A nurse -manager is mediating a conflict between two nurses on the unit. What goal should the manager prioritize when addressing this conflict?", "opts": "<div class=\"opt\" data-letter=\"A\">A) A solution is chosen that minimizes the effect on other employees.</div><div class=\"opt\" data-letter=\"B\">B) The nurses emerge from the resolution with a close personal relationship.</div><div class=\"opt\" data-letter=\"C\">C) A solution is identified that can be easily and quickly implemented.</div><div class=\"opt\" data-letter=\"D\">D) The nurses agree to a solution that is mutually beneficial.</div>", "ans": "D", "sata": false, "fb": "The optimal goal in resolving conflict is creating a win -win solution for all involved. Speed and ease of implementation are not priority goals and may in fact lead to a simplistic or hasty solution. It may be necessary for other employees to be affected by a fair and desirable solution. A win -win solution does not necessarily lead to the development of a close relationship between the parties."}, {"ch": "Ch 21: Conflict, Workplace Violence, and Negotiation", "q": "Two nurses in a small community are in conflict because the first nurse's son committed a violent assault on the second nurse's son. In recent weeks, workplace interactions between the two have become increasingly tense. What is the nurse -manager's best strategy for", "opts": "<div class=\"opt\" data-letter=\"A\">A) Confrontation</div><div class=\"opt\" data-letter=\"B\">B) Soothing</div><div class=\"opt\" data-letter=\"C\">C) Responsibility charting</div><div class=\"opt\" data-letter=\"D\">D) Structure change</div>", "ans": "D", "sata": false, "fb": "The manager does not have the ability to mitigate the realities of these nurses' relationship, and it may be unrealistic to expect them to set aside this significant event. As a result, it may be necessary for one of the nurses to change work locations. This issue has nothing to do with roles or responsibilities, so responsibility charting is irrelevant. Soothing is always a temporary solution. Confrontation has the potential to exacerbate this particular conflict because there is no solution that changes the facts of their circumstances."}];
let questions = [...ALL_QUESTIONS];
let current = 0;
let answers = {};       // index -> letter (normal) or Set of letters (sata)
let correctCount = 0, wrongCount = 0;
let wrongIndexes = new Set();

function init() {
  current = 0; answers = {}; correctCount = 0; wrongCount = 0; wrongIndexes = new Set();
  document.getElementById('stat-correct').textContent = '0';
  document.getElementById('stat-wrong').textContent = '0';
  document.getElementById('stat-remain').textContent = questions.length;
  document.getElementById('summary').style.display = 'none';
  document.getElementById('quiz-container').style.display = 'block';
  document.getElementById('wrong-btn').style.display = 'none';
  render();
}

function render() {
  if (current >= questions.length) { showSummary(); return; }
  const q = questions[current];
  document.getElementById('q-counter').textContent = 'Question ' + (current+1) + ' of ' + questions.length;
  document.getElementById('ch-tag').textContent = q.ch;

  const sataTag = document.getElementById('sata-tag');
  const legend  = document.getElementById('sata-legend');
  if (q.sata) {
    sataTag.style.display = 'inline-block';
    legend.style.display = 'block';
  } else {
    sataTag.style.display = 'none';
    legend.style.display = 'none';
  }

  document.getElementById('q-text').textContent = q.q;
  document.getElementById('options').innerHTML = q.opts;
  document.getElementById('feedback').style.display = 'none';
  document.getElementById('feedback-text').textContent = q.fb;
  document.getElementById('correct-badge').style.display = 'none';
  document.getElementById('wrong-badge').style.display  = 'none';
  document.getElementById('check-btn').style.display    = 'none';
  document.getElementById('progress').style.width = ((current / questions.length) * 100) + '%';
  document.getElementById('prev-btn').disabled = current === 0;
  document.getElementById('next-btn').textContent = current === questions.length - 1 ? 'Finish' : 'Next';

  const prev = answers[current];
  if (prev !== undefined) {
    if (q.sata) restoreMulti(prev, q.ans);
    else        revealSingle(prev, q.ans);
  } else {
    if (q.sata) attachMultiHandlers(q.ans);
    else        attachSingleHandlers(q.ans);
  }
}

// ── Single-answer ───────────────────────────────────────────────────────────
function attachSingleHandlers(correct) {
  document.querySelectorAll('.opt').forEach(o => {
    o.onclick = () => {
      if (answers[current] !== undefined) return;
      answers[current] = o.dataset.letter;
      updateStats(o.dataset.letter === correct);
      revealSingle(o.dataset.letter, correct);
    };
  });
}

function revealSingle(selected, correct) {
  document.querySelectorAll('.opt').forEach(o => {
    o.classList.add('locked'); o.onclick = null;
    if (o.dataset.letter === correct)                       o.classList.add('correct');
    if (o.dataset.letter === selected && selected !== correct) o.classList.add('wrong');
  });
  document.getElementById('feedback').style.display = 'block';
  const isCorrect = selected === correct;
  document.getElementById('correct-badge').style.display = isCorrect ? 'flex' : 'none';
  document.getElementById('wrong-badge').style.display   = isCorrect ? 'none' : 'flex';
}

// ── Multi-answer SATA ───────────────────────────────────────────────────────
let sataSelected = new Set();

function attachMultiHandlers(correctList) {
  sataSelected = new Set();
  document.querySelectorAll('.opt').forEach(o => {
    o.onclick = () => {
      if (o.classList.contains('locked')) return;
      const letter = o.dataset.letter;
      if (sataSelected.has(letter)) {
        sataSelected.delete(letter);
        o.classList.remove('selected');
      } else {
        sataSelected.add(letter);
        o.classList.add('selected');
      }
      document.getElementById('check-btn').style.display = sataSelected.size > 0 ? 'block' : 'none';
    };
  });
  document.getElementById('check-btn').onclick = () => submitMulti(correctList);
}

function submitMulti(correctList) {
  const correct = new Set(correctList);
  const isFullyCorrect = [...correct].every(l => sataSelected.has(l)) &&
                         [...sataSelected].every(l => correct.has(l));
  answers[current] = [...sataSelected];
  if (!isFullyCorrect) wrongIndexes.add(current);
  updateStats(isFullyCorrect);

  document.querySelectorAll('.opt').forEach(o => {
    o.classList.add('locked'); o.onclick = null;
    o.classList.remove('selected');
    const letter = o.dataset.letter;
    const wasSelected = sataSelected.has(letter);
    const isCorrect   = correct.has(letter);
    if (isCorrect && wasSelected)  o.classList.add('correct');
    if (!isCorrect && wasSelected) o.classList.add('wrong');
    if (isCorrect && !wasSelected) o.classList.add('missed');
  });
  document.getElementById('check-btn').style.display = 'none';
  document.getElementById('feedback').style.display  = 'block';
  document.getElementById('correct-badge').style.display = isFullyCorrect ? 'flex' : 'none';
  document.getElementById('wrong-badge').style.display   = isFullyCorrect ? 'none' : 'flex';
}

function restoreMulti(savedList, correctList) {
  const saved   = new Set(savedList);
  const correct = new Set(correctList);
  document.querySelectorAll('.opt').forEach(o => {
    o.classList.add('locked'); o.onclick = null;
    const letter = o.dataset.letter;
    const wasSelected = saved.has(letter);
    const isCorrect   = correct.has(letter);
    if (isCorrect && wasSelected)  o.classList.add('correct');
    if (!isCorrect && wasSelected) o.classList.add('wrong');
    if (isCorrect && !wasSelected) o.classList.add('missed');
  });
  document.getElementById('feedback').style.display = 'block';
  const isFullyCorrect = [...correct].every(l => saved.has(l)) && [...saved].every(l => correct.has(l));
  document.getElementById('correct-badge').style.display = isFullyCorrect ? 'flex' : 'none';
  document.getElementById('wrong-badge').style.display   = isFullyCorrect ? 'none' : 'flex';
}

// ── Stats ────────────────────────────────────────────────────────────────────
function updateStats(isCorrect) {
  if (isCorrect) correctCount++; else { wrongCount++; wrongIndexes.add(current); }
  document.getElementById('stat-correct').textContent = correctCount;
  document.getElementById('stat-wrong').textContent   = wrongCount;
  document.getElementById('stat-remain').textContent  = questions.length - Object.keys(answers).length;
}

// ── Nav ──────────────────────────────────────────────────────────────────────
function nextQ() {
  if (current < questions.length - 1) { current++; render(); } else showSummary();
}
function prevQ() { if (current > 0) { current--; render(); } }

// ── Summary ──────────────────────────────────────────────────────────────────
function showSummary() {
  document.getElementById('quiz-container').style.display = 'none';
  document.getElementById('summary').style.display = 'block';
  const total   = questions.length;
  const skipped = total - Object.keys(answers).length;
  const pct     = total > 0 ? Math.round((correctCount/total)*100) : 0;
  document.getElementById('sum-score').textContent   = correctCount + '/' + total;
  document.getElementById('sum-pct').textContent     = pct + '%';
  document.getElementById('sum-correct').textContent = correctCount;
  document.getElementById('sum-wrong').textContent   = wrongCount;
  document.getElementById('sum-skipped').textContent = skipped;
  let msg = '';
  if (pct >= 92) msg = 'A — Outstanding! You are very well prepared.';
  else if (pct >= 83) msg = 'B — Good work. A few more rounds and you are set.';
  else if (pct >= 75) msg = 'C — Passing, but push for deeper mastery before exam day.';
  else msg = 'Below passing — focus on rationales for wrong answers and review those chapters.';
  document.getElementById('sum-msg').textContent = msg;
  document.getElementById('progress').style.width = '100%';
  if (wrongIndexes.size > 0) document.getElementById('wrong-btn').style.display = 'inline-block';
}

// ── Controls ─────────────────────────────────────────────────────────────────
function shuffleQuestions() {
  for (let i = questions.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i+1));
    [questions[i], questions[j]] = [questions[j], questions[i]];
  }
  init();
}
function resetQuiz() {
  questions = [...ALL_QUESTIONS];
  document.getElementById('ch-filter').value = 'all';
  init();
}
function filterByChapter() {
  const val = document.getElementById('ch-filter').value;
  questions = val === 'all' ? [...ALL_QUESTIONS]
    : ALL_QUESTIONS.filter(q => q.ch.startsWith('Ch ' + val + ':'));
  init();
}
function showOnlyWrong() {
  if (wrongIndexes.size === 0) return;
  questions = [...wrongIndexes].map(i => questions[i]);
  init();
}

document.addEventListener('keydown', e => {
  const key = e.key.toUpperCase();
  if (['A','B','C','D','E'].includes(key)) {
    document.querySelectorAll('.opt').forEach(o => { if (o.dataset.letter === key) o.click(); });
  }
  if ((e.key === 'ArrowRight' || e.key === 'Enter') && answers[current] !== undefined) nextQ();
  if (e.key === 'ArrowLeft') prevQ();
});

init();
</script>
