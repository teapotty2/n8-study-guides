<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGN Cardiac Practice Exam v2</title>
    <style>
        :root {
            --primary: #1a365d;
            --secondary: #2c5282;
            --accent: #3182ce;
            --cardiac: #E74C3C;
            --bg: #f0f4f8;
            --card: #ffffff;
            --text: #1a202c;
            --green: #38a169;
            --red: #e53e3e;
            --orange: #dd6b20;
            --muted: #718096;
            --border: #e2e8f0;
            --radius: 12px
        }

        [data-theme="dark"] {
            --bg: #0f1117;
            --card: #1a1d2e;
            --text: #e2e8f0;
            --border: #2d3148;
            --muted: #8892b0
        }

        /* RESET */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6
        }

        #app {
            max-width: 1100px;
            margin: 0 auto;
            padding: 1rem
        }

        /* DARK MODE TOGGLE */
        .theme-toggle {
            position: fixed;
            top: 1rem;
            right: 1rem;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 2px solid var(--border);
            background: var(--card);
            color: var(--text);
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: all .2s;
            box-shadow: 0 2px 8px rgba(0,0,0,.12)
        }

        .theme-toggle:hover {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent)
        }

        /* HEADER */
        .exam-header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #fff;
            padding: 1.5rem 2rem;
            border-radius: var(--radius);
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem
        }

        .exam-header h1 {
            font-size: 1.5rem;
            font-weight: 700
        }

        .progress-wrap {
            flex: 1;
            min-width: 200px;
            max-width: 400px
        }

        .progress-bar {
            height: 8px;
            background: rgba(255, 255, 255, .2);
            border-radius: 4px;
            overflow: hidden
        }

        .progress-fill {
            height: 100%;
            background: #68d391;
            border-radius: 4px;
            transition: width .4s
        }

        .progress-text {
            font-size: .8rem;
            opacity: .8;
            margin-top: 4px;
            text-align: right
        }

        /* START SCREEN */
        .start-screen {
            text-align: center;
            padding: 3rem 2rem;
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: 0 2px 12px rgba(0, 0, 0, .08)
        }

        .start-screen h2 {
            font-size: 2rem;
            color: var(--primary);
            margin-bottom: 1rem
        }

        .start-screen p {
            color: var(--muted);
            margin-bottom: .5rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto
        }

        .exam-stats {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin: 2rem 0;
            flex-wrap: wrap
        }

        .stat-box {
            background: var(--bg);
            padding: 1rem 1.5rem;
            border-radius: 8px;
            min-width: 120px
        }

        .stat-box .num {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--accent)
        }

        .stat-box .lbl {
            font-size: .8rem;
            color: var(--muted)
        }

        /* FILTER GROUP */
        .filter-group {
            display: flex;
            flex-wrap: wrap;
            gap: .5rem;
            justify-content: center;
            margin: 1.5rem 0
        }

        .filter-group .btn {
            font-size: .85rem;
            padding: .5rem 1rem
        }

        .filter-group .btn.active {
            background: var(--accent);
            color: #fff
        }

        /* RESUME BANNER */
        .resume-banner {
            background: var(--card);
            border: 2px solid var(--accent);
            border-radius: var(--radius);
            padding: 1rem 1.5rem;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: .75rem;
            box-shadow: 0 2px 8px rgba(0,0,0,.06)
        }

        .resume-banner p {
            color: var(--text);
            font-weight: 600
        }

        .resume-banner .btn {
            font-size: .85rem
        }

        /* BUTTONS */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: .5rem;
            padding: .7rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all .2s
        }

        .btn-primary {
            background: var(--accent);
            color: #fff
        }

        .btn-primary:hover {
            background: var(--secondary)
        }

        .btn-success {
            background: var(--green);
            color: #fff
        }

        .btn-success:hover {
            filter: brightness(.9)
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--accent);
            color: var(--accent)
        }

        .btn-outline:hover {
            background: var(--accent);
            color: #fff
        }

        .btn:disabled {
            opacity: .5;
            cursor: not-allowed
        }

        /* QUESTION CARD */
        .q-card {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: 0 2px 12px rgba(0, 0, 0, .08);
            overflow: hidden
        }

        .q-header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #fff;
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: .5rem
        }

        .q-num {
            font-weight: 700;
            font-size: 1.1rem
        }

        .q-badge {
            font-size: .75rem;
            padding: 3px 10px;
            border-radius: 20px;
            font-weight: 600
        }

        .badge-case {
            background: rgba(255, 255, 255, .2)
        }

        .badge-cjmm {
            background: #68d391;
            color: #1a365d
        }

        .badge-ngn {
            background: #fbd38d;
            color: #7b341e
        }

        .badge-trad {
            background: rgba(255, 255, 255, .15)
        }

        .q-type {
            font-size: .75rem;
            opacity: .8
        }

        .q-body {
            padding: 1.5rem
        }

        .q-stem {
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 1.2rem;
            line-height: 1.5
        }

        .q-actions {
            padding: 1rem 1.5rem;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center
        }

        /* CASE STUDY LAYOUT */
        .case-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0
        }

        .case-chart {
            background: var(--bg);
            border-right: 2px solid var(--border);
            max-height: 500px;
            overflow-y: auto
        }

        .case-tabs {
            display: flex;
            border-bottom: 2px solid var(--border);
            background: var(--primary);
            overflow-x: auto
        }

        .case-tab {
            padding: .6rem 1rem;
            font-size: .8rem;
            font-weight: 600;
            color: rgba(255, 255, 255, .7);
            cursor: pointer;
            white-space: nowrap;
            border: none;
            background: none;
            transition: all .2s
        }

        .case-tab.active {
            color: #fff;
            background: rgba(255, 255, 255, .1);
            border-bottom: 2px solid #68d391
        }

        .tab-content {
            padding: 1rem;
            font-size: .9rem;
            display: none
        }

        .tab-content.active {
            display: block
        }

        .tab-content table {
            width: 100%;
            border-collapse: collapse;
            font-size: .85rem;
            margin: .5rem 0
        }

        .tab-content th,
        .tab-content td {
            padding: 6px 8px;
            border: 1px solid var(--border);
            text-align: left
        }

        .tab-content th {
            background: var(--primary);
            color: #fff;
            font-weight: 600
        }

        @media(max-width:768px) {
            .case-layout {
                grid-template-columns: 1fr
            }

            .case-chart {
                max-height: 300px;
                border-right: none;
                border-bottom: 2px solid var(--border)
            }
        }

        /* HIGHLIGHT TYPE */
        .hl-passage {
            line-height: 1.8;
            font-size: .95rem
        }

        .hl-span {
            padding: 2px 4px;
            border-radius: 3px;
            cursor: pointer;
            transition: all .2s;
            border-bottom: 2px dashed var(--border)
        }

        .hl-span:hover {
            background: #bee3f8
        }

        .hl-span.selected {
            background: #fefcbf;
            border-bottom-color: var(--orange)
        }

        .hl-span.correct {
            background: #c6f6d5 !important;
            border-bottom-color: var(--green) !important
        }

        .hl-span.wrong {
            background: #fed7d7 !important;
            border-bottom-color: var(--red) !important
        }

        .hl-span.missed {
            background: #c6f6d5;
            border: 2px dashed var(--green)
        }

        /* DROPDOWN / CLOZE */
        .cloze-text {
            line-height: 2.2;
            font-size: .95rem
        }

        .cloze-select {
            padding: 4px 8px;
            border: 2px solid var(--accent);
            border-radius: 6px;
            font-size: .9rem;
            font-weight: 600;
            color: var(--primary);
            background: var(--card);
            cursor: pointer;
            min-width: 160px
        }

        .cloze-select.correct {
            border-color: var(--green);
            background: #c6f6d5
        }

        .cloze-select.wrong {
            border-color: var(--red);
            background: #fed7d7
        }

        /* MATRIX GRID */
        .matrix-table {
            width: 100%;
            border-collapse: collapse;
            font-size: .9rem
        }

        .matrix-table th,
        .matrix-table td {
            padding: 10px 12px;
            border: 1px solid var(--border);
            text-align: center
        }

        .matrix-table th {
            background: var(--primary);
            color: #fff
        }

        .matrix-table td:first-child {
            text-align: left;
            font-weight: 500;
            background: var(--bg)
        }

        .matrix-table input[type=radio],
        .matrix-table input[type=checkbox] {
            width: 18px;
            height: 18px;
            cursor: pointer
        }

        .matrix-row.correct td:first-child {
            border-left: 4px solid var(--green)
        }

        .matrix-row.wrong td:first-child {
            border-left: 4px solid var(--red)
        }

        /* SELECT N */
        .select-n-count {
            font-size: .9rem;
            color: var(--accent);
            font-weight: 600;
            margin-bottom: .8rem;
            padding: 6px 12px;
            background: var(--bg);
            border-radius: 6px;
            display: inline-block
        }

        .opt-list {
            list-style: none
        }

        .opt-item {
            padding: 10px 14px;
            margin: 6px 0;
            border: 2px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all .2s
        }

        .opt-item:hover {
            border-color: var(--accent);
            background: var(--bg)
        }

        .opt-item.checked {
            border-color: var(--accent);
            background: var(--bg)
        }

        .opt-item.correct {
            border-color: var(--green) !important;
            background: #c6f6d5 !important
        }

        .opt-item.wrong {
            border-color: var(--red) !important;
            background: #fed7d7 !important
        }

        .opt-item.missed {
            border-color: var(--green);
            border-style: dashed
        }

        .opt-check {
            width: 20px;
            height: 20px;
            border: 2px solid var(--border);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 14px
        }

        .opt-item.checked .opt-check {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff
        }

        /* DRAG & DROP / ORDERED */
        .drag-source {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 1rem;
            min-height: 44px
        }

        .drag-pill {
            padding: 8px 14px;
            background: var(--bg);
            border: 2px solid var(--accent);
            border-radius: 8px;
            cursor: pointer;
            font-size: .9rem;
            font-weight: 500;
            transition: all .2s;
            user-select: none
        }

        .drag-pill:hover {
            background: var(--accent);
            color: #fff
        }

        .drag-pill.placed {
            opacity: .4;
            pointer-events: none
        }

        .drop-slots {
            counter-reset: slot
        }

        .drop-slot {
            padding: 10px 14px;
            margin: 6px 0;
            border: 2px dashed var(--border);
            border-radius: 8px;
            min-height: 44px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all .2s
        }

        .drop-slot::before {
            counter-increment: slot;
            content: counter(slot);
            background: var(--primary);
            color: #fff;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: .8rem;
            flex-shrink: 0
        }

        .drop-slot.filled {
            border-color: var(--accent);
            background: var(--bg)
        }

        .drop-slot.correct {
            border-color: var(--green);
            background: #c6f6d5
        }

        .drop-slot.wrong {
            border-color: var(--red);
            background: #fed7d7
        }

        .slot-content {
            flex: 1
        }

        .slot-remove {
            cursor: pointer;
            color: var(--red);
            font-weight: 700;
            font-size: 1.2rem
        }

        /* BOWTIE */
        .bowtie-wrap {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 1rem;
            align-items: center;
            margin: 1rem 0
        }

        .bowtie-col {
            display: flex;
            flex-direction: column;
            gap: .5rem
        }

        .bowtie-center {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #fff;
            padding: 1rem;
            border-radius: var(--radius);
            text-align: center;
            font-weight: 700;
            min-width: 140px
        }

        .bowtie-target {
            border: 2px dashed var(--border);
            border-radius: 8px;
            padding: 10px;
            min-height: 50px;
            text-align: center;
            cursor: pointer;
            transition: all .2s;
            font-size: .9rem
        }

        .bowtie-target.filled {
            border-color: var(--accent);
            background: var(--bg);
            border-style: solid
        }

        .bowtie-target.correct {
            border-color: var(--green);
            background: #c6f6d5
        }

        .bowtie-target.wrong {
            border-color: var(--red);
            background: #fed7d7
        }

        .bowtie-label {
            font-size: .75rem;
            color: var(--muted);
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 4px
        }

        @media(max-width:600px) {
            .bowtie-wrap {
                grid-template-columns: 1fr;
                gap: .5rem
            }
            .bowtie-center { min-width: unset }
            .bowtie-target { font-size: .82rem; padding: 8px }
        }

        /* TREND */
        .trend-table {
            width: 100%;
            border-collapse: collapse;
            font-size: .85rem;
            margin: 1rem 0
        }

        .trend-table th {
            background: var(--primary);
            color: #fff;
            padding: 8px;
            position: sticky;
            top: 0
        }

        .trend-table td {
            padding: 8px;
            border: 1px solid var(--border);
            text-align: center
        }

        .trend-table tr:nth-child(even) {
            background: var(--bg)
        }

        .trend-alert {
            color: var(--red);
            font-weight: 700
        }

        /* MC / SATA */
        .mc-list {
            list-style: none
        }

        .mc-opt {
            padding: 12px 16px;
            margin: 6px 0;
            border: 2px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            transition: all .2s;
            display: flex;
            align-items: center;
            gap: 12px
        }

        .mc-opt:hover {
            border-color: var(--accent);
            background: var(--bg)
        }

        .mc-opt.selected {
            border-color: var(--accent);
            background: var(--bg)
        }

        .mc-opt.correct {
            border-color: var(--green) !important;
            background: #c6f6d5 !important
        }

        .mc-opt.wrong {
            border-color: var(--red) !important;
            background: #fed7d7 !important
        }

        .mc-letter {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: .85rem;
            flex-shrink: 0
        }

        .mc-opt.selected .mc-letter {
            background: var(--accent);
            color: #fff
        }

        /* FILL IN BLANK */
        .fill-input {
            padding: 8px 14px;
            border: 2px solid var(--accent);
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 700;
            width: 120px;
            text-align: center;
            color: var(--primary);
            background: var(--card)
        }

        .fill-input.correct {
            border-color: var(--green);
            background: #c6f6d5
        }

        .fill-input.wrong {
            border-color: var(--red);
            background: #fed7d7
        }

        .fill-unit {
            font-weight: 600;
            color: var(--muted);
            margin-left: 8px
        }

        /* FEEDBACK */
        .feedback {
            margin-top: 1rem;
            padding: 1rem 1.2rem;
            border-radius: 8px;
            font-size: .9rem;
            display: none
        }

        .feedback.show {
            display: block
        }

        .feedback.pass {
            background: #c6f6d5;
            border-left: 4px solid var(--green)
        }

        .feedback.fail {
            background: #fed7d7;
            border-left: 4px solid var(--red)
        }

        .feedback.partial {
            background: #fefcbf;
            border-left: 4px solid var(--orange)
        }

        .feedback strong {
            display: block;
            margin-bottom: 4px
        }

        .score-chip {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: .8rem;
            font-weight: 700;
            margin-left: 8px
        }

        .score-chip.full {
            background: var(--green);
            color: #fff
        }

        .score-chip.part {
            background: var(--orange);
            color: #fff
        }

        .score-chip.zero {
            background: var(--red);
            color: #fff
        }

        /* RESULTS SCREEN */
        .results {
            text-align: center;
            padding: 2rem;
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: 0 2px 12px rgba(0, 0, 0, .08)
        }

        .results h2 {
            color: var(--primary);
            margin-bottom: 1rem
        }

        .score-circle {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: conic-gradient(var(--green) calc(var(--pct) * 1%), var(--border) 0);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 1.5rem auto
        }

        .score-inner {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: var(--card);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center
        }

        .score-inner .pct {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--primary)
        }

        .score-inner .lbl {
            font-size: .8rem;
            color: var(--muted)
        }

        .breakdown {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin: 2rem 0;
            text-align: left
        }

        .bd-card {
            padding: 1rem;
            background: var(--bg);
            border-radius: 8px
        }

        .bd-card h4 {
            font-size: .85rem;
            color: var(--muted);
            margin-bottom: 4px
        }

        .bd-card .val {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--primary)
        }

        /* DROPDOWN TABLE */
        .dd-table {
            width: 100%;
            border-collapse: collapse;
            font-size: .9rem
        }

        .dd-table th,
        .dd-table td {
            padding: 10px;
            border: 1px solid var(--border)
        }

        .dd-table th {
            background: var(--primary);
            color: #fff
        }

        .dd-table select {
            padding: 4px 6px;
            border: 2px solid var(--accent);
            border-radius: 6px;
            font-size: .85rem;
            font-weight: 600;
            width: 100%;
            background: var(--card);
            color: var(--text)
        }

        /* HIGHLIGHT TABLE */
        .hl-table {
            width: 100%;
            border-collapse: collapse;
            font-size: .9rem
        }

        .hl-table th,
        .hl-table td {
            padding: 10px;
            border: 1px solid var(--border);
            text-align: center
        }

        .hl-table th {
            background: var(--primary);
            color: #fff
        }

        .hl-table td.hlable {
            cursor: pointer;
            transition: all .2s
        }

        .hl-table td.hlable:hover {
            background: #bee3f8
        }

        .hl-table td.hlable.selected {
            background: #fefcbf
        }

        .hl-table td.hlable.correct {
            background: #c6f6d5 !important
        }

        .hl-table td.hlable.wrong {
            background: #fed7d7 !important
        }

        /* REVIEW MODE GRID */
        .q-grid {

        }

            height: 44px;
            border: 2px solid var(--border);
            border-radius: 8px;
            background: var(--card);
            color: var(--text);
            font-weight: 700;
            font-size: .9rem;
            cursor: pointer;
            transition: all .2s;
            display: flex;
            align-items: center;
            justify-content: center
        }

            border-color: var(--accent);
            background: var(--bg)
        }

        .q-grid button.current {
            border-color: var(--accent);
            background: var(--accent);
            color: #fff
        }

        .q-grid button.answered {
            border-color: var(--green);
            background: var(--green);
            color: #fff
        }

            border-color: var(--red);
            background: var(--red);
            color: #fff
        }

        .q-grid button.partial-answer {
            border-color: var(--orange);
            background: var(--orange);
            color: #fff
        }

            background: rgba(221, 107, 32, .25)

            /* Trend table — horizontal scroll */

            /* Cloze */
            .cloze-select { min-width: 120px; font-size: .82rem }

            /* Highlight */

  topic: "DIC"
});

}

// ===== VALIDATE DATA =====
function validateData() {
    const types = ['highlight','cloze','matrix','selectN','ordered','bowtie','mc','sata','fillin'];
    Q.forEach((q, i) => {
        if (!types.includes(q.type)) console.warn(`Q${q.id}: unknown type "${q.type}"`);
        if (!q.rationale) console.warn(`Q${q.id}: missing rationale`);
        if (q.type === 'cloze' && (!q.selects || !q.text)) console.warn(`Q${q.id}: cloze missing selects or text`);
        if (q.type === 'highlight' && !q.phrases) console.warn(`Q${q.id}: highlight missing phrases`);
        if (q.type === 'matrix' && (!q.rows || !q.cols || !q.correct)) console.warn(`Q${q.id}: matrix missing fields`);
        if (q.type === 'selectN' && !q.n) console.warn(`Q${q.id}: selectN missing n`);
        if (q.type === 'ordered' && !q.items) console.warn(`Q${q.id}: ordered missing items`);
        if (q.type === 'bowtie' && (!q.actions || !q.condition || !q.parameters)) console.warn(`Q${q.id}: bowtie missing fields`);
        if (q.type === 'mc' && (q.correct === undefined || !q.opts)) console.warn(`Q${q.id}: mc missing fields`);
        if (q.type === 'sata' && !q.opts) console.warn(`Q${q.id}: sata missing opts`);
        if (q.type === 'fillin' && q.answer === undefined) console.warn(`Q${q.id}: fillin missing answer`);
        if (q.caseId && !CASES.find(c => c.id === q.caseId)) console.warn(`Q${q.id}: references missing case ${q.caseId}`);
    });
    console.log(`validateData: ${Q.length} questions checked`);
}
validateData();

// ===== NORMALIZE DATA =====
// Data may use {text, correct} or {t, c} for options, and "options" or "opts" as key.
// Normalize everything to {t, c} under q.opts so renderers/scorers stay clean.
Q.forEach(q => {
    // Normalize opts/options → q.opts with {t, c}
    if (q.options && !q.opts) { q.opts = q.options; delete q.options; }
    if (q.opts) {
        q.opts = q.opts.map(o => {
            if (typeof o === 'string') return { t: o, c: false };
            if (o.t !== undefined) return o;
            return { t: o.text || o.label || String(o), c: !!(o.correct || o.c) };
        });
    }
    // Normalize phrases → {t, c}
    if (q.phrases) {
        q.phrases = q.phrases.map(p => {
            if (p.t !== undefined) return p;
            return { t: p.text || String(p), c: !!(p.correct || p.c) };
        });
    }
    // Normalize cloze selects → {opts: [...], correct: N}
    if (q.selects) {
        q.selects = q.selects.map(s => {
            if (s.opts) return s;
            return { opts: s.options || s.opts || [], correct: s.correct };
        });
    }
});

// ===== SHUFFLE =====
function shuffle(a) {
    const arr = [...a];
    for (let i = arr.length - 1; i > 0; i--) { let j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
    return arr;
}

// ===== LOCAL STORAGE =====
function saveState() {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ cur, scores, submitted: [...submitted], answers, examQs: examQs.map(q => q.id), mode }));
    } catch(e) {}
}
function loadState() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return null;
        const s = JSON.parse(raw);
        if (!s || !s.examQs) return null;
        return s;
    } catch(e) { return null; }
}
function clearState() { try { localStorage.removeItem(STORAGE_KEY); } catch(e) {} }

// ===== START SCREEN =====

            </div>

let activeFilter = 'all';
let activeSize = 60; // default to Full (60)
function setFilter(btn) {
    document.querySelectorAll('.filter-btn').forEach(b => { b.classList.remove('active'); b.classList.add('btn-outline'); b.classList.remove('btn-primary'); });
    btn.classList.add('active'); btn.classList.add('btn-primary'); btn.classList.remove('btn-outline');
    activeFilter = btn.dataset.filter;
}
function setSize(btn) {
    document.querySelectorAll('.size-btn').forEach(b => { b.classList.remove('active'); b.classList.add('btn-outline'); b.classList.remove('btn-primary'); });
    btn.classList.add('active'); btn.classList.add('btn-primary'); btn.classList.remove('btn-outline');
    activeSize = parseInt(btn.dataset.size);
}

function getFilteredQs() {
    if (activeFilter === 'all') return [...Q];
    if (activeFilter === 'case') return Q.filter(q => q.caseId);
    if (activeFilter === 'ngn') return Q.filter(q => !q.caseId && ['bowtie','selectN','cloze','highlight','matrix'].includes(q.type));
    if (activeFilter === 'trad') return Q.filter(q => !q.caseId && ['mc','sata','ordered','fillin'].includes(q.type));
    return [...Q];
}

// Sample N questions from pool while preserving the ratio of question categories.
// Case study questions are kept as complete groups (all 6 Qs per case stay together).
function sampleByRatio(pool, n) {
    if (n <= 0 || n >= pool.length) return pool;

    // Bucket into 3 categories: case groups, NGN standalone, traditional
    const caseGroups = {}; // caseId -> [q, q, ...]
    const ngn = [];
    const trad = [];
    pool.forEach(q => {
        if (q.caseId) {
            if (!caseGroups[q.caseId]) caseGroups[q.caseId] = [];
            caseGroups[q.caseId].push(q);
        } else if (['bowtie','selectN','cloze','highlight','matrix'].includes(q.type)) ngn.push(q);
        else trad.push(q);
    });

    const caseGroupList = Object.values(caseGroups); // each is an array of 6 Qs
    const totalCase = caseGroupList.reduce((a, g) => a + g.length, 0);
    const total = pool.length;

    // Calculate proportional targets
    const caseTarget = Math.round(n * (totalCase / total));
    const ngnTarget = Math.round(n * (ngn.length / total));
    const tradTarget = n - caseTarget - ngnTarget; // remainder goes to trad to avoid rounding gaps

    // For case questions, pick whole groups that get closest to caseTarget
    const shuffledGroups = shuffle(caseGroupList);
    const pickedCaseQs = [];
    for (const group of shuffledGroups) {
        if (pickedCaseQs.length + group.length <= Math.max(caseTarget, 6)) {
            pickedCaseQs.push(...group);
        }
        if (pickedCaseQs.length >= caseTarget) break;
    }

    // Pick standalone NGN and traditional
    const pickedNgn = shuffle(ngn).slice(0, Math.max(0, ngnTarget));
    // Adjust trad count to hit total target after case rounding
    const tradNeeded = n - pickedCaseQs.length - pickedNgn.length;
    const pickedTrad = shuffle(trad).slice(0, Math.max(0, tradNeeded));

    return [...pickedCaseQs, ...pickedNgn, ...pickedTrad];
}

function startExam() {
    let qs = getFilteredQs();
    if (qs.length === 0) { alert('No questions match the selected filter.'); return; }

    // Apply size limit with ratio preservation
    if (activeSize > 0 && activeSize < qs.length) {
        qs = sampleByRatio(qs, activeSize);
    }

    const doRandom = document.getElementById('randomizeChk') && document.getElementById('randomizeChk').checked;
    if (doRandom || activeSize > 0) {
        // Always shuffle when sampling (otherwise you'd get the same subset every time)
        const caseQs = {};
        const standalone = [];
        qs.forEach(q => {
            if (q.caseId) {
                if (!caseQs[q.caseId]) caseQs[q.caseId] = [];
                caseQs[q.caseId].push(q);
            } else standalone.push(q);
        });
        const shuffledStandalone = shuffle(standalone);
        const caseGroups = shuffle(Object.values(caseQs));
        const result = [...shuffledStandalone];
        caseGroups.forEach(group => {
            const pos = Math.floor(Math.random() * (result.length + 1));
            result.splice(pos, 0, ...group);
        });
        qs = result;
    }
    // Shuffle option order for MC/SATA/selectN so correct answers aren't always in the same position
    qs.forEach(q => {
        if (q.type === 'sata' || q.type === 'selectN') {
            q.opts = shuffle(q.opts);
        } else if (q.type === 'mc') {
            const correctOpt = q.opts[q.correct];
            q.opts = shuffle(q.opts);
            q.correct = q.opts.indexOf(correctOpt);
        }
    });
    examQs = qs;
    cur = 0; scores = new Array(qs.length).fill(null); submitted = new Set(); answers = {}; mode = 'exam';
    saveState();
    renderQ();
}

function resumeExam() {
    const s = loadState();
    if (!s) { showStart(); return; }
    examQs = s.examQs.map(id => Q.find(q => q.id === id)).filter(Boolean);
    cur = s.cur; scores = s.scores || new Array(examQs.length).fill(null);
    submitted = new Set(s.submitted || []);
    answers = s.answers || {};
    mode = s.mode || 'exam';
    renderQ();
}

// ===== GET CASE =====
function getCaseForQ(q) { return CASES.find(c => c.id === q.caseId); }

// ===== RENDER CHART (CASE TABS) =====
function renderChart(cs, q) {
    const tabs = q.useTabs2 && cs.tabs2 ? cs.tabs2 : cs.tabs;
    const keys = Object.keys(tabs);
    let html = `<div class="case-tabs">${keys.map((k, i) => `<button class="case-tab${i === 0 ? ' active' : ''}" data-tabkey="${k}">${tabs[k].label}</button>`).join('')}</div>`;
    keys.forEach((k, i) => { html += `<div class="tab-content${i === 0 ? ' active' : ''}" data-tab="${k}">${tabs[k].content}</div>`; });
    return html;
}

// ===== TAB SWITCHING (event delegation) =====
document.addEventListener('click', function(e) {
    const tab = e.target.closest('.case-tab');
    if (!tab) return;
    const chart = tab.closest('.case-chart');
    if (!chart) return;
    const key = tab.dataset.tabkey;
    chart.querySelectorAll('.case-tab').forEach(t => t.classList.remove('active'));
    chart.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    const panel = chart.querySelector(`[data-tab="${key}"]`);
    if (panel) panel.classList.add('active');
});

// ===== BADGES =====
function badge(q) {
    let b = '';
    if (q.caseId) { const cs = getCaseForQ(q); b += `<span class="q-badge badge-case">Case ${q.caseId}: ${cs ? cs.title : ''}</span> `; }
    if (q.cjmm) b += `<span class="q-badge badge-cjmm">${q.cjmm}</span> `;
    const typeLabels = { highlight:'Highlight Text', cloze:'Drop-Down Cloze', matrix:'Matrix Grid', selectN:`Select ${q.n||'N'}`, ordered:'Ordered Response', bowtie:'Bow-Tie', mc:'Multiple Choice', sata:'Select All That Apply', fillin:'Fill-in-the-Blank' };
    const cat = q.caseId ? 'badge-case' : (['bowtie','selectN','cloze','highlight','matrix'].includes(q.type) ? 'badge-ngn' : 'badge-trad');
    b += `<span class="q-badge ${cat}">${typeLabels[q.type] || q.type}</span>`;
    return b;
}

// ===== MAIN RENDER =====
function renderQ() {
    if (cur >= examQs.length) { showResults(); return; }
    const q = examQs[cur];
    const cs = q.caseId ? getCaseForQ(q) : null;
    const isCase = !!cs;
    const isSubmitted = submitted.has(cur);

    const header = `<div class="q-header"><span class="q-num">Question ${cur + 1} of ${examQs.length}</span><div>${badge(q)}</div></div>`;

    const renderers = {
        highlight: renderHighlight, cloze: renderCloze, matrix: renderMatrix,
        selectN: renderSelectN, ordered: renderOrdered, bowtie: renderBowtie,
        mc: renderMC, sata: renderSATA, fillin: renderFillin
    };
    const renderer = renderers[q.type];
    const body = renderer ? renderer(q) : `<p style="color:var(--red)">Unknown question type: ${q.type}</p>`;

    const navBtns = `${cur > 0 ? `<button class="btn btn-outline" onclick="prevQ()">\u2190 Prev</button>` : '<span></span>'}`;
    const submitBtn = isSubmitted
        ? `<button class="btn btn-success" onclick="nextQ()">Next \u2192</button>`
        : `<button class="btn btn-primary" id="submitBtn" onclick="submitAnswer()">Submit Answer</button>`;

    const actions = `<div class="q-actions">${navBtns}<div>${submitBtn}<span id="scoreArea">${isSubmitted && scores[cur] ? ` <span class="score-chip ${scores[cur].pct===100?'full':scores[cur].pct>0?'part':'zero'}">${scores[cur].earned}/${scores[cur].possible} (${scores[cur].pct}%)</span>` : ''}</div></div>`;
    const fb = `<div class="feedback" id="feedback"></div>`;

    let inner;
    if (isCase) {
        inner = `<div class="case-layout"><div class="case-chart">${renderChart(cs, q)}</div><div><div class="q-body"><div class="q-stem">${q.stem}</div>${body}</div>${fb}${actions}</div></div>`;
    } else {
        inner = `<div class="q-body"><div class="q-stem">${q.stem.replace(/\n/g,'<br>')}</div>${body}</div>${fb}${actions}`;
    }

    const reviewGrid = mode === 'review' ? `<div class="q-grid">${examQs.map((qq,i) => `<div class="q-grid-item${i===cur?' current':''}${submitted.has(i)?' answered':''}" onclick="goToQ(${i})">${i+1}</div>`).join('')}</div>` : '';

    app.innerHTML = `
    <div class="exam-header">
        <h1>NGN Cardiac Practice Exam</h1>
        <div class="progress-wrap">
            <div class="progress-bar"><div class="progress-fill" style="width:${((cur+1)/examQs.length)*100}%"></div></div>
            <div class="progress-text">${cur+1}/${examQs.length} ${mode==='review'?'(Review Mode)':''}</div>
        </div>
    </div>
    ${reviewGrid}
    <div class="q-card">${header}${inner}</div>`;

    if (isSubmitted) showFeedback(q);
}

// ===== TYPE RENDERERS =====
function renderHighlight(q) {
    return `<div class="hl-passage">${q.phrases.map((p, i) => `<span class="hl-span" data-idx="${i}">${p.t}</span> `).join('')}</div>`;
}
function renderCloze(q) {
    const parts = q.text.split(/\|(\d+)\|/);
    let html = '<div class="cloze-text">';
    parts.forEach((p, i) => {
        if (i % 2 === 1) {
            const idx = parseInt(p); const s = q.selects[idx];
            html += `<select class="cloze-select" data-idx="${idx}"><option value="">-- Select --</option>${s.opts.map((o, j) => `<option value="${j}">${o}</option>`).join('')}</select>`;
        } else html += p;
    });
    return html + '</div>';
}
function renderMatrix(q) {
    // Build shuffled index array so rows don't always appear in data order
    const indices = q.rows.map((_, i) => i);
    for (let i = indices.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [indices[i], indices[j]] = [indices[j], indices[i]]; }
    // Store shuffle map so scoring can find the original index
    q._shuffledIndices = indices;
    let html = `<table class="matrix-table"><tr><th></th>${q.cols.map(c => `<th>${c}</th>`).join('')}</tr>`;
    indices.forEach((origIdx, displayIdx) => {
        html += `<tr class="matrix-row" data-row="${origIdx}"><td>${q.rows[origIdx]}</td>${q.cols.map((c, j) => `<td><input type="radio" name="matrix_${q.id}_${origIdx}" value="${j}"></td>`).join('')}</tr>`;
    });
    return html + '</table>';
}
function renderSelectN(q) {
    return `<div class="select-n-count">Select exactly ${q.n}</div><ul class="opt-list">${q.opts.map((o, i) => `<li class="opt-item" data-idx="${i}"><div class="opt-check">\u2713</div><span>${o.t}</span></li>`).join('')}</ul>`;
}
function renderOrdered(q) {
    const shuffled = shuffle(q.items.map((item, i) => ({ t: item, origIdx: i })));
    let html = `<div class="drag-source" id="dragSrc">${shuffled.map(it => `<div class="drag-pill" data-orig="${it.origIdx}">${it.t}</div>`).join('')}</div><div class="drop-slots" id="dropSlots">`;
    for (let i = 0; i < q.items.length; i++) html += `<div class="drop-slot" data-pos="${i}"><span class="slot-content"></span></div>`;
    return html + '</div>';
}
function renderBowtie(q) {
    const allA = shuffle([...q.allActions]), allC = shuffle([...q.allConditions]), allP = shuffle([...q.allParams]);
    const allPills = [...allA, ...allC, ...allP];
    return `<p style="margin-bottom:.5rem;color:var(--muted);font-size:.85rem">Click an option, then click a target box to place it.</p>
<div style="margin-bottom:1rem"><strong>Available Options:</strong>
<div class="drag-source" id="btSrc">${allPills.map(o => `<div class="drag-pill" data-val="${o}">${o}</div>`).join('')}</div></div>
<div class="bowtie-wrap">
<div class="bowtie-col"><div class="bowtie-label">Actions to Take</div>
<div class="bowtie-target" data-slot="a1">Click to place</div>
<div class="bowtie-target" data-slot="a2">Click to place</div></div>
<div class="bowtie-center"><div class="bowtie-label" style="color:rgba(255,255,255,.7)">Condition</div>
<div class="bowtie-target" data-slot="cond" style="background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.3)">Click to place</div></div>
<div class="bowtie-col"><div class="bowtie-label">Parameters to Monitor</div>
<div class="bowtie-target" data-slot="p1">Click to place</div>
<div class="bowtie-target" data-slot="p2">Click to place</div></div></div>`;
}
function renderMC(q) {
    const letters = 'ABCDEFGH';
    return `<ul class="mc-list">${q.opts.map((o, i) => `<li class="mc-opt" data-idx="${i}"><span class="mc-letter">${letters[i]}</span><span>${typeof o === 'string' ? o : o.t || o}</span></li>`).join('')}</ul>`;
}
function renderSATA(q) {
    return `<div class="select-n-count">Select All That Apply</div><ul class="opt-list">${q.opts.map((o, i) => `<li class="opt-item" data-idx="${i}"><div class="opt-check">\u2713</div><span>${o.t}</span></li>`).join('')}</ul>`;
}
function renderFillin(q) {
    return `<div style="margin-top:1rem"><input type="number" class="fill-input" id="fillInput" step="any" placeholder="?"><span class="fill-unit">${q.unit || ''}</span></div>`;
}

// ===== EVENT DELEGATION (no inline onclick for interaction types) =====
document.addEventListener('click', function(e) {
    if (submitted.has(cur)) return;

    const hlSpan = e.target.closest('.hl-span');
    if (hlSpan && !submitted.has(cur)) { hlSpan.classList.toggle('selected'); return; }

    const optItem = e.target.closest('.opt-item');
    if (optItem) {
        const q = examQs[cur];
        if (optItem.classList.contains('checked')) { optItem.classList.remove('checked'); }
        else {
            if (q.type === 'selectN' && q.n) {
                const checked = optItem.closest('.opt-list').querySelectorAll('.checked').length;
                if (checked >= q.n) {
                    const first = optItem.closest('.opt-list').querySelector('.checked');
                    if (first) first.classList.remove('checked');
                }
            }
            optItem.classList.add('checked');
        }
        return;
    }

    const mcOpt = e.target.closest('.mc-opt');
    if (mcOpt) {
        mcOpt.closest('.mc-list').querySelectorAll('.mc-opt').forEach(o => o.classList.remove('selected'));
        mcOpt.classList.add('selected');
        return;
    }

    const pill = e.target.closest('.drag-pill:not(.placed)');
    if (pill && pill.closest('.drag-source') && !pill.closest('#btSrc')) {
        const slots = document.querySelectorAll('.drop-slot:not(.filled)');
        if (slots.length === 0) return;
        slots[0].classList.add('filled');
        slots[0].querySelector('.slot-content').textContent = pill.textContent;
        slots[0].dataset.origIdx = pill.dataset.orig;
        pill.classList.add('placed');
        return;
    }

    const slot = e.target.closest('.drop-slot.filled');
    if (slot && !e.target.closest('.bowtie-target')) {
        const origIdx = slot.dataset.origIdx;
        slot.classList.remove('filled');
        slot.querySelector('.slot-content').textContent = '';
        delete slot.dataset.origIdx;
        const srcPill = document.querySelector(`.drag-pill[data-orig="${origIdx}"]`);
        if (srcPill) srcPill.classList.remove('placed');
        return;
    }

    const btPill = e.target.closest('#btSrc .drag-pill:not(.placed)');
    if (btPill) {
        document.querySelectorAll('#btSrc .drag-pill').forEach(p => p.style.outline = '');
        btPill.style.outline = '3px solid var(--accent)';
        btSelected = btPill;
        return;
    }

    const btTarget = e.target.closest('.bowtie-target');
    if (btTarget && btSelected) {
        if (btTarget.classList.contains('filled')) {
            const old = btTarget.dataset.val;
            const oldPill = document.querySelector(`#btSrc .drag-pill[data-val="${CSS.escape(old)}"]`);
            if (oldPill) oldPill.classList.remove('placed');
        }
        btTarget.textContent = btSelected.textContent;
        btTarget.dataset.val = btSelected.dataset.val;
        btTarget.classList.add('filled');
        btSelected.classList.add('placed');
        btSelected.style.outline = '';
        btSelected = null;
        return;
    }
});

// ===== SCORING =====
function submitAnswer() {
    if (submitted.has(cur)) return;
    submitted.add(cur);
    const q = examQs[cur];
    let earned = 0, possible = 0;

    if (q.type === 'highlight') {
        const correct = q.phrases.filter(p => p.c).length;
        possible = correct;
        document.querySelectorAll('.hl-span').forEach(el => {
            const idx = parseInt(el.dataset.idx), isCorrect = q.phrases[idx].c, isSel = el.classList.contains('selected');
            if (isCorrect && isSel) { earned++; el.classList.add('correct'); }
            else if (isCorrect && !isSel) { el.classList.add('missed'); }
            else if (!isCorrect && isSel) { earned = Math.max(0, earned - 1); el.classList.add('wrong'); }
        });
        earned = Math.max(0, earned);
    }
    else if (q.type === 'cloze') {
        possible = q.selects.length;
        let allCorrect = true;
        document.querySelectorAll('.cloze-select').forEach(sel => {
            const idx = parseInt(sel.dataset.idx), val = parseInt(sel.value);
            sel.disabled = true;
            if (val === q.selects[idx].correct) { sel.classList.add('correct'); }
            else { sel.classList.add('wrong'); allCorrect = false; }
        });
        if (q.scoring === 'dyad') { earned = allCorrect ? possible : 0; }
        else { document.querySelectorAll('.cloze-select.correct').forEach(() => earned++); }
    }
    else if (q.type === 'matrix') {
        possible = q.rows.length;
        q.rows.forEach((r, i) => {
            const sel = document.querySelector(`input[name="matrix_${q.id}_${i}"]:checked`);
            const row = document.querySelector(`.matrix-row[data-row="${i}"]`);
            document.querySelectorAll(`input[name="matrix_${q.id}_${i}"]`).forEach(inp => inp.disabled = true);
            if (sel && parseInt(sel.value) === q.correct[i]) { earned++; row.classList.add('correct'); }
            else row.classList.add('wrong');
        });
    }
    else if (q.type === 'selectN' || q.type === 'sata') {
        const corr = q.opts.filter(o => o.c).length;
        possible = corr;
        document.querySelectorAll('.opt-item').forEach(el => {
            const idx = parseInt(el.dataset.idx), isC = q.opts[idx].c, isSel = el.classList.contains('checked');
            el.style.pointerEvents = 'none';
            if (isC && isSel) { earned++; el.classList.add('correct'); }
            else if (isC && !isSel) el.classList.add('missed');
            else if (!isC && isSel) { earned = Math.max(0, earned - 1); el.classList.add('wrong'); }
        });
        earned = Math.max(0, earned);
    }
    else if (q.type === 'ordered') {
        possible = q.items.length;
        document.querySelectorAll('.drop-slot').forEach((slot, i) => {
            const origIdx = slot.dataset.origIdx;
            if (origIdx !== undefined && parseInt(origIdx) === i) { earned++; slot.classList.add('correct'); }
            else slot.classList.add('wrong');
        });
        document.querySelectorAll('.drag-pill').forEach(p => p.style.pointerEvents = 'none');
    }
    else if (q.type === 'bowtie') {
        possible = 5;
        document.querySelectorAll('.bowtie-target').forEach(t => {
            const slotName = t.dataset.slot, val = t.dataset.val || '';
            let isCorrect = false;
            if ((slotName === 'a1' || slotName === 'a2') && q.actions.includes(val)) isCorrect = true;
            if (slotName === 'cond' && val === q.condition) isCorrect = true;
            if ((slotName === 'p1' || slotName === 'p2') && q.parameters.includes(val)) isCorrect = true;
            if (isCorrect) { earned++; t.classList.add('correct'); } else t.classList.add('wrong');
        });
        document.querySelectorAll('#btSrc .drag-pill').forEach(p => p.style.pointerEvents = 'none');
    }
    else if (q.type === 'mc') {
        possible = 1;
        const sel = document.querySelector('.mc-opt.selected');
        document.querySelectorAll('.mc-opt').forEach(o => o.style.pointerEvents = 'none');
        if (sel) {
            const idx = parseInt(sel.dataset.idx);
            if (idx === q.correct) { earned = 1; sel.classList.add('correct'); }
            else { sel.classList.add('wrong'); document.querySelectorAll('.mc-opt')[q.correct].classList.add('correct'); }
        } else { document.querySelectorAll('.mc-opt')[q.correct].classList.add('correct'); }
    }
    else if (q.type === 'fillin') {
        possible = 1;
        const inp = document.getElementById('fillInput');
        const val = parseFloat(inp.value), tol = q.tolerance || 0;
        inp.disabled = true;
        if (!isNaN(val) && Math.abs(val - q.answer) <= tol) { earned = 1; inp.classList.add('correct'); }
        else { inp.classList.add('wrong'); inp.insertAdjacentHTML('afterend', `<span style="color:var(--green);font-weight:700;margin-left:1rem">Correct: ${q.answer} ${q.unit||''}</span>`); }
    }

    const pct = possible > 0 ? Math.round((earned / possible) * 100) : 0;
    scores[cur] = { earned, possible, pct };

    const submitBtn = document.getElementById('submitBtn');
    if (submitBtn) {
        const nextBtn = document.createElement('button');
        nextBtn.className = 'btn btn-success';
        nextBtn.textContent = 'Next \u2192';
        nextBtn.addEventListener('click', nextQ);
        submitBtn.parentNode.replaceChild(nextBtn, submitBtn);
    }

    const scoreArea = document.getElementById('scoreArea');
    if (scoreArea) {
        const chip = pct === 100 ? 'full' : pct > 0 ? 'part' : 'zero';
        scoreArea.innerHTML = `<span class="score-chip ${chip}">${earned}/${possible} (${pct}%)</span>`;
    }

    showFeedback(q);
    saveState();
}

function showFeedback(q) {
    const s = scores[cur] || { pct: 0 };
    const cls = s.pct === 100 ? 'pass' : s.pct > 0 ? 'partial' : 'fail';
    const lbl = s.pct === 100 ? 'Correct!' : s.pct > 0 ? 'Partial Credit' : 'Incorrect';
    const fb = document.getElementById('feedback');
    if (fb) {
        fb.className = `feedback show ${cls}`;
        fb.innerHTML = `<strong>${lbl}</strong>${q.rationale}`;
    }
}

// ===== NAVIGATION =====
function nextQ() { if (cur < examQs.length - 1) { cur++; saveState(); renderQ(); } else { showResults(); } }
function prevQ() { if (cur > 0) { cur--; saveState(); renderQ(); } }
function goToQ(i) { cur = i; saveState(); renderQ(); }

window.nextQ = nextQ;
window.prevQ = prevQ;
window.goToQ = goToQ;
window.submitAnswer = submitAnswer;
window.startExam = startExam;
window.resumeExam = resumeExam;
window.showStart = showStart;
window.setFilter = setFilter;
window.setSize = setSize;
window.clearState = clearState;
window.toggleTheme = toggleTheme;

// ===== RESULTS SCREEN =====
function showResults() {
    const total = scores.reduce((a, s) => a + (s ? s.earned : 0), 0);
    const poss = scores.reduce((a, s) => a + (s ? s.possible : 0), 0);
    const pct = poss > 0 ? Math.round((total / poss) * 100) : 0;

    let caseE=0,caseP=0,ngnE=0,ngnP=0,tradE=0,tradP=0;
    scores.forEach((s, i) => {
        if (!s) return;
        const q = examQs[i];
        if (q.caseId) { caseE += s.earned; caseP += s.possible; }
        else if (['bowtie','selectN','cloze','highlight','matrix'].includes(q.type)) { ngnE += s.earned; ngnP += s.possible; }
        else { tradE += s.earned; tradP += s.possible; }
    });

    const topics = {};
    scores.forEach((s, i) => {
        if (!s) return;
        const q = examQs[i];
        const topic = q.topic || (q.caseId ? `Case ${q.caseId}` : 'General');
        if (!topics[topic]) topics[topic] = { earned: 0, possible: 0 };
        topics[topic].earned += s.earned;
        topics[topic].possible += s.possible;
    });

    const topicHTML = Object.entries(topics).map(([t, d]) => {
        const tp = d.possible > 0 ? Math.round((d.earned/d.possible)*100) : 0;
        return `<div class="bd-card"><h4>${t}</h4><div class="val">${tp}%</div></div>`;
    }).join('');

    app.innerHTML = `
    <div class="exam-header"><h1>NGN Cardiac Practice Exam</h1></div>
    <div class="results">
        <h2>Exam Complete!</h2>
        <div class="score-circle" style="--pct:${pct}"><div class="score-inner"><div class="pct">${pct}%</div><div class="lbl">${total}/${poss} points</div></div></div>
        <div class="breakdown">
            ${caseP ? `<div class="bd-card"><h4>Case Studies</h4><div class="val">${Math.round((caseE/caseP)*100)}%</div></div>` : ''}
            ${ngnP ? `<div class="bd-card"><h4>NGN Standalone</h4><div class="val">${Math.round((ngnE/ngnP)*100)}%</div></div>` : ''}
            ${tradP ? `<div class="bd-card"><h4>Traditional</h4><div class="val">${Math.round((tradE/tradP)*100)}%</div></div>` : ''}
        </div>
        <h3 style="margin-top:1.5rem;margin-bottom:.5rem">By Topic</h3>
        <div class="breakdown">${topicHTML}</div>
        <button class="btn btn-primary" onclick="clearState();showStart()" style="margin-top:1.5rem">Retake Exam</button>
        <button class="btn btn-outline" onclick="enterReview()" style="margin-top:1.5rem;margin-left:.5rem">Review Answers</button>
    </div>`;
}

function enterReview() {
    mode = 'review'; cur = 0;
    for (let i = 0; i < examQs.length; i++) submitted.add(i);
    renderQ();
}
window.enterReview = enterReview;

// ===== INIT =====
showStart();

</script>
