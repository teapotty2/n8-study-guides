pts to resolve the situation. It is unrealistic to expect supervisors to support whistleblowing, which is only necessary when the normal chain of authority has failed to respond to an issue. The nurse may eventually be forced to resign, but this is not a precondition for whistleblowing in every situation. Attempting to edit documentation may set the nurse up for legal consequences."},{"ch":"Ch 6: Patient, Subordinate, Workplace, and Professional Advocacy","q":"Which statement is true regarding political action committees (PACs)?","opts":"<div class=\"opt\" data-letter=\"A\">A) They attempt to persuade legislators to vote in a particular way.</div><div class=\"opt\" data-letter=\"B\">B) They are composed of volunteers who are interested in politics.</div><div class=\"opt\" data-letter=\"C\">C) Their focus is usually on defeating specific pieces of legislature.</div><div class=\"opt\" data-letter=\"D\">D) They appear to have less influence on lawmakers than in the past.</div>","ans":"A","sata":false,"fb":"PACs attempt to persuade legislators to vote in a particular way. Lobbyists of the PAC may be members of a group interested in a particular law or paid agents of the group that wants a specific bill passed or defeated. Currently, PACs appear to have a significant amount of influence on lawmakers and the legislative process. There is no evidence that their influence is waning.","feedback":"PACs attempt to persuade legislators to vote in a particular way. Lobbyists of the PAC may be members of a group interested in a particular law or paid agents of the group that wants a specific bill passed or defeated. Currently, PACs appear to have a significant amount of influence on lawmakers and the legislative process. There is no evidence that their influence is waning."},{"ch":"Ch 6: Patient, Subordinate, Workplace, and Professional Advocacy","q":"A nurse is deeply concerned about a proposed piece of legislation. Which action will best influence a local legislator who will be voting on the legislation?","opts":"<div class=\"opt\" data-letter=\"A\">A) Signing an online petition</div><div class=\"opt\" data-letter=\"B\">B) Phoning the legislator's office repeatedly</div><div class=\"opt\" data-letter=\"C\">C) Writing a succinct, personalized letter to the legislator</div><div class=\"opt\" data-letter=\"D\">D) Forwarding the legislator online articles that are related to the legislation</div>","ans":"C","sata":false,"fb":"Personalized letters can have a significant influence on a legislator, likely more so than telephone calls. It is not normally possible to outline one's ideas in a telephone message and a nurse cannot provide any detail by signing a petition. E -mail forward is very likely to be ignored and not opened."},{"ch":"Ch 6: Patient, Subordinate, Workplace, and Professional Advocacy","q":"A nurse is preparing for a television interview to address an aspect of health care. What actions should the nurse perform? Select all that apply.","opts":"<div class=\"opt\" data-letter=\"A\">A) Being focused on key points</div><div class=\"opt\" data-letter=\"B\">B) Introducing statistics that support the key points</div><div class=\"opt\" data-letter=\"C\">C) Repeating key points several times during the interview</div><div class=\"opt\" data-letter=\"D\">D) Providing background material related to the key points</div><div class=\"opt\" data-letter=\"E\">E) Using technical vocabulary to ensure precise communication</div>","ans":["A","B","C","D"],"sata":true,"fb":"The best strategies for a television interview are to be prepared and to stick to three or four key points that will drive home your message and repeat them during the interview. Concentrating on popular points is not necessarily where the focus should be directed. It is best to avoid technical jargon because it will be not be understood by most"},{"ch":"Ch 6: Patient, Subordinate, Workplace, and Professional Advocacy","q":"Which statement is true concerning political action of nurses?","opts":"<div class=\"opt\" data-letter=\"A\">A) Political action is often contrary to codes of ethics.</div><div class=\"opt\" data-letter=\"B\">B) Political action mainly takes place through the American Nurses Association (ANA).</div><div class=\"opt\" data-letter=\"C\">C) Nurses' primary focus is to speak about consumer health -related issues.</div><div class=\"opt\" data-letter=\"D\">D) Nurses have not yet recognized the full potential of political activity.</div>","ans":"D","sata":false,"fb":"As a whole, the nursing profession has not yet recognized the full potential of collective political activity. Political action is not contrary to ethical practice and may in fact support it. The ANA is not the main venue for political action among nurses, which can take many forms. Nurses can speak about many aspects of health care and the nursing profession, not only consumer issues."},{"ch":"Ch 6: Patient, Subordinate, Workplace, and Professional Advocacy","q":"Which leadership role is most closely associated with advocacy?","opts":"<div class=\"opt\" data-letter=\"A\">A) Creating a climate where advocacy and its associated risk taking are valued</div><div class=\"opt\" data-letter=\"B\">B) Giving subordinates and clients adequate information to make informed decisions</div><div class=\"opt\" data-letter=\"C\">C) Ensuring that the workplace environment is safe</div><div class=\"opt\" data-letter=\"D\">D) Seeking appropriate consultation when advocacy results in intrapersonal or interpersonal conflict</div>","ans":"A","sata":false,"fb":"A leadership role associated with advocacy is to create a climate where advocacy and its associated risk taking are valued. Management functions include giving subordinates and clients adequate information to make informed decisions and seeking appropriate consultation when advocacy results in intrapersonal or interpersonal conflict. Workplace safety is more closely aligned with a management role than a leadership role."},{"ch":"Ch 6: Patient, Subordinate, Workplace, and Professional Advocacy","q":"The manager of a community health center is committed to acting as an advocate. What action by the manager best promotes this goal?","opts":"<div class=\"opt\" data-letter=\"A\">A) Taking prompt action when working conditions appear unsafe</div><div class=\"opt\" data-letter=\"B\">B) Seeking formal and informal interactions with the media</div><div class=\"opt\" data-letter=\"C\">C) Communicating a vision that advocacy is something highly valued in the organization</div><div class=\"opt\" data-letter=\"D\">D) Pushing for the creation of a binding, national Bill of Rights for Patients</div>","ans":"A","sata":false,"fb":"A management function associated with advocacy is taking prompt action when there is a lack of safety in the workplace. Leaders generally interact with the media more than managers do, and communicating vision is more closely aligned with a leadership role. Similarly, advocating for a national Bill of Rights for Patients is more closely aligned with leadership than management."},{"ch":"Ch 6: Patient, Subordinate, Workplace, and Professional Advocacy","q":"A nurse is working with a client who has a terminal diagnosis and who is facing difficult decisions around end -of-life care. How can the nurse best advocate for this client?","opts":"<div class=\"opt\" data-letter=\"A\">A) Teach the client how to make an effective decision.</div><div class=\"opt\" data-letter=\"B\">B) Offer to facilitate a referral to social work or spiritual care.</div><div class=\"opt\" data-letter=\"C\">C) Arrange for the client to meet an individual who has faced the same decision.</div><div class=\"opt\" data-letter=\"D\">D) Ensure the client receives all the necessary information to make an informed choice.</div>","ans":"D","sata":false,"fb":"The main advocacy role for nurses involves giving clients all they need to make informed decisions. Teaching the client how to make a decision is likely to be perceived as paternalistic. Referrals may be helpful for the client, but this does not advocate for the client's need to make a decision. Introducing a client to another client in similar circumstances can be ethically challenging and may or may not be perceived as helpful."},{"ch":"Ch 6: Patient, Subordinate, Workplace, and Professional Advocacy","q":"Which characteristics associated with being a client of the health care system increase the need for advocacy? Select all that apply.","opts":"<div class=\"opt\" data-letter=\"A\">A) Loss of physical freedom as a result of extended hospitalizations</div><div class=\"opt\" data-letter=\"B\">B) Decreased independence due to physical or psychosocial limitations</div><div class=\"opt\" data-letter=\"C\">C) Loss of legal rights due to being a client in a health care facility</div><div class=\"opt\" data-letter=\"D\">D) Physical or psychosocial limitations negatively impacting autonomy</div><div class=\"opt\" data-letter=\"E\">E) Increased vulnerability due to impaired communication</div>","ans":["A","B","D","E"],"sata":true,"fb":"Client advocacy is necessary because disease almost always results in decreased independence, loss of freedom, and interference with the ability to make choices autonomously. In addition, aging, as well as physical, mental, or social disability, may make individuals more vulnerable and in need of advocacy. Admission to a health care facility does not result in a loss of legal rights."},{"ch":"Ch 6: Patient, Subordinate, Workplace, and Professional Advocacy","q":"Which are the common areas requiring nurse -client advocacy? Select all that apply.","opts":"<div class=\"opt\" data-letter=\"A\">A) Maintaining current licensure</div><div class=\"opt\" data-letter=\"B\">B) Securing client informed consents</div><div class=\"opt\" data-letter=\"C\">C) Preventing medication errors</div><div class=\"opt\" data-letter=\"D\">D) Facilitating access to health care services</div><div class=\"opt\" data-letter=\"E\">E) Promoting respect for client dignity and cultural values</div>","ans":["B","C","D","E"],"sata":true,"fb":"Common areas requiring nurse -client advocacy include inadequate client consents, medical errors, access to health care, and respect for client dignity and cultural values. Although nurses must maintain current licensure, this does not involve client advocacy."},{"ch":"Ch 6: Patient, Subordinate, Workplace, and Professional Advocacy","q":"The nurse -manager of a hospital unit has set a goal of increasing client advocacy. What activities are likely to help the manager attain this goal? Select all that apply.","opts":"<div class=\"opt\" data-letter=\"A\">A) Staffing the unit with a sufficient number of care providers</div><div class=\"opt\" data-letter=\"B\">B) Orienting staff on the safe use of a new mechanical lift</div><div class=\"opt\" data-letter=\"C\">C) Providing an in -service on culturally meeting clients' end -of-life needs</div><div class=\"opt\" data-letter=\"D\">D) Arranging for a client to have a meeting with a member of the financial office</div><div class=\"opt\" data-letter=\"E\">E) Organizing an equitable system for distributing vacation time to staff</div>","ans":["A","B","C","D"],"sata":true,"fb":"Common areas for managers to advocate for clients include distribution of resources, use of technology, end -of-life decisions, and health care reimbursement. Issues around scheduling and vacation are areas where the manager could advocate for subordinates, but this matter has little direct impact on clients.","feedback":"Common areas for managers to advocate for clients include distribution of resources, use of technology, end -of-life decisions, and health care reimbursement. Issues around scheduling and vacation are areas where the manager could advocate for subordinates, but this matter has little direct impact on clients."},{"ch":"Ch 6: Patient, Subordinate, Workplace, and Professional Advocacy","q":"A nurse is reviewing the provisions of legislation that relates to nursing practice in the jurisdiction where the nurse provides care. The nurse should identify what primary purpose of this legislation?","opts":"<div class=\"opt\" data-letter=\"A\">A) Protecting clients' rights and safety</div><div class=\"opt\" data-letter=\"B\">B) Organizing the overall structure of the health care system</div><div class=\"opt\" data-letter=\"C\">C) Promoting a unique role for nursing in promoting wellness</div><div class=\"opt\" data-letter=\"D\">D) Ensuring nurses provide care that is ethical and moral</div>","ans":"A","sata":false,"fb":"The legislative controls of nursing practice primarily protect the rights of clients. Legislation is not primarily aimed at organizing the health system, which is an administrative role, not a legislative function. Legislation is not aimed at promoting the role of nursing. Ethical practice is addressed primarily by codes of ethics, not binding legislation."},{"ch":"Ch 6: Patient, Subordinate, Workplace, and Professional Advocacy","q":"A nurse feels strongly that a proposed piece of legislation would be contrary to the interests of clients. How can the nurse most effectively oppose this legislation?","opts":"<div class=\"opt\" data-letter=\"A\">A) Address the issue on social media sites as often as possible.</div><div class=\"opt\" data-letter=\"B\">B) Send e -mails to legislators' offices expressing concerns.</div><div class=\"opt\" data-letter=\"C\">C) Collaborate with a group of professionals who feel the same way.</div><div class=\"opt\" data-letter=\"D\">D) Contact media outlets and ask to be interviewed.</div>","ans":"C","sata":false,"fb":"Collective action is generally considered to be more effective than individual action. E -mails are easy to ignore and are less effective than personalized letters. Addressing the issue on social media may make more people aware of the issue, but it may or may not result in action change. Media outlets normally initiate interest in news interviews; they rarely respond to people's requests to be interviewed."},{"ch":"Ch 6: Patient, Subordinate, Workplace, and Professional Advocacy","q":"The Genetic Information Nondiscrimination Act (GINA) protects which individual from discrimination?","opts":"<div class=\"opt\" data-letter=\"A\">A) A client who has chosen genetic testing for her child</div><div class=\"opt\" data-letter=\"B\">B) A client who has received gene therapy</div><div class=\"opt\" data-letter=\"C\">C) A client who has been diagnosed with a health disorder that has a genetic component</div><div class=\"opt\" data-letter=\"D\">D) A client who is known to have a genetic predisposition to a disease</div>","ans":"D","sata":false,"fb":"Some legally binding legislation has been passed to safeguard vulnerable populations. One such legislation, the GINA, is a federal law passed in 2008, making it illegal for health insurers or employers to discriminate against individuals based on their genetic information."},{"ch":"Ch 6: Patient, Subordinate, Workplace, and Professional Advocacy","q":"A nurse is involved in a challenging clinical situation which requires the nurse to consider many people's interests. How can the nurse best implement Standard VII of the American Nurses Association (ANA) Scope and Standards of Practice?","opts":"<div class=\"opt\" data-letter=\"A\">A) Allow the client to read the documentation about the situation.</div><div class=\"opt\" data-letter=\"B\">B) Seek legal advice promptly.</div><div class=\"opt\" data-letter=\"C\">C) Advocate for the organization's interests above those of individuals.</div><div class=\"opt\" data-letter=\"D\">D) Carefully consider the ethical aspects of the situation.</div>","ans":"D","sata":false,"fb":"Standard VII of the American Nurses Association (ANA) Scope and Standards of Practice (2015) states that the registered nurse practices ethically. Consequently, this standard is more closely related to issues around ethics than issues around documentation or legality. It is simplistic and inaccurate to presume that the organization's interests always supersede the individual's interests."},{"ch":"Ch 6: Patient, Subordinate, Workplace, and Professional Advocacy","q":"Which nursing intervention demonstrates attention to the nursing values central to client advocacy? Select all that apply.","opts":"<div class=\"opt\" data-letter=\"A\">A) Assuring clients that their wishes will be respected regarding the care they receive</div><div class=\"opt\" data-letter=\"B\">B) Reassuring clients that they will always make the right decisions</div><div class=\"opt\" data-letter=\"C\">C) Identifying clients' religious dietary practices when discussing a prescribed diet</div><div class=\"opt\" data-letter=\"D\">D) Answering clients' questions regarding the alternatives to proposed procedures</div><div class=\"opt\" data-letter=\"E\">E) Suggesting to clients that a social services consult would help with discharge needs</div>","ans":["A","C","D","E"],"sata":true,"fb":"The nursing values central to advocacy emphasize caring, autonomy, respect, and empowerment. Telling clients that they will certainly make the right decisions is false reassurance, which is not a valid form of advocacy."},{"ch":"Ch 6: Patient, Subordinate, Workplace, and Professional Advocacy","q":"Which strategy best demonstrates an understanding of the manager's role as an advocate for their subordinates?","opts":"<div class=\"opt\" data-letter=\"A\">A) Posting a copy of the code of ethics in the staff room</div><div class=\"opt\" data-letter=\"B\">B) Addressing an employee's high rate of absenteeism</div><div class=\"opt\" data-letter=\"C\">C) Establishing friendships with as many of the nurses as possible</div><div class=\"opt\" data-letter=\"D\">D) Working with primary care providers to expand standing nursing orders</div>","ans":"D","sata":false,"fb":"Promoting nurse autonomy in the form of increased standing orders is an example of advocating for subordinates. Publicizing the code of ethics may be beneficial for nurses but does not advocate on their behalf. In the same way, a manager is being responsible when addressing absenteeism, but this is unlikely to entail an advocacy role. The manager should seek professional relationships, not friendships."},{"ch":"Ch 6: Patient, Subordinate, Workplace, and Professional Advocacy","q":"What action by the manager of a community health center best demonstrates workplace advocacy?","opts":"<div class=\"opt\" data-letter=\"A\">A) Phoning the home of a nurse who has called in sick to confirm that the nurse is genuinely ill</div><div class=\"opt\" data-letter=\"B\">B) Asking clients to provide feedback on the care that they have received in their homes</div><div class=\"opt\" data-letter=\"C\">C) Reporting concerns about the safety of working conditions encountered during home visits</div><div class=\"opt\" data-letter=\"D\">D) Assigning a different nurse to a client who had personality differences with his original nurse</div>","ans":"C","sata":false,"fb":"Ensuring the safety or workers is one of the major demonstrations of workplace advocacy. Checking on a nurse who states that he or she is sick is likely to be perceived as an act of mistrust, not of advocacy. Asking for clients' feedback and assigning a client a new nurse are suggestive of client advocacy, not workplace advocacy."},{"ch":"Ch 6: Patient, Subordinate, Workplace, and Professional Advocacy","q":"A nurse is concerned about the implications of a new piece of legislation that is being debated by lawmakers. The nurse has decided to draft a letter to a legislator and should do what actions? Select all that apply.","opts":"<div class=\"opt\" data-letter=\"A\">A) Self-identify as a constituent in the first paragraph.</div><div class=\"opt\" data-letter=\"B\">B) State the reason for writing in the second paragraph.</div><div class=\"opt\" data-letter=\"C\">C) Sign the letter and include contact information.</div><div class=\"opt\" data-letter=\"D\">D) Address the legislator by his or her title.</div><div class=\"opt\" data-letter=\"E\">E) Hand deliver the letter to the legislator's office, if possible.</div>","ans":["A","C","D"],"sata":true,"fb":"The nurse should be sure to address the legislator properly by title and establish credibility early in the letter as both a constituent and a health care expert. It is best to state your reason for writing the letter in the first paragraph and refer to the specific bill that you are writing about. Then, state your position on the issue and give personal examples as necessary to support your position. Personal letters are more effective than other formats, but there is no reason to hand deliver the letter to the legislator's office."},{"ch":"Ch 6: Patient, Subordinate, Workplace, and Professional Advocacy","q":"A nurse -manager has been asked to write an article for the newspaper addressing a health care issue of local concern. Which statement demonstrates the nurse's understanding of the appropriate way to respond to such a request? Select all that apply.","opts":"<div class=\"opt\" data-letter=\"A\">A) \"I'll include the latest data on the subject.\"</div><div class=\"opt\" data-letter=\"B\">B) \"When will you need to have the final draft of my article?\"</div><div class=\"opt\" data-letter=\"C\">C) \"Are you comfortable with me focusing on three key points related to this topic?\"</div><div class=\"opt\" data-letter=\"D\">D) \"That isn't my field of expertise but I will contact a peer with that knowledge.\"</div><div class=\"opt\" data-letter=\"E\">E) \"Working with the media is outside my scope of practice, but I'll recommend you to someone else.\"</div>","ans":["A","B","C","D"],"sata":true,"fb":"Tips for effective interaction with the media include respecting and meeting their deadlines, having key facts ready to include, limiting key points to two or three, and not being afraid to say you lack that specific expertise. Working with the media is not something that is beyond the nursing scope or practice."},{"ch":"Ch 6: Patient, Subordinate, Workplace, and Professional Advocacy","q":"A nurse is admitting a new client who is facing a serious health problem. The nurse can best apply the skills of advocacy when working with this client by:","opts":"<div class=\"opt\" data-letter=\"A\">A) seeking opportunities to demonstrate professionalism.</div><div class=\"opt\" data-letter=\"B\">B) engaging closely and genuinely with the client and family.</div><div class=\"opt\" data-letter=\"C\">C) making decisions for the client and family in order to lessen their responsibilities.</div><div class=\"opt\" data-letter=\"D\">D) providing evidence -based care.</div>","ans":"B","sata":false,"fb":"Engagement has been identified as a key factor in advocating for clients and families when they are in the health care system. Demonstrating professionalism and providing evidence -based care support good outcomes and may put the client and family at ease, but these actions do not necessarily demonstrate or promote advocacy. The nurse should always support the family's decision -making process rather than taking on this role."},{"ch":"Ch 6: Patient, Subordinate, Workplace, and Professional Advocacy","q":"A client has been diagnosed with a degenerative neurologic disease and has expressed interest in physician -assisted suicide. How should the nurse best advocate in this situation?","opts":"<div class=\"opt\" data-letter=\"A\">A) Document the client's statements verbatim in the medical record as a resource for the care team.</div><div class=\"opt\" data-letter=\"B\">B) Clearly explain the moral and ethical implications of physician -assisted suicide.</div><div class=\"opt\" data-letter=\"C\">C) Implement interventions that directly address the client's fear and anxiety.</div><div class=\"opt\" data-letter=\"D\">D) Ask the client and family questions that help them identify and explore their values and beliefs.</div>","ans":"D","sata":false,"fb":"Providing the client and family with the tools necessary to make an informed decision is the best demonstration of client advocacy. Documentation is important in this situation, but this action does not necessarily demonstrate advocacy. The moral implications of physician -assisted suicide must be identified by the family rather than provided by the nurse; these are subjective and this will be part of the family's decision -making process. The nurse should avoid presuming that the client is fearful and anxious. This may not necessarily be the motivation behind the client's request.","feedback":"Providing the client and family with the tools necessary to make an informed decision is the best demonstration of client advocacy. Documentation is important in this situation, but this action does not necessarily demonstrate advocacy. The moral implications of physician -assisted suicide must be identified by the family rather than provided by the nurse; these are subjective and this will be part of the family's decision -making process. The nurse should avoid presuming that the client is fearful and anxious. This may not necessarily be the motivation behind the client's request."},{"ch":"Ch 6: Patient, Subordinate, Workplace, and Professional Advocacy","q":"For which client would right to die laws most likely apply?","opts":"<div class=\"opt\" data-letter=\"A\">A) An adult client with major depression</div><div class=\"opt\" data-letter=\"B\">B) An adult client who has a terminal diagnosis</div><div class=\"opt\" data-letter=\"C\">C) A client who lives with intractable pain</div><div class=\"opt\" data-letter=\"D\">D) A client who has expressed suicidal ideation</div>","ans":"B","sata":false,"fb":"Typically, right to die laws apply only to clients who are at least 18 years old, with the capacity to make medical decisions, with a terminal disease expected to result in death within 6 months. Depression and pain are not normally considered to be terminal diseases, and suicidal ideation in and of itself does not mean that this legislation would apply."},{"ch":"Ch 6: Patient, Subordinate, Workplace, and Professional Advocacy","q":"A nurse has accepted a new position as the manager at an ambulatory clinic. The nurse can best model subordinate advocacy in this new position by:","opts":"<div class=\"opt\" data-letter=\"A\">A) abolishing formal performance reviews.</div><div class=\"opt\" data-letter=\"B\">B) increasing the number of part -time employees and reducing the number of full-time employees.</div><div class=\"opt\" data-letter=\"C\">C) adopting a laissez -faire leadership style.</div><div class=\"opt\" data-letter=\"D\">D) encouraging employees to participate in decision making.</div>","ans":"D","sata":false,"fb":"Collaborative decision making is associated with subordinate advocacy. However, the manager does not need to abolish rigorous practices (such as performance reviews) or adopt a laissez -faire style of leadership in order to promote subordinate advocacy. Doing away with full -time positions in favor of part -time positions is unlikely to be accepted as an example of advocacy; this will likely be perceived as threatening.","feedback":"Collaborative decision making is associated with subordinate advocacy. However, the manager does not need to abolish rigorous practices (such as performance reviews) or adopt a laissez -faire style of leadership in order to promote subordinate advocacy. Doing away with full -time positions in favor of part -time positions is unlikely to be accepted as an example of advocacy; this will likely be perceived as threatening."},{"ch":"Ch 6: Patient, Subordinate, Workplace, and Professional Advocacy","q":"A nurse is distressed by some of the examples of substandard care in the workplace and is considering whistleblowing. What is the nurse's best initial action?","opts":"<div class=\"opt\" data-letter=\"A\">A) Seek contacts in the local media.</div><div class=\"opt\" data-letter=\"B\">B) Inform the manager of the nurse's intent.</div><div class=\"opt\" data-letter=\"C\">C) Carefully consider the possible ramifications of whistleblowing.</div><div class=\"opt\" data-letter=\"D\">D) Hire an attorney to assist with the whistleblowing process.</div>","ans":"C","sata":false,"fb":"Before taking action, it is important for the nurse to consider the possible ramifications of whistleblowing, which could be serious. This must precede efforts such as hiring a lawyer or contacting the media. Depending on the circumstances, it may be inadvisable to dialogue with the manager before whistleblowing."},{"ch":"Ch 14: Organizing Patient Care","q":"Which aspect of care at a long -term care facility most clearly suggests that a functional model of care delivery is being used?","opts":"<div class=\"opt\" data-letter=\"A\">A) One nurse is assigned to provide all of a resident's care during a shift.</div><div class=\"opt\" data-letter=\"B\">B) Unlicensed assistive personnels (UAPs) coordinate each resident's care and occasionally delegate to practical nurses.</div><div class=\"opt\" data-letter=\"C\">C) Registered nurses perform all assessments while UAPs provide all feeding and hygiene.</div><div class=\"opt\" data-letter=\"D\">D) A pairing of one registered nurse and one practical nurse provides all the care for a designated pool of residents.</div>","ans":"C","sata":false,"fb":"Functional nursing is task focused with specific tasks assigned to specific members of the care team. Having one nurse provide all of a resident's care is indicative of total client care. No model of care ascribes a coordination role for UAP. Pairings suggest team or modular nursing."},{"ch":"Ch 14: Organizing Patient Care","q":"A nurse is assigned to administer medications to all clients throughout the shift. What is this an example of?","opts":"<div class=\"opt\" data-letter=\"A\">A) Team nursing</div><div class=\"opt\" data-letter=\"B\">B) Case method nursing</div><div class=\"opt\" data-letter=\"C\">C) Primary care delivery</div><div class=\"opt\" data-letter=\"D\">D) Functional nursing care</div>","ans":"D","sata":false,"fb":"Being assigned a specific task to do is part of functional nursing. None of the other options identify that connection."},{"ch":"Ch 14: Organizing Patient Care","q":"A nurse has accepted a position as a staff nurse and will practice primary care nursing. The nurse will be the only RN on the team. What is an appropriate role expectation for role fulfillment?","opts":"<div class=\"opt\" data-letter=\"A\">A) Planning nursing care independently of others</div><div class=\"opt\" data-letter=\"B\">B) Assigning work according to the expertise of group members</div><div class=\"opt\" data-letter=\"C\">C) Coordinating care across the 24-hour period through associate nurses</div><div class=\"opt\" data-letter=\"D\">D) Carrying out the majority of personal care for assigned clients</div>","ans":"B","sata":false,"fb":"In the primary nursing, during work hours, the primary nurse provides total direct care for the client. When the primary nurse is not on duty, associate nurses, who follow the care plan established by the primary nurse, provide care. In primary nursing, the sole RN would not plan the care without others' input. The nurse is responsible for care planning for 24 hours per day. The RN leads the planning of care but may not carry out the majority of personal care."},{"ch":"Ch 14: Organizing Patient Care","q":"A registered nurse (RN) is providing care in a setting that uses modular nursing. What task should the nurse perform during a shift?","opts":"<div class=\"opt\" data-letter=\"A\">A) Providing every aspect of care to one -half to one -third of the mini -team's assigned clients</div><div class=\"opt\" data-letter=\"B\">B) Collaborating with another registered nurse to plan the care of all the mini -team's assigned clients</div><div class=\"opt\" data-letter=\"C\">C) Confirming that each member of the mini -team is completing their assigned tasks</div><div class=\"opt\" data-letter=\"D\">D) Providing total client care to the most acutely ill clients that the mini -team is assigned</div>","ans":"C","sata":false,"fb":"The modular team leader should check the work of team members. Care is divided among the mini -team members, so the RN does not provide every aspect of care to some of the clients, even those who are acutely ill. Modular nursing does not usually involve collaboration between two RNs; it is more common for each team to have only one RN."},{"ch":"Ch 14: Organizing Patient Care","q":"A nurse -manager is advocating for a switch from team nursing to primary nursing care. What characteristic of primary nursing care should the manager describe to decision makers?","opts":"<div class=\"opt\" data-letter=\"A\">A) It requires minimal RN staffing.</div><div class=\"opt\" data-letter=\"B\">B) It is comparatively easy to implement.</div><div class=\"opt\" data-letter=\"C\">C) Many nurses find it stimulating and challenging.</div><div class=\"opt\" data-letter=\"D\">D) It eliminates the need for UAP or practical nurses.</div>","ans":"C","sata":false,"fb":"Primary care provides challenging work for nurses; however, it is not easy to implement and it can succeed with a diverse skills mix (i.e., not all RNs). It requires a comparatively large cohort of RNs.","feedback":"Primary care provides challenging work for nurses; however, it is not easy to implement and it can succeed with a diverse skills mix (i.e., not all RNs). It requires a comparatively large cohort of RNs."},{"ch":"Ch 14: Organizing Patient Care","q":"A nurse -manager has recently learned that the health care facility will be moving toward a case management approach. What factor is most likely driving this change?","opts":"<div class=\"opt\" data-letter=\"A\">A) The need to address cost -effective options for care</div><div class=\"opt\" data-letter=\"B\">B) The need to provide challenging work for nurses and other members of the care team</div><div class=\"opt\" data-letter=\"C\">C) The need to enhance professionalism throughout the organization</div><div class=\"opt\" data-letter=\"D\">D) The need to obtain magnet designation</div>","ans":"A","sata":false,"fb":"Case management addresses each client individually, identifying the most cost-effective providers, treatments, and care settings possible. It is not an explicit requirement of magnet designation and it is not primarily motivated by a need to stimulate nurses or increase professionalism."},{"ch":"Ch 14: Organizing Patient Care","q":"A change in the client care delivery system has been mandated on a hospital unit. The manager can best ensure the successful introduction of a new delivery system by:","opts":"<div class=\"opt\" data-letter=\"A\">A) assigning a senior registered nurse to lead the implementation.</div><div class=\"opt\" data-letter=\"B\">B) explaining the implications of the proposed change to clients and families.</div><div class=\"opt\" data-letter=\"C\">C) carefully studying the best method for implementing the planned change.</div><div class=\"opt\" data-letter=\"D\">D) hiring nurses who have experience in providing the new delivery system.</div>","ans":"C","sata":false,"fb":"Thorough preparation is essential to the successful implementation of a new client care delivery system. This does not necessarily require hiring new nurses who have experience with the new system; existing staff can be adequately prepared if there are sufficient time and resources. The manager should collaborate with staff but it would be an inappropriate delegation if the manager assigned a nurse to lead the transition. Explaining internal changes to clients and families is not normally necessary and would not significantly increase the chances of success."},{"ch":"Ch 14: Organizing Patient Care","q":"What is the primary focus of case management in prioritizing client care?","opts":"<div class=\"opt\" data-letter=\"A\">A) Assessing each client's needs individually</div><div class=\"opt\" data-letter=\"B\">B) Minimizing costs to the organization</div><div class=\"opt\" data-letter=\"C\">C) Minimizing costs to the client</div><div class=\"opt\" data-letter=\"D\">D) Applying the principles of team nursing</div>","ans":"A","sata":false,"fb":"Case management is largely dependent on individualized assessments of each client's specific needs. The client's needs supersede costs, even though cost containment is an important consideration. Case nursing does not necessarily entail a team nursing care delivery model."},{"ch":"Ch 14: Organizing Patient Care","q":"A nurse is practicing in a case management context and a client has been following a multidisciplinary action plan (MAP). In the last 24 hours, it has become clear that the client's health status is not improving as quickly as expected and the client is deviating from the MAP. What is the nurse's best action?","opts":"<div class=\"opt\" data-letter=\"A\">A) Cancel the client's current MAP and call a meeting to select a new one.</div><div class=\"opt\" data-letter=\"B\">B) Document the presence of a variance in the MAP.</div><div class=\"opt\" data-letter=\"C\">C) Collaborate with the care team to arrange a transfer to a new setting.</div><div class=\"opt\" data-letter=\"D\">D) Cancel the current MAP and adopt customized, rather than standardized care.</div>","ans":"B","sata":false,"fb":"In care MAPs, it is necessary to provide variances when there are client deviations, because this is a major component to case management. Deviations do not warrant a wholesale rejection of the existing MAP or case management principles. A transfer to another site may or may not be necessary, and this does not address the need to change the client's MAP."},{"ch":"Ch 14: Organizing Patient Care","q":"A nurse is providing care in a setting that uses a team nursing approach. What should be","opts":"<div class=\"opt\" data-letter=\"A\">A) Inclusion of the client and family as members of the team</div><div class=\"opt\" data-letter=\"B\">B) Opportunities for UAP and practical nurses to increase their education level</div><div class=\"opt\" data-letter=\"C\">C) Frequent communication between team members</div><div class=\"opt\" data-letter=\"D\">D) Use of multidisciplinary action plans (MAPs)</div>","ans":"C","sata":false,"fb":"Team nursing is wholly dependent on close, frequent communication between the team members. Through extensive team communication, comprehensive care can be provided for clients despite a relatively high proportion of ancillary staff. The client's and family's input is vital, and frequently sought, but they are not formal members of the care team. MAPs are associated with case management, which may or may not utilize team nursing. Educational opportunities for practical nurses or UAPs are not the drivers behind team nursing."},{"ch":"Ch 14: Organizing Patient Care","q":"A nurse is evaluating a set of clients and identifies which one as being most appropriate for having care organized by case management?","opts":"<div class=\"opt\" data-letter=\"A\">A) A client with a urinary tract infection who is admitted through the emergency department</div><div class=\"opt\" data-letter=\"B\">B) A client who is seen for a dislocated wrist in the ambulatory clinic</div><div class=\"opt\" data-letter=\"C\">C) A client who is being seen for follow -up care related to high blood pressure in a primary care provider office</div><div class=\"opt\" data-letter=\"D\">D) A client who has to undergo same day surgery in a perioperative settings</div>","ans":"A","sata":false,"fb":"Because 50% to 80% of admissions in most hospitals enter via the emergency department, case management often begins there in the acute care setting."},{"ch":"Ch 14: Organizing Patient Care","q":"Which client would be most likely to benefit from a disease management approach within the context of case management?","opts":"<div class=\"opt\" data-letter=\"A\">A) A client who is being treated for a ruptured tympanic membrane</div><div class=\"opt\" data-letter=\"B\">B) A client who has chronic obstructive pulmonary disease (COPD)</div><div class=\"opt\" data-letter=\"C\">C) A client who has been diagnosed with a postpartum hemorrhage (PPH)</div><div class=\"opt\" data-letter=\"D\">D) A client being treated for a transfusion reaction after receiving packed red blood cells</div>","ans":"B","sata":false,"fb":"Disease management is most often focused on the management of long -term, chronic diseases rather than acute health problems.","feedback":"Disease management is most often focused on the management of long -term, chronic diseases rather than acute health problems."},{"ch":"Ch 14: Organizing Patient Care","q":"What is one of the most important differences between case management and disease management?","opts":"<div class=\"opt\" data-letter=\"A\">A) Disease management referrals begin in the hospital inpatient setting.</div><div class=\"opt\" data-letter=\"B\">B) Disease management is a collaborative process to meet client needs.</div><div class=\"opt\" data-letter=\"C\">C) High -cost population groups are specifically targeted in disease management.</div><div class=\"opt\" data-letter=\"D\">D) Disease management treatment is episodic.</div>","ans":"C","sata":false,"fb":"Although there are many similarities between disease management and case management, the primary goal of disease management is to target high -cost disease populations. Disease management referrals may originate in the community rather than from inpatient settings. Both models are collaborative. Disease management is designed to be ongoing rather than episodic."},{"ch":"Ch 14: Organizing Patient Care","q":"A large health care organization is reconsidering the model of client care delivery. What factor should be prioritized in this decision?","opts":"<div class=\"opt\" data-letter=\"A\">A) Client needs</div><div class=\"opt\" data-letter=\"B\">B) Staff expertise</div><div class=\"opt\" data-letter=\"C\">C) Cost</div><div class=\"opt\" data-letter=\"D\">D) Physical layout of the facility</div>","ans":"A","sata":false,"fb":"Many factors need to be considered when a change in care delivery is being selected. Central among these, however, is the interests of client s. Costs, staffing, and facilities must be considered, but the needs of clients are paramount."},{"ch":"Ch 14: Organizing Patient Care","q":"A registered nurse is paired with a practical nurse and the two nurses are working together to provide all the needs for a group of clients. What type of nursing care delivery are these nurses demonstrating?","opts":"<div class=\"opt\" data-letter=\"A\">A) Total client care</div><div class=\"opt\" data-letter=\"B\">B) Functional nursing</div><div class=\"opt\" data-letter=\"C\">C) Modular nursing</div><div class=\"opt\" data-letter=\"D\">D) Primary care nursing</div>","ans":"C","sata":false,"fb":"Modular nursing uses mini -teams, typically an RN and unlicensed health care worker(s), to provide care to a small group of clients, centralized geographically. None of the other options provide this particular staffing format."},{"ch":"Ch 14: Organizing Patient Care","q":"Primary care nursing is organized so that the client is at the center of the structure. How many nurses have responsibility for the care planning and coordination for the client during the 24 -hour period?","opts":"<div class=\"opt\" data-letter=\"A\">A) One</div><div class=\"opt\" data-letter=\"B\">B) Two</div><div class=\"opt\" data-letter=\"C\">C) Three</div><div class=\"opt\" data-letter=\"D\">D) Four</div>","ans":"A","sata":false,"fb":"Primary care nursing is organized so that the client is at the center of the structure. One nurse has 24 -hour responsibility for care planning and coordination."},{"ch":"Ch 14: Organizing Patient Care","q":"A nurse can directly address one of the Institute of Medicine's recommendations to improve practice environment by:","opts":"<div class=\"opt\" data-letter=\"A\">A) Facilitating open communication and shared decision making.</div><div class=\"opt\" data-letter=\"B\">B) Advocating for caps on the maximum allowable nurse-client ratio.</div><div class=\"opt\" data-letter=\"C\">C) Adopting a functional nursing model whenever the setting allows.</div><div class=\"opt\" data-letter=\"D\">D) Requiring all nursing staff to complete advanced clinical training annually.</div>","ans":"A","sata":false,"fb":"Interdisciplinary teamwork is accomplished through interdependent collaboration, open communication, and shared decision making. The Institute of Medicine has helped expand opportunities for nurses to lead collaborative improvement efforts with physicians and other members of the health care team to improve practice environments."},{"ch":"Ch 14: Organizing Patient Care","q":"A nurse is following a multidisciplinary action plan (MAP) when caring for a new client. The nurse should identify what components within the MAP? Select all that apply.","opts":"<div class=\"opt\" data-letter=\"A\">A) Cost analysis of major interventions</div><div class=\"opt\" data-letter=\"B\">B) Identity of the nurse navigator</div><div class=\"opt\" data-letter=\"C\">C) Critical path</div><div class=\"opt\" data-letter=\"D\">D) Nursing care plan</div><div class=\"opt\" data-letter=\"E\">E) Indication of times when nursing interventions occur</div>","ans":["C","D","E"],"sata":true,"fb":"The care MAP is a combination of a critical path and a nursing care plan that shows times when nursing interventions should occur as well as variances. All health care providers follow the care MAP to facilitate expected outcomes. It does not include cost analysis and does not necessarily involve a role for a nurse navigator."},{"ch":"Ch 14: Organizing Patient Care","q":"A client who has just been diagnosed with lung cancer has been assigned a nurse navigator. What task should the nurse prioritize in this role?","opts":"<div class=\"opt\" data-letter=\"A\">A) Providing evidence -based guidance on treatment options and treatment decisions</div><div class=\"opt\" data-letter=\"B\">B) Providing clinical leadership and ensuring quality for the client's care</div><div class=\"opt\" data-letter=\"C\">C) Guiding the client in an effort to provide high -quality managed care</div><div class=\"opt\" data-letter=\"D\">D) Guiding the client and family through their various interactions with the health care system</div>","ans":"D","sata":false,"fb":"The primary role of a nurse navigator is to help the client and the family navigate the complex health care system by providing information and support. The navigator would not provide direct guidance on choosing treatment options, which are normally beyond the nurse's scope of practice. Clinical leadership is the role of the clinical nurse -leader. The role","feedback":"The primary role of a nurse navigator is to help the client and the family navigate the complex health care system by providing information and support. The navigator would not provide direct guidance on choosing treatment options, which are normally beyond the nurse's scope of practice. Clinical leadership is the role of the clinical nurse-leader. The role of the nurse navigator is not synonymous with managed care."},{"ch":"Ch 14: Organizing Patient Care","q":"An experienced registered nurse has begun a position as a clinical nurse -leader (CNL). In this role, what tasks should the nurse perform? Select all that apply.","opts":"<div class=\"opt\" data-letter=\"A\">A) Collaborating with the interdisciplinary team</div><div class=\"opt\" data-letter=\"B\">B) Guiding clients and families through the health care system at various sites</div><div class=\"opt\" data-letter=\"C\">C) Coaching nurses to provide evidence -based care</div><div class=\"opt\" data-letter=\"D\">D) Introducing quality improvement initiatives</div><div class=\"opt\" data-letter=\"E\">E) Preceptoring senior nursing students</div>","ans":["A","C","D"],"sata":true,"fb":"The CNL role involves close collaboration with the interdisciplinary care team, leading nurses on the unit to ensure high -quality care and introducing quality improvement measures. Guiding clients and families through the health care system at various sites is more congruent with a nurse navigator role. A CNL focuses on high -level leadership at the clinical site and would be less likely to be a preceptor because that role focuses on direct client care."},{"ch":"Ch 14: Organizing Patient Care","q":"A clinical site has a diverse skills mix that includes registered nurses, practical nurses, and UAPs. Senior management is proposing a shift from team nursing to primary nursing. What effect will the skills mix have on this transition?","opts":"<div class=\"opt\" data-letter=\"A\">A) Implementation of primary nursing will likely require hiring more UAPs and laying off some RNs.</div><div class=\"opt\" data-letter=\"B\">B) Implementation of primary nursing will likely require hiring more RNs, and laying off some UAPs.</div><div class=\"opt\" data-letter=\"C\">C) With adequate resources, primary nursing can be successfully implemented with the existing skills mix.</div><div class=\"opt\" data-letter=\"D\">D) Primary nursing is most successful if every member of the team providing direct client care is an RN.</div>","ans":"B","sata":false,"fb":"Shifting from a team approach to a primary care nursing approach would typically necessitate an increased number of licensed RNs and a reduction in UAP."},{"ch":"Ch 14: Organizing Patient Care","q":"Which statement demonstrates an intervention focused on the primary disadvantage of team nursing?","opts":"<div class=\"opt\" data-letter=\"A\">A) \"We are working with one fewer team member today.\"</div><div class=\"opt\" data-letter=\"B\">B) \"The team will be meeting for a care report update in 5 minutes.\"</div><div class=\"opt\" data-letter=\"C\">C) \"Our client assignment is comprised of both males and females.\"</div><div class=\"opt\" data-letter=\"D\">D) \"We will be having a member of the float pool in our team today.\"</div>","ans":"B","sata":false,"fb":"Disadvantages of team nursing are associated primarily with improper implementation rather than with the philosophy itself. Frequently, insufficient time is allowed for team care planning and communication. This can lead to blurred lines of responsibility, errors, and fragmented client care. None of the other options address a known disadvantage of team nursing."},{"ch":"Ch 14: Organizing Patient Care","q":"Which statements demonstrate an understanding of the factors that should be considered when a change in the care delivery system is being proposed? Select all that apply.","opts":"<div class=\"opt\" data-letter=\"A\">A) \"We have determined that our level of care would improve if we provided it differently.\"</div><div class=\"opt\" data-letter=\"B\">B) \"It's questionable whether our current nursing staff is large enough to support the proposed change.\"</div><div class=\"opt\" data-letter=\"C\">C) \"We will discuss our proposed change with the multidisciplinary team members.\"</div><div class=\"opt\" data-letter=\"D\">D) \"Administration has been supportive of the planned change in our care delivery system.\"</div><div class=\"opt\" data-letter=\"E\">E) \"We're going to make our decision based on which option is newest in the literature.\"</div>","ans":["A","B","C","D"],"sata":true,"fb":"If evaluation of the present system reveals deficiencies, leaders and managers need to examine available resources and compare those with resources needed for the change. Therefore, openness to change and a willingness to examine available resources are necessary. Interdisciplinary collaboration is essential and support from high -level administration is needed as well. Decisions should not be based simply on which model is newest or most innovative."},{"ch":"Ch 14: Organizing Patient Care","q":"Which historical event have had a major effect on the delivery model of nursing care?","opts":"<div class=\"opt\" data-letter=\"A\">A) Emergence of antibiotic -resistant microorganisms in the 1990s</div><div class=\"opt\" data-letter=\"B\">B) Increases in client empowerment during the 1970s and 80s</div><div class=\"opt\" data-letter=\"C\">C) High rates of infection, death, and disability during the Civil War</div><div class=\"opt\" data-letter=\"D\">D) Shifts from home -based care to hospital -based care during the 1930s</div>","ans":"D","sata":false,"fb":"Major shifts in the location of care from the home to the hospital underlie many of the shifts in care delivery in the early decades of the 20th century. Client empowerment, antibiotic resistance, and the Civil War are not identified as having such sweeping effects on the delivery of nursing care."},{"ch":"Ch 14: Organizing Patient Care","q":"A nurse -manager is part of a committee that has been commissioned to change the care delivery model at a health care facility. When planning this change, the nurse and the other committee members should be aware that this process will:","opts":"<div class=\"opt\" data-letter=\"A\">A) be difficult to implement without hiring staff who have experience with the new model.</div><div class=\"opt\" data-letter=\"B\">B) affect social relationships and group functioning in the workforce.</div><div class=\"opt\" data-letter=\"C\">C) require equal input from every staff member during the planning stage.</div><div class=\"opt\" data-letter=\"D\">D) be best conducted by objective consultants from outside the organization.</div>","ans":"B","sata":false,"fb":"The nurse -leader -manager needs to be aware that redesigning work that disrupts group cohesiveness may result in increased levels of job dissatisfaction. Reorganizing care does not necessarily require individuals from outside the organization. Often, the existing staff and skills mix can be used to implement a change; hiring may not be necessary. Input from staff and other stakeholders should be sought, but it is unrealistic to expect equal input from everyone."},{"ch":"Ch 14: Organizing Patient Care","q":"An emergency room nurse is assessing a client who has presented with an exacerbation of recently diagnosed irritable bowel syndrome. The client states being \"overwhelmed\" and \"bewildered\" by the mix of diagnostic tests, appointments, and consultations since the diagnosis. What is the nurse's best action?","opts":"<div class=\"opt\" data-letter=\"A\">A) Acknowledge the difficulty of the client's circumstances and arrange for a nurse navigator.</div><div class=\"opt\" data-letter=\"B\">B) Validate the client's concerns and liaise with the clinical nurse -leader (CNL).</div><div class=\"opt\" data-letter=\"C\">C) Offer to mediate between the client and the case manager.</div><div class=\"opt\" data-letter=\"D\">D) Offer to accompany the client to any upcoming appointments.</div>","ans":"A","sata":false,"fb":"Nurse navigators help clients and families navigate the complex health care system by providing information and support. It would not be possible for the ED nurse to perform this role on an ad hoc basis. A CNL focuses on quality of care in a specific setting and less on helping clients navigate the larger health care system. Offering to mediate between the client and the case manager does not address the client's expressed concern."},{"ch":"Ch 14: Organizing Patient Care","q":"An experienced nurse is applying for a position as a clinical nurse -leader (CNL). In addition to the nurse's clinical experience, what characteristic best qualifies the nurse for this position?","opts":"<div class=\"opt\" data-letter=\"A\">A) The nurse currently sits on the hospital's ethics board.</div><div class=\"opt\" data-letter=\"B\">B) The nurse has consistently adhered to the standards of practice.</div><div class=\"opt\" data-letter=\"C\">C) Specialty certification in a specific area of practice.</div><div class=\"opt\" data-letter=\"D\">D) The nurse has a master of science in nursing degree.</div>","ans":"D","sata":false,"fb":"The CNL, as an advanced generalist with a master's degree in nursing, is expected to provide clinical leadership at the point of care. CNLs have advanced knowledge and education in general practice as opposed to specialization in one primary discipline, like clinical nurse specialists. Adherence to standards of practice is a minimum requirement for nursing practice, not a specific qualifier for a CNL role. Similarly, sitting on an ethics board is a useful aspect of experience but not a specific qualifier for a CNL role."},{"ch":"Ch 14: Organizing Patient Care","q":"A nurse -manager sits on the hospital's board of directors and there has been repeated discussion about the possibility of changing the care delivery model. What action should be performed first?","opts":"<div class=\"opt\" data-letter=\"A\">A) Elicit support from internal and external stakeholders.</div><div class=\"opt\" data-letter=\"B\">B) Perform a cost -benefit analysis of the major alternatives for care delivery.</div><div class=\"opt\" data-letter=\"C\">C) Assess the strengths and weaknesses of the current delivery model.</div><div class=\"opt\" data-letter=\"D\">D) Plan a pilot project where the delivery model will be changed on one subacute unit.</div>","ans":"C","sata":false,"fb":"Assessment of the current delivery system must precede any decision to change the delivery model. Consequently, it would be premature to start building support from stakeholders, introducing a pilot project, or doing cost -benefit analysis of alternatives."},{"ch":"Ch 14: Organizing Patient Care","q":"A primary health care teams (PHCTs) has been established to coordinate the care of a client with complex health care needs. What should be the nurse's primary role in this team?","opts":"<div class=\"opt\" data-letter=\"A\">A) Communicate the wishes of the client to the other team members.</div><div class=\"opt\" data-letter=\"B\">B) Weigh the benefits of suggested interventions with their costs.</div><div class=\"opt\" data-letter=\"C\">C) Provide the client's direct bedside care, whenever possible.</div><div class=\"opt\" data-letter=\"D\">D) Emphasize improved quality of life and client -centered care.</div>","ans":"D","sata":false,"fb":"The nurse can perform several tasks in the context of a PHCT, but advocating for the client and promoting client -centered care is a priority role that encompasses many smaller tasks (such as communicating the client's wishes, when necessary). The nurse does not focus on financial concerns in this setting, and it is not necessary for the nurse on the PHCT to be the one to provide the majority of the client's actual care."},{"ch":"Ch 14: Organizing Patient Care","q":"A nurse manager is planning to evaluate the change of client care from team nursing to primary nursing. Which intervention is needed?","opts":"<div class=\"opt\" data-letter=\"A\">A) The nurses are asked to complete a short survey about the process.</div><div class=\"opt\" data-letter=\"B\">B) The nurses' charts are reviewed for critical elements of admission process.</div><div class=\"opt\" data-letter=\"C\">C) The nurse manager asks informally and formally about the need of nursing resources for client care.</div><div class=\"opt\" data-letter=\"D\">D) Observing nurses during client rounds to assess the quality of care delivered.</div>","ans":"C","sata":false,"fb":"A nurse leader and manager should evaluate the client care, which involves asking informally and formally about the need of nursing resources for client care. Completing a short survey will allow for information but will not assist in understanding some of the challenges of client care. Reviewing charts are essential further along in the process of the change in the process. The other members of the interprofessional/multidisciplinary team can assist in planning but not evaluating."}];
let questions = [...ALL_QUESTIONS];
let current = 0;
let answers = {};       // index -> letter (normal) or Set of letters (sata)
let correctCount = 0, wrongCount = 0;
let wrongIndexes = new Set();

function init() {
  current = 0; answers = {}; correctCount = 0; wrongCount = 0; wrongIndexes = new Set();
  document.getElementById('stat-correct').textContent = '0';
  document.getElementById('stat-wrong').textContent = '0';
  document.getElementById('stat-remain').textContent = questions.length;
  document.getElementById('summary').style.display = 'none';
  document.getElementById('quiz-container').style.display = 'block';
  document.getElementById('wrong-btn').style.display = 'none';
  render();
}

function render() {
  if (current >= questions.length) { showSummary(); return; }
  const q = questions[current];
  document.getElementById('q-counter').textContent = 'Question ' + (current+1) + ' of ' + questions.length;
  document.getElementById('ch-tag').textContent = q.ch;

  const sataTag = document.getElementById('sata-tag');
  const legend  = document.getElementById('sata-legend');
  if (q.sata) {
    sataTag.style.display = 'inline-block';
    legend.style.display = 'block';
  } else {
    sataTag.style.display = 'none';
    legend.style.display = 'none';
  }

  document.getElementById('q-text').textContent = q.q;
  document.getElementById('options').innerHTML = q.opts;
  document.getElementById('feedback').style.display = 'none';
  document.getElementById('feedback-text').textContent = q.fb;
  document.getElementById('correct-badge').style.display = 'none';
  document.getElementById('wrong-badge').style.display  = 'none';
  document.getElementById('check-btn').style.display    = 'none';
  document.getElementById('progress').style.width = ((current / questions.length) * 100) + '%';
  document.getElementById('prev-btn').disabled = current === 0;
  document.getElementById('next-btn').textContent = current === questions.length - 1 ? 'Finish' : 'Next';

  const prev = answers[current];
  if (prev !== undefined) {
    if (q.sata) restoreMulti(prev, q.ans);
    else        revealSingle(prev, q.ans);
  } else {
    if (q.sata) attachMultiHandlers(q.ans);
    else        attachSingleHandlers(q.ans);
  }
}

// ── Single-answer ───────────────────────────────────────────────────────────
function attachSingleHandlers(correct) {
  document.querySelectorAll('.opt').forEach(o => {
    o.onclick = () => {
      if (answers[current] !== undefined) return;
      answers[current] = o.dataset.letter;
      updateStats(o.dataset.letter === correct);
      revealSingle(o.dataset.letter, correct);
    };
  });
}

function revealSingle(selected, correct) {
  document.querySelectorAll('.opt').forEach(o => {
    o.classList.add('locked'); o.onclick = null;
    if (o.dataset.letter === correct)                       o.classList.add('correct');
    if (o.dataset.letter === selected && selected !== correct) o.classList.add('wrong');
  });
  document.getElementById('feedback').style.display = 'block';
  const isCorrect = selected === correct;
  document.getElementById('correct-badge').style.display = isCorrect ? 'flex' : 'none';
  document.getElementById('wrong-badge').style.display   = isCorrect ? 'none' : 'flex';
}

// ── Multi-answer SATA ───────────────────────────────────────────────────────
let sataSelected = new Set();

function attachMultiHandlers(correctList) {
  sataSelected = new Set();
  document.querySelectorAll('.opt').forEach(o => {
    o.onclick = () => {
      if (o.classList.contains('locked')) return;
      const letter = o.dataset.letter;
      if (sataSelected.has(letter)) {
        sataSelected.delete(letter);
        o.classList.remove('selected');
      } else {
        sataSelected.add(letter);
        o.classList.add('selected');
      }
      document.getElementById('check-btn').style.display = sataSelected.size > 0 ? 'block' : 'none';
    };
  });
  document.getElementById('check-btn').onclick = () => submitMulti(correctList);
}

function submitMulti(correctList) {
  const correct = new Set(correctList);
  const isFullyCorrect = [...correct].every(l => sataSelected.has(l)) &&
                         [...sataSelected].every(l => correct.has(l));
  answers[current] = [...sataSelected];
  if (!isFullyCorrect) wrongIndexes.add(current);
  updateStats(isFullyCorrect);

  document.querySelectorAll('.opt').forEach(o => {
    o.classList.add('locked'); o.onclick = null;
    o.classList.remove('selected');
    const letter = o.dataset.letter;
    const wasSelected = sataSelected.has(letter);
    const isCorrect   = correct.has(letter);
    if (isCorrect && wasSelected)  o.classList.add('correct');
    if (!isCorrect && wasSelected) o.classList.add('wrong');
    if (isCorrect && !wasSelected) o.classList.add('missed');
  });
  document.getElementById('check-btn').style.display = 'none';
  document.getElementById('feedback').style.display  = 'block';
  document.getElementById('correct-badge').style.display = isFullyCorrect ? 'flex' : 'none';
  document.getElementById('wrong-badge').style.display   = isFullyCorrect ? 'none' : 'flex';
}

function restoreMulti(savedList, correctList) {
  const saved   = new Set(savedList);
  const correct = new Set(correctList);
  document.querySelectorAll('.opt').forEach(o => {
    o.classList.add('locked'); o.onclick = null;
    const letter = o.dataset.letter;
    const wasSelected = saved.has(letter);
    const isCorrect   = correct.has(letter);
    if (isCorrect && wasSelected)  o.classList.add('correct');
    if (!isCorrect && wasSelected) o.classList.add('wrong');
    if (isCorrect && !wasSelected) o.classList.add('missed');
  });
  document.getElementById('feedback').style.display = 'block';
  const isFullyCorrect = [...correct].every(l => saved.has(l)) && [...saved].every(l => correct.has(l));
  document.getElementById('correct-badge').style.display = isFullyCorrect ? 'flex' : 'none';
  document.getElementById('wrong-badge').style.display   = isFullyCorrect ? 'none' : 'flex';
}

// ── Stats ────────────────────────────────────────────────────────────────────
function updateStats(isCorrect) {
  if (isCorrect) correctCount++; else { wrongCount++; wrongIndexes.add(current); }
  document.getElementById('stat-correct').textContent = correctCount;
  document.getElementById('stat-wrong').textContent   = wrongCount;
  document.getElementById('stat-remain').textContent  = questions.length - Object.keys(answers).length;
}

// ── Nav ──────────────────────────────────────────────────────────────────────
function nextQ() {
  if (current < questions.length - 1) { current++; render(); } else showSummary();
}
function prevQ() { if (current > 0) { current--; render(); } }

// ── Summary ──────────────────────────────────────────────────────────────────
function showSummary() {
  document.getElementById('quiz-container').style.display = 'none';
  document.getElementById('summary').style.display = 'block';
  const total   = questions.length;
  const skipped = total - Object.keys(answers).length;
  const pct     = total > 0 ? Math.round((correctCount/total)*100) : 0;
  document.getElementById('sum-score').textContent   = correctCount + '/' + total;
  document.getElementById('sum-pct').textContent     = pct + '%';
  document.getElementById('sum-correct').textContent = correctCount;
  document.getElementById('sum-wrong').textContent   = wrongCount;
  document.getElementById('sum-skipped').textContent = skipped;
  let msg = '';
  if (pct >= 92) msg = 'A — Outstanding! You are very well prepared.';
  else if (pct >= 83) msg = 'B — Good work. A few more rounds and you are set.';
  else if (pct >= 75) msg = 'C — Passing, but push for deeper mastery before exam day.';
  else msg = 'Below passing — focus on rationales for wrong answers and review those chapters.';
  document.getElementById('sum-msg').textContent = msg;
  document.getElementById('progress').style.width = '100%';
  if (wrongIndexes.size > 0) document.getElementById('wrong-btn').style.display = 'inline-block';
}

// ── Controls ─────────────────────────────────────────────────────────────────
function shuffleQuestions() {
  for (let i = questions.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i+1));
    [questions[i], questions[j]] = [questions[j], questions[i]];
  }
  init();
}
function resetQuiz() {
  questions = [...ALL_QUESTIONS];
  document.getElementById('ch-filter').value = 'all';
  init();
}
function filterByChapter() {
  const val = document.getElementById('ch-filter').value;
  questions = val === 'all' ? [...ALL_QUESTIONS]
    : ALL_QUESTIONS.filter(q => q.ch.startsWith('Ch ' + val + ':'));
  init();
}
function showOnlyWrong() {
  if (wrongIndexes.size === 0) return;
  questions = [...wrongIndexes].map(i => questions[i]);
  init();
}

document.addEventListener('keydown', e => {
  const key = e.key.toUpperCase();
  if (['A','B','C','D','E'].includes(key)) {
    document.querySelectorAll('.opt').forEach(o => { if (o.dataset.letter === key) o.click(); });
  }
  if ((e.key === 'ArrowRight' || e.key === 'Enter') && answers[current] !== undefined) nextQ();
  if (e.key === 'ArrowLeft') prevQ();
});

init();
</script>
