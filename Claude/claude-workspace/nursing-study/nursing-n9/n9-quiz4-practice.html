<script>
const ALL_QUESTIONS = [{"ch":"Ch 4: Ethical Issues","q":"Which statement best describes ethics?","opts":"<div class=\"opt\" data-letter=\"A\">A) How our lives are led in day -to-day circumstances</div><div class=\"opt\" data-letter=\"B\">B) How people make decisions based on legal consequences</div><div class=\"opt\" data-letter=\"C\">C) The conflict, power, and interdependency associated with the way we live</div><div class=\"opt\" data-letter=\"D\">D) What our conduct and actions should be regarding what is right and good</div>","ans":"D","sata":false,"fb":"Ethics is the systematic study of what a person's conduct and actions should be with regard to self, other human beings, and the environment. It is the justification of what is right or good and the study of what a person's life and relationships should be, such as doing the right action when witnessing a crime, not necessarily what they are. It is not the study of what people actually do in their daily lives or how they make a decision based on the legal consequences but rather what they should do. Ethics is related to legality and morality, but it is not synonymous with these concepts."},{"ch":"Ch 4: Ethical Issues","q":"A nurse is facing an ethical dilemma about whether to report a colleague's offensive comment, an action which is likely to jeopardize their relationship. What is a characteristic of this nurse's ethical dilemma?","opts":"<div class=\"opt\" data-letter=\"A\">A) The dilemma can be solved by applying empirical data.</div><div class=\"opt\" data-letter=\"B\">B) The situation involves a breach of the law.</div><div class=\"opt\" data-letter=\"C\">C) The dilemma has no realistic solution.</div><div class=\"opt\" data-letter=\"D\">D) The situation involves two or more undesirable alternatives.</div>","ans":"D","sata":false,"fb":"Ethical dilemmas involve being forced to choose between two or more undesirable alternatives. Ethical dilemmas are often not amenable to being solved with empirical data; they involve values and beliefs, not only facts. Most ethical dilemmas do not involve a breach of the law; legal issues often have a more clear and unambiguous response. Even though ethical dilemmas are difficult to manage, this does not mean that there is no possibility of a realistic solution."},{"ch":"Ch 4: Ethical Issues","q":"A nurse is applying the ethical principle of justice when providing care for clients. What","opts":"<div class=\"opt\" data-letter=\"A\">A) Meeting continuing education requirements for license renewal</div><div class=\"opt\" data-letter=\"B\">B) Prioritizing actions that will benefit the largest number of clients</div><div class=\"opt\" data-letter=\"C\">C) Respecting clients' rights to make decisions about their care</div><div class=\"opt\" data-letter=\"D\">D) Ensuring that time and resources are distributed equitably to clients</div>","ans":"D","sata":false,"fb":"The principle of justice states that equals should be treated equally and that unequals should be treated according to their differences; this is the principle of equity. Justice is frequently applied when there are scarcities or competition for resources or benefits. Meeting requirements for licensure is a legal issue, not a principle of ethics. The principle of utility involves prioritizing actions that will benefit the largest number of clients. Respecting clients' rights to make decisions demonstrates autonomy."},{"ch":"Ch 4: Ethical Issues","q":"The only treatment alternative left for a client diagnosed with advanced cancer is a rare, highly experimental bone marrow transfusion with a 10% success rate. Some individuals are arguing that the high cost of the procedure could be better spent providing well -baby screening for 2,000 residents in the service area. What ethical principle is most directly involved in this situation?","opts":"<div class=\"opt\" data-letter=\"A\">A) Unethical conduct</div><div class=\"opt\" data-letter=\"B\">B) Maleficence</div><div class=\"opt\" data-letter=\"C\">C) Paternalism</div><div class=\"opt\" data-letter=\"D\">D) Utility</div>","ans":"D","sata":false,"fb":"The principle of utility states that what is best for the common good outweighs what is best for the individual. There is no indication of unethical or maleficent (harmful) behavior. Paternalism would be characterized by decisions being made without the client having input."},{"ch":"Ch 4: Ethical Issues","q":"A nurse is applying the MORAL decision -making model to a dilemma involving a colleague's possible dishonesty in documentation. What is the nurse's initial action?","opts":"<div class=\"opt\" data-letter=\"A\">A) Perform a critical self-reflection of the nurse's own morals and values.</div><div class=\"opt\" data-letter=\"B\">B) Think of as many alternatives as possible.</div><div class=\"opt\" data-letter=\"C\">C) Gather as much information about the situation as possible.</div><div class=\"opt\" data-letter=\"D\">D) Identify the legal implications of the dilemma.</div>","ans":"C","sata":false,"fb":"The first step of the MORAL decision -making model is to \"massage the dilemma.\" This involves collecting data about the ethical problem and who should be involved in the decision -making process. However, this does not necessarily mean that the nurse must engage the colleague who is the object of the decision. Outlining options (alternatives) is the second step in the model. It is presumed that a nurse will engage in self-reflection when addressing dilemmas, but this is not an explicit component of the MORAL model."},{"ch":"Ch 4: Ethical Issues","q":"A nurse has been asked to stay after a shift and work overtime because three nurses have called in sick. The nurse is reluctant to work the overtime because of a social commitment. Duty -based reasoning would dictate that the nurse:","opts":"<div class=\"opt\" data-letter=\"A\">A) carefully weighs the effect of the decision on workplace relationships.</div><div class=\"opt\" data-letter=\"B\">B) works overtime because of the responsibility owed to clients.</div><div class=\"opt\" data-letter=\"C\">C) bases the decision on recent precedents in the health care organization.</div><div class=\"opt\" data-letter=\"D\">D) contacts the three nurses to remind them of their obligations.</div>","ans":"B","sata":false,"fb":"Duty -based reasoning is an ethical framework stating that some decisions must be made because there is a duty to do something or to refrain from doing something. In this case, it could be construed that the nurse has a duty to care for clients that supersedes social activities. Duty -based reasoning would not prioritize the effect on relationships over the nurse's moral duty. Precedents would not necessarily indicate what the nurse's duty is. Duty -based reasoning emphasizes the nurse's own duty, not that of colleagues."},{"ch":"Ch 4: Ethical Issues","q":"A nurse is integrating the code of ethics when making a decision about the best response to a challenging situation. What information will the nurse be able to obtain from this document?","opts":"<div class=\"opt\" data-letter=\"A\">A) Legal guidelines to help the nurse make an ethical decision</div><div class=\"opt\" data-letter=\"B\">B) The principles that are most valued in nursing practice</div><div class=\"opt\" data-letter=\"C\">C) A model that will guide the nurse to make an ethical decision</div><div class=\"opt\" data-letter=\"D\">D) Guidelines that will help the nurse clarify his or her own values</div>","ans":"B","sata":false,"fb":"A professional code of ethics is a set of principles, established by a profession, to guide the individual practitioner. It is not, however, a decision -making model or a tool for clarifying one's own values. Codes of ethics are not legally binding documents.","feedback":"A professional code of ethics is a set of principles, established by a profession, to guide the individual practitioner. It is not, however, a decision -making model or a tool for clarifying one's own values. Codes of ethics are not legally binding documents."},{"ch":"Ch 4: Ethical Issues","q":"A nurse is faced with a situation that requires ethical decision making. What statement should guide the nurse's action?","opts":"<div class=\"opt\" data-letter=\"A\">A) Outcomes are the main criterion for evaluating ethical decision making.</div><div class=\"opt\" data-letter=\"B\">B) Only desirable alternatives should be identified when solving ethical dilemmas.</div><div class=\"opt\" data-letter=\"C\">C) Critical ethical decisions should be made quickly so the situation does not worsen.</div><div class=\"opt\" data-letter=\"D\">D) Accepting some ambiguity and uncertainty is a part of ethical decision making.</div>","ans":"D","sata":false,"fb":"Ethical decision makers choose between two or more undesirable alternatives; and because they can use only the information and resources available at the time, they must live with some ambiguity and uncertainty. Processes must be considered during ethical decision making, not only outcomes. The nurse should identify as many alternatives as possible during the early stages of decision making, not only desirable alternatives. Ethical decisions often require a careful and methodical approach rather than a quick decision."},{"ch":"Ch 4: Ethical Issues","q":"Which statement by a nurse most clearly demonstrates an intuitionist framework for ethical decision making?","opts":"<div class=\"opt\" data-letter=\"A\">A) \"I'll make the best decision if I choose the option that comes to mind first rather than overanalyzing the situation.\"</div><div class=\"opt\" data-letter=\"B\">B) \"I'm trying to think of as many different options as I can rather than focusing on those that look most attractive.\"</div><div class=\"opt\" data-letter=\"C\">C) \"It's important that I consider the effect of my decision on the organization, not just the people who are directly involved.\"</div><div class=\"opt\" data-letter=\"D\">D) \"I've got to look at this situation on the basis of its unique characteristics, not by comparing it to other situations.\"</div>","ans":"D","sata":false,"fb":"Intuitionist states that each case weighed on a case -by-case basis to determine relative goals, duties, and rights. Consequently, there is a focus on the specific characteristics of a situation, not its commonalities with other situations. Thinking of as many options as possible is a good practice for ethical decision making, but it is not specifically aligned with an intuitionist framework. Similarly, considering the effects on the organization is not a particular characteristic of this framework. Intuition does not entail choosing the option that first comes to mind, without any further analysis or consideration.","feedback":"Intuitionist states that each case weighed on a case -by-case basis to determine relative goals, duties, and rights. Consequently, there is a focus on the specific characteristics of a situation, not its commonalities with other situations. Thinking of as many options as possible is a good practice for ethical decision making, but it is not specifically aligned with an intuitionist framework. Similarly, considering the effects on the organization is not a particular characteristic of this framework. Intuition does not entail choosing the option that first comes to mind, without any further analysis or consideration."},{"ch":"Ch 4: Ethical Issues","q":"The principle of autonomy would have the greatest bearing on what clinical situation?","opts":"<div class=\"opt\" data-letter=\"A\">A) A client is discussing a do -not-resuscitate order with the care team.</div><div class=\"opt\" data-letter=\"B\">B) A client is unable to afford the treatment that carries the best chance for a cure.</div><div class=\"opt\" data-letter=\"C\">C) A nurse is considering whether to report a colleague's rough treatment of a client.</div><div class=\"opt\" data-letter=\"D\">D) The nurse is caring for two clients in pain and must choose whom to treat first.</div>","ans":"A","sata":false,"fb":"Autonomy, or self -determination, is also referred to as freedom of choice and accepting the responsibility for one's choice. Deciding on resuscitation options involves this principle because the client's preference is the final determinant on the matter. Situations involving scarce resources or time are more closely aligned with issues of justice. The nurse's ethical decision making around reporting bad practice align most closely with duty-based reasoning and beneficence for clients."},{"ch":"Ch 4: Ethical Issues","q":"A care team is working with a client who has mental illness and has been deemed a threat to self and others. It may be justified to take away the client's right to:","opts":"<div class=\"opt\" data-letter=\"A\">A) justice.</div><div class=\"opt\" data-letter=\"B\">B) confidentiality.</div><div class=\"opt\" data-letter=\"C\">C) self-determination.</div><div class=\"opt\" data-letter=\"D\">D) beneficence.</div>","ans":"C","sata":false,"fb":"When an individual's impaired decision making poses a threat to self or others, it may be in the interests of the client and other people to temporarily remove the client's right to self -determination; that is, to remove the client's right to reject treatment. This is ultimately an act of beneficence, even though the client may perceive otherwise. Justice is more closely aligned with the distribution of benefits between people. Confidentiality is"},{"ch":"Ch 4: Ethical Issues","q":"An interdisciplinary team is considering whether to apply the principle of paternalism in the care of a client. What question should guide the team's decision?","opts":"<div class=\"opt\" data-letter=\"A\">A) Does the client have strong social or family support?</div><div class=\"opt\" data-letter=\"B\">B) What is the client's most likely prognosis?</div><div class=\"opt\" data-letter=\"C\">C) Is the client competent to make decisions?</div><div class=\"opt\" data-letter=\"D\">D) What interventions are in the client's best interest?</div>","ans":"C","sata":false,"fb":"Paternalism can be invoked when a client is unable to make sound decisions for himself or herself. Consequently, the client's ability to make decisions underlies the question of whether acting paternalistic is justified or not? The presence or absence of social and family support does not justify or rule out paternalism. Likewise, the particulars of the client's prognosis do not determine whether it is appropriate to be paternalistic. The client's competence decides whether the care team is justified in stepping in to act in the client's \"best interest.\""},{"ch":"Ch 4: Ethical Issues","q":"A nurse was navigating a difficult situation that involved an ethical dilemma. Which factors should be considered when assessing the quality of the nurse's ethical problem -solving process? Select all that apply.","opts":"<div class=\"opt\" data-letter=\"A\">A) The outcomes of the process</div><div class=\"opt\" data-letter=\"B\">B) The process that was used to arrive at a decision</div><div class=\"opt\" data-letter=\"C\">C) The number of alternatives that the nurse initially generated</div><div class=\"opt\" data-letter=\"D\">D) The process the nurse used for data gathering</div><div class=\"opt\" data-letter=\"E\">E) Precedents in the organization involving similar situations</div>","ans":["A","B","C"],"sata":true,"fb":"Outcomes should never be used as the sole criterion for assessing the quality of ethical problem solving because many variables affect outcomes that have no reflection on whether the problem solving was appropriate. Quality, instead, should be evaluated both by the outcome and the process used to make the decision. Rigorous data gathering enhances the decision -making process, but this is not the criteria by which the overall process is gauged. Similarly, precedents can be used to inform decision making but do not constitute the basis for evaluating the overall process. Generating multiple alternatives aids the"},{"ch":"Ch 4: Ethical Issues","q":"A nurse has applied the MORAL decision -making model to a situation that involved an ethical dilemma. The nurse should complete the process by:","opts":"<div class=\"opt\" data-letter=\"A\">A) evaluating the effectiveness of the decision -making process.</div><div class=\"opt\" data-letter=\"B\">B) reaffirming the nurse's relationships with stakeholders.</div><div class=\"opt\" data-letter=\"C\">C) disseminating the results of the process to other nurses.</div><div class=\"opt\" data-letter=\"D\">D) leading the implementation plan.</div>","ans":"A","sata":false,"fb":"The final phase of the MORAL decision -making model involves \"looking back,\" that is, evaluating the decision -making process. This model does not explicitly involve reaffirming relationships or disseminating the results, even though the model does not preclude these actions. Implementing the decision precedes the evaluation phase."},{"ch":"Ch 4: Ethical Issues","q":"Which statement is correct regarding the distinction between legal and ethical obligations in decision making?","opts":"<div class=\"opt\" data-letter=\"A\">A) Ethical controls are clearer and philosophically impartial.</div><div class=\"opt\" data-letter=\"B\">B) Ethical controls are much clearer and individualized.</div><div class=\"opt\" data-letter=\"C\">C) Legal controls are clearer and philosophically impartial.</div><div class=\"opt\" data-letter=\"D\">D) Legal controls are much less clear and individualized.</div>","ans":"C","sata":false,"fb":"In general, legal controls are clearer and philosophically impartial; ethical controls are much less clear and are individualized."},{"ch":"Ch 4: Ethical Issues","q":"A nurse -manager has learned that there is conflict between a nonresponsive client's family members about the best plan of care. The manager recognizes the complex ethics of this situation. What is the manager's best action?","opts":"<div class=\"opt\" data-letter=\"A\">A) Apply the precedent established by a similar ethical case.</div><div class=\"opt\" data-letter=\"B\">B) Make contact with the hospital's ethics committee.</div><div class=\"opt\" data-letter=\"C\">C) Refer the family to the hospital's spiritual care service.</div><div class=\"opt\" data-letter=\"D\">D) Ask an impartial staff member to mediate.</div>","ans":"B","sata":false,"fb":"An ethics committee can bring needed experience, perspective, and insight to challenging ethical situations. Precedent cannot always be used as a guide because each situation is unique, even if they appear superficially similar. Clients and families often benefit from spiritual care, but this does not help the manager make a good decision. Mediation can sometimes be beneficial, but this does not release the nurse -manager from addressing the situation as best as he or she can."},{"ch":"Ch 4: Ethical Issues","q":"In which situation would a nurse be justified in overriding a client's right to confidentiality?","opts":"<div class=\"opt\" data-letter=\"A\">A) An older adult client discloses to the nurse that her son occasionally hits her.</div><div class=\"opt\" data-letter=\"B\">B) A client states that he does not want to know the results of his recent diagnostic test.</div><div class=\"opt\" data-letter=\"C\">C) A client does not want her husband to know that she is a client on the unit.</div><div class=\"opt\" data-letter=\"D\">D) A teenage client asks the nurse not to tell her parents that she is pregnant.</div>","ans":"A","sata":false,"fb":"Health care managers are required by law to report certain cases, such as drug abuse in employees, elder abuse, and child abuse. This is considered a justifiable violation of confidentiality. The manager is obliged to respect client confidentiality around disclosing pregnancy, acknowledging a hospital admission, or not wanting to know diagnostic results."},{"ch":"Ch 4: Ethical Issues","q":"A new nurse -manager has committed to modeling the leadership roles associated with applying ethics in the workplace. What is the manager's best action?","opts":"<div class=\"opt\" data-letter=\"A\">A) Demonstrate self -awareness about their own beliefs, morals, and values.</div><div class=\"opt\" data-letter=\"B\">B) Ensure that individual rights are always prioritized over collective rights.</div><div class=\"opt\" data-letter=\"C\">C) Delegate ethical decision making to staff nurses whenever possible.</div><div class=\"opt\" data-letter=\"D\">D) Ensure nurses are responsible for scrutinizing each other's behavior to monitor for ethical violations.</div>","ans":"A","sata":false,"fb":"A core competency for ethical leadership is evaluating one's own values and beliefs. This form of self -reflection is foundational for providing ethical care and for promoting self -awareness in others. The balance between individual and collective rights is situation -specific; individual rights are not always prioritized over group interests. The manager must show leadership in ethical decision making and cannot always delegate this important function to staff. Ethical nurses are observant for violations, but this should not result in an environment where each nurse is \"scrutinizing\" colleagues' practice.","feedback":"A core competency for ethical leadership is evaluating one's own values and beliefs. This form of self -reflection is foundational for providing ethical care and for promoting self -awareness in others. The balance between individual and collective rights is situation -specific; individual rights are not always prioritized over group interests. The manager must show leadership in ethical decision making and cannot always delegate this important function to staff. Ethical nurses are observant for violations, but this should not result in an environment where each nurse is \"scrutinizing\" colleagues' practice."},{"ch":"Ch 4: Ethical Issues","q":"Which nurse is experiencing moral distress?","opts":"<div class=\"opt\" data-letter=\"A\">A) A nurse witnesses a colleague using a racial slur in a conversation with another nurse.</div><div class=\"opt\" data-letter=\"B\">B) The children of a terminally ill client do not want the client's prognosis communicated to the client.</div><div class=\"opt\" data-letter=\"C\">C) A nurse knows that a colleague called in sick to work because the colleague had a social engagement.</div><div class=\"opt\" data-letter=\"D\">D) A heavy workload prevents a nurse from providing the care that each client requires.</div>","ans":"D","sata":false,"fb":"Each of the listed situations has an ethical element. However, moral distress occurs when the individual knows the right thing to do but organizational constraints make it difficult to take the right course of action. A nurse who lacks the time and energy to give clients what they need is likely to experience moral distress. Issues of respect, honesty, and confidentiality require ethical decision making, but they do not directly involve a disconnect between the desire and the ability to do the right thing."},{"ch":"Ch 4: Ethical Issues","q":"A nurse is practicing in a challenging environment where ethical and moral issues must often be dealt with. Which statement describes how moral uncertainty occurs?","opts":"<div class=\"opt\" data-letter=\"A\">A) An individual is unsure which moral principles or values apply and may even be uncertain as to what the moral problem is.</div><div class=\"opt\" data-letter=\"B\">B) An individual knows the right thing to do, but organizational constraints make it difficult to take the right course of action.</div><div class=\"opt\" data-letter=\"C\">C) An individual witnesses the immoral act of another but feels powerless to stop it.</div><div class=\"opt\" data-letter=\"D\">D) An individual is left with lasting negative feelings after making a difficult ethical decision.</div>","ans":"A","sata":false,"fb":"Moral uncertainty occurs when an individual is unsure which moral principles or values apply; this may even include uncertainty as to what the moral problem is. Moral distress occurs when the individual knows the right thing to do but organizational constraints make it difficult to take the right course of action. Moral outrage occurs when an individual witnesses the immoral act of another but feels powerless to stop it. Ethical dilemma is being forced to choose between two or more undesirable alternatives."},{"ch":"Ch 4: Ethical Issues","q":"A nurse -manager is applying the MORAL decision -making model to a decision around a client's plan of care. The manager has engaged all the necessary stakeholders and collected as much data about the situation as possible. What should the manager do next?","opts":"<div class=\"opt\" data-letter=\"A\">A) Assess the client's values and beliefs.</div><div class=\"opt\" data-letter=\"B\">B) Identify as many alternatives as possible.</div><div class=\"opt\" data-letter=\"C\">C) Choose the option that best aligns with ethical principles.</div><div class=\"opt\" data-letter=\"D\">D) Arrange to meet with the institution's ethics board.</div>","ans":"B","sata":false,"fb":"The initial step in the MORAL decision -making model involves collecting data and determining who should be involved in the decision -making process. After this, the nurse identifies alternatives before choosing the best option. Engaging with an ethics committee should take place in the first step when the manager decides who to involve. Assessing the client's values should take place early in the decision -making process."},{"ch":"Ch 4: Ethical Issues","q":"Which ethical principle is demonstrated when an adult child is legally given the right to make medical decisions for a cognitively impaired parent?","opts":"<div class=\"opt\" data-letter=\"A\">A) Justice</div><div class=\"opt\" data-letter=\"B\">B) Fidelity</div><div class=\"opt\" data-letter=\"C\">C) Paternalism</div><div class=\"opt\" data-letter=\"D\">D) Beneficence</div>","ans":"C","sata":false,"fb":"Paternalism is when one individual assumes the right to make decisions for another. Justice requires that a person seek fairness, treat \"equals\" equally, and treat \"unequals\" according to their differences. Fidelity involves the need to keep promises."},{"ch":"Ch 4: Ethical Issues","q":"A nurse has repeatedly witnessed a physician being dismissive of clients' reports of pain and anxiety. The nurse recognizes that the best action would be to address this behavior with the physician, but the nurse strongly suspects that these concerns would be dismissed. What phenomenon is this nurse experiencing?","opts":"<div class=\"opt\" data-letter=\"A\">A) Moral conflict</div><div class=\"opt\" data-letter=\"B\">B) Moral outrage</div><div class=\"opt\" data-letter=\"C\">C) Ethical relativism</div><div class=\"opt\" data-letter=\"D\">D) Ethical universalism</div>","ans":"B","sata":false,"fb":"Moral outrage occurs when an individual witnesses the immoral act of another but feels powerless to stop it. Moral uncertainty or moral conflict occurs when an individual is unsure which moral principles or values apply. Ethical relativism suggests that individuals make decisions based only on what seems right or reasonable according to their value system or culture. Ethical universalism holds that ethical principles are universal and constant and that ethical decision making should not vary as a result of individual circumstances or cultural differences."},{"ch":"Ch 4: Ethical Issues","q":"Which statements concerning autonomy are true? Select all that apply.","opts":"<div class=\"opt\" data-letter=\"A\">A) It is a form of personal liberty</div><div class=\"opt\" data-letter=\"B\">B) Its legal equivalent is self-determination</div><div class=\"opt\" data-letter=\"C\">C) It is based on a person's right to make a choice</div><div class=\"opt\" data-letter=\"D\">D) It supports the process of progressive employee discipline</div><div class=\"opt\" data-letter=\"E\">E) It overrides paternalism but not beneficence</div>","ans":["A","B","C","D"],"sata":true,"fb":"A form of personal liberty, autonomy is also called freedom of choice or accepting the responsibility for one's choice. The legal right of self -determination supports this moral principle. The use of progressive discipline recognizes the autonomy of the employee. The employee, in essence, has the choice to meet organizational expectations or to be disciplined further. If the employee's continued behavior warrants termination, the principle of autonomy says that the employee has made the choice to be terminated by virtue of his or her actions, not by that of the manager. Ethical situations always differ, so it"},{"ch":"Ch 4: Ethical Issues","q":"Which activity best demonstrates a nursing -unit manager's attention to ANA standards for ethics required of that position?","opts":"<div class=\"opt\" data-letter=\"A\">A) Refers complex dilemmas to the institution's ethics board</div><div class=\"opt\" data-letter=\"B\">B) Terminates a staff member for absenteeism</div><div class=\"opt\" data-letter=\"C\">C) Assures staff and clients that unit decisions are ethically sound</div><div class=\"opt\" data-letter=\"D\">D) Maintains current licensure</div>","ans":"A","sata":false,"fb":"ANA standards for ethics related to nurse administrators identify participants on multidisciplinary and interdisciplinary teams that address ethical risks, benefits, and outcomes as a criteria measurement. The remaining options, although addressing ethical behaviors on the administrator's part, are not as directly identified by the ANA."},{"ch":"Ch 4: Ethical Issues","q":"A nurse has applied for a management position in a new organization. How can the manager best prevent intrapersonal conflict related to ethical issues in this role?","opts":"<div class=\"opt\" data-letter=\"A\">A) Determine whether nurses in the organization are required to follow a code of ethics.</div><div class=\"opt\" data-letter=\"B\">B) Identify a mentor in the organization who maintains high ethical standards.</div><div class=\"opt\" data-letter=\"C\">C) Clarify their own values and beliefs and compare to those of the organization.</div><div class=\"opt\" data-letter=\"D\">D) Become familiar with the Nurse Practice Act in the jurisdiction where the organization is located.</div>","ans":"C","sata":false,"fb":"The likelihood of intrapersonal conflict resulting from disagreement between a manager's values and those of the organization is reduced if the manager clarifies their own values and those of the organization. A mentor cannot necessarily help a manager do this because values are personal. All nurses must follow a code of ethics, so this is not a variable. Becoming familiar with the Nurse Practice Act is beneficial, but this legislation does not address ethical issues and values."},{"ch":"Ch 4: Ethical Issues","q":"The managers of a hospital unit have been approached by a nurse educator who wants to conduct research into a particular nursing intervention. In order to ensure that the rights of clients who may participate are protected, the managers should:","opts":"<div class=\"opt\" data-letter=\"A\">A) ask the hospital ethics committee to approve or deny the application.</div><div class=\"opt\" data-letter=\"B\">B) discuss the educator's values, beliefs, and ethics.</div><div class=\"opt\" data-letter=\"C\">C) compare the study methodology to the code of ethics.</div><div class=\"opt\" data-letter=\"D\">D) refer the educator to the institutional review board (IRB).</div>","ans":"D","sata":false,"fb":"IRBs are primarily formed to protect the rights and welfare of research subjects. They are the main gatekeepers for research that takes place in an institution. Ethics committees more often deal with specific situations involved in client care. Discussing the educator's values and beliefs is insufficient to protect the rights of participants. There may be some benefit in comparing the research proposal to the code of ethics, but ultimately, this is within the jurisdiction of the IRB."},{"ch":"Ch 4: Ethical Issues","q":"The policies in a long -term care facility specify that immobile residents should be repositioned at least every 2 hours. Despite this, it is well known that many residents endure long periods without being repositioned. How should the nurse best interpret this situation?","opts":"<div class=\"opt\" data-letter=\"A\">A) It is necessary for the nurses at the facility to review the code of ethics.</div><div class=\"opt\" data-letter=\"B\">B) There is a need for actions to address this theory -practice -ethics gap.</div><div class=\"opt\" data-letter=\"C\">C) The nurses at the facility are experiencing intrapersonal conflict that affects their practice.</div><div class=\"opt\" data-letter=\"D\">D) The nurses at the facility should apply the MORAL decision -making model to address this.</div>","ans":"B","sata":false,"fb":"Theory -practice -ethics gaps exist when there is incongruence between what nurses know they should or must do and what they actually do. Intrapersonal conflict is internal discontent resulting from inconsistency between what should be done and what a nurse can realistically do. However, there is no evidence that this is the case. Reviewing a code of ethics is unlikely to bring about meaningful change without the addition of other incentives. The MORAL decision -making model guides ethical decision making but does not address the gaps between what should be done and what is actually done."},{"ch":"Ch 4: Ethical Issues","q":"A nurse has recognized that many older adult clients on the unit do not receive enough nutrition because they are unable to feed themselves independently. What action by a manager would be most likely to resolve the nurse's moral distress?","opts":"<div class=\"opt\" data-letter=\"A\">A) Acknowledging and validating the nurse's observation</div><div class=\"opt\" data-letter=\"B\">B) Hiring more nursing assistants to help feed these clients</div><div class=\"opt\" data-letter=\"C\">C) Arranging to have the clients' diets changed so they are more nutrient -dense</div><div class=\"opt\" data-letter=\"D\">D) Providing a reference so the nurse can seek new employment</div>","ans":"B","sata":false,"fb":"Moral distress occurs when an individual knows the right thing to do but organizational constraints make it difficult to take the right course of action. In this case, the nurse knows what needs to be done (the clients need assistance with feeding) and arranging for more employees to do this function would remove the organizational constraint. Validation is of no value if it is not followed up by action. Changing the clients' diets is not helpful if they cannot be fed the new diet. Helping the nurse seek employment elsewhere does not benefit the clients and may not relieve the nurse's moral distress."},{"ch":"Ch 4: Ethical Issues","q":"A nurse -manager is discussing a proposed change in practice with the interdisciplinary team. What question by the manager best reflects a utilitarian perspective?","opts":"<div class=\"opt\" data-letter=\"A\">A) \"Have we asked clients and families what they think?\"</div><div class=\"opt\" data-letter=\"B\">B) \"Does our code of ethics address this?\"</div><div class=\"opt\" data-letter=\"C\">C) \"Are the benefits greater than the risks?\"</div><div class=\"opt\" data-letter=\"D\">D) \"How many people will this benefit?\"</div>","ans":"D","sata":false,"fb":"Utilitarianism prioritizes the greatest good for the largest number of people. For this reason, a question about how many individuals would benefit would be more indicative of utilitarianism than issues related to consulting clients, weighing risks and benefits, and consulting the code of ethics."},{"ch":"Ch 5: Legal and Legislative Issues","q":"Two registered nurses have disagreed about their scope of practice regarding medication administration. What resource should the nurses consult?","opts":"<div class=\"opt\" data-letter=\"A\">A) The attorney general's office</div><div class=\"opt\" data-letter=\"B\">B) The Nurse Practice Act</div><div class=\"opt\" data-letter=\"C\">C) The nursing standards of practice</div><div class=\"opt\" data-letter=\"D\">D) The code of ethics</div>","ans":"B","sata":false,"fb":"Nurse Practice Acts define and limit the practice of nursing, stating what constitutes authorized practice as well as what exceeds the scope of authority. An attorney general's office cannot supersede the provisions of a Nurse Practice Act. Ethical guidelines do not establish a nurse's scope of practice. Standards of practice describe the quality of a nurse's care but not the legal scope."},{"ch":"Ch 5: Legal and Legislative Issues","q":"A nurse is facing a malpractice suit after a client was injured in a fall. When establishing whether the nurse committed a breach of duty, the court will consult with:","opts":"<div class=\"opt\" data-letter=\"A\">A) other nurses who practice in similar settings and specialties.</div><div class=\"opt\" data-letter=\"B\">B) members of public who have been treated in similar care settings.</div><div class=\"opt\" data-letter=\"C\">C) the administrators of the health facility where the fall occurred.</div><div class=\"opt\" data-letter=\"D\">D) medical experts from the same area of specialty.</div>","ans":"A","sata":false,"fb":"The testimony of other nurses in the same specialty as the defendant may be used to prove breach of duty. These people are considered a reliable and valid source of information by the court, more so than members of the public, administrators, or medical experts."},{"ch":"Ch 5: Legal and Legislative Issues","q":"A health care provider prescribes a medical procedure that the staff nurse has reason to believe will harm the client. Which principle should guide the nurse's choice of action?","opts":"<div class=\"opt\" data-letter=\"A\">A) The staff nurse cannot be held legally liable for any harm to the client if the procedure is carried out with due care.</div><div class=\"opt\" data-letter=\"B\">B) The nurse may lose their license by refusing to carry out the procedure.</div><div class=\"opt\" data-letter=\"C\">C) The nurse should not carry out the procedure without questioning it.</div><div class=\"opt\" data-letter=\"D\">D) Liability rests with the health care provider, not the nurse.</div>","ans":"C","sata":false,"fb":"The rule of personal liability says that every person is liable for their own conduct, even if someone else prescribed the intervention. The law does not permit a wrongdoer to avoid legal liability for his or her own wrongdoing, even though someone else also may be sued and held legally liable. \"Due care\" does not negate the consequences of the nurse's actions or release the nurse from liability if he or she knowingly committed an unsafe act. Refusal to carry out the procedure would not be a basis for losing a nursing license."},{"ch":"Ch 5: Legal and Legislative Issues","q":"A preoperative admitting nurse witnessed a client sign an operative consent form. The nurse then cosigned the same document as a witness. The client suffered an injury during surgery and names the nurse in the suit because the nurse witnessed the consent form. What is the most likely outcome?","opts":"<div class=\"opt\" data-letter=\"A\">A) The nurse is not likely liable because the signature only specifies that the nurse witnessed the client signing the consent form.</div><div class=\"opt\" data-letter=\"B\">B) The nurse is likely not liable because surgery is beyond the nurse's scope of practice.</div><div class=\"opt\" data-letter=\"C\">C) The nurse may be liable because cosigning the consent form makes the nurse an equal member of the surgical team.</div><div class=\"opt\" data-letter=\"D\">D) The nurse is liable because cosigning the consent form confirms that the client fully understood the risks of surgery.</div>","ans":"A","sata":false,"fb":"Informed consent is obtained by a physician; therefore, in most cases, a nurse is not legally responsible for informed consent but is confirming that the client signed the consent form. If the nurse acts solely in the role of a witness, there are likely no legal consequences for the nurse. The nurse would not be considered to be a full member of the surgical team if their role was limited to admitting the client. Surgery is beyond the nurse's scope of practice, but this does not form the basis for the nurse's likely exemption from liability."},{"ch":"Ch 5: Legal and Legislative Issues","q":"A client is preparing to be discharged from the health care facility and has told the nurse that","opts":"<div class=\"opt\" data-letter=\"A\">A) Arrange for the medical record to be provided to the client.</div><div class=\"opt\" data-letter=\"B\">B) Inform the client that this request will be communicated to the facility's ethics committee.</div><div class=\"opt\" data-letter=\"C\">C) Confirm the facility's policy around providing medical records to clients.</div><div class=\"opt\" data-letter=\"D\">D) Check whether this provision is included in the jurisdiction's Nurse Practice Act.</div>","ans":"C","sata":false,"fb":"Clients possess a right to view their medical records, but the protocols for facilitating this vary. Consequently, the nurse should check this facility's policy before acting. It would likely be premature for the nurse to provide the medical record to the client before communicating with other members of the care team or administrators to ensure policy is followed. This matter is outside the purview of ethics committees because it does not involve a dilemma. The Nurse Practice Act focuses on the scope of practice and other regulatory issues, not client rights."},{"ch":"Ch 5: Legal and Legislative Issues","q":"A charge nurse has discovered that a medication error was made on the previous shift. What is the nurse's best action?","opts":"<div class=\"opt\" data-letter=\"A\">A) Share that information with the charge nurse on the previous shift.</div><div class=\"opt\" data-letter=\"B\">B) Document the incident and follow it up as per hospital policy.</div><div class=\"opt\" data-letter=\"C\">C) Write a memo to the nurse who made the error requesting an incident report be written.</div><div class=\"opt\" data-letter=\"D\">D) Document in the client's chart that an incident report will be completed.</div>","ans":"B","sata":false,"fb":"It is the responsibility as a manager to immediately document the error according to hospital policy. Because policies concerning such situations vary, it is vital to know and follow established policies. It is not generally appropriate to make such a note on the client's chart. Speaking to another nurse or manager is not a sufficient response, although this may be one part of the follow -up process."},{"ch":"Ch 5: Legal and Legislative Issues","q":"What is the best reason that nurse -managers have an ongoing responsibility to be aware of legislation affecting nursing practice?","opts":"<div class=\"opt\" data-letter=\"A\">A) Laws are created by people who are not nurses.</div><div class=\"opt\" data-letter=\"B\">B) Laws are fluid and subject to change.</div><div class=\"opt\" data-letter=\"C\">C) Awareness will help ensure ethical practice.</div><div class=\"opt\" data-letter=\"D\">D) Staff nurses bear less responsibility for keeping up with legislation than nurse-managers.</div>","ans":"B","sata":false,"fb":"When using doctrines as a guide for nursing practice, the nurse must remember that all laws are fluid and subject to change. Laws are not static. It is the responsibility of each manager to keep abreast of legislation and laws affecting both nursing practice and management practice. It is true that laws are made by people who are not nurses, but this does not necessarily create a need for managers to stay abreast of laws. Standards of practice do not explicitly guide nurses to remain aware of changes in legislation. Awareness is unlikely to have a direct effect on ethical practice, which is rooted in values and beliefs about what is good."},{"ch":"Ch 5: Legal and Legislative Issues","q":"A novice nurse can reduce the likelihood of being sued for malpractice by:","opts":"<div class=\"opt\" data-letter=\"A\">A) beginning his or her career in a lower acuity setting.</div><div class=\"opt\" data-letter=\"B\">B) avoiding performing interventions without a witness present.</div><div class=\"opt\" data-letter=\"C\">C) establishing positive, therapeutic relationships with clients and families.</div><div class=\"opt\" data-letter=\"D\">D) engaging in lifelong learning.</div>","ans":"C","sata":false,"fb":"It has been shown that despite technical competence, nurses who have difficulty establishing positive interpersonal relationships with clients and their families are at greater risk for being sued. Relationship building is a skill that consequently has the potential to reduce a nurse's risk of a lawsuit. Many malpractice suits originate in lower acuity settings, such as long -term care, so practicing in such an environment may not necessarily reduce the nurse's risk of a lawsuit. It is unrealistic and unnecessary to perform all interventions with a witness, and there is no evidence that this would reduce the risk of a lawsuit. Lifelong learning is beneficial but is not noted to reduce the nurse's risk of a lawsuit."},{"ch":"Ch 5: Legal and Legislative Issues","q":"A state Nurse Practice Act is an example of which source of law?","opts":"<div class=\"opt\" data-letter=\"A\">A) Statute</div><div class=\"opt\" data-letter=\"B\">B) Constitution</div><div class=\"opt\" data-letter=\"C\">C) Administrative</div><div class=\"opt\" data-letter=\"D\">D) Judicial</div>","ans":"A","sata":false,"fb":"Statutes are the only laws made by official enactment by the legislative body. A Nurse Practice Act is an example of a \"law that governs.\" As a statute, a Nurse Practice Act is not a form of constitutional, administrative, or judicial law.","feedback":"Statutes are the only laws made by official enactment by the legislative body. A Nurse Practice Act is an example of a \"law that governs.\" As a statute, a Nurse Practice Act is not a form of constitutional, administrative, or judicial law."},{"ch":"Ch 5: Legal and Legislative Issues","q":"A nurse failed to supervise a confused client, and the client fell while transferring to the bathroom. The client was unharmed, but the client's family has launched a malpractice suit, citing the nurse's breach of duty. What is the most likely outcome of this case?","opts":"<div class=\"opt\" data-letter=\"A\">A) The outcome will depend on the extent to which the client was responsible for the incident.</div><div class=\"opt\" data-letter=\"B\">B) It will likely be successful, provided the family can prove the event was reasonably foreseeable.</div><div class=\"opt\" data-letter=\"C\">C) It will likely be unsuccessful because the client was not injured.</div><div class=\"opt\" data-letter=\"D\">D) The outcome will depend on how the nurse's actions compare to the established standard of care.</div>","ans":"C","sata":false,"fb":"A malpractice suit requires evidence of actual injury to the offended party. The fact that this client was unharmed would likely jeopardize the suit, regardless of the client's role or the standard of care. Even if the event was foreseeable, the absence of injury removes a key criterion of malpractice."},{"ch":"Ch 5: Legal and Legislative Issues","q":"A nurse is facing a malpractice suit after an incident where a client received the wrong dose of medication. Which elements must be present to prove malpractice? Select all that apply.","opts":"<div class=\"opt\" data-letter=\"A\">A) Breach of duty</div><div class=\"opt\" data-letter=\"B\">B) Presence of injury</div><div class=\"opt\" data-letter=\"C\">C) Ability to foresee harm</div><div class=\"opt\" data-letter=\"D\">D) Causal relationship between inadequate care and injury</div><div class=\"opt\" data-letter=\"E\">E) Intent to cause harm</div>","ans":["A","B","C","D"],"sata":true,"fb":"A lawsuit pertaining to malpractice must include a standard of care, breach of duty, injury, a causal relationship between breach of duty and injury, and a foreseeability of harm. Intent to cause harm does not need to be present or proven. The presence of malicious intent would be more suggestive of a criminal act than professional malpractice."},{"ch":"Ch 5: Legal and Legislative Issues","q":"A nurse is being sued for malpractice after a client completed suicide on the medical -surgical unit. The nurse's attorney has pointed out that the client had no history of suicide attempts, had no history of mental illness, and denied suicidality on the standard intake assessment. This argument calls into question what component of a malpractice suit?","opts":"<div class=\"opt\" data-letter=\"A\">A) Breach of duty</div><div class=\"opt\" data-letter=\"B\">B) Failure to meet standard of care</div><div class=\"opt\" data-letter=\"C\">C) Foreseeability of harm</div><div class=\"opt\" data-letter=\"D\">D) A causal relationship</div>","ans":"C","sata":false,"fb":"This argument suggests that there is no obvious reason why the nurse should have predicted a suicide attempt. This may negate the criterion of foreseeability. There is no evidence that the attorney is addressing the nurse's standards of care or the nurse's ability to perform his or her duties. The attorney is not questioning the relationship between the nurse's actions and the outcomes."},{"ch":"Ch 5: Legal and Legislative Issues","q":"A nurse made a medication error that injured a hospital client. The nurse's attorney has cited the concept of respondeat superior during the trial. This argument would focus on:","opts":"<div class=\"opt\" data-letter=\"A\">A) \"Why am I not allowed to eat and drink before the surgery?\"</div><div class=\"opt\" data-letter=\"B\">B) \"How long do you think I'll stay in the recovery room?\"</div><div class=\"opt\" data-letter=\"C\">C) \"Do you think this surgery is actually safe and necessary?\"</div><div class=\"opt\" data-letter=\"D\">D) \"What is the difference between a surgeon and an anesthesiologist?\"</div>","ans":"C","sata":false,"fb":"The concept of respondeat superior states that an employer should be held legally liable for the conduct of employees whose actions the employer has a right to direct or control. Consequently, there is no direct reference to the nurse's resources, intent, or insurance coverage."},{"ch":"Ch 5: Legal and Legislative Issues","q":"A client has provided informed consent for surgery and is being assessed by the nurse. What statement by the client should prompt the nurse to contact the surgeon?","opts":"<div class=\"opt\" data-letter=\"A\">A) \"Why am I not allowed to eat and drink before the surgery?\"</div><div class=\"opt\" data-letter=\"B\">B) \"How long do you think I'll stay in the recovery room?\"</div><div class=\"opt\" data-letter=\"C\">C) \"Do you think this surgery is actually safe and necessary?\"</div><div class=\"opt\" data-letter=\"D\">D) \"What is the difference between a surgeon and an anesthesiologist?\"</div>","ans":"C","feedback":"Nurses are obliged to provide teaching and to clarify information given to clients by their physicians. This could include such topics as the different roles of the OR team, typical recovery times, and the rationale for fasting. However, nurses must be careful not to give new information or to go outside the scope of practice. Addressing the safety and relative risks of a surgery, or the necessity for surgery, would be beyond the nurse's scope of practice and should be referred back to the surgeon."},{"ch":"Ch 5: Legal and Legislative Issues","q":"In which situations does the nurse -manager have a legal responsibility for reporting? Select all that apply.","opts":"<div class=\"opt\" data-letter=\"A\">A) A nurse had to work 2 hours overtime because another nurse failed to report for a shift.</div><div class=\"opt\" data-letter=\"B\">B) A nursing assistant has reported a suspected incident of elder abuse.</div><div class=\"opt\" data-letter=\"C\">C) A nurse is suspected of providing substandard medical care.</div><div class=\"opt\" data-letter=\"D\">D) A pediatric client reports physical abuse in the home.</div><div class=\"opt\" data-letter=\"E\">E) There is a confirmed case of a reportable infectious disease.</div>","ans":["B","C","D","E"],"sata":true,"fb":"The manager, like all professional nurses, is responsible for reporting improper or substandard medical care, child and elder abuse, and communicable diseases, as specified by the Centers for Disease Control and Prevention. Staffing issues are not mandated reportable situations."},{"ch":"Ch 5: Legal and Legislative Issues","q":"What initiative is most likely to promote open communication between clients and practitioners?","opts":"<div class=\"opt\" data-letter=\"A\">A) Involving health care consumers as active members of the health care team</div><div class=\"opt\" data-letter=\"B\">B) Promoting the creation of cultures of client safety in health care organizations</div><div class=\"opt\" data-letter=\"C\">C) Establishing a federal leadership locus for advocacy of client safety and health care</div><div class=\"opt\" data-letter=\"D\">D) Building an evidence -based information and technology system that impacts client safety</div>","ans":"A","sata":false,"fb":"One way to promote open communication between clients and practitioners is involving health care consumers as active members of the health care team. The remaining answer choices would impact client safety but not necessarily promote open communication."},{"ch":"Ch 5: Legal and Legislative Issues","q":"A registered nurse has admitted to the manager that she obtained her license on false pretenses and that she never actually graduated from a nursing education program. What is most likely to take place next?","opts":"<div class=\"opt\" data-letter=\"A\">A) An investigation by the board of nursing</div><div class=\"opt\" data-letter=\"B\">B) A civil lawsuit by the health care facility</div><div class=\"opt\" data-letter=\"C\">C) Criminal charges</div><div class=\"opt\" data-letter=\"D\">D) A fine levied by the jurisdiction where the event took place</div>","ans":"A","sata":false,"fb":"Following a complaint, the board of nursing completes an investigation. The facility may or may not pursue a lawsuit and is more likely to focus solely on dismissal. This would be more likely to be handled administratively by the board of nursing than criminally by the court system. A ban from the profession would be more likely than a fine."},{"ch":"Ch 5: Legal and Legislative Issues","q":"A nurse -manager is working with colleagues to update the policies and procedures at a health care facility. To ensure that the policies align with the provisions of Title VII, the team should focus on what aspect of care?","opts":"<div class=\"opt\" data-letter=\"A\">A) Falls prevention</div><div class=\"opt\" data-letter=\"B\">B) Timely and accurate documentation</div><div class=\"opt\" data-letter=\"C\">C) Relationships between practical and registered nurses</div><div class=\"opt\" data-letter=\"D\">D) Avoiding discrimination against clients</div>","ans":"D","sata":false,"fb":"Title VII is the Civil Rights Act which covers many different manifestations of diversity. The major focus of Title VII is civil rights and the avoidance of discrimination. Topics such as injury prevention, documentation, and interprofessional relationships are not normally within the scope of civil rights."},{"ch":"Ch 5: Legal and Legislative Issues","q":"Which nurse could face discipline for committing an intentional tort? Select all that apply.","opts":"<div class=\"opt\" data-letter=\"A\">A) A nurse who slapped a client when the client became verbally abusive</div><div class=\"opt\" data-letter=\"B\">B) A nurse who applied restraints to a client as a punitive measure</div><div class=\"opt\" data-letter=\"C\">C) A nurse who increased a client's analgesia dosage without a prescription</div><div class=\"opt\" data-letter=\"D\">D) A nurse who neglected to supervise a client, leading to a fall</div><div class=\"opt\" data-letter=\"E\">E) A nurse who threatened an elderly client when the client did not participate in care</div>","ans":["A","B","E"],"sata":true,"fb":"Whereas professional negligence is considered to be an unintentional tort, assault, battery, false imprisonment, invasion of privacy, defamation, and slander are intentional torts. Slapping a client is battery. Threatening a client is assault, and applying restraints inappropriately is a form of false imprisonment. Failing to supervise a client or practicing outside the scope of practice (changing a medication dose) would be classified as unintentional torts."},{"ch":"Ch 5: Legal and Legislative Issues","q":"The nurse at a long -term care facility became frustrated with a client who has dementia and is unable to be redirected from wandering. The nurse applied restraints to keep the client in bed during a night shift despite there being no order to do so. How should this nurse's actions be best interpreted?","opts":"<div class=\"opt\" data-letter=\"A\">A) The nurse is guilty of malpractice.</div><div class=\"opt\" data-letter=\"B\">B) The nurse's action is permissible if it was in the client's best interest.</div><div class=\"opt\" data-letter=\"C\">C) The nurse could face charges of false imprisonment.</div><div class=\"opt\" data-letter=\"D\">D) The nurse's action may be grounds for an assault charge.</div>","ans":"C","sata":false,"fb":"Inappropriate use of restraints constitutes false imprisonment. Assault, however, is characterized by a verbal threat of harm. Malpractice is an unintentional tort, but this nurse's action is an intentional tort. Even if the nurse felt that he or she was acting in the"},{"ch":"Ch 5: Legal and Legislative Issues","q":"Which statement is true regarding criminal law cases in the context of nursing? Select all that apply.","opts":"<div class=\"opt\" data-letter=\"A\">A) Incarceration is a likely consequence of being found guilty of a criminal offense.</div><div class=\"opt\" data-letter=\"B\">B) Intentionally giving an overdose of a potent narcotic is a criminal offense.</div><div class=\"opt\" data-letter=\"C\">C) A guilty verdict requires evidence beyond a reasonable doubt.</div><div class=\"opt\" data-letter=\"D\">D) Most malpractice cases are tried in criminal court.</div><div class=\"opt\" data-letter=\"E\">E) A serious, inadvertent drug error is likely to bring criminal charges.</div>","ans":["A","B","C"],"sata":true,"fb":"In criminal cases, the individual faces charges generally filed by the state or federal attorney general for crimes committed against an individual or society. In criminal cases, the individual is always presumed to be innocent unless the state can prove his or her guilt beyond a reasonable doubt. Incarceration and even death are possible consequences for being found guilty in criminal matters. Nurses found guilty of intentionally administering fatal doses of drugs to clients would be charged in a criminal court. Most malpractice cases are tried in civil court. In most cases, unintentional errors do not result in criminal charges."},{"ch":"Ch 5: Legal and Legislative Issues","q":"Which action should the nurse prioritize when trying to prevent malpractice claims?","opts":"<div class=\"opt\" data-letter=\"A\">A) Always carrying a personal liability insurance policy</div><div class=\"opt\" data-letter=\"B\">B) Always functioning within the scope of the Nursing Practice Act</div><div class=\"opt\" data-letter=\"C\">C) Asking for assistance when engaged in complicated procedures</div><div class=\"opt\" data-letter=\"D\">D) Devoting time to establishing an effective nurse -client relationship</div>","ans":"B","sata":false,"fb":"Nurses can reduce the risk of malpractice claims by practicing within the scope of the Nurse Practice Act. Personal liability insurance will help protect a nurse from financial ruin in the case of a malpractice suit, but it will not prevent malpractice claims. Asking for assistance when needed is prudent nursing practice, but staying within the scope of practice is a more important guideline. Similarly, good nurse - client relationship has been shown to reduce the likelihood of malpractice, but this is a less significant guideline than staying within the scope of practice, which is paramount."},{"ch":"Ch 5: Legal and Legislative Issues","q":"Which statements accurately describe the implications of a Good Samaritan law for a registered nurse? Select all that apply.","opts":"<div class=\"opt\" data-letter=\"A\">A) A nurse has a legal responsibility to provide emergency services.</div><div class=\"opt\" data-letter=\"B\">B) Such laws are universally worded so as to minimize differences between jurisdictions.</div><div class=\"opt\" data-letter=\"C\">C) To be protected, nurses must provide care that is within their legal scope of practice.</div><div class=\"opt\" data-letter=\"D\">D) A nurse who provided out -of-scope care is not protected by the Good Samaritan law.</div><div class=\"opt\" data-letter=\"E\">E) A nurse can be held responsible for a person's injuries if the nurse does not intervene.</div>","ans":["C","D"],"sata":true,"fb":"Good Samaritan laws suggest that health care providers are typically protected from potential liability if they volunteer their nursing skills away from the workplace (generally limited to emergencies), provided that actions taken are not grossly negligent and that the health care worker does not exceed their training or scope of practice in performing the emergency services. Good Samaritan laws vary between jurisdictions. Nurses are not required to stop and provide emergency services as a matter of law, although most health care workers feel ethically compelled to do so."},{"ch":"Ch 5: Legal and Legislative Issues","q":"A nurse has been hired to manage a busy medical -surgical unit. What actions should the nurse -manager perform to ensure compliance with legal issues? Select all that apply.","opts":"<div class=\"opt\" data-letter=\"A\">A) Develop a vision for the organization's future and communicate this vision.</div><div class=\"opt\" data-letter=\"B\">B) Remain current on all institutional policies and procedures.</div><div class=\"opt\" data-letter=\"C\">C) Delegate with consideration to appropriate scopes of practice.</div><div class=\"opt\" data-letter=\"D\">D) Require physical proof of appropriate professional licensure.</div><div class=\"opt\" data-letter=\"E\">E) Ensure that client -nurse ratios do not exceed 3:1.</div>","ans":["B","C","D"],"sata":true,"fb":"Sound management functions regarding legal issues include understanding and adhering to institutional policies and procedures; delegating to subordinates wisely; and monitoring subordinates to ensure they have a valid, current, and appropriate license to practice nursing. Some jurisdictions have legal requirements around client -nurse ratios, but these ratios vary according to the care setting; in many cases, a ratio of greater than 3:1 is permitted. Developing and communicating a vision is an essential leadership function, but this does not apply to the management of legal matters."},{"ch":"Ch 5: Legal and Legislative Issues","q":"Which statement best describes the impact that the concept of respondeat superior has on the issue of nursing liability?","opts":"<div class=\"opt\" data-letter=\"A\">A) It allows for equal liability among physicians, nurses, and health care organizations.</div><div class=\"opt\" data-letter=\"B\">B) It supports the sharing of blame among all involved sources of health care services.</div><div class=\"opt\" data-letter=\"C\">C) It encourages legal intervention when health care is thought to be substandard.</div><div class=\"opt\" data-letter=\"D\">D) It implies that the institution is responsible for errors, not the employee.</div>","ans":"B","sata":false,"fb":"Nurses must remember that the purpose of respondeat superior is not to shift the burden of blame from the employee to the organization but rather to share the blame, increasing the possibility of larger financial compensation to the injured party. Liability is not always apportioned equally in every situation, and it does not wholly release employees from liability."},{"ch":"Ch 5: Legal and Legislative Issues","q":"A nurse is admitting a client to the health care facility who is in the late stages of pancreatic cancer. In order to comply with the terms of the Patient Self -Determination Act (PSDA), the nurse should:","opts":"<div class=\"opt\" data-letter=\"A\">A) ensure that the client clearly understands each treatment option.</div><div class=\"opt\" data-letter=\"B\">B) determine whether the client has established an advance directive.</div><div class=\"opt\" data-letter=\"C\">C) document that the client's family has been included in care planning.</div><div class=\"opt\" data-letter=\"D\">D) assess the client's expectations for recovery.</div>","ans":"B","sata":false,"fb":"The PSDA requires acute care facilities to document on the medical record whether a client has an AD and to provide written information to clients who do not. This legislation does not directly address such matters as ensuring the client's understanding of treatment options, including the family in care planning, and determining the client's expectations, even though each of the actions is necessary for providing quality care."},{"ch":"Ch 5: Legal and Legislative Issues","q":"For which client are the provisions of the Patient Self -Determination Act (PSDA) most likely to be significant?","opts":"<div class=\"opt\" data-letter=\"A\">A) A client who has recently been diagnosed with HIV</div><div class=\"opt\" data-letter=\"B\">B) A client whose neonate has just died of sudden infant death syndrome (SIDS)</div><div class=\"opt\" data-letter=\"C\">C) A client whose reduced ability to perform activities of daily living (ADLs) has required an admission to long -term care</div><div class=\"opt\" data-letter=\"D\">D) A client who has just experienced an ischemic stroke and whose prognosis is poor</div>","ans":"D","sata":false,"fb":"The PSDA applies to all clients, but it is especially relevant to clients and families who are facing decisions around end -of-life care. A client whose infant has died, a client with a new HIV diagnosis, and a client whose ADLs are compromised are not facing imminent decisions about end -of-life care. However, this is not the case for a client with a fresh stroke and poor prognosis."},{"ch":"Ch 5: Legal and Legislative Issues","q":"The nurse -manager oversees the care of several dozen nurses. With which nurse should the manager review the provisions of the Health Insurance Portability and Accountability Act (HIPAA)?","opts":"<div class=\"opt\" data-letter=\"A\">A) A nurse who has discussed a client's status with a physician over the telephone</div><div class=\"opt\" data-letter=\"B\">B) A nurse who confirmed a new client's admission to the unit to a relative who telephoned</div><div class=\"opt\" data-letter=\"C\">C) A nurse who completed a client's documentation outside of the client's room</div><div class=\"opt\" data-letter=\"D\">D) A nurse who has initiated contact with a social worker to discuss a client's discharge planning</div>","ans":"B","sata":false,"fb":"HIPAA states that a client's privacy and confidentiality must be maintained. Confirming a new client's presence on a unit can be problematic because the identity of the person speaking cannot be confirmed. Communicating by telephone with other members of the care team is acceptable, provided efforts are taken to protect the client's privacy from others who may overhear. Documentation can be completed in any setting, provided it is guarded from view of unauthorized persons. There is no prohibition against initiating contact for referrals."},{"ch":"Ch 5: Legal and Legislative Issues","q":"A nurse is off duty, in the community, and witnesses an adult suddenly collapse. The individual appears to be unconscious. How should the nurse apply Good Samaritan laws to this situation?","opts":"<div class=\"opt\" data-letter=\"A\">A) The nurse should intervene because of the legal obligation to do so.</div><div class=\"opt\" data-letter=\"B\">B) The nurse is not required to intervene, even though intervening is an ethical act.</div><div class=\"opt\" data-letter=\"C\">C) The nurse should attempt to contact emergency services before intervening.</div><div class=\"opt\" data-letter=\"D\">D) The nurse should attempt to determine if the individual has an advance directive before intervening.</div>","ans":"B","sata":false,"fb":"Good Samaritan laws vary by jurisdiction, but they generally do not create a legal requirement for a nurse to intervene, although the ethical obligations for beneficence still apply to nurses. A nurse is not obliged to contact emergency services before acting. It is rarely possible or practical to determine a stranger's end -of-life wishes in a situation like this."},{"ch":"Ch 5: Legal and Legislative Issues","q":"A nurse has been caring for a medical client for several shifts and the client has expressed frustration with his slow recovery. At the beginning of the shift, the client states to the nurse, \"That's it. I want to read what they've written in my chart.\" What is the nurse's best response?","opts":"<div class=\"opt\" data-letter=\"A\">A) \"Certainly. I'll go and get it for you.\"</div><div class=\"opt\" data-letter=\"B\">B) \"You'll have to get permission to do so, but I'll definitely pass on your request to the care team.\"</div><div class=\"opt\" data-letter=\"C\">C) \"It sounds like you might have some questions about your health and your care. Can we talk about that?\"</div><div class=\"opt\" data-letter=\"D\">D) \"That's definitely within your rights, but you'll likely find that it's difficult to understand because of medical jargon.\"</div>","ans":"C","sata":false,"fb":"Clients' requests to read their health records are often motivated by confusion or dissatisfaction with care. The nurse should offer to address the clients concerns. Doing so is not a refusal of the client's right to view his or her health records. Protocol must be followed when a client requests access, so it would be inappropriate for the nurse to immediately provide the client with the record. Even though the protocol must be followed, clients still have the right to view their records and do not require permission under normal circumstances. The nurse should not attempt to dissuade the client by warning about medical jargon, even though this is likely to be a barrier to understanding."},{"ch":"Ch 6: Patient, Subordinate, Workplace, and Professional Advocacy","q":"When applying the principles of advocacy, a nurse -manager should:","opts":"<div class=\"opt\" data-letter=\"A\">A) defer to a leader whenever possible because advocacy is primarily a leadership function.</div><div class=\"opt\" data-letter=\"B\">B) prioritize the needs of subordinates over the needs of the organization.</div><div class=\"opt\" data-letter=\"C\">C) balance the need to advocate for several different individuals, groups, and organizations.</div><div class=\"opt\" data-letter=\"D\">D) recognize that advocacy can only be provided for individuals, not groups or organizations.</div>","ans":"C","sata":false,"fb":"Advocacy is helping others to grow and self -actualize. The manager must be an advocate for clients, subordinates, and the nursing profession. Advocacy is not limited to leaders. It is simplistic to claim that the needs of subordinates always trump those of the organization; every situation is different."},{"ch":"Ch 6: Patient, Subordinate, Workplace, and Professional Advocacy","q":"A nurse -manager is overseeing the care of a client who is taking a passive role in their care. How should the nurse begin to act in the role of an advocate?","opts":"<div class=\"opt\" data-letter=\"A\">A) Inform the client of their rights and ensure they have sufficient information</div><div class=\"opt\" data-letter=\"B\">B) Teach the client the benefits of taking an active and assertive role in their care</div><div class=\"opt\" data-letter=\"C\">C) Assess the size and quality of the client's social support network</div><div class=\"opt\" data-letter=\"D\">D) Role -play with the client in order to teach assertiveness skills</div>","ans":"A","sata":false,"fb":"The advocate informs others of their rights and makes certain they have sufficient information to make decisions. This contextualizes any further teaching or dialogue, such as role modeling or educating them about the benefits of being more assertive. Not every client has the desire or skills necessary to be assertive and an active participant in care. It is important to assess clients' social support networks, but this is not directly related to advocacy."},{"ch":"Ch 6: Patient, Subordinate, Workplace, and Professional Advocacy","q":"Even after a lengthy discussion concerning the ramifications, a client wants to leave the hospital against medical advice (AMA). What should the nurse do in the role of a client","opts":"<div class=\"opt\" data-letter=\"A\">A) Instruct the client to wait until morning to leave the hospital.</div><div class=\"opt\" data-letter=\"B\">B) Ask family members to help talk the client out of the decision.</div><div class=\"opt\" data-letter=\"C\">C) Encourage the client to leave and assist with the transition.</div><div class=\"opt\" data-letter=\"D\">D) Make sure the client has appropriate follow -up appointments.</div>","ans":"D","sata":false,"fb":"As an advocate for this client, it is important to make sure the client is informed of the ramifications of leaving AMA; however, it is a client's right to refuse treatment. However, this does not mean that the nurse is obliged to actively encourage the client to leave, which would be inappropriate. The nurse should dialogue with the client about the risks of leaving but avoid making the decision for the client or coercing the client to stay."},{"ch":"Ch 6: Patient, Subordinate, Workplace, and Professional Advocacy","q":"A nurse -manager is reviewing the provisions of the Consumer Bill of Rights and Responsibilities (Patient's Bill of Rights) with a group of new nurses. The manager should address what goals of this legislation? Select all that apply.","opts":"<div class=\"opt\" data-letter=\"A\">A) Ensuring every client has access to quality and affordable health care</div><div class=\"opt\" data-letter=\"B\">B) Promoting strong relationships between clients and health care providers</div><div class=\"opt\" data-letter=\"C\">C) Promoting clear communication between members of the health care team</div><div class=\"opt\" data-letter=\"D\">D) Helping clients feel confident in the health care system</div><div class=\"opt\" data-letter=\"E\">E) Assisting clients with understanding the provisions of their health insurance</div>","ans":["B","D"],"sata":true,"fb":"The provisions of the Patient's Bill of Rights are threefold: (a) to help clients feel more confident in the US health care system, (b) to stress the importance of a strong relationship between clients and their health care providers, and (c) to stress the key role clients play in staying healthy by laying out rights and responsibilities for all clients and health care providers. This legislation does not explicitly address access to health care, communication in the health -care team, or teaching clients about their insurance."},{"ch":"Ch 6: Patient, Subordinate, Workplace, and Professional Advocacy","q":"A nurse -manager can implement workplace advocacy and subordinate advocacy by performing what actions? Select all that apply.","opts":"<div class=\"opt\" data-letter=\"A\">A) Creating an atmosphere that is free of violence or the threat of violence</div><div class=\"opt\" data-letter=\"B\">B) Providing education about injury prevention and safety</div><div class=\"opt\" data-letter=\"C\">C) Making efforts to ensure that nurses have reasonable and predictable work schedules</div><div class=\"opt\" data-letter=\"D\">D) Including nurses in the decisions that must be made at the facility</div><div class=\"opt\" data-letter=\"E\">E) Encouraging clients to provide feedback about the care they provide when they are discharged</div>","ans":["A","B","C","D"],"sata":true,"fb":"Workplace and subordinate advocacy include such actions as preventing violence, promoting safety, creating workable schedules, and including nurses in the decision -making process. Asking clients to provide feedback about their care may be helpful in promoting good practice, but this does not directly relate to subordinate advocacy or workplace advocacy."},{"ch":"Ch 6: Patient, Subordinate, Workplace, and Professional Advocacy","q":"A nurse has become dismayed at repeated instances of false documentation in the health care organization. The nurse has become aware that documentation has been altered so that acts of negligence appear to be accidents. When preparing to blow the whistle on this behavior, the nurse should:","opts":"<div class=\"opt\" data-letter=\"A\">A) attempt to edit the false documentation so that it is more accurate.</div><div class=\"opt\" data-letter=\"B\">B) resign from the health care facility to reduce the risk of retaliation.</div><div class=\"opt\" data-letter=\"C\">C) seek permission from the nurse's immediate supervisor and head of the organization.</div><div class=\"opt\" data-letter=\"D\">D) carefully document any prior attempts to address the issue with supervisors.</div>","ans":"D","sata":false,"fb":"Before whistleblowing, the nurse should carefully document any prior attem
