<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGN Cardiac Exam — 50 Questions</title>
    <style>
        :root {
            --p: #1a365d;
            --s: #2c5282;
            --a: #3182ce;
            --bg: #f0f4f8;
            --card: #fff;
            --border: #e2e8f0;
            --green: #38a169;
            --red: #e53e3e;
            --orange: #dd6b20;
            --text: #1a202c;
            --muted: #718096;
            --radius: 12px
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6
        }

        #app {
            max-width: 1100px;
            margin: 0 auto;
            padding: 1rem
        }

        /* HEADER */
        .exam-header {
            background: linear-gradient(135deg, var(--p), var(--s));
            color: #fff;
            padding: 1.5rem 2rem;
            border-radius: var(--radius);
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem
        }

        .exam-header h1 {
            font-size: 1.5rem;
            font-weight: 700
        }

        .progress-wrap {
            flex: 1;
            min-width: 200px;
            max-width: 400px
        }

        .progress-bar {
            height: 8px;
            background: rgba(255, 255, 255, .2);
            border-radius: 4px;
            overflow: hidden
        }

        .progress-fill {
            height: 100%;
            background: #68d391;
            border-radius: 4px;
            transition: width .4s
        }

        .progress-text {
            font-size: .8rem;
            opacity: .8;
            margin-top: 4px;
            text-align: right
        }

        /* START SCREEN */
        .start-screen {
            text-align: center;
            padding: 3rem 2rem;
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: 0 2px 12px rgba(0, 0, 0, .08)
        }

        .start-screen h2 {
            font-size: 2rem;
            color: var(--p);
            margin-bottom: 1rem
        }

        .start-screen p {
            color: var(--muted);
            margin-bottom: .5rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto
        }

        .exam-stats {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin: 2rem 0;
            flex-wrap: wrap
        }

        .stat-box {
            background: var(--bg);
            padding: 1rem 1.5rem;
            border-radius: 8px;
            min-width: 120px
        }

        .stat-box .num {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--a)
        }

        .stat-box .lbl {
            font-size: .8rem;
            color: var(--muted)
        }

        /* BUTTONS */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: .5rem;
            padding: .7rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all .2s
        }

        .btn-primary {
            background: var(--a);
            color: #fff
        }

        .btn-primary:hover {
            background: var(--s)
        }

        .btn-success {
            background: var(--green);
            color: #fff
        }

        .btn-success:hover {
            filter: brightness(.9)
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--a);
            color: var(--a)
        }

        .btn-outline:hover {
            background: var(--a);
            color: #fff
        }

        .btn:disabled {
            opacity: .5;
            cursor: not-allowed
        }

        /* QUESTION CARD */
        .q-card {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: 0 2px 12px rgba(0, 0, 0, .08);
            overflow: hidden
        }

        .q-header {
            background: linear-gradient(135deg, var(--p), var(--s));
            color: #fff;
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: .5rem
        }

        .q-num {
            font-weight: 700;
            font-size: 1.1rem
        }

        .q-badge {
            font-size: .75rem;
            padding: 3px 10px;
            border-radius: 20px;
            font-weight: 600
        }

        .badge-case {
            background: rgba(255, 255, 255, .2)
        }

        .badge-cjmm {
            background: #68d391;
            color: #1a365d
        }

        .badge-ngn {
            background: #fbd38d;
            color: #7b341e
        }

        .badge-trad {
            background: rgba(255, 255, 255, .15)
        }

        .q-type {
            font-size: .75rem;
            opacity: .8
        }

        .q-body {
            padding: 1.5rem
        }

        .q-stem {
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 1.2rem;
            line-height: 1.5
        }

        .q-actions {
            padding: 1rem 1.5rem;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center
        }

        /* CASE STUDY LAYOUT */
        .case-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0
        }

        .case-chart {
            background: #f7fafc;
            border-right: 2px solid var(--border);
            max-height: 500px;
            overflow-y: auto
        }

        .case-tabs {
            display: flex;
            border-bottom: 2px solid var(--border);
            background: var(--p);
            overflow-x: auto
        }

        .case-tab {
            padding: .6rem 1rem;
            font-size: .8rem;
            font-weight: 600;
            color: rgba(255, 255, 255, .7);
            cursor: pointer;
            white-space: nowrap;
            border: none;
            background: none;
            transition: all .2s
        }

        .case-tab.active {
            color: #fff;
            background: rgba(255, 255, 255, .1);
            border-bottom: 2px solid #68d391
        }

        .tab-content {
            padding: 1rem;
            font-size: .9rem;
            display: none
        }

        .tab-content.active {
            display: block
        }

        .tab-content table {
            width: 100%;
            border-collapse: collapse;
            font-size: .85rem;
            margin: .5rem 0
        }

        .tab-content th,
        .tab-content td {
            padding: 6px 8px;
            border: 1px solid var(--border);
            text-align: left
        }

        .tab-content th {
            background: var(--p);
            color: #fff;
            font-weight: 600
        }

        @media(max-width:768px) {
            .case-layout {
                grid-template-columns: 1fr
            }

            .case-chart {
                max-height: 300px;
                border-right: none;
                border-bottom: 2px solid var(--border)
            }
        }

        /* HIGHLIGHT TYPE */
        .hl-passage {
            line-height: 1.8;
            font-size: .95rem
        }

        .hl-span {
            padding: 2px 4px;
            border-radius: 3px;
            cursor: pointer;
            transition: all .2s;
            border-bottom: 2px dashed var(--border)
        }

        .hl-span:hover {
            background: #bee3f8
        }

        .hl-span.selected {
            background: #fefcbf;
            border-bottom-color: var(--orange)
        }

        .hl-span.correct {
            background: #c6f6d5 !important;
            border-bottom-color: var(--green) !important
        }

        .hl-span.wrong {
            background: #fed7d7 !important;
            border-bottom-color: var(--red) !important
        }

        .hl-span.missed {
            background: #c6f6d5;
            border: 2px dashed var(--green)
        }

        /* DROPDOWN / CLOZE */
        .cloze-text {
            line-height: 2.2;
            font-size: .95rem
        }

        .cloze-select {
            padding: 4px 8px;
            border: 2px solid var(--a);
            border-radius: 6px;
            font-size: .9rem;
            font-weight: 600;
            color: var(--p);
            background: #ebf8ff;
            cursor: pointer;
            min-width: 160px
        }

        .cloze-select.correct {
            border-color: var(--green);
            background: #c6f6d5
        }

        .cloze-select.wrong {
            border-color: var(--red);
            background: #fed7d7
        }

        /* MATRIX GRID */
        .matrix-table {
            width: 100%;
            border-collapse: collapse;
            font-size: .9rem
        }

        .matrix-table th,
        .matrix-table td {
            padding: 10px 12px;
            border: 1px solid var(--border);
            text-align: center
        }

        .matrix-table th {
            background: var(--p);
            color: #fff
        }

        .matrix-table td:first-child {
            text-align: left;
            font-weight: 500;
            background: #f7fafc
        }

        .matrix-table input[type=radio],
        .matrix-table input[type=checkbox] {
            width: 18px;
            height: 18px;
            cursor: pointer
        }

        .matrix-row.correct td:first-child {
            border-left: 4px solid var(--green)
        }

        .matrix-row.wrong td:first-child {
            border-left: 4px solid var(--red)
        }

        /* SELECT N */
        .select-n-count {
            font-size: .9rem;
            color: var(--a);
            font-weight: 600;
            margin-bottom: .8rem;
            padding: 6px 12px;
            background: #ebf8ff;
            border-radius: 6px;
            display: inline-block
        }

        .opt-list {
            list-style: none
        }

        .opt-item {
            padding: 10px 14px;
            margin: 6px 0;
            border: 2px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all .2s
        }

        .opt-item:hover {
            border-color: var(--a);
            background: #ebf8ff
        }

        .opt-item.checked {
            border-color: var(--a);
            background: #ebf8ff
        }

        .opt-item.correct {
            border-color: var(--green) !important;
            background: #c6f6d5 !important
        }

        .opt-item.wrong {
            border-color: var(--red) !important;
            background: #fed7d7 !important
        }

        .opt-item.missed {
            border-color: var(--green);
            border-style: dashed
        }

        .opt-check {
            width: 20px;
            height: 20px;
            border: 2px solid var(--border);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 14px
        }

        .opt-item.checked .opt-check {
            background: var(--a);
            border-color: var(--a);
            color: #fff
        }

        /* DRAG & DROP / ORDERED */
        .drag-source {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 1rem;
            min-height: 44px
        }

        .drag-pill {
            padding: 8px 14px;
            background: #ebf8ff;
            border: 2px solid var(--a);
            border-radius: 8px;
            cursor: pointer;
            font-size: .9rem;
            font-weight: 500;
            transition: all .2s;
            user-select: none
        }

        .drag-pill:hover {
            background: var(--a);
            color: #fff
        }

        .drag-pill.placed {
            opacity: .4;
            pointer-events: none
        }

        .drop-slots {
            counter-reset: slot
        }

        .drop-slot {
            padding: 10px 14px;
            margin: 6px 0;
            border: 2px dashed var(--border);
            border-radius: 8px;
            min-height: 44px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all .2s
        }

        .drop-slot::before {
            counter-increment: slot;
            content: counter(slot);
            background: var(--p);
            color: #fff;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: .8rem;
            flex-shrink: 0
        }

        .drop-slot.filled {
            border-color: var(--a);
            background: #ebf8ff
        }

        .drop-slot.correct {
            border-color: var(--green);
            background: #c6f6d5
        }

        .drop-slot.wrong {
            border-color: var(--red);
            background: #fed7d7
        }

        .slot-content {
            flex: 1
        }

        .slot-remove {
            cursor: pointer;
            color: var(--red);
            font-weight: 700;
            font-size: 1.2rem
        }

        /* BOWTIE */
        .bowtie-wrap {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 1rem;
            align-items: center;
            margin: 1rem 0
        }

        .bowtie-col {
            display: flex;
            flex-direction: column;
            gap: .5rem
        }

        .bowtie-center {
            background: linear-gradient(135deg, var(--p), var(--s));
            color: #fff;
            padding: 1rem;
            border-radius: var(--radius);
            text-align: center;
            font-weight: 700;
            min-width: 140px
        }

        .bowtie-target {
            border: 2px dashed var(--border);
            border-radius: 8px;
            padding: 10px;
            min-height: 50px;
            text-align: center;
            cursor: pointer;
            transition: all .2s;
            font-size: .9rem
        }

        .bowtie-target.filled {
            border-color: var(--a);
            background: #ebf8ff;
            border-style: solid
        }

        .bowtie-target.correct {
            border-color: var(--green);
            background: #c6f6d5
        }

        .bowtie-target.wrong {
            border-color: var(--red);
            background: #fed7d7
        }

        .bowtie-label {
            font-size: .75rem;
            color: var(--muted);
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 4px
        }

        @media(max-width:600px) {
            .bowtie-wrap {
                grid-template-columns: 1fr;
                gap: .5rem
            }
        }

        /* TREND */
        .trend-table {
            width: 100%;
            border-collapse: collapse;
            font-size: .85rem;
            margin: 1rem 0
        }

        .trend-table th {
            background: var(--p);
            color: #fff;
            padding: 8px;
            position: sticky;
            top: 0
        }

        .trend-table td {
            padding: 8px;
            border: 1px solid var(--border);
            text-align: center
        }

        .trend-table tr:nth-child(even) {
            background: #f7fafc
        }

        .trend-alert {
            color: var(--red);
            font-weight: 700
        }

        /* MC / SATA */
        .mc-list {
            list-style: none
        }

        .mc-opt {
            padding: 12px 16px;
            margin: 6px 0;
            border: 2px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            transition: all .2s;
            display: flex;
            align-items: center;
            gap: 12px
        }

        .mc-opt:hover {
            border-color: var(--a);
            background: #ebf8ff
        }

        .mc-opt.selected {
            border-color: var(--a);
            background: #ebf8ff
        }

        .mc-opt.correct {
            border-color: var(--green) !important;
            background: #c6f6d5 !important
        }

        .mc-opt.wrong {
            border-color: var(--red) !important;
            background: #fed7d7 !important
        }

        .mc-letter {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: .85rem;
            flex-shrink: 0
        }

        .mc-opt.selected .mc-letter {
            background: var(--a);
            color: #fff
        }

        /* FILL IN BLANK */
        .fill-input {
            padding: 8px 14px;
            border: 2px solid var(--a);
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 700;
            width: 120px;
            text-align: center;
            color: var(--p)
        }

        .fill-input.correct {
            border-color: var(--green);
            background: #c6f6d5
        }

        .fill-input.wrong {
            border-color: var(--red);
            background: #fed7d7
        }

        .fill-unit {
            font-weight: 600;
            color: var(--muted);
            margin-left: 8px
        }

        /* FEEDBACK */
        .feedback {
            margin-top: 1rem;
            padding: 1rem 1.2rem;
            border-radius: 8px;
            font-size: .9rem;
            display: none
        }

        .feedback.show {
            display: block
        }

        .feedback.pass {
            background: #c6f6d5;
            border-left: 4px solid var(--green)
        }

        .feedback.fail {
            background: #fed7d7;
            border-left: 4px solid var(--red)
        }

        .feedback.partial {
            background: #fefcbf;
            border-left: 4px solid var(--orange)
        }

        .feedback strong {
            display: block;
            margin-bottom: 4px
        }

        .score-chip {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: .8rem;
            font-weight: 700;
            margin-left: 8px
        }

        .score-chip.full {
            background: var(--green);
            color: #fff
        }

        .score-chip.part {
            background: var(--orange);
            color: #fff
        }

        .score-chip.zero {
            background: var(--red);
            color: #fff
        }

        /* RESULTS SCREEN */
        .results {
            text-align: center;
            padding: 2rem;
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: 0 2px 12px rgba(0, 0, 0, .08)
        }

        .results h2 {
            color: var(--p);
            margin-bottom: 1rem
        }

        .score-circle {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: conic-gradient(var(--green) calc(var(--pct)*1%), var(--border) 0);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 1.5rem auto
        }

        .score-inner {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: var(--card);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center
        }

        .score-inner .pct {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--p)
        }

        .score-inner .lbl {
            font-size: .8rem;
            color: var(--muted)
        }

        .breakdown {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin: 2rem 0;
            text-align: left
        }

        .bd-card {
            padding: 1rem;
            background: var(--bg);
            border-radius: 8px
        }

        .bd-card h4 {
            font-size: .85rem;
            color: var(--muted);
            margin-bottom: 4px
        }

        .bd-card .val {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--p)
        }

        /* DROPDOWN TABLE */
        .dd-table {
            width: 100%;
            border-collapse: collapse;
            font-size: .9rem
        }

        .dd-table th,
        .dd-table td {
            padding: 10px;
            border: 1px solid var(--border)
        }

        .dd-table th {
            background: var(--p);
            color: #fff
        }

        .dd-table select {
            padding: 4px 6px;
            border: 2px solid var(--a);
            border-radius: 6px;
            font-size: .85rem;
            font-weight: 600;
            width: 100%
        }

        /* HIGHLIGHT TABLE */
        .hl-table {
            width: 100%;
            border-collapse: collapse;
            font-size: .9rem
        }

        .hl-table th,
        .hl-table td {
            padding: 10px;
            border: 1px solid var(--border);
            text-align: center
        }

        .hl-table th {
            background: var(--p);
            color: #fff
        }

        .hl-table td.hlable {
            cursor: pointer;
            transition: all .2s
        }

        .hl-table td.hlable:hover {
            background: #bee3f8
        }

        .hl-table td.hlable.selected {
            background: #fefcbf
        }

        .hl-table td.hlable.correct {
            background: #c6f6d5 !important
        }

        .hl-table td.hlable.wrong {
            background: #fed7d7 !important
        }
    </style>
</head>

<body>
    <div id="app"></div>
    <script>
        /* ===== CASE STUDY DEFINITIONS ===== */
        const CASES = [
            {
                id: 1, title: 'ACS / STEMI', patient: 'Robert Torres', age: '68 y/o male', dx: 'Chest pain, rule out MI',
                tabs: {
                    notes: { label: "Nurse's Notes", content: `<p><strong>0842:</strong> Client arrived via EMS c/o crushing substernal chest pain radiating to left arm and jaw × 40 minutes, rated 9/10, unrelieved by rest. Client appears diaphoretic, anxious, and pale. States "it feels like an elephant is sitting on my chest." Denies SOB at rest but reports mild dyspnea with any movement. No nausea or vomiting.</p><p><strong>PMH:</strong> HTN × 15 yrs, Type 2 DM, hyperlipidemia, 30-pack-year smoking hx (quit 2 yrs ago). Father had MI at age 58.</p><p><strong>Current Meds:</strong> Metformin 1000mg BID, lisinopril 20mg daily, atorvastatin 40mg daily.</p><p><strong>Allergies:</strong> NKDA</p>` },

        function badge(q) {
            let b = '';
            if (q.case) b += `<span class="q-badge badge-case">Case ${q.case}: ${getCaseForQ(q).title}</span> `;
            if (q.cjmm) b += `<span class="q-badge badge-cjmm">⚡ ${q.cjmm}</span> `;
            let tl = { highlight: 'Highlight Text', cloze: 'Drop-Down Cloze', matrix: 'Matrix Grid', selectN: `Select ${q.n || 'N'}`, ordered: 'Ordered Response', bowtie: 'Bow-Tie', mc: 'Multiple Choice', sata: 'Select All That Apply', fillin: 'Fill-in-the-Blank' };
            b += `<span class="q-type">${tl[q.type] || q.type}</span>`;
            return b;
        }

        function renderQ() {
            if (cur >= Q.length) { showResults(); return }
            let q = Q[cur], cs = q.case ? getCaseForQ(q) : null;
            let isCase = !!cs;
            let header = `<div class="q-header"><span class="q-num">Question ${cur + 1} of ${Q.length}</span><div>${badge(q)}</div></div>`;
            let body = '';

            if (q.type === 'highlight') body = renderHighlight(q);
            else if (q.type === 'cloze') body = renderCloze(q);
            else if (q.type === 'matrix') body = renderMatrix(q);
            else if (q.type === 'selectN') body = renderSelectN(q);
            else if (q.type === 'ordered') body = renderOrdered(q);
            else if (q.type === 'bowtie') body = renderBowtie(q);
            else if (q.type === 'mc') body = renderMC(q);
            else if (q.type === 'sata') body = renderSATA(q);
            else if (q.type === 'fillin') body = renderFillin(q);

            let done = submitted.has(cur);
            let actions = `<div class="q-actions">${!done ? `<button class="btn btn-primary" id="submitBtn" onclick="submitAnswer()">Submit Answer</button>` : `<button class="btn btn-success" onclick="nextQ()">Next →</button>`}<span id="scoreArea"></span></div>`;
            let fb = `<div class="feedback" id="feedback"></div>`;

            let inner = isCase ?
                `<div class="case-layout"><div class="case-chart">${renderChart(cs, q)}</div><div><div class="q-body"><div class="q-stem">${q.stem}</div>${body}</div>${fb}${actions}</div></div>` :
                `<div class="q-body"><div class="q-stem">${q.stem.replace(/\n/g, '<br>')}</div>${body}</div>${fb}${actions}`;

            app.innerHTML = `<div class="exam-header"><h1>🫀 NGN Cardiac Exam</h1><div class="progress-wrap"><div class="progress-bar"><div class="progress-fill" style="width:${(cur / Q.length) * 100}%"></div></div><div class="progress-text">${cur + 1}/${Q.length}</div></div></div><div class="q-card">${header}${inner}</div>`;
            if (done) showFeedback(q);
        }

        function renderHighlight(q) {
            return `<div class="hl-passage">${q.phrases.map((p, i) => `<span class="hl-span" data-idx="${i}" onclick="toggleHL(this)">${p.t}</span> `).join('')}</div>`;
        }
        window.toggleHL = function (el) { if (!submitted.has(cur)) { el.classList.toggle('selected') } };

        function renderCloze(q) {
            let parts = q.text.split(/\|(\d+)\|/);
            let html = '<div class="cloze-text">';
            parts.forEach((p, i) => {
                if (i % 2 === 1) {
                    let idx = parseInt(p); let s = q.selects[idx];
                    html += `<select class="cloze-select" data-idx="${idx}"><option value="">— Select —</option>${s.opts.map((o, j) => `<option value="${j}">${o}</option>`).join('')}</select>`;
                } else html += p;
            });
            return html + '</div>';
        }

        function renderMatrix(q) {
            let html = `<table class="matrix-table"><tr><th></th>${q.cols.map(c => `<th>${c}</th>`).join('')}</tr>`;
            q.rows.forEach((r, i) => {
                html += `<tr class="matrix-row" data-row="${i}"><td>${r}</td>${q.cols.map((c, j) => `<td><input type="radio" name="matrix_${i}" value="${j}"></td>`).join('')}</tr>`;
            });
            return html + '</table>';
        }

        function renderSelectN(q) {
            return `<div class="select-n-count">Select exactly ${q.n}</div><ul class="opt-list">${q.opts.map((o, i) => `<li class="opt-item" data-idx="${i}" onclick="toggleOpt(this,${q.n})"><div class="opt-check">✓</div><span>${o.t}</span></li>`).join('')}</ul>`;
        }
        window.toggleOpt = function (el, n) {
            if (submitted.has(cur)) return;
            if (el.classList.contains('checked')) { el.classList.remove('checked'); return }
            let checked = el.parentElement.querySelectorAll('.checked').length;
            if (!n || checked < n) el.classList.add('checked');
        };

        function renderOrdered(q) {
            let shuffled = q.items.map((item, i) => ({ t: item, origIdx: i }));
            shuffle(shuffled);
            let html = `<div class="drag-source" id="dragSrc">${shuffled.map((it, i) => `<div class="drag-pill" data-orig="${it.origIdx}" onclick="placeItem(this)">${it.t}</div>`).join('')}</div><div class="drop-slots" id="dropSlots">`;
            for (let i = 0; i < q.items.length; i++) html += `<div class="drop-slot" data-pos="${i}" onclick="removeFromSlot(this)"><span class="slot-content"></span></div>`;
            return html + '</div>';
        }
        window.placeItem = function (pill) {
            if (submitted.has(cur) || pill.classList.contains('placed')) return;
            let slots = document.querySelectorAll('.drop-slot:not(.filled)');
            if (slots.length === 0) return;
            slots[0].classList.add('filled');
            slots[0].querySelector('.slot-content').textContent = pill.textContent;
            slots[0].dataset.origIdx = pill.dataset.orig;
            pill.classList.add('placed');
        };
        window.removeFromSlot = function (slot) {
            if (submitted.has(cur) || !slot.classList.contains('filled')) return;
            let origIdx = slot.dataset.origIdx;
            slot.classList.remove('filled');
            slot.querySelector('.slot-content').textContent = '';
            delete slot.dataset.origIdx;
            document.querySelector(`.drag-pill[data-orig="${origIdx}"]`).classList.remove('placed');
        };

        function renderBowtie(q) {
            let allA = shuffle([...q.allActions]), allC = shuffle([...q.allConditions]), allP = shuffle([...q.allParams]);
            return `<p style="margin-bottom:.5rem;color:var(--muted);font-size:.85rem">Click an option below, then click a target box to place it.</p>
<div style="margin-bottom:1rem"><strong>Available Options:</strong>
<div class="drag-source" id="btSrc">${[...allA, ...allC, ...allP].map((o, i) => `<div class="drag-pill" data-val="${o}" onclick="selectBT(this)">${o}</div>`).join('')}</div></div>
<div class="bowtie-wrap">
<div class="bowtie-col"><div class="bowtie-label">Actions to Take</div>
<div class="bowtie-target" data-slot="a1" onclick="placeBT(this)">Click to place</div>
<div class="bowtie-target" data-slot="a2" onclick="placeBT(this)">Click to place</div></div>
<div class="bowtie-center"><div class="bowtie-label" style="color:rgba(255,255,255,.7)">Condition</div>
<div class="bowtie-target" data-slot="cond" onclick="placeBT(this)" style="background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.3)">Click to place</div></div>
<div class="bowtie-col"><div class="bowtie-label">Parameters to Monitor</div>
<div class="bowtie-target" data-slot="p1" onclick="placeBT(this)">Click to place</div>
<div class="bowtie-target" data-slot="p2" onclick="placeBT(this)">Click to place</div></div></div>`;
        }
        let btSelected = null;
        window.selectBT = function (pill) {
            if (submitted.has(cur) || pill.classList.contains('placed')) return;
            document.querySelectorAll('.drag-pill').forEach(p => p.style.outline = '');
            pill.style.outline = '3px solid var(--a)';
            btSelected = pill;
        };
        window.placeBT = function (target) {
            if (submitted.has(cur) || !btSelected) return;
            if (target.classList.contains('filled')) {
                let old = target.dataset.val;
                document.querySelector(`.drag-pill[data-val="${old}"]`).classList.remove('placed');
            }
            target.textContent = btSelected.textContent;
            target.dataset.val = btSelected.dataset.val;
            target.classList.add('filled');
            btSelected.classList.add('placed');
            btSelected.style.outline = '';
            btSelected = null;
        };

        function renderMC(q) {
            let letters = 'ABCDEFGH';
            return `<ul class="mc-list">${q.opts.map((o, i) => `<li class="mc-opt" data-idx="${i}" onclick="selectMC(this)"><span class="mc-letter">${letters[i]}</span><span>${o}</span></li>`).join('')}</ul>`;
        }
        window.selectMC = function (el) {
            if (submitted.has(cur)) return;
            el.parentElement.querySelectorAll('.mc-opt').forEach(o => o.classList.remove('selected'));
            el.classList.add('selected');
        };

        function renderSATA(q) {
            return `<div class="select-n-count">Select All That Apply</div><ul class="opt-list">${q.opts.map((o, i) => `<li class="opt-item" data-idx="${i}" onclick="toggleOpt(this)"><div class="opt-check">✓</div><span>${o.t}</span></li>`).join('')}</ul>`;
        }

        function renderFillin(q) {
            return `<div style="margin-top:1rem"><input type="number" class="fill-input" id="fillInput" step="any" placeholder="?"><span class="fill-unit">${q.unit || ''}</span></div>`;
        }

        /* ===== SCORING ===== */
        window.submitAnswer = function () {
            if (submitted.has(cur)) return;
            submitted.add(cur);
            let q = Q[cur], earned = 0, possible = 0, pct = 0;

            if (q.type === 'highlight') {
                let correct = q.phrases.filter(p => p.c).length;
                possible = correct;
                document.querySelectorAll('.hl-span').forEach(el => {
                    let idx = parseInt(el.dataset.idx), isCorrect = q.phrases[idx].c, isSel = el.classList.contains('selected');
                    if (isCorrect && isSel) { earned++; el.classList.add('correct') }
                    else if (isCorrect && !isSel) { el.classList.add('missed') }
                    else if (!isCorrect && isSel) { earned = Math.max(0, earned - 1); el.classList.add('wrong') }
                }); earned = Math.max(0, earned);
            }
            else if (q.type === 'cloze') {
                possible = q.selects.length;
                document.querySelectorAll('.cloze-select').forEach(sel => {
                    let idx = parseInt(sel.dataset.idx), val = parseInt(sel.value);
                    sel.disabled = true;
                    if (val === q.selects[idx].correct) { earned++; sel.classList.add('correct') }
                    else sel.classList.add('wrong');
                });
            }
            else if (q.type === 'matrix') {
                possible = q.rows.length;
                q.rows.forEach((r, i) => {
                    let sel = document.querySelector(`input[name="matrix_${i}"]:checked`);
                    let row = document.querySelector(`.matrix-row[data-row="${i}"]`);
                    document.querySelectorAll(`input[name="matrix_${i}"]`).forEach(inp => inp.disabled = true);
                    if (sel && parseInt(sel.value) === q.correct[i]) { earned++; row.classList.add('correct') }
                    else row.classList.add('wrong');
                });
            }
            else if (q.type === 'selectN' || q.type === 'sata') {
                let corr = q.opts.filter(o => o.c).length; possible = corr;
                document.querySelectorAll('.opt-item').forEach(el => {
                    let idx = parseInt(el.dataset.idx), isC = q.opts[idx].c, isSel = el.classList.contains('checked');
                    el.style.pointerEvents = 'none';
                    if (isC && isSel) { earned++; el.classList.add('correct') }
                    else if (isC && !isSel) el.classList.add('missed');
                    else if (!isC && isSel) { earned = Math.max(0, earned - 1); el.classList.add('wrong') }
                }); earned = Math.max(0, earned);
            }
            else if (q.type === 'ordered') {
                possible = q.items.length;
                document.querySelectorAll('.drop-slot').forEach((slot, i) => {
                    let origIdx = slot.dataset.origIdx;
                    document.querySelectorAll('.drag-pill').forEach(p => p.style.pointerEvents = 'none');
                    if (origIdx !== undefined && parseInt(origIdx) === i) { earned++; slot.classList.add('correct') }
                    else slot.classList.add('wrong');
                });
            }
            else if (q.type === 'bowtie') {
                possible = 5;
                let targets = document.querySelectorAll('.bowtie-target');
                targets.forEach(t => {
                    let slot = t.dataset.slot, val = t.dataset.val || '';
                    let isCorrect = false;
                    if ((slot === 'a1' || slot === 'a2') && q.actions.includes(val)) isCorrect = true;
                    if (slot === 'cond' && val === q.condition) isCorrect = true;
                    if ((slot === 'p1' || slot === 'p2') && q.parameters.includes(val)) isCorrect = true;
                    if (isCorrect) { earned++; t.classList.add('correct') } else t.classList.add('wrong');
                });
                document.querySelectorAll('.drag-pill').forEach(p => p.style.pointerEvents = 'none');
            }
            else if (q.type === 'mc') {
                possible = 1;
                let sel = document.querySelector('.mc-opt.selected');
                document.querySelectorAll('.mc-opt').forEach(o => o.style.pointerEvents = 'none');
                if (sel) {
                    let idx = parseInt(sel.dataset.idx);
                    if (idx === q.correct) { earned = 1; sel.classList.add('correct') }
                    else { sel.classList.add('wrong'); document.querySelectorAll('.mc-opt')[q.correct].classList.add('correct') }
                } else document.querySelectorAll('.mc-opt')[q.correct].classList.add('correct');
            }
            else if (q.type === 'fillin') {
                possible = 1; let inp = document.getElementById('fillInput');
                let val = parseFloat(inp.value), tol = q.tolerance || 0;
                inp.disabled = true;
                if (!isNaN(val) && Math.abs(val - q.answer) <= tol) { earned = 1; inp.classList.add('correct') }
                else { inp.classList.add('wrong'); inp.insertAdjacentHTML('afterend', `<span style="color:var(--green);font-weight:700;margin-left:1rem">Correct: ${q.answer} ${q.unit || ''}</span>`) }
            }

            pct = possible > 0 ? Math.round((earned / possible) * 100) : 0;
            scores[cur] = { earned, possible, pct };

            let btn = document.getElementById('submitBtn');
            btn.outerHTML = `<button class="btn btn-success" onclick="nextQ()">Next →</button>`;
            let chip = pct === 100 ? 'full' : pct > 0 ? 'part' : 'zero';
            document.getElementById('scoreArea').innerHTML = `<span class="score-chip ${chip}">${earned}/${possible} (${pct}%)</span>`;
            showFeedback(q);
        };

        function showFeedback(q) {
            let s = scores[cur] || { pct: 0 };
            let cls = s.pct === 100 ? 'pass' : s.pct > 0 ? 'partial' : 'fail';
            let lbl = s.pct === 100 ? '✅ Correct!' : s.pct > 0 ? '⚠️ Partial Credit' : '❌ Incorrect';
            document.getElementById('feedback').className = `feedback show ${cls}`;
            document.getElementById('feedback').innerHTML = `<strong>${lbl}</strong>${q.rationale}`;
        }

        window.nextQ = function () { cur++; renderQ() };

        function showResults() {
            let total = scores.reduce((a, s) => a + (s ? s.earned : 0), 0);
            let poss = scores.reduce((a, s) => a + (s ? s.possible : 0), 0);
            let pct = Math.round((total / poss) * 100);
            let caseE = 0, caseP = 0, ngn1E = 0, ngn1P = 0, tradE = 0, tradP = 0;
            scores.forEach((s, i) => {
                if (!s) return;
                let q = Q[i];
                if (q.case) { caseE += s.earned; caseP += s.possible }
                else if (q.type === 'bowtie' || i <= 25) { ngn1E += s.earned; ngn1P += s.possible }
                else { tradE += s.earned; tradP += s.possible }
            });
            app.innerHTML = `<div class="exam-header"><h1>🫀 NGN Cardiac Exam</h1></div>
<div class="results"><h2>Exam Complete!</h2>
<div class="score-circle" style="--pct:${pct}"><div class="score-inner"><div class="pct">${pct}%</div><div class="lbl">${total}/${poss} points</div></div></div>
<div class="breakdown">
<div class="bd-card"><h4>Case Studies</h4><div class="val">${caseP ? Math.round((caseE / caseP) * 100) : 0}%</div></div>
<div class="bd-card"><h4>NGN Standalone</h4><div class="val">${ngn1P ? Math.round((ngn1E / ngn1P) * 100) : 0}%</div></div>
<div class="bd-card"><h4>Traditional</h4><div class="val">${tradP ? Math.round((tradE / tradP) * 100) : 0}%</div></div>
</div>
<button class="btn btn-primary" onclick="showStart()" style="margin-top:1rem">🔄 Retake Exam</button>
<button class="btn btn-outline" onclick="reviewAnswers()" style="margin-top:1rem;margin-left:.5rem">📋 Review Answers</button>
</div>`;
        }
        window.reviewAnswers = function () { cur = 0; renderQ() };

        showStart();
    </script>
</body>

</html>
